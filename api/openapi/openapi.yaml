openapi: 3.1.0
info:
  title: OpenSesame Host API
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: /api/v1
paths:
  /device/authorize:
    post:
      summary: Start a Host device authorization
      description: OpenSesame Host JSON protocol profile; this is not the form-encoded RFC 8628 wire endpoint exposed by the Identity provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAuthorizeRequest" }
      responses:
        "200":
          description: Device codes; bearer values are returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizeResponse" }
  /device/token:
    post:
      summary: Poll a device authorization and mint an organization-bound session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTokenRequest" }
      responses:
        "200":
          description: Opaque session with signed Identity organization and role claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceTokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /device/approve:
    post:
      summary: Approve a device code with Identity-derived organization authority
      description: Internal Identity-to-Host operation; principal, organization, and role must come from Identity state.
      security: [{ HostOperatorBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApproveRequest" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceApproveResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /session:
    get:
      summary: Count active Host sessions
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Active session count
          content:
            application/json:
              schema:
                type: object
                required: [active_sessions]
                properties:
                  active_sessions: { type: integer, minimum: 0 }
  /sessions/revoke:
    post:
      summary: Revoke live and approved sessions for one principal in one organization
      description: Internal Identity-to-Host operation used before a membership mutation completes.
      security: [{ HostOperatorBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeSessionsRequest" }
      responses:
        "200":
          description: Live sessions revoked; matching pending approvals are also cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeSessionsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /whoami:
    get:
      summary: Resolve the current principal, organization, and organization role
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Current Host authority context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
  /credential-providers:
    get:
      summary: List native credential, storage, encryption, and lease providers
      description: >-
        Public metadata only. A supported label requires both contract and live-test
        evidence; experimental adapters are never presented as supported.
      responses:
        "200":
          description: Provider catalog and support policy
  /credential-providers/{id}/test:
    post:
      summary: Probe a credential provider adapter as the connected principal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Local readiness or provider-specific live health
        "401":
          description: Opaque user session required
        "404":
          description: Unknown provider
  /credential-connections:
    get:
      summary: List the connected principal's credential-provider connections
      description: Credential references and credential material are never returned.
      responses:
        "200":
          description: Secret-safe connection views
        "401":
          description: Opaque user session required
    post:
      summary: Create a credential-provider connection
      description: >-
        public_config accepts coordinates such as region, vault, mount, or project.
        Secret-like fields are rejected; provider authentication remains in the
        personal daemon or configured workload worker.
      responses:
        "201":
          description: Created connection view
        "401":
          description: Opaque user session required
        "422":
          description: Unknown provider or unsafe public configuration
  /credential-connections/{id}:
    put:
      summary: Replace a credential connection's display name or public configuration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated connection view
        "401":
          description: Opaque user session required
        "404":
          description: Connection not found in the caller's organization
        "422":
          description: Unsafe public configuration
    delete:
      summary: Remove a credential-provider connection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "401":
          description: Opaque user session required
        "404":
          description: Connection not found in the caller's organization
  /intents:
    post:
      summary: Invoke under the caller's organization-bound bootstrap authority
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvokeRequest" }
      responses:
        "200":
          description: Signed organization-bound invocation receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvocationReceipt" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks:
    get:
      summary: List task runs owned by the caller in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Visible task runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListTasksResponse" }
    post:
      summary: Start task authority for the calling principal and organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartTaskRequest" }
      responses:
        "201":
          description: Task started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartTaskResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/intents:
    post:
      summary: Freeze an intent under an owned task in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreezeTaskIntentRequest" }
      responses:
        "201":
          description: Frozen intent handle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreezeTaskIntentResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /tasks/invoke:
    post:
      summary: Execute a caller-owned frozen intent in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvokeTaskRequest" }
      responses:
        "200":
          description: Signed organization-bound invocation receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvocationReceipt" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      summary: Get a caller-owned task in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{id}/terminate:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      summary: Terminate a caller-owned task in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminateTaskRequest" }
      responses:
        "200":
          description: Terminated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminateTaskResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /providers:
    get:
      summary: List immutable provider templates
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: Includes safe OAuth callback URLs and catalog-derived egress policy.
      responses:
        "200":
          description: Provider catalog
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: { type: array, items: { $ref: "#/components/schemas/Provider" } }
  /integrations:
    parameters:
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: List organization and read-only deployment integrations
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Safe integration metadata; never client secrets
          content:
            application/json:
              schema:
                type: object
                required: [integrations]
                properties:
                  integrations: { type: array, items: { $ref: "#/components/schemas/Integration" } }
    post:
      summary: Create an organization integration
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: Owner/admin only. Provider endpoints and egress remain catalog-controlled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIntegration" }
      responses:
        "201":
          description: Integration metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /integrations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: Get safe organization-scoped integration metadata
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Integration metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "404": { $ref: "#/components/responses/ContractError" }
    patch:
      summary: Update an organization integration
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: >-
        Owner/admin only; provider_id is immutable. Omitted client_secret preserves it and
        empty clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIntegration" }
      responses:
        "200":
          description: Integration metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    delete:
      summary: Delete an unused organization integration
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections:
    parameters:
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: List connections visible to the caller
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Reference-only connections with integration_id
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections: { type: array, items: { $ref: "#/components/schemas/Connection" } }
    post:
      summary: Create a member-owned connection pinned to integration_id
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: Provider-only omission is accepted only for an unambiguous legacy integration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnection" }
      responses:
        "201":
          description: Pending connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections/{id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: Get a caller-visible connection
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Connection metadata; never credential material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/ContractError" }
    delete:
      summary: Revoke a connection locally and attempt upstream revocation
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Revocation outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeOutcome" }
        "404": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/authorize:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Start OAuth authorization with PKCE and single-use state
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizeRequest" }
      responses:
        "200":
          description: Authorization redirect metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizeResponse" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "503": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Refresh a caller-visible OAuth connection
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Refreshed safe connection metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/credential:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Store an API-key credential without returning it
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCredentialRequest" }
      responses:
        "200":
          description: Active safe connection metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/bindings:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Bind a caller-visible connection to an organization, project, or agent
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBinding" }
      responses:
        "200":
          description: Connection metadata including the new binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/bindings/{binding_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - name: binding_id
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/OperatorOrganization"
    delete:
      summary: Remove a connection binding
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Connection metadata without the removed binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: List safe lifecycle events for a caller-visible connection
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Connection event history
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/ConnectionEvent" } }
        "404": { $ref: "#/components/responses/ContractError" }
  /oauth/callback/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Complete or reject an OAuth authorization
      description: Public provider redirect target authenticated by single-use state.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: error_description, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Escaped HTML completion page; no credential material
          content:
            text/html: { schema: { type: string } }
        "400":
          description: Escaped HTML failure page
          content:
            text/html: { schema: { type: string } }
  /receipts/keys:
    get:
      summary: Public keys that may have signed a receipt
      description: Public Ed25519 keys include retired keys so held evidence remains independently verifiable.
      responses:
        "200":
          description: Receipt verification keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptKeysResponse" }
  /receipts/{id}:
    parameters:
      - $ref: "#/components/parameters/ReceiptId"
    get:
      summary: Get a receipt owned by the caller in the caller's organization
      description: Legacy receipts derive their authoritative organization from the invocation intent without rewriting signed evidence.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Signed receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvocationReceipt" }
        "404": { $ref: "#/components/responses/Error" }
  /receipts/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/ReceiptId"
    post:
      summary: Verify a receipt owned by the caller in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Signature validity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyReceiptResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /agent-identities:
    post:
      summary: Register agent instance and start claim ceremony
      responses:
        "200":
          description: Claim session; bearer token returned once
components:
  securitySchemes:
    HostBearer:
      type: http
      scheme: bearer
      description: Opaque session bearer or `operator:<token>` break-glass bearer.
    HostOperatorBearer:
      type: http
      scheme: bearer
      description: Operator bearer in the form `operator:<token>`.
    HostOperatorHeader:
      type: apiKey
      in: header
      name: X-OpenSesame-Operator
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReceiptId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ConnectionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    OperatorOrganization:
      name: X-OpenSesame-Organization
      in: header
      required: false
      description: >-
        Canonical org:<uuid> organization selection for authenticated operators. Operators
        default to the bootstrap organization when omitted. Session callers are always bound
        to their signed organization and must not send this header.
      schema:
        type: string
        pattern: '^org:[0-9a-fA-F-]{36}$'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ContractError:
      description: Stable broker error code and safe human hint
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContractError" }
  schemas:
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
    CallerRole:
      type: string
      enum: [owner, admin, member, operator]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
        hint: { type: string }
    DeviceAuthorizeRequest:
      type: object
      required: [client_id]
      properties:
        client_id: { type: string }
        scope: { type: string }
    DeviceAuthorizeResponse:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval, client_id, scope]
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        expires_in: { type: integer, minimum: 1 }
        interval: { type: integer, minimum: 1 }
        client_id: { type: string }
        scope: { type: string }
    DeviceTokenRequest:
      type: object
      required: [device_code, grant_type]
      properties:
        device_code: { type: string }
        grant_type: { type: string, const: "urn:ietf:params:oauth:grant-type:device_code" }
    HostSession:
      type: object
      required: [session_id, principal_id, actor_id, issuer, assurance, organization_id, organization_role, project_id, credential_handle, approved_as, expires_at]
      properties:
        session_id: { type: string }
        principal_id: { type: string }
        actor_id: { type: [string, "null"] }
        issuer: { type: string, format: uri }
        assurance: { type: string }
        organization_id: { type: string }
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
        project_id: { type: [string, "null"] }
        credential_handle: { type: [string, "null"] }
        approved_as: { type: string }
        expires_at: { type: string, format: date-time }
    DeviceTokenResponse:
      type: object
      required: [token_type, expires_in, session, access_token]
      properties:
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1 }
        session: { $ref: "#/components/schemas/HostSession" }
        access_token: { type: string }
    DeviceApproveRequest:
      type: object
      required: [user_code]
      properties:
        user_code: { type: string }
        principal: { type: string }
        organization_id: { type: string }
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
    DeviceApproveResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: approved }
    RevokeSessionsRequest:
      type: object
      required: [principal_id, organization_id]
      properties:
        principal_id: { type: string }
        organization_id: { type: string }
    RevokeSessionsResponse:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, minimum: 0 }
    WhoAmI:
      type: object
      required: [principal_id, actor_id, client_id, issuer, assurance, organization_id, organization_role, context]
      properties:
        principal_id: { type: string }
        actor_id: { type: [string, "null"] }
        client_id: { type: string }
        issuer: { type: string, format: uri }
        assurance: { type: string }
        organization_id: { type: string }
        organization_role: { $ref: "#/components/schemas/CallerRole" }
        context: { type: [string, "null"] }
    InvokeRequest:
      type: object
      required: [operation, resource]
      properties:
        connection_ref: { type: string }
        connection: { type: string }
        operation: { type: string }
        resource: { type: string }
        audience: { type: string, format: uri }
        parameters: {}
        idempotency_key: { type: string }
        invoke_level: { type: integer, minimum: 1, maximum: 3 }
        task_run_id: { type: string, deprecated: true }
        intent_digest: { type: string, deprecated: true }
    CapabilityRequest:
      type: object
      required: [action, resource]
      properties:
        action: { type: string }
        resource: { type: string }
    ResourceSelector:
      oneOf:
        - type: object
          required: [kind, value]
          properties:
            kind: { type: string, const: exact }
            value: { type: string }
        - type: object
          required: [kind, values]
          properties:
            kind: { type: string, const: enumerated }
            values: { type: array, items: { type: string } }
    Capability:
      type: object
      required: [action, resource]
      properties:
        action: { type: string }
        resource: { $ref: "#/components/schemas/ResourceSelector" }
    CapabilitySet:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
    StartTaskRequest:
      type: object
      required: [principal_id, organization_id, capabilities]
      properties:
        principal_id:
          type: string
          description: Canonical `principal:<uuid>`, bare UUID, or Identity `prn_<uuid>`.
        organization_id: { type: string }
        capabilities:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/CapabilityRequest" }
        ttl_seconds: { type: integer, minimum: 1, maximum: 86400, default: 3600 }
    StartTaskResponse:
      type: object
      required: [task_run_id, state_version, state_digest, ceiling_digest, status, capabilities]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        state_digest: { type: string }
        ceiling_digest: { type: string }
        status: { type: string, const: active }
        capabilities: { $ref: "#/components/schemas/CapabilitySet" }
    TaskSummary:
      type: object
      required: [task_run_id, state_version, status, principal_id]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        status: { type: string }
        principal_id: { type: string }
    ListTasksResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskSummary" }
    Task:
      type: object
      required: [task_run_id, state_version, state_digest, status, capability_ceiling, current_capabilities, authority_context_id, maximum_expires_at]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        state_digest: { type: string }
        status: { type: string }
        capability_ceiling: { $ref: "#/components/schemas/CapabilitySet" }
        current_capabilities: { $ref: "#/components/schemas/CapabilitySet" }
        authority_context_id: { type: string }
        maximum_expires_at: { type: string, format: date-time }
    FreezeTaskIntentRequest:
      type: object
      required: [task_run_id, expected_state_version, operation, resource, audience, arguments, idempotency_key]
      properties:
        task_run_id: { type: string }
        expected_state_version: { type: integer, minimum: 0 }
        operation: { type: string }
        resource: { type: string }
        audience: { type: string, format: uri }
        arguments: {}
        idempotency_key: { type: string }
    FreezeTaskIntentResponse:
      type: object
      required: [intent_id, intent_digest, task_run_id, task_state_version, canonical_arguments]
      properties:
        intent_id: { type: string }
        intent_digest: { type: string }
        task_run_id: { type: string }
        task_state_version: { type: integer, minimum: 0 }
        canonical_arguments: {}
    InvokeTaskRequest:
      type: object
      required: [intent_digest]
      properties:
        intent_digest: { type: string }
    TerminateTaskRequest:
      type: object
      properties:
        expected_state_version: { type: integer, minimum: 0 }
    TerminateTaskResponse:
      type: object
      required: [task_run_id, state_version, status]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        status: { type: string, const: cancelled }
    InvocationReceipt:
      type: object
      required: [id, invocation_id, intent_digest, principal_id, actor_id, delegation_chain, operation, resource, policy_decision_id, policy_version_digest, started_at, completed_at, outcome, authority_key_id, signature, receipt_schema_version]
      properties:
        id: { type: string }
        invocation_id: { type: string }
        intent_digest: { type: string }
        principal_id: { type: string }
        organization_id:
          type: string
          description: Present on schema 3 receipts; legacy receipts are authorized through their stored invocation intent.
        actor_id: { type: string }
        actor_instance_id: { type: [string, "null"] }
        client_id: { type: [string, "null"] }
        operator_id: { type: [string, "null"] }
        delegation_chain: { type: array, items: { type: string } }
        connection_id: { type: [string, "null"] }
        operation: { type: string }
        resource: { type: string }
        policy_decision_id: { type: string }
        policy_version_digest: { type: string }
        approval_id: { type: [string, "null"] }
        credential_handle_id: { type: [string, "null"] }
        connector_component_digest: { type: [string, "null"] }
        external_request_digest: { type: [string, "null"] }
        external_response_digest: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        outcome: { type: string, enum: [succeeded, failed, denied, cancelled] }
        safe_result_summary: {}
        authority_key_id: { type: string }
        signature: { type: string }
        receipt_schema_version: { type: integer, minimum: 1 }
        task_run_id: { type: string }
        task_state_version: { type: integer, minimum: 0 }
        task_state_digest: { type: string }
    ReceiptKey:
      type: object
      required: [key_id, algorithm, public_key_b64]
      properties:
        key_id: { type: string }
        algorithm: { type: string, const: ed25519 }
        public_key_b64: { type: string }
    ReceiptKeysResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/ReceiptKey" }
    VerifyReceiptResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        error: { type: string }
    ContractError:
      type: object
      additionalProperties: false
      required: [error, hint]
      properties:
        error:
          type: string
          enum:
            - catalog_unavailable
            - provider_unknown
            - provider_unconfigured
            - connection_not_found
            - integration_not_found
            - integration_required
            - integration_conflict
            - integration_read_only
            - integration_in_use
            - invalid_state
            - state_expired
            - exchange_failed
            - not_refreshable
            - needs_reauth
            - redirect_not_allowed
            - binding_exists
            - binding_not_found
            - unsupported_credential
            - invalid_request
            - internal_error
            - unauthorized
            - forbidden
        hint: { type: string }
    Integration:
      type: object
      additionalProperties: false
      required: [id, key, provider_id, display_name, source, enabled, configured, callback_url, scopes, client_id_hint, has_client_secret, configured_fields, connection_count, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        key: { type: string }
        provider_id: { type: string }
        display_name: { type: string }
        source: { type: string, enum: [organization, shared_dev, deployment] }
        enabled: { type: boolean }
        configured: { type: boolean }
        callback_url: { type: [string, "null"], format: uri }
        scopes: { type: array, items: { type: string } }
        client_id_hint: { type: [string, "null"] }
        has_client_secret: { type: boolean }
        configured_fields:
          type: array
          items: { $ref: "#/components/schemas/ConfiguredField" }
        connection_count: { type: integer, minimum: 0 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateIntegration:
      type: object
      additionalProperties: false
      required: [key, provider_id, display_name]
      properties:
        key: { type: string, minLength: 1 }
        provider_id: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        scopes: { type: array, items: { type: string } }
        client_id: { type: string, minLength: 1 }
        client_secret: { type: string, minLength: 1 }
        configuration: { $ref: "#/components/schemas/Configuration" }
    UpdateIntegration:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        scopes: { type: array, items: { type: string } }
        client_id: { type: string }
        client_secret: { type: string }
        configuration_set: { $ref: "#/components/schemas/Configuration" }
        configuration_clear:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1 }
    Configuration:
      type: object
      maxProperties: 64
      propertyNames: { pattern: "^[A-Za-z0-9_.-]{1,64}$" }
      additionalProperties: { type: string, minLength: 1, maxLength: 8192 }
    ConfigurationFieldDef:
      type: object
      additionalProperties: false
      required: [name, secret, required]
      properties:
        name: { type: string, minLength: 1 }
        secret: { type: boolean }
        required: { type: boolean }
    ConfiguredField:
      type: object
      additionalProperties: false
      required: [name, hint]
      properties:
        name: { type: string, minLength: 1 }
        hint: { type: [string, "null"] }
    Egress:
      type: object
      additionalProperties: false
      required: [scheme, authorities, path_prefixes]
      properties:
        scheme: { type: string }
        authorities: { type: array, items: { type: string } }
        path_prefixes: { type: array, items: { type: string } }
    Scope:
      type: object
      additionalProperties: false
      required: [name, description, sensitive, default]
      properties:
        name: { type: string }
        description: { type: string }
        sensitive: { type: boolean }
        default: { type: boolean }
    Provider:
      type: object
      additionalProperties: false
      required: [id, display_name, category, docs_url, provenance_url, catalog_revision, auth_kind, supports_refresh, configured, callback_url, missing_config, scopes, egress, operations, integration_configuration_fields, connection_configuration_fields]
      properties:
        id: { type: string }
        display_name: { type: string }
        category: { type: string, enum: [developer, productivity, communication, storage, crm, payments, identity, testing] }
        docs_url: { type: string, format: uri }
        provenance_url: { type: string, format: uri }
        catalog_revision: { type: string, minLength: 1 }
        auth_kind: { type: string, enum: [oauth2_authorization_code, api_key] }
        supports_refresh: { type: boolean }
        configured: { type: boolean }
        callback_url: { type: [string, "null"], format: uri }
        missing_config: { type: array, items: { type: string } }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        egress: { $ref: "#/components/schemas/Egress" }
        operations: { type: array, items: { type: string } }
        integration_configuration_fields:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationFieldDef" }
        connection_configuration_fields:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationFieldDef" }
    Binding:
      type: object
      additionalProperties: false
      required: [id, target_kind, target_id, target_label, created_at]
      properties:
        id: { type: string }
        target_kind: { type: string, enum: [organization, project, agent] }
        target_id: { type: string }
        target_label: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    CreateBinding:
      type: object
      additionalProperties: false
      required: [target_kind, target_id]
      properties:
        target_kind: { type: string, enum: [organization, project, agent] }
        target_id: { type: string, minLength: 1 }
        target_label: { type: string, minLength: 1 }
    ConnectionEvent:
      type: object
      additionalProperties: false
      required: [id, kind, at, detail]
      properties:
        id: { type: string }
        kind: { type: string, enum: [created, authorize_started, authorized, refreshed, refresh_failed, bound, unbound, revoked, error] }
        at: { type: string, format: date-time }
        detail: { type: [string, "null"] }
    Connection:
      type: object
      additionalProperties: false
      required: [connection_id, integration_id, connection_ref, logical_name, display_name, provider_id, status, status_detail, organization_id, project_id, owner_kind, shareability, requested_scopes, granted_scopes, account_label, expires_at, refreshable, configured_fields, last_refreshed_at, max_invoke_level, egress, bindings, created_at, updated_at]
      properties:
        connection_id: { type: string }
        integration_id: { type: [string, "null"] }
        connection_ref: { type: string }
        logical_name: { type: string }
        display_name: { type: string }
        provider_id: { type: string }
        status: { type: string, enum: [pending, active, needs_reauth, expired, revoked, error] }
        status_detail: { type: [string, "null"] }
        organization_id: { type: string }
        project_id: { type: [string, "null"] }
        owner_kind: { type: string }
        shareability: { type: string, enum: [private, delegable, organization_wide] }
        requested_scopes: { type: array, items: { type: string } }
        granted_scopes: { type: array, items: { type: string } }
        account_label: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        refreshable: { type: boolean }
        configured_fields:
          type: array
          items: { $ref: "#/components/schemas/ConfiguredField" }
        last_refreshed_at: { type: [string, "null"], format: date-time }
        max_invoke_level: { type: integer }
        egress: { $ref: "#/components/schemas/Egress" }
        bindings: { type: array, items: { $ref: "#/components/schemas/Binding" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateConnection:
      type: object
      additionalProperties: false
      anyOf:
        - required: [integration_id]
        - required: [provider_id]
      properties:
        integration_id: { type: string, minLength: 1 }
        provider_id: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        logical_name: { type: string, minLength: 1 }
        project_id: { type: string, minLength: 1 }
        scopes: { type: array, items: { type: string } }
        shareability: { type: string, enum: [private, delegable, organization_wide] }
    AuthorizeRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_uri: { type: string, format: uri }
        scopes: { type: array, items: { type: string } }
    AuthorizeResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, state, expires_at]
      properties:
        authorization_url: { type: string, format: uri }
        state: { type: string }
        expires_at: { type: string, format: date-time }
    SetCredentialRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [value]
        - required: [configuration_set]
        - required: [configuration_clear]
      properties:
        value: { type: string, minLength: 1, maxLength: 8192 }
        configuration_set:
          allOf:
            - $ref: "#/components/schemas/Configuration"
          minProperties: 1
        configuration_clear:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string, minLength: 1 }
    RevokeOutcome:
      type: object
      additionalProperties: false
      required: [revoked, provider_revocation]
      properties:
        revoked: { type: boolean }
        provider_revocation: { type: string, enum: [ok, unsupported, failed] }

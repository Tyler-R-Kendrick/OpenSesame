    ReceiptKeysResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/ReceiptKey" }
    VerifyReceiptResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        error: { type: string }
    ContractError:
      type: object
      additionalProperties: false
      required: [error, hint]
      properties:
        error:
          type: string
          enum:
            - catalog_unavailable
            - provider_unknown
            - provider_unconfigured
            - connection_not_found
            - integration_not_found
            - integration_required
            - integration_conflict
            - integration_read_only
            - integration_in_use
            - invalid_state
            - state_expired
            - exchange_failed
            - not_refreshable
            - needs_reauth
            - redirect_not_allowed
            - binding_exists
            - binding_not_found
            - unsupported_credential
            - materialization_denied
            - unmintable
            - invalid_request
            - internal_error
            - unauthorized
            - forbidden
        hint: { type: string }

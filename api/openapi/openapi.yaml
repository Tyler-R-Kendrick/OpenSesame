openapi: 3.1.0
info:
  title: OpenSesame API
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: /api/v1
paths:
  /device/authorize:
    post:
      summary: Start RFC 8628 device authorization
      responses:
        "200":
          description: Device codes (device_code to client memory only)
  /device/token:
    post:
      summary: Poll device token endpoint
      responses:
        "200":
          description: Opaque session metadata
  /providers:
    get:
      summary: List native credential, storage, encryption, and lease providers
      description: >-
        Public metadata only. A supported label requires both contract and live-test
        evidence; experimental adapters are never presented as supported.
      responses:
        "200":
          description: Provider catalog and support policy
  /providers/{id}/test:
    post:
      summary: Probe a provider adapter as the connected principal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Local readiness or provider-specific live health
        "401":
          description: Opaque user session required
        "404":
          description: Unknown provider
  /connections:
    get:
      summary: List the connected principal's provider connections
      description: Credential references and credential material are never returned.
      responses:
        "200":
          description: Secret-safe connection views
        "401":
          description: Opaque user session required
    post:
      summary: Create a provider connection
      description: >-
        public_config accepts coordinates such as region, vault, mount, or project.
        Secret-like fields are rejected; provider authentication remains in the
        personal daemon or configured workload worker.
      responses:
        "201":
          description: Created connection view
        "401":
          description: Opaque user session required
        "422":
          description: Unknown provider or unsafe public configuration
  /connections/{id}:
    put:
      summary: Replace a connection's display name or public configuration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated connection view
        "401":
          description: Opaque user session required
        "404":
          description: Connection not found in the caller's organization
        "422":
          description: Unsafe public configuration
    delete:
      summary: Remove a connection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "401":
          description: Opaque user session required
        "404":
          description: Connection not found in the caller's organization
  /intents:
    post:
      summary: Create intent and invoke brokered operation
      responses:
        "200":
          description: Signed InvocationReceipt
  /receipts/keys:
    get:
      summary: Public keys that may have signed a receipt
      description: >-
        Ed25519 public keys keyed by authority_key_id, including retired ones, so a
        receipt holder can verify independently. Public material only.
      responses:
        "200":
          description: Key set
  /receipts/{id}/verify:
    post:
      summary: Verify receipt signature
      description: >-
        Scoped to the caller: a session may only verify receipts for its own
        principal, operators may verify any. Unowned ids answer 404. Checked
        against the key named by authority_key_id, so receipts signed by a
        retired key stay verifiable while it is still published.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validity
        "404":
          description: Unknown receipt, or not owned by the caller
  /agent-identities:
    post:
      summary: Register agent instance and start claim ceremony
      responses:
        "200":
          description: Claim session (token once)

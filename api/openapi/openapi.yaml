openapi: 3.1.0
info:
  title: OpenSesame Host API
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: /api/v1
paths:
  /device/authorize:
    post:
      summary: Start a Host device authorization
      description: OpenSesame Host JSON protocol profile; this is not the form-encoded RFC 8628 wire endpoint exposed by the Identity provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAuthorizeRequest" }
      responses:
        "200":
          description: Device codes; bearer values are returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizeResponse" }
  /device/token:
    post:
      summary: Poll a device authorization and mint an organization-bound session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTokenRequest" }
      responses:
        "200":
          description: Opaque session with signed Identity organization and role claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceTokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /device/approve:
    post:
      summary: Approve a device code with Identity-derived organization authority
      description: Internal Identity-to-Host operation; principal, organization, and role must come from Identity state.
      security: [{ HostOperatorBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApproveRequest" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceApproveResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /session:
    get:
      summary: Count active Host sessions
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Active session count
          content:
            application/json:
              schema:
                type: object
                required: [active_sessions]
                properties:
                  active_sessions: { type: integer, minimum: 0 }
  /sessions/revoke:
    post:
      summary: Revoke live and approved sessions for one principal in one organization
      description: Internal Identity-to-Host operation used before a membership mutation completes.
      security: [{ HostOperatorBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeSessionsRequest" }
      responses:
        "200":
          description: Live sessions revoked; matching pending approvals are also cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeSessionsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /whoami:
    get:
      summary: Resolve the current principal, organization, and organization role
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Current Host authority context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
  /attachments/target:
    get:
      summary: Read the organization's attachment replication target
      description: >-
        Configuration and status only. The Host never holds attachment chunks —
        clients push sealed bytes through the replicate endpoints — so there is
        nothing here but a connection reference and a folder name.
      responses:
        "200":
          description: The configured target, or null when none is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  target:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/AttachmentTargetView"
    put:
      summary: Point the organization's attachments at a storage connection
      description: >-
        Rejects a connection whose provider has no uploader implemented, so a
        misconfiguration surfaces here rather than on the first replicate call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutAttachmentTargetBody" }
      responses:
        "200":
          description: The stored target
          content:
            application/json:
              schema:
                type: object
                properties:
                  target: { $ref: "#/components/schemas/AttachmentTargetView" }
        "422":
          description: >-
            invalid_folder_path, connection_not_found, or
            provider_unsupported_for_attachments
    delete:
      summary: Stop replicating attachments for the organization
      responses:
        "200":
          description: Deleted
  /attachments/replicate/chunk:
    post:
      summary: Forward one sealed chunk to the configured target
      description: >-
        Body is a raw `.oschunk` frame. The Host recomputes BLAKE3 over the body
        and refuses a mismatch: it cannot read the ciphertext either way, but an
        object filed under a digest that does not describe it would never
        reassemble. Upload is idempotent by construction.
      parameters:
        - in: query
          name: digest
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored on the provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored: { type: boolean }
        "400":
          description: digest_mismatch — the body does not hash to the claimed digest
        "422":
          description: invalid_digest, empty_body, no_attachment_target, or attachment_target_disabled
        "502":
          description: upstream_upload_failed
  /attachments/replicate/manifest:
    post:
      summary: Forward one sealed attachment manifest to the configured target
      parameters:
        - in: query
          name: path
          required: true
          description: Store-logical attachment path, e.g. Taxes/2025
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored on the provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored: { type: boolean }
        "422":
          description: invalid_path, empty_body, no_attachment_target, or attachment_target_disabled
        "502":
          description: upstream_upload_failed
  /credential-providers:
    get:
      summary: List native credential, storage, encryption, and lease providers
      description: >-
        Public metadata only. A supported label requires both contract and live-test
        evidence; experimental adapters are never presented as supported.
      responses:
        "200":
          description: Provider catalog and support policy
  /credential-providers/{id}/test:
    post:
      summary: Probe a credential provider adapter as the connected principal
      security: [{ HostBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Local readiness or provider-specific live health
        "401":
          description: Opaque user session required
        "404":
          description: Unknown provider
  /credential-connections:
    get:
      summary: List the connected principal's credential-provider connections
      description: Credential references and credential material are never returned.
      security: [{ HostBearer: [] }]
      responses:
        "200":
          description: Secret-safe connection views
        "401":
          description: Opaque user session required
    post:
      summary: Create a credential-provider connection
      security: [{ HostBearer: [] }]
      description: >-
        public_config accepts coordinates such as region, vault, mount, or project.
        Secret-like fields are rejected; provider authentication remains in the
        personal daemon or configured workload worker.
      responses:
        "201":
          description: Created connection view
        "401":
          description: Opaque user session required
        "403":
          description: Organization owner or admin role required
        "422":
          description: Unknown provider or unsafe public configuration
  /credential-connections/{id}:
    put:
      summary: Replace a credential connection's display name or public configuration
      security: [{ HostBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated connection view
        "401":
          description: Opaque user session required
        "403":
          description: Organization owner or admin role required
        "404":
          description: Connection not found in the caller's organization
        "422":
          description: Unsafe public configuration
    delete:
      summary: Remove a credential-provider connection
      security: [{ HostBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "401":
          description: Opaque user session required
        "403":
          description: Organization owner or admin role required
        "404":
          description: Connection not found in the caller's organization
  /intents:
    post:
      summary: Invoke under the caller's organization-bound bootstrap authority
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvokeRequest" }
      responses:
        "200":
          description: Signed organization-bound invocation receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvocationReceipt" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks:
    get:
      summary: List task runs owned by the caller in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Visible task runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListTasksResponse" }
    post:
      summary: Start task authority for the calling principal and organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartTaskRequest" }
      responses:
        "201":
          description: Task started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartTaskResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tasks/intents:
    post:
      summary: Freeze an intent under an owned task in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreezeTaskIntentRequest" }
      responses:
        "201":
          description: Frozen intent handle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreezeTaskIntentResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /tasks/invoke:
    post:
      summary: Execute a caller-owned frozen intent in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvokeTaskRequest" }
      responses:
        "200":
          description: Signed organization-bound invocation receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvocationReceipt" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      summary: Get a caller-owned task in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{id}/terminate:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      summary: Terminate a caller-owned task in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminateTaskRequest" }
      responses:
        "200":
          description: Terminated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminateTaskResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /providers:
    parameters:
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: List provider templates plus the organization's custom connectors
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: Includes safe OAuth callback URLs and catalog-derived egress policy.
      responses:
        "200":
          description: Provider catalog
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: { type: array, items: { $ref: "#/components/schemas/Provider" } }
  /custom-providers:
    parameters:
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Register an organization-scoped custom connector
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: >-
        Owner/admin only. The definition carries no secrets; egress is derived
        from the base URL and never stated by the caller. OAuth clients for a
        custom connector are sealed through integrations; API keys through
        connection credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomProvider" }
      responses:
        "201":
          description: The derived provider view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /custom-providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/OperatorOrganization"
    delete:
      summary: Delete a custom connector definition with no live connections
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /integrations:
    parameters:
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: List organization and read-only deployment integrations
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Safe integration metadata; never client secrets
          content:
            application/json:
              schema:
                type: object
                required: [integrations]
                properties:
                  integrations: { type: array, items: { $ref: "#/components/schemas/Integration" } }
    post:
      summary: Create an organization integration
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: Owner/admin only. Provider endpoints and egress remain catalog-controlled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIntegration" }
      responses:
        "201":
          description: Integration metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /integrations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: Get safe organization-scoped integration metadata
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Integration metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "404": { $ref: "#/components/responses/ContractError" }
    patch:
      summary: Update an organization integration
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: >-
        Owner/admin only; provider_id is immutable. Omitted client_secret preserves it and
        empty clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIntegration" }
      responses:
        "200":
          description: Integration metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    delete:
      summary: Delete an unused organization integration
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections:
    parameters:
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: List connections visible to the caller
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Reference-only connections with integration_id
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections: { type: array, items: { $ref: "#/components/schemas/Connection" } }
    post:
      summary: Create a member-owned connection pinned to integration_id
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: Provider-only omission is accepted only for an unambiguous legacy integration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnection" }
      responses:
        "201":
          description: Pending connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections/discover:
    parameters:
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Import complete credentials already configured on the Host
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: >-
        In local development, the first owner/admin organization claims detected credentials
        for that Host process. Production import requires the Host operator to select the one
        target organization. Credential values are never returned.
      responses:
        "200":
          description: Number of newly configured connections
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [configured]
                properties:
                  configured: { type: integer, minimum: 0 }
        "403": { $ref: "#/components/responses/ContractError" }
  /connections/{id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: Get a caller-visible connection
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Connection metadata; never credential material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/ContractError" }
    patch:
      summary: Update connection sharing and invocation policy
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConnectionPolicy" }
      responses:
        "200":
          description: Updated safe connection metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
    delete:
      summary: Revoke a connection locally and attempt upstream revocation
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Revocation outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeOutcome" }
        "404": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/authorize:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Start OAuth authorization with PKCE and single-use state
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizeRequest" }
      responses:
        "200":
          description: Authorization redirect metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizeResponse" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "503": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Refresh a caller-visible OAuth connection
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Refreshed safe connection metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/credential:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Store an API-key credential without returning it
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCredentialRequest" }
      responses:
        "200":
          description: Active safe connection metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/mint:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Mint a short-lived provider-derived credential (ADR 0049)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      description: >-
        The one route that returns token bytes, and only provider-minted derived
        ones: short-lived, attenuated, and revocable at the provider. The sealed
        stored credential never moves. Only the connection owner or an operator
        may mint, and the connection's materialization policy must be
        derived_short_lived (default deny).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MintRequest" }
      responses:
        "200":
          description: Derived provider-minted credential; returned once, never stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DerivedMaterialization" }
        "400": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
        "502": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/bindings:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    post:
      summary: Bind a connection to an organization, project, agent, group, device, or identity
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBinding" }
      responses:
        "200":
          description: Connection metadata including the new binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/bindings/{binding_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - name: binding_id
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/OperatorOrganization"
    delete:
      summary: Remove a connection binding
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Connection metadata without the removed binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: List safe lifecycle events for a caller-visible connection
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Connection event history
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/ConnectionEvent" } }
        "404": { $ref: "#/components/responses/ContractError" }
  /oauth/callback/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Complete or reject an OAuth authorization
      description: Public provider redirect target authenticated by single-use state.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: error_description, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Escaped HTML completion page; no credential material
          content:
            text/html: { schema: { type: string } }
        "400":
          description: Escaped HTML failure page
          content:
            text/html: { schema: { type: string } }
  /receipts/keys:
    get:
      summary: Public keys that may have signed a receipt
      description: Public Ed25519 keys include retired keys so held evidence remains independently verifiable.
      responses:
        "200":
          description: Receipt verification keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptKeysResponse" }
  /receipts/{id}:
    parameters:
      - $ref: "#/components/parameters/ReceiptId"
    get:
      summary: Get a receipt owned by the caller in the caller's organization
      description: Legacy receipts derive their authoritative organization from the invocation intent without rewriting signed evidence.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Signed receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvocationReceipt" }
        "404": { $ref: "#/components/responses/Error" }
  /receipts/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/ReceiptId"
    post:
      summary: Verify a receipt owned by the caller in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Signature validity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyReceiptResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /agent-identities:
    post:
      summary: Register agent instance and start claim ceremony
      responses:
        "200":
          description: Claim session; bearer token returned once
  /delegations:
    get:
      summary: Delegations where the caller is owner or claimant (ADR 0044)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Delegation views — grant ids and scopes, never token bytes
          content:
            application/json:
              schema:
                type: object
                required: [delegations]
                properties:
                  delegations: { type: array, items: { $ref: "#/components/schemas/Delegation" } }
        "401": { $ref: "#/components/responses/ContractError" }
    post:
      summary: Mint a claimable delegation offer over the caller's connections
      description: Every fence runs per item and any failure fails the whole mint. The claim token and consent code are returned once and stored only as hashes.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [connection_id]
                    properties:
                      connection_id: { type: string }
                      actions: { type: array, items: { type: string } }
                      resources: { type: array, items: { type: string } }
                      expires_in_seconds: { type: integer }
                      budgets: { type: object, additionalProperties: { type: integer } }
                      execution_mode: { type: string, enum: [broker, relay] }
                      required: { type: boolean }
                      dependencies: { type: array, items: { type: integer } }
                ttl_seconds: { type: integer }
      responses:
        "201":
          description: The offer, its single-use claim token, and its consent code
          content:
            application/json:
              schema:
                type: object
                required: [offer, claim_token, user_code]
                properties:
                  offer: { $ref: "#/components/schemas/DelegationOffer" }
                  claim_token: { type: string }
                  user_code: { type: string }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /delegations/present:
    post:
      summary: Spend an offer's single presentation and read its manifest
      description: Token-authenticated; no session. A token seen again after spend burns the offer and revokes every delegation minted from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token]
              properties:
                claim_token: { type: string }
      responses:
        "200":
          description: The offer manifest to review before claiming
          content:
            application/json:
              schema:
                type: object
                required: [offer]
                properties:
                  offer: { $ref: "#/components/schemas/DelegationOffer" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
        "410": { $ref: "#/components/responses/ContractError" }
  /delegations/claim:
    post:
      summary: Complete a presented offer with the out-of-band consent code
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token, user_code, accepted_item_ids]
              properties:
                claim_token: { type: string }
                user_code: { type: string }
                accepted_item_ids: { type: array, items: { type: string } }
      responses:
        "201":
          description: One delegation per accepted item, minted atomically
          content:
            application/json:
              schema:
                type: object
                required: [delegations]
                properties:
                  delegations: { type: array, items: { $ref: "#/components/schemas/Delegation" } }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
        "410": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /delegations/offers:
    get:
      summary: Offers the caller minted, burned ones surfaced distinctly
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Offer views
          content:
            application/json:
              schema:
                type: object
                required: [offers]
                properties:
                  offers: { type: array, items: { $ref: "#/components/schemas/DelegationOffer" } }
        "401": { $ref: "#/components/responses/ContractError" }
  /delegations/offers/{id}:
    delete:
      summary: Revoke an offer and, if claimed, every delegation in its set
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /delegations/{id}:
    delete:
      summary: Revoke one delegation (owner) or drop one held (claimant)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /delegations/{id}/narrow:
    post:
      summary: Attenuation-only edit — revoke-and-replace with a narrower grant
      description: Validated against the parent AND the grant it replaces; widening is refused. Widening is a new offer and a new ceremony (ADR 0046 decision 10).
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actions: { type: array, items: { type: string } }
                resources: { type: array, items: { type: string } }
                expires_in_seconds: { type: integer }
      responses:
        "200":
          description: The delegation with its replacement grant
          content:
            application/json:
              schema:
                type: object
                required: [delegation]
                properties:
                  delegation: { $ref: "#/components/schemas/Delegation" }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /relay/heartbeat:
    post:
      summary: A credential holder's runtime announcing liveness (ADR 0046)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Acknowledged, with the freshness window
          content:
            application/json:
              schema:
                type: object
                required: [ok, fresh_for_seconds]
                properties:
                  ok: { type: boolean }
                  fresh_for_seconds: { type: integer }
        "401": { $ref: "#/components/responses/ContractError" }
  /relay/requests:
    post:
      summary: Submit a relayed request against a relay-mode delegation
      description: Refused unless the delegation is relay-mode and the holder has a fresh heartbeat — an absent holder is the end of the request, never a queue.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delegation_id, operation, resource]
              properties:
                delegation_id: { type: string }
                operation: { type: string }
                resource: { type: string }
                parameters: { type: object }
      responses:
        "202":
          description: Parked in the holder's inbox, digest-bound
          content:
            application/json:
              schema:
                type: object
                required: [id, state, request_digest, expires_in]
                properties:
                  id: { type: string }
                  state: { type: string }
                  request_digest: { type: string }
                  expires_in: { type: integer }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /relay/requests/pending:
    get:
      summary: The holder drains its relay inbox (draining proves liveness)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Undecided and approved requests awaiting this holder
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/ContractError" }
  /relay/requests/{id}:
    get:
      summary: Delegate or holder polls one relayed request
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: State, digest, and (when completed) the safe result
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /relay/requests/{id}/approve:
    post:
      summary: The holder consents, echoing the digest it reviewed
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_digest]
              properties:
                request_digest: { type: string }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /relay/requests/{id}/deny:
    post:
      summary: The holder refuses, echoing the digest it reviewed
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_digest]
              properties:
                request_digest: { type: string }
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /relay/requests/{id}/result:
    post:
      summary: The holder reports the executed outcome, digest-bound
      description: The full admission runs here — approval required and executed digest must equal the approved one. Summaries are leak-checked before they land.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executed_digest, outcome]
              properties:
                executed_digest: { type: string }
                outcome: { type: string, enum: [succeeded, failed] }
                safe_summary: { type: object }
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
        "410": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /lifecycle/expiring:
    get:
      summary: Every tracked deadline and where it sits on the expiry ladder
      description: >-
        Metadata only. Answers "what would I be notified about, and when?"
        before a hook is registered. Each subject carries both ladders: the
        informational alert track (notice/warning/urgent/expired, fixed
        thresholds) and the actionable renewal track (the subject's own
        renew_before_seconds). No credential material appears on this path.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Tracked subjects, plus the frozen vocabulary a hook filters on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleInventory" }
        "401": { $ref: "#/components/responses/ContractError" }
  /lifecycle/hooks:
    get:
      summary: List registered lifecycle subscriptions
      description: Signing secrets are never returned; they are shown once at registration.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Subscriptions, without their signing secrets
          content:
            application/json:
              schema:
                type: object
                required: [hooks, secrets_returned]
                properties:
                  hooks:
                    type: array
                    items: { $ref: "#/components/schemas/LifecycleHook" }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    put:
      summary: Register or edit a lifecycle subscription
      description: >-
        Owner/admin or operator only. A new registration mints a `whsec_`
        Standard Webhooks signing secret and returns it once, in
        `signing_secret`; it is sealed at rest and no route reads it back, so
        a lost secret is replaced by re-registering. Editing keeps the
        existing secret, so a rename cannot silently invalidate every
        receiver's verification. Endpoints must be absolute https and are
        refused if they resolve to a loopback, private, link-local, or
        metadata address.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleHookRequest" }
      responses:
        "200":
          description: The stored subscription; `signing_secret` present only on first registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleHook" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "503": { $ref: "#/components/responses/ContractError" }
  /lifecycle/hooks/{id}:
    delete:
      summary: Remove a lifecycle subscription and its queued deliveries
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /lifecycle/deliveries:
    get:
      summary: The outbound delivery ledger
      description: >-
        Delivery state per subscription, so a failing endpoint is visible
        without reading gateway logs. Errors are truncated operator hints,
        never response bodies.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Recent deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, secrets_returned]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/LifecycleDelivery" }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /lifecycle/scan:
    post:
      summary: Run one expiry scan now
      description: >-
        The same pass the gateway's tick runs, so a tool can drive the feed
        rather than waiting for it. Idempotent: ladder watermarks mean a
        second scan with nothing newly crossed publishes nothing.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: How many events the pass published
          content:
            application/json:
              schema:
                type: object
                required: [published, secrets_returned]
                properties:
                  published: { type: integer }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
components:
  securitySchemes:
    HostBearer:
      type: http
      scheme: bearer
      description: Opaque session bearer or `operator:<token>` break-glass bearer.
    HostOperatorBearer:
      type: http
      scheme: bearer
      description: Operator bearer in the form `operator:<token>`.
    HostOperatorHeader:
      type: apiKey
      in: header
      name: X-OpenSesame-Operator
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReceiptId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ConnectionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    OperatorOrganization:
      name: X-OpenSesame-Organization
      in: header
      required: false
      description: >-
        Canonical org:<uuid> organization selection for authenticated operators. Operators
        default to the bootstrap organization when omitted. Session callers are always bound
        to their signed organization and must not send this header.
      schema:
        type: string
        pattern: '^org:[0-9a-fA-F-]{36}$'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ContractError:
      description: Stable broker error code and safe human hint
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContractError" }
  schemas:
    LifecycleEventType:
      type: string
      description: Frozen lifecycle event names. Additive only; never renamed.
      enum:
        - lifecycle.expiry.notice
        - lifecycle.expiry.warning
        - lifecycle.expiry.urgent
        - lifecycle.renewal.due
        - lifecycle.expiry.expired
        - lifecycle.renewal.succeeded
        - lifecycle.renewal.failed
    LifecycleSubjectKind:
      type: string
      description: >-
        The closed set of things whose expiry the platform tracks. Closed on
        purpose: each kind implies a platform-owned responder with real
        authority, so a subscription selects kinds but never adds one.
      enum: [certificate, certificate_authority, connection_credential, store_path, signer]
    LifecycleStage:
      type: string
      description: >-
        A rung of the expiry ladder. notice/warning/urgent/expired advance the
        alert watermark; renewal advances its own, so a per-subject renewal
        lead can never alias and suppress a fixed alert rung.
      enum: [notice, warning, urgent, expired, renewal]
    LifecycleRung:
      type: object
      required: [stage, track, event_type, fires_at, crossed]
      properties:
        stage: { $ref: "#/components/schemas/LifecycleStage" }
        track: { type: string, enum: [alert, renewal] }
        event_type: { $ref: "#/components/schemas/LifecycleEventType" }
        fires_at:
          type: [string, "null"]
          description: >-
            When this rung is reached. Null when the deadline sits too close to
            the start of the representable range to date the rung — a
            never-run rotation schedule, which is due now regardless.
        crossed: { type: boolean, description: Whether the deadline is already past it }
    LifecycleSubject:
      type: object
      required: [subject_kind, subject_id, organization_id, expires_at, remaining_seconds, renew_before_seconds, auto_respond, alerting, ladder, secrets_returned]
      properties:
        subject_kind: { $ref: "#/components/schemas/LifecycleSubjectKind" }
        subject_id: { type: string }
        organization_id: { type: string }
        label:
          type: [string, "null"]
          description: Operator-facing name — a common name, a store path, a provider. Never a credential.
        expires_at: { type: string }
        remaining_seconds: { type: integer, description: Negative once expired }
        renew_before_seconds: { type: integer }
        auto_respond:
          type: boolean
          description: Whether a platform responder may act. False still emits every event.
        responder:
          type: [string, "null"]
          description: The platform responder for this kind, or null when renewal is the subscriber's to perform.
        alerting:
          type: boolean
          description: >-
            False for recurring schedules such as rotation policies, whose
            deadline moves on every run; they use the renewal track only.
        ladder:
          type: array
          items: { $ref: "#/components/schemas/LifecycleRung" }
        secrets_returned: { type: boolean, const: false }
    LifecycleInventory:
      type: object
      required: [subjects, event_types, subject_kinds, stages, secrets_returned]
      properties:
        subjects:
          type: array
          items: { $ref: "#/components/schemas/LifecycleSubject" }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/LifecycleEventType" }
        subject_kinds:
          type: array
          items: { $ref: "#/components/schemas/LifecycleSubjectKind" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/LifecycleStage" }
        secrets_returned: { type: boolean, const: false }
    LifecycleHookRequest:
      type: object
      required: [name, event_types, endpoint_url]
      properties:
        id:
          type: string
          description: Omit to register; supply to edit in place.
        name: { type: string, minLength: 1, maxLength: 120 }
        event_types:
          type: array
          minItems: 1
          description: Event names, or the single wildcard `lifecycle.*`. An empty list is refused rather than read as "everything".
          items: { type: string }
        endpoint_url:
          type: string
          format: uri
          maxLength: 2048
          description: Absolute https endpoint. Private, loopback, link-local and metadata addresses are refused, as are embedded credentials.
        subject_kinds:
          type: [array, "null"]
          description: Optional narrowing. Null or absent means every kind.
          items: { $ref: "#/components/schemas/LifecycleSubjectKind" }
        enabled: { type: boolean, default: true }
    LifecycleHook:
      type: object
      required: [id, name, organization_id, event_types, delivery, enabled, version, secrets_returned]
      properties:
        id: { type: string }
        name: { type: string }
        organization_id: { type: string }
        event_types:
          type: array
          items: { type: string }
        delivery:
          type: string
          enum: [webhook, internal]
          description: >-
            `webhook` is the community surface — an observer, delivered
            asynchronously, unable to influence any decision. `internal` names
            a platform responder that runs in process and cannot be registered
            over this API.
        endpoint_url: { type: [string, "null"] }
        responder: { type: [string, "null"] }
        subject_kinds: { type: [array, "null"], items: { type: string } }
        enabled: { type: boolean }
        last_delivered_at: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
        signing_secret:
          type: string
          description: >-
            The `whsec_` Standard Webhooks secret. Present only in the response
            to a first registration; sealed at rest and never returned again.
        signing_secret_hint: { type: string }
        secrets_returned: { type: boolean, const: false }
    LifecycleDelivery:
      type: object
      required: [id, hook_id, event_type, subject_kind, subject_id, state, attempts, created_at]
      properties:
        id:
          type: string
          description: Sent as the `webhook-id` header; doubles as the receiver's idempotency key.
        hook_id: { type: string }
        event_type: { $ref: "#/components/schemas/LifecycleEventType" }
        subject_kind: { $ref: "#/components/schemas/LifecycleSubjectKind" }
        subject_id: { type: string }
        state: { type: string, enum: [pending, delivered, dead_lettered] }
        attempts: { type: integer }
        available_at: { type: [string, "null"], description: Backoff gate; claimable once past }
        last_error: { type: [string, "null"], description: Truncated operator hint, never a response body }
        delivered_at: { type: [string, "null"] }
        created_at: { type: string }
    DelegationOffer:
      type: object
      required: [id, state, manifest_digest, expires_at, items]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, presented, claimed, revoked, expired, burned] }
        manifest_digest: { type: string }
        expires_at: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, connection_id, provider_id, actions, execution_mode, required]
            properties:
              id: { type: string }
              connection_id: { type: string }
              provider_id: { type: string }
              display_name: { type: string }
              actions: { type: array, items: { type: string } }
              resources: { type: array, items: { type: string } }
              expires_in_seconds: { type: integer }
              execution_mode: { type: string, enum: [broker, relay] }
              required: { type: boolean }
              dependencies: { type: array, items: { type: string } }
    Delegation:
      type: object
      required: [id, offer_id, connection_id, claimant_subject, grant_id, execution_mode, expires_at]
      properties:
        id: { type: string }
        offer_id: { type: string }
        connection_id: { type: string }
        claimant_subject: { type: string }
        grant_id: { type: string }
        execution_mode: { type: string, enum: [broker, relay] }
        actions: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        expires_at: { type: string }
        revoked_at: { type: string, nullable: true }
    AttachmentTargetView:
      type: object
      description: Where sealed attachment ciphertext is replicated. Carries no token material.
      properties:
        connection_id: { type: string }
        provider_id: { type: string }
        folder_path: { type: string }
        enabled: { type: boolean }
        status: { type: string }
        last_error:
          oneOf:
            - type: "null"
            - type: string
        updated_at_unix_ms: { type: integer }
    PutAttachmentTargetBody:
      type: object
      additionalProperties: false
      required: [connection_id, folder_path]
      properties:
        connection_id: { type: string }
        folder_path:
          type: string
          description: Absolute provider path such as /OpenSesame/attachments; no '..' or empty segments.
        enabled: { type: boolean }
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
    CallerRole:
      type: string
      enum: [owner, admin, member, operator]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
        hint: { type: string }
    DeviceAuthorizeRequest:
      type: object
      required: [client_id]
      properties:
        client_id: { type: string }
        scope: { type: string }
    DeviceAuthorizeResponse:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval, client_id, scope]
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        expires_in: { type: integer, minimum: 1 }
        interval: { type: integer, minimum: 1 }
        client_id: { type: string }
        scope: { type: string }
    DeviceTokenRequest:
      type: object
      required: [device_code, client_id, grant_type]
      properties:
        device_code: { type: string }
        client_id: { type: string, enum: [opensesame-cli, opensesame-pages] }
        grant_type: { type: string, const: "urn:ietf:params:oauth:grant-type:device_code" }
    HostSession:
      type: object

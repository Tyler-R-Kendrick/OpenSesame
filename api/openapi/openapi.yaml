openapi: 3.1.0
info:
  title: OpenSesame API
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: /api/v1
paths:
  /device/authorize:
    post:
      summary: Start RFC 8628 device authorization
      responses:
        "200":
          description: Device codes (device_code to client memory only)
  /device/token:
    post:
      summary: Poll device token endpoint
      responses:
        "200":
          description: Opaque session metadata
  /intents:
    post:
      summary: Create intent and invoke brokered operation
      responses:
        "200":
          description: Signed InvocationReceipt
  /receipts/keys:
    get:
      summary: Public keys that may have signed a receipt
      description: >-
        Ed25519 public keys keyed by authority_key_id, including retired ones, so a
        receipt holder can verify independently. Public material only.
      responses:
        "200":
          description: Key set
  /receipts/{id}/verify:
    post:
      summary: Verify receipt signature
      description: >-
        Scoped to the caller: a session may only verify receipts for its own
        principal, operators may verify any. Unowned ids answer 404. Checked
        against the key named by authority_key_id, so receipts signed by a
        retired key stay verifiable while it is still published.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validity
        "404":
          description: Unknown receipt, or not owned by the caller
  /agent-identities:
    post:
      summary: Register agent instance and start claim ceremony
      responses:
        "200":
          description: Claim session (token once)

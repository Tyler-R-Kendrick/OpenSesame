        organization_id: { type: string }
        capabilities:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/CapabilityRequest" }
        ttl_seconds: { type: integer, minimum: 1, maximum: 86400, default: 3600 }
    StartTaskResponse:
      type: object
      required: [task_run_id, state_version, state_digest, ceiling_digest, status, capabilities]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        state_digest: { type: string }
        ceiling_digest: { type: string }
        status: { type: string, const: active }
        capabilities: { $ref: "#/components/schemas/CapabilitySet" }
    TaskSummary:
      type: object
      required: [task_run_id, state_version, status, principal_id]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        status: { type: string }
        principal_id: { type: string }
    ListTasksResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskSummary" }
    Task:
      type: object
      required: [task_run_id, state_version, state_digest, status, capability_ceiling, current_capabilities, authority_context_id, maximum_expires_at]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        state_digest: { type: string }
        status: { type: string }
        capability_ceiling: { $ref: "#/components/schemas/CapabilitySet" }
        current_capabilities: { $ref: "#/components/schemas/CapabilitySet" }
        authority_context_id: { type: string }
        maximum_expires_at: { type: string, format: date-time }
    FreezeTaskIntentRequest:
      type: object
      required: [task_run_id, expected_state_version, operation, resource, audience, arguments, idempotency_key]
      properties:
        task_run_id: { type: string }
        expected_state_version: { type: integer, minimum: 0 }
        operation: { type: string }
        resource: { type: string }
        audience: { type: string, format: uri }
        arguments: {}
        idempotency_key: { type: string }
    FreezeTaskIntentResponse:
      type: object
      required: [intent_id, intent_digest, task_run_id, task_state_version, canonical_arguments]
      properties:
        intent_id: { type: string }
        intent_digest: { type: string }
        task_run_id: { type: string }
        task_state_version: { type: integer, minimum: 0 }
        canonical_arguments: {}
    InvokeTaskRequest:
      type: object
      required: [intent_digest]
      properties:
        intent_digest: { type: string }
    TerminateTaskRequest:
      type: object
      properties:
        expected_state_version: { type: integer, minimum: 0 }
    TerminateTaskResponse:
      type: object
      required: [task_run_id, state_version, status]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        status: { type: string, const: cancelled }
    InvocationReceipt:
      type: object
      required: [id, invocation_id, intent_digest, principal_id, actor_id, delegation_chain, operation, resource, policy_decision_id, policy_version_digest, started_at, completed_at, outcome, authority_key_id, signature, receipt_schema_version]

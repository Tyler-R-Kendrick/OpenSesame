    <!--
      THESIS: A real end-to-end-encrypted vault. The master password derives the key that decrypts
        every item; nothing else does, and nothing leaves the device. Four audiences, one store:
        humans keep passwords and passkeys, agents draw scoped grants, websites authenticate
        against it, developers govern it.
      OWN-WORLD: Password-manager canon (Bitwarden / 1Password craft bar) in OpenSesame navy and
        teal. Three-pane desktop frame — navy rail, list, detail. System UI stack; mono reserved
        for codes, digests, and measurements. Light and dark both first-class.
      STORY: Create or unlock the vault → land on the item list → reveal, copy, generate, rotate →
        step sideways into Agents, Sites, or Authority when the same identity governs more than
        passwords.
      FIRST VIEWPORT: The unlock card, stating plainly that there is no recovery, over a navy
        ground. First run adds a strength meter and an explicit acknowledgement.
      FORM: Canon taken by the user's own words ("it's a Bitwarden alternative"), executed at full
        fidelity — no irony, no smuggled quirk. Craft bar: Bitwarden, 1Password.
      FINISH: pending — full redesign in flight; DESIGN.md rewritten from the built result.
    -->

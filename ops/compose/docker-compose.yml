# Relay-only compose profile (ADR 0181).
# Optional vault-relay peer — not a Host, Identity, or daemon API stack.
# Requires Docker. Replace image tags with digests in production.
services:
  relay:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
      args:
        OPENSESAME_FEATURES: ${OPENSESAME_FEATURES:-}
    command: ["relay", "run"]
    environment:
      OPENSESAME_LISTEN: "0.0.0.0:8787"
      OPENSESAME_GATEWAY_PROFILE: relay
    ports: ["8787:8787"]

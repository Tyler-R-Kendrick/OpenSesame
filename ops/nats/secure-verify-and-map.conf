# OpenSesame NATS — certificate-to-user MAPPING profile (SEPARATE, opt-in).
#
# NOT the default. `verify_and_map: true` makes the server take the user
# name from the client certificate itself — the first SAN it recognises
# (email, then DNS, then URI) or else the subject DN — and look that name
# up in `users`. Only names listed below exist; any other certificate from
# the CA is admitted by TLS and then REJECTED at authentication. Nothing
# here is joined by email or CN by OpenSesame policy: the operator writes
# the exact SAN of each workload certificate as a binding, one user per
# line, and the server does exact-match only.
#
# Compared with `secure-client.conf` (admission + nkey authority):
#   - no nkey seed is distributed; the TLS private key is the credential
#   - revocation = removing the user line (and a CRL for the CA) + restart;
#     there is still no server-enforced session expiry for a mapped user
#   - a certificate with several SANs maps by the server's SAN order, so
#     issue mapping certificates with exactly one SAN
#
# Every value is an environment variable; the live suite starts this file
# with SANs it issued from a disposable CA.

listen: $OPENSESAME_NATS_LISTEN
server_name: $OPENSESAME_NATS_SERVER_NAME

jetstream {
  store_dir: $OPENSESAME_NATS_STORE_DIR
}

tls {
  cert_file: $OPENSESAME_NATS_TLS_SERVER_CERT
  key_file: $OPENSESAME_NATS_TLS_SERVER_KEY
  ca_file: $OPENSESAME_NATS_TLS_CLIENT_CA
  verify_and_map: true
  timeout: 2
}

accounts {
  OPENSESAME {
    jetstream: enabled
    users: [
      {
        # exact SAN of the provisioner certificate, e.g. a DNS SAN
        # "provisioner.nats.opensesame.internal"
        user: $OPENSESAME_NATS_MAP_PROVISIONER
        permissions: {
          publish: { allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.CREATE.OPENSESAME_EVENTS",
            "$JS.API.STREAM.UPDATE.OPENSESAME_EVENTS",
            "$JS.API.STREAM.INFO.OPENSESAME_EVENTS",
            "$JS.API.CONSUMER.CREATE.OPENSESAME_EVENTS.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.OPENSESAME_EVENTS.>",
            "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.>"
          ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
      {
        # exact SAN of the Host runtime certificate
        user: $OPENSESAME_NATS_MAP_HOST
        permissions: {
          publish: { allow: [
            "opensesame.events.>",
            "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.opensesame-worker",
            "$JS.API.CONSUMER.MSG.NEXT.OPENSESAME_EVENTS.opensesame-worker",
            "$JS.ACK.OPENSESAME_EVENTS.opensesame-worker.>"
          ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
    ]
  }
}

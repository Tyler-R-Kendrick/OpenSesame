# OpenSesame NATS — auth-callout profile (server-enforced session expiry).
#
# The same admission as `secure-client.conf` (required client certificate
# from the private CA), but user authorization is decided per connection by
# the auth-callout responder in the AUTH account (the bridge SW-CALLOUT
# ships, or the live suite's test responder). The responder answers
# `$SYS.REQ.USER.AUTH` with a user JWT signed by `issuer`; that JWT's `exp`
# is the ONE session bound nats-server 2.11 enforces on a live connection —
# when it passes, the server sends `-ERR 'User Authentication Expired'` and
# closes the connection. The live suite issues a 5 s JWT and observes the
# disconnect (AT-NATS-LIVEEXPIRY). Static-user profiles have no such bound.
#
# `authorization { timeout }` and `tls { timeout }` are handshake timeouts,
# not session bounds. `tls { handshake_first: true }` (TLS before INFO) is
# on here: clients must set OPENSESAME_NATS_TLS_FIRST=1.
#
# Mixed mode. The Host's own service roles (provisioner, host, publisher,
# consumer, backup — `opensesame-roles.conf`, the same users
# `secure-client.conf` defines) are static nkey users listed in
# `auth_users`, so they bypass the callout; every other identity — people
# and agents from any allowlisted upstream IdP (`OPENSESAME_NATS_CALLOUT_
# ISSUER_JWKS` on the Host), or a certificate the Host maps — is decided
# per connection by the callout. A service role never depends on an IdP
# being reachable, and an end user never holds a static credential.
#
# Sealed callouts. `auth_callout.xkey` makes the server seal every
# authorization request to the bridge's curve key (`xkv1`) and accept only
# a reply sealed back to the server: the end user's token and certificate
# chain are not readable by anything else in the AUTH account. The bridge
# holds the matching seed (`OPENSESAME_NATS_CALLOUT_XKEY_SEED_FILE`); set
# `OPENSESAME_NATS_CALLOUT_XKEY` to its public key (`X...`).
#
# The bridge registers as the `opensesame-auth-callout` NATS micro service,
# so it may subscribe `$SRV.>` and answer those requesters
# (`allow_responses`). Operators discover instances and read their stats
# (`nats micro ls|stats opensesame-auth-callout`) as the observer user
# (`OPENSESAME_NATS_NKEY_CALLOUT_OBSERVER`), which may only ask `$SRV.>` and
# read its own inbox — never the bridge's key, which can answer callouts.

listen: $OPENSESAME_NATS_LISTEN
server_name: $OPENSESAME_NATS_SERVER_NAME

jetstream {
  store_dir: $OPENSESAME_NATS_STORE_DIR
}

tls {
  cert_file: $OPENSESAME_NATS_TLS_SERVER_CERT
  key_file: $OPENSESAME_NATS_TLS_SERVER_KEY
  ca_file: $OPENSESAME_NATS_TLS_CLIENT_CA
  verify: true
  handshake_first: true
  timeout: 2
}

include ./opensesame-roles.conf

accounts {
  AUTH {
    users: [
      {
        nkey: $OPENSESAME_NATS_NKEY_CALLOUT
        permissions: {
          # The server's reply-to for an auth request is `$SYS._INBOX.>`,
          # not `_INBOX.>`: without it every callout answer is a Publish
          # Violation and the client is denied on a callout timeout.
          publish: { allow: [ "$SYS._INBOX.>" ] }
          subscribe: { allow: [ "$SYS.REQ.USER.AUTH", "$SRV.>" ] }
          # Services API discovery answers go to each requester's inbox,
          # and only to a requester's inbox.
          allow_responses: true
        }
      }
      {
        # Discovery and stats only: it cannot see or answer a callout.
        nkey: $OPENSESAME_NATS_NKEY_CALLOUT_OBSERVER
        permissions: {
          publish: { allow: [ "$SRV.>" ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
    ]
  }
  OPENSESAME {
    jetstream: enabled
    users: $OPENSESAME_ROLE_USERS
  }
}

# nats-server 2.11 reads auth_callout inside `authorization`, never at the
# top level (a top-level block is `unknown field "auth_callout"`).
authorization {
  timeout: 2
  auth_callout {
    issuer: $OPENSESAME_NATS_CALLOUT_ISSUER
    account: AUTH
    xkey: $OPENSESAME_NATS_CALLOUT_XKEY
    # Mixed mode: the bridge and the Host's service roles bypass the callout.
    auth_users: [
      $OPENSESAME_NATS_NKEY_CALLOUT
      $OPENSESAME_NATS_NKEY_CALLOUT_OBSERVER
      $OPENSESAME_NATS_NKEY_PROVISIONER
      $OPENSESAME_NATS_NKEY_HOST
      $OPENSESAME_NATS_NKEY_PUBLISHER
      $OPENSESAME_NATS_NKEY_CONSUMER
      $OPENSESAME_NATS_NKEY_BACKUP
    ]
  }
}

# OpenSesame NATS — the Host's service-role users, one definition.
#
# Not a profile: `include`d by `secure-client.conf` (as the OPENSESAME
# account's users) and by `secure-callout.conf` (the same users, listed in
# `auth_callout.auth_users` so service roles bypass the callout — mixed
# mode). Keeping them here means the two profiles cannot drift apart.
#
# Roles (one nkey each; nothing holds `$JS.API.>`):
#   provisioner  creates or converges the stream and the durable consumers
#   host         publishes opensesame.events.> and drains opensesame-worker
#   publisher    publishes user events only (system.> denied)
#   consumer     durable pull on opensesame-worker only
#   backup       durable pull on opensesame-backup only (system wakes)

OPENSESAME_ROLE_USERS: [
  {
    nkey: $OPENSESAME_NATS_NKEY_PROVISIONER
    permissions: {
      publish: { allow: [
        "$JS.API.INFO",
        "$JS.API.STREAM.CREATE.OPENSESAME_EVENTS",
        "$JS.API.STREAM.UPDATE.OPENSESAME_EVENTS",
        "$JS.API.STREAM.INFO.OPENSESAME_EVENTS",
        "$JS.API.CONSUMER.CREATE.OPENSESAME_EVENTS.>",
        "$JS.API.CONSUMER.DURABLE.CREATE.OPENSESAME_EVENTS.>",
        "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.>"
      ] }
      subscribe: { allow: [ "_INBOX.>" ] }
    }
  }
  {
    nkey: $OPENSESAME_NATS_NKEY_HOST
    permissions: {
      publish: { allow: [
        "opensesame.events.>",
        "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.opensesame-worker",
        "$JS.API.CONSUMER.MSG.NEXT.OPENSESAME_EVENTS.opensesame-worker",
        "$JS.ACK.OPENSESAME_EVENTS.opensesame-worker.>"
      ] }
      subscribe: { allow: [ "_INBOX.>" ] }
    }
  }
  {
    nkey: $OPENSESAME_NATS_NKEY_PUBLISHER
    permissions: {
      publish: {
        allow: [ "opensesame.events.>" ]
        deny: [ "opensesame.events.system.>" ]
      }
      subscribe: { allow: [ "_INBOX.>" ] }
    }
  }
  {
    nkey: $OPENSESAME_NATS_NKEY_CONSUMER
    permissions: {
      publish: { allow: [
        "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.opensesame-worker",
        "$JS.API.CONSUMER.MSG.NEXT.OPENSESAME_EVENTS.opensesame-worker",
        "$JS.ACK.OPENSESAME_EVENTS.opensesame-worker.>"
      ] }
      subscribe: { allow: [ "_INBOX.>" ] }
    }
  }
  {
    nkey: $OPENSESAME_NATS_NKEY_BACKUP
    permissions: {
      publish: { allow: [
        "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.opensesame-backup",
        "$JS.API.CONSUMER.MSG.NEXT.OPENSESAME_EVENTS.opensesame-backup",
        "$JS.ACK.OPENSESAME_EVENTS.opensesame-backup.>"
      ] }
      subscribe: { allow: [ "_INBOX.>" ] }
    }
  }
]

# OpenSesame NATS — local development profile (plaintext, loopback only).
#
# This is the *legacy local* profile: no TLS, no credentials, loopback bind.
# It is what `scripts/test/nats-dogfood-test.sh` runs (nats-server 2.10.18) and
# what a developer gets from `nats-server -js -a 127.0.0.1`. The Host does
# not use it unless told to: the TaskBus backend defaults to `memory`, and
# only `OPENSESAME_TASKBUS=nats` / `NATS_URL=nats://127.0.0.1:4222` (or the
# stored operator setting) selects NATS at all.
#
# On this profile the Host provisions its own stream and consumers on
# connect (there is no separate provisioner identity). On every other
# profile in this directory provisioning is a one-time operator action.
#
# Never expose this listener beyond loopback: it authenticates nobody.

listen: 127.0.0.1:4222
server_name: opensesame-local

jetstream {
  store_dir: $OPENSESAME_NATS_STORE_DIR
}

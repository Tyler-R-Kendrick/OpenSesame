# OpenSesame NATS — 2-node cluster with TLS routes (the one server-to-server
# topology that ships and is tested).
#
# Start this file twice (one process per node) with a different
# OPENSESAME_NATS_NODE_* environment for each; both nodes share the client
# TLS block and the account/permission set of `secure-client.conf` (kept in
# one place: include that file's accounts by copying it here in a real
# deployment, or run the nodes with the same generated accounts block).
#
# Route TLS is its own listener with its own settings: `cluster.tls` with
# `verify: true` means a peer route must present a certificate from the
# ROUTE CA. A route from a node holding a certificate from any other CA is
# refused at the TLS handshake and the cluster does not form — the live
# suite proves this by reading the node log, then proves a message
# published on node B is received by a client on node A once both hold
# route certificates from the route CA. Route certificates need both
# serverAuth and clientAuth (a route dials and accepts).
#
# Clients on a TLS profile ignore the `connect_urls` the cluster
# advertises (`ignore_discovered_servers`): failover happens only along
# the URLs the operator listed in NATS_URL, each of which must present the
# configured server name. Discovery never widens egress.
#
# JetStream in this 2-node cluster is R1 only; a 3-node cluster is required
# for replicated streams and is NOT tested here (report: unsupported).
# Gateways, leaf nodes, WebSocket and MQTT listeners are not enabled by any
# profile in this directory and are unsupported.

listen: $OPENSESAME_NATS_LISTEN
server_name: $OPENSESAME_NATS_SERVER_NAME

jetstream {
  store_dir: $OPENSESAME_NATS_STORE_DIR
}

tls {
  cert_file: $OPENSESAME_NATS_TLS_SERVER_CERT
  key_file: $OPENSESAME_NATS_TLS_SERVER_KEY
  ca_file: $OPENSESAME_NATS_TLS_CLIENT_CA
  verify: true
  timeout: 2
}

cluster {
  name: opensesame
  listen: $OPENSESAME_NATS_CLUSTER_LISTEN
  routes: [ $OPENSESAME_NATS_ROUTE_URL ]
  tls {
    cert_file: $OPENSESAME_NATS_ROUTE_CERT
    key_file: $OPENSESAME_NATS_ROUTE_KEY
    ca_file: $OPENSESAME_NATS_ROUTE_CA
    verify: true
    timeout: 2
  }
}

accounts {
  OPENSESAME {
    jetstream: enabled
    users: [
      {
        nkey: $OPENSESAME_NATS_NKEY_HOST
        permissions: {
          publish: { allow: [ "opensesame.events.>" ] }
          subscribe: { allow: [ "opensesame.events.>", "_INBOX.>" ] }
        }
      }
    ]
  }
}

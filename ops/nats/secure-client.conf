# OpenSesame NATS — secure client profile (default secure profile).
#
# Admission + dynamic authorization: TLS with a *required* client
# certificate from the private CA (`verify: true`), then NKey
# authentication and per-user subject permissions decide what the caller
# may do. The certificate admits the peer to the listener; it never names
# the user (that is the separate `secure-verify-and-map.conf` profile).
#
# Every value is an environment variable so the same file is what the live
# suite (`crates/task-bus/src/nats_live_*.rs`, pinned nats-server 2.11)
# starts. Generate nkeys with `nk -gen user -pubout` (or nkeys in code) and
# hand each Host process exactly one seed via
# `OPENSESAME_NATS_AUTH=nkey OPENSESAME_NATS_NKEY_SEED_FILE=...`.
#
# Roles (one nkey each; nothing holds `$JS.API.>`):
#   provisioner  creates the stream and the durable consumers, once
#   host         publishes opensesame.events.> and drains opensesame-worker
#   publisher    publishes user events only (system.> denied)
#   consumer     durable pull on opensesame-worker only
#   backup       durable pull on opensesame-backup only (system wakes)
#   callout      AUTH account: answers $SYS.REQ.USER.AUTH, publishes replies
#   system       SYS account for operators; never handed to a Host process
#
# Session bounds: `authorization { timeout }` / `tls { timeout }` bound the
# *handshake* only. A static nkey user has NO server-enforced session
# expiry — revoke by removing the user and restarting, or use the callout
# profile (`secure-callout.conf`) whose issued user JWT `exp` the server
# enforces by disconnecting.

listen: $OPENSESAME_NATS_LISTEN
server_name: $OPENSESAME_NATS_SERVER_NAME

jetstream {
  store_dir: $OPENSESAME_NATS_STORE_DIR
}

tls {
  cert_file: $OPENSESAME_NATS_TLS_SERVER_CERT
  key_file: $OPENSESAME_NATS_TLS_SERVER_KEY
  ca_file: $OPENSESAME_NATS_TLS_CLIENT_CA
  verify: true
  timeout: 2
}

system_account: SYS

accounts {
  SYS {
    users: [ { nkey: $OPENSESAME_NATS_NKEY_SYSTEM } ]
  }

  OPENSESAME {
    jetstream: enabled
    users: [
      {
        nkey: $OPENSESAME_NATS_NKEY_PROVISIONER
        permissions: {
          publish: { allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.CREATE.OPENSESAME_EVENTS",
            "$JS.API.STREAM.UPDATE.OPENSESAME_EVENTS",
            "$JS.API.STREAM.INFO.OPENSESAME_EVENTS",
            "$JS.API.CONSUMER.CREATE.OPENSESAME_EVENTS.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.OPENSESAME_EVENTS.>",
            "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.>"
          ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
      {
        nkey: $OPENSESAME_NATS_NKEY_HOST
        permissions: {
          publish: { allow: [
            "opensesame.events.>",
            "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.opensesame-worker",
            "$JS.API.CONSUMER.MSG.NEXT.OPENSESAME_EVENTS.opensesame-worker",
            "$JS.ACK.OPENSESAME_EVENTS.opensesame-worker.>"
          ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
      {
        nkey: $OPENSESAME_NATS_NKEY_PUBLISHER
        permissions: {
          publish: {
            allow: [ "opensesame.events.>" ]
            deny: [ "opensesame.events.system.>" ]
          }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
      {
        nkey: $OPENSESAME_NATS_NKEY_CONSUMER
        permissions: {
          publish: { allow: [
            "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.opensesame-worker",
            "$JS.API.CONSUMER.MSG.NEXT.OPENSESAME_EVENTS.opensesame-worker",
            "$JS.ACK.OPENSESAME_EVENTS.opensesame-worker.>"
          ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
      {
        nkey: $OPENSESAME_NATS_NKEY_BACKUP
        permissions: {
          publish: { allow: [
            "$JS.API.CONSUMER.INFO.OPENSESAME_EVENTS.opensesame-backup",
            "$JS.API.CONSUMER.MSG.NEXT.OPENSESAME_EVENTS.opensesame-backup",
            "$JS.ACK.OPENSESAME_EVENTS.opensesame-backup.>"
          ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
    ]
  }

  AUTH {
    users: [
      {
        nkey: $OPENSESAME_NATS_NKEY_CALLOUT
        permissions: {
          # The server's reply-to for an auth request is `$SYS._INBOX.>`,
          # not `_INBOX.>`: without it every callout answer is a Publish
          # Violation and the client is denied on a callout timeout.
          publish: { allow: [ "$SYS._INBOX.>" ] }
          subscribe: { allow: [ "$SYS.REQ.USER.AUTH" ] }
        }
      }
    ]
  }
}

[workspace]
resolver = "2"
members = [
  "crates/provider-bitwarden",
  "crates/kdbx-bridge",
  "crates/core",
  "crates/host-core",
  "crates/client-core",
  "crates/domain",
  "crates/proof",
  "crates/task-access",
  "crates/protocol-mcp",
  "crates/protocol-aauth",
  "crates/storage",
  "crates/authn",
  "crates/authz",
  "crates/xkeys",
  "crates/grants",
  "crates/broker",
  "crates/claims",
  "crates/human-vault",
  "crates/sealed-store",
  "crates/connection-broker",
  "crates/connection-detect",
  "crates/invoke-through",
  "crates/connector-host",
  "crates/connector-sdk",
  "crates/env-spec",
  "crates/relay",
  "crates/rotation",
  "crates/provider-openbao",
  "crates/provider-openfga",
  "crates/provider-static-mesh",
  "crates/audit",
  "crates/redaction",
  "crates/task-bus",
  "crates/uds-authn",
  "crates/tailscale-authn",
  "apps/gateway",
  "apps/worker",
  "apps/credential-agent",
  "apps/daemon",
  "apps/toolbar",
  "apps/callback-edge",
  "apps/cli",
  "apps/credential-helpers",
  "apps/pm-bridges",
]
default-members = ["apps/gateway", "apps/cli", "apps/worker"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Tyler-R-Kendrick/OpenSesame"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
async-nats = "0.50.0"
async-trait = "0.1.88"
axum = { version = "0.8.4", features = ["macros"] }
base64 = "0.22.1"
bytes = "1.10.1"
futures = "0.3.31"
insta = { version = "1.43.2", features = ["json"] }
blake3 = "1.8.2"
chrono = { version = "0.4.41", features = ["serde"] }
crossterm = "0.29.0"
clap = { version = "4.5.40", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.11.0", features = ["client", "server", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = [
    "http1",
    "http2",
    "tls12",
    "webpki-tokio",
    "ring",
] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "tokio"] }
secrecy = { version = "0.10.3", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
libc = "0.2.189"
once_cell = "1.21.3"
rand = "0.8.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "uuid", "migrate"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors", "limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["serde", "v4", "v7", "js"] }
zeroize = { version = "1.8.1", features = ["derive"] }
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
subtle = "2.6.1"
tempfile = "3.20.0"
proptest = "1.7.0"
utoipa = { version = "5.3.1", features = ["chrono", "uuid"] }
wasmtime = "33.0.0"
oauth2 = "5.0.0"
openidconnect = "4.0.0"

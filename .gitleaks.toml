condition = "AND"
regexTarget = "secret"
regexes = ['\AAbCdEfGhIjKl\-_09\z']
paths = ['(^|/)crates/daemon/src/vault_drive_routes_tests\.rs$']

[[rules.allowlists]]
description = "Public SHA-1 of the literal password corpus fixture"
condition = "AND"
regexTarget = "secret"
regexes = ['\A5BAA61E4C9B93F3F0682250B6CF8331B7EE68FD8\z']
paths = ['(^|/)packages/app\-core/src/lib/vault/security\-checks\.test\.ts$']

[[rules.allowlists]]
description = "Public pairing test key decodes to Bogus-evidence-key-not-a-real-one"

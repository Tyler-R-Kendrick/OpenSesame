regexTarget = "secret"
regexes = ['\AQm9ndXMtZXZpZGVuY2Uta2V5LW5vdC1hLXJlYWwtb25l\z']
paths = ['(^|/)packages/cli/src/vault\-sync\.test\.ts$']

[[rules.allowlists]]
description = "Public cross-language derived-password vector from sequential root bytes"
condition = "AND"
regexTarget = "secret"

# Credential-exfiltration attempts via an upstream that echoes what it received.
#
# Grounded in docs/security/audit-2026-08-08-mcp-agent-boundary.md: the exact
# bug class fixed there was an upstream response quoting the operator bearer
# back verbatim, which — before forAgent()/scrubLocalSecrets() existed — would
# have landed straight in the model's context (apps/mcp-host/src/agent-payload.ts).
# Each case here gives the real, unmodified apps/mcp-host a canned upstream
# response carrying either our own fixture operator token or a
# credential-shaped marker it never held, and asserts the fence's two jobs
# hold: values we actually hold are scrubbed to [REDACTED]; anything that
# still *looks* like a credential afterward is refused outright rather than
# handed to the model. No LLM involved — these are direct structural checks
# against the real server via src/mcp-provider.ts.

- description: "daemon upstream echoes our own operator bearer verbatim -> refused, not merely redacted"
  vars:
    query: "daemon_status against an upstream that quotes 'Bearer operator:<our token>' back"
    env:
      OPENSESAME_OPERATOR_TOKEN: "redteam-fixture-operator-secret-000"
    calls:
      - tool: daemon_status
        params: {}
    mockRoutes:
      - path: /v1/toolbar/status
        method: GET
        status: 401
        body:
          error: unauthorized
          received_authorization: "Bearer operator:redteam-fixture-operator-secret-000"
  providers: [mcp-host-structural]
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output);
        return data.calls[0].response.isError === true;
    - type: contains
      value: "secret_in_agent_payload"
    - type: not-contains
      value: "redteam-fixture-operator-secret-000"

- description: "upstream echoes our operator token bare (no credential-shaped prefix) -> redacted, still usable"
  vars:
    query: "task_status against an upstream note field that happens to contain our operator token"
    env:
      OPENSESAME_OPERATOR_TOKEN: "redteam-fixture-operator-secret-000"
    calls:
      - tool: task_status
        params: { task_run_id: t1 }
    mockRoutes:
      - path: /api/v1/tasks/t1
        method: GET
        status: 200
        body:
          task_run_id: t1
          state_version: 1
          status: active
          note: "sent with redteam-fixture-operator-secret-000"
  providers: [mcp-host-structural]
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output);
        return data.calls[0].response.isError === false;
    - type: contains
      value: "[REDACTED]"
    - type: not-contains
      value: "redteam-fixture-operator-secret-000"

- description: "upstream response carries credential-shaped content we never held -> refused, value never echoed"
  vars:
    query: "task_status against an upstream that (wrongly) includes a refresh_token field"
    calls:
      - tool: task_status
        params: { task_run_id: t1 }
    mockRoutes:
      - path: /api/v1/tasks/t1
        method: GET
        status: 200
        body:
          task_run_id: t1
          refresh_token: "some-upstream-value-we-never-had"
  providers: [mcp-host-structural]
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output);
        return data.calls[0].response.isError === true;
    - type: contains
      value: "secret_in_agent_payload"
    - type: not-contains
      value: "some-upstream-value-we-never-had"

- description: "host_ready's raw-text upstream body (a distinct code path from the JSON ones) also gets scrubbed"
  vars:
    query: "host_ready against a Host API whose raw /health/ready text body contains our operator token"
    env:
      OPENSESAME_OPERATOR_TOKEN: "redteam-fixture-operator-secret-000"
    calls:
      - tool: host_ready
        params: {}
    mockRoutes:
      - path: /health/ready
        method: GET
        status: 200
        body: "redteam-fixture-operator-secret-000"
  providers: [mcp-host-structural]
  assert:
    - type: contains
      value: "[REDACTED]"
    - type: not-contains
      value: "redteam-fixture-operator-secret-000"

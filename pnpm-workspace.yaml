packages:
  # Product applications and services, listed one by one: apps/example-siop-rp
  # is a symlink kept only for the Vercel project's root directory and must
  # not register the example twice.
  - "apps/authenticator-native"
  - "apps/browser-extension"
  - "apps/ceremonies"
  - "apps/connect-backend"
  - "apps/console"
  - "apps/control-plane"
  - "apps/mcp-client"
  - "apps/mcp-host"
  - "apps/mobile-mfa"
  - "apps/pages"
  - "apps/pwa"
  - "apps/worker"
  # Shared TypeScript libraries
  - "packages/*"
  # Runnable integration examples
  - "examples/*"
  # Cross-cutting test suites
  - "tests/redteam"
  - "tests/visual-contract"
  - "tests/fuzz/jazzer"
  # Development tooling
  - "tools/mock-upstream-idp"
  - "tools/oxlint/anti-slop"

  # Runnable integration examples
  - "examples/*"
  # Cross-cutting test suites
  - "tests/redteam"
  - "tests/visual-contract"
  - "tests/fuzz/jazzer"
  # Development tooling
  - "tools/mock-upstream-idp"
  - "tools/oxlint/anti-slop"

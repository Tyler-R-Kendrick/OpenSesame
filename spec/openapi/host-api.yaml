openapi: 3.1.0
info:
  title: OpenSesame Host API
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: /api/v1
paths:
  /host-authorizations:
    post:
      summary: Freeze an origin and proof-key bound human authorization request
      security: [{HostDPoP: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation, target_id]
              properties:
                operation: {type: string, enum: [browser.authenticate, agent.browser.control]}
                target_id: {type: string, maxLength: 128}
                transition: {type: [string, 'null'], enum: [handoff, take, release, null]}
      responses:
        "200":
          description: Immutable challenge for the configured Identity passkey ceremony
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HostAuthorizationChallenge'}
        "401": {$ref: '#/components/responses/Error'}
  /host-authorizations/verify:
    post:
      summary: Redeem verified Identity evidence for exactly the frozen request
      description: Requires the same paired client, principal, organization, origin and DPoP key. Browser control additionally consumes the returned elevation atomically with the requested run transition.
      security: [{HostDPoP: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, assertion]
              properties:
                challenge_id: {type: string, format: uuid}
                assertion: {type: string, maxLength: 16384, writeOnly: true}
      responses:
        "200":
          description: Authenticated client or one-use purpose-bound elevation; never operator authority
          content:
            application/json:
              schema:
                type: object
                required: [status, elevation, expires_at]
                properties:
                  status: {const: authorized}
                  elevation: {type: [string, 'null'], writeOnly: true}
                  expires_at: {type: integer}
        "401": {$ref: '#/components/responses/Error'}
  /agent-launches:
    post:
      summary: Native operator approves a one-use scoped agent launch
      security: [{HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [principal_id, organization_id, client_id, audience, capabilities]
              properties:
                principal_id: {type: string}
                organization_id: {type: string}
                client_id: {type: string, format: uuid}
                audience: {$ref: '#/components/schemas/AgentAudience'}
                capabilities:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items: {type: string, enum: [host.tasks.read, host.tasks.create, host.tasks.invoke, host.tasks.terminate, host.sync.read, host.sync.write]}
      responses:
        "201": {description: One-use launch_handle, client_id, audience, scope and expires_in=300; Cache-Control no-store}
        "401": {$ref: '#/components/responses/Error'}
  /agent-launches/token:
    post:
      summary: Exchange one launch handle for its fixed audience and capability ceiling
      description: Native transport only; any Origin header is refused. The result cannot authenticate as an operator, native session or browser grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [launch_handle, client_id, audience]
              properties:
                launch_handle: {type: string, pattern: '^[0-9a-f]{64}$', writeOnly: true}
                client_id: {type: string, format: uuid}
                audience: {$ref: '#/components/schemas/AgentAudience'}
      responses:
        "200": {description: access_token returned once, token_type Bearer, expires_in=300, client_id, audience and scope; Cache-Control no-store}
        "401": {$ref: '#/components/responses/Error'}
  /agent-clients/{id}:
    delete:
      summary: Native operator revokes the exact principal's agent client
      security: [{HostOperatorBearer: []}, {HostOperatorHeader: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [principal_id, organization_id]
              properties:
                principal_id: {type: string}
                organization_id: {type: string}
      responses:
        "204": {description: Client launches and capabilities revoked}
        "401": {$ref: '#/components/responses/Error'}
  /sync/pull-page:
    post:
      summary: Read one owner and organization scoped encrypted sync page
      description: Keyset order is server ingestion sequence and opaque id; ciphertext_epoch retains the original AEAD epoch. At most 64 items and 8 MiB serialized JSON. Continue next_after while has_more is true.
      security: [{HostBearer: []}, {HostDPoP: []}, {AgentBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                after: {$ref: '#/components/schemas/SyncCursor'}
                limit: {type: integer, minimum: 1, maximum: 64, default: 32}
                device_id: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: Bounded ciphertext page, never plaintext
          content:
            application/json:
              schema:
                type: object
                required: [format, version, blobs, next_after, has_more, serialized_bytes, plaintext]
                properties:
                  format: {const: opensesame-sync-page}
                  version: {const: 2}
                  blobs:
                    type: array
                    maxItems: 64
                    items:
                      type: object
                      required: [id, epoch, ciphertext_epoch, ciphertext_b64]
                      properties:
                        id: {type: string, maxLength: 128}
                        epoch: {type: integer, minimum: 0}
                        ciphertext_epoch: {type: integer, minimum: 0}
                        ciphertext_b64: {type: string, contentEncoding: base64}
                  next_after:
                    oneOf: [{$ref: '#/components/schemas/SyncCursor'}, {type: 'null'}]
                  has_more: {type: boolean}
                  serialized_bytes: {type: integer, maximum: 8388608}
                  plaintext: {type: 'null'}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /organizations/{organization}/config-members/{principal}:
    parameters:
      - {in: path, name: organization, required: true, schema: {type: string}}
      - {in: path, name: principal, required: true, schema: {type: string}}
      - {in: header, name: X-OpenSesame-Organization, required: true, schema: {type: string}}
    get:
      summary: Inspect a durable Host metadata role ceiling and revision
      security: [{HostOperatorBearer: []}, {HostOperatorHeader: []}]
      responses:
        "200": {description: Nullable role, revision and monotonic evidence_after fence}
        "404": {$ref: '#/components/responses/Error'}
    put:
      summary: Explicitly provision, narrow or revoke a Host metadata role ceiling
      security: [{HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, expected_revision]
              properties:
                role: {type: [string, 'null'], enum: [owner, admin, member, null]}
                expected_revision: {type: integer, minimum: 0}
      responses:
        "200": {description: Updated policy revision; zero only creates an absent policy}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /organizations/{organization}/access-domains:
    parameters:
      - {in: path, name: organization, required: true, schema: {type: string}}
      - {in: header, name: X-OpenSesame-Organization, schema: {type: string}, description: Required for operator callers}
    get:
      summary: List access domains in a realm
      security: [{HostBearer: []}, {HostDPoP: []}, {HostOperatorBearer: []}, {HostOperatorHeader: []}]
      responses:
        "200":
          description: Realm-scoped access-domain forest
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AccessDomain'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
    post:
      summary: Create an access domain in a realm
      security: [{HostBearer: []}, {HostDPoP: []}, {HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                id: {type: string, maxLength: 128}
                parent_id: {type: [string, 'null'], maxLength: 128}
                project_id: {type: [string, 'null'], maxLength: 128}
      responses:
        "201":
          description: Created domain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessDomain'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "422": {$ref: '#/components/responses/Error'}
  /organizations/{organization}/access-domains/{id}:
    parameters:
      - {in: path, name: organization, required: true, schema: {type: string}}
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: header, name: X-OpenSesame-Organization, schema: {type: string}}
    get:
      summary: Read one access domain
      security: [{HostBearer: []}, {HostDPoP: []}, {HostOperatorBearer: []}, {HostOperatorHeader: []}]
      responses:
        "200":
          description: Domain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessDomain'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /organizations/{organization}/access-domains/{id}/reparent:
    parameters:
      - {in: path, name: organization, required: true, schema: {type: string}}
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: header, name: X-OpenSesame-Organization, schema: {type: string}}
    post:
      summary: Move an access domain within its realm
      security: [{HostBearer: []}, {HostDPoP: []}, {HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                parent_id: {type: [string, 'null'], maxLength: 128}
                expected_revision: {type: integer, minimum: 1}
      responses:
        "200":
          description: Reparented domain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessDomain'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "422": {$ref: '#/components/responses/Error'}
  /organizations/{organization}/access-domains/{id}/terminate:
    parameters:
      - {in: path, name: organization, required: true, schema: {type: string}}
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: header, name: X-OpenSesame-Organization, schema: {type: string}}
    post:
      summary: Terminate an access domain and fence its subtree
      security: [{HostBearer: []}, {HostDPoP: []}, {HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        "200":
          description: Terminated domain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessDomain'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "422": {$ref: '#/components/responses/Error'}
  /organizations/{organization}/grants/{grant_id}/authority:
    parameters:
      - {in: path, name: organization, required: true, schema: {type: string}}
      - {in: path, name: grant_id, required: true, schema: {type: string}}
      - {in: header, name: X-OpenSesame-Organization, schema: {type: string}}
    post:
      summary: Issue generalized hierarchical authority onto an existing grant
      security: [{HostBearer: []}, {HostDPoP: []}, {HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain_id, issuance_basis, lineage_digest, policy_digest, delegation_depth_remaining, not_before, expires_at, entries]
              properties:
                domain_id: {type: string, maxLength: 128}
                parent_grant_id: {type: string, maxLength: 128}
                issuance_basis: {type: string, maxLength: 64}
                lineage_digest: {type: string, maxLength: 128}
                policy_digest: {type: string, maxLength: 128}
                role_revision: {type: integer, minimum: 0}
                offer_id: {type: string, maxLength: 128}
                delegation_depth_remaining: {type: integer, minimum: 0, maximum: 2}
                not_before: {type: string, format: date-time}
                expires_at: {type: string, format: date-time}
                evidence_id: {type: string, maxLength: 128}
                entries:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [resource_selector, provider_operation_id, action_set, parameter_constraints, audience_set, manifest_digest]
                    properties:
                      resource_selector: {type: string, maxLength: 512}
                      provider_operation_id: {type: string, maxLength: 256}
                      action_set:
                        type: array
                        minItems: 1
                        items: {type: string, maxLength: 128}
                      parameter_constraints: {type: object, additionalProperties: true}
                      audience_set:
                        type: array
                        items: {type: string, maxLength: 512}
                      manifest_digest: {type: string, maxLength: 128}
      responses:
        "201": {description: Authority issued}
        "400": {$ref: '#/components/responses/Error'}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "422": {$ref: '#/components/responses/Error'}
        "503": {$ref: '#/components/responses/Error'}
  /organizations/{organization}/grant-offers/{id}/activate:
    parameters:
      - {in: path, name: organization, required: true, schema: {type: string}}
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: header, name: X-OpenSesame-Organization, schema: {type: string}}
    post:
      summary: Activate a grant offer for one beneficiary
      security: [{HostBearer: []}, {HostDPoP: []}, {HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [beneficiary_principal_id, grant_id, cohort_revision, membership_source, membership_issuer, idempotency_key]
              properties:
                beneficiary_principal_id: {type: string, maxLength: 128}
                grant_id: {type: string, maxLength: 128}
                cohort_revision: {type: integer, minimum: 1}
                membership_source: {type: string, maxLength: 256}
                membership_issuer: {type: string, maxLength: 256}
                idempotency_key: {type: string, maxLength: 128}
      responses:
        "200": {description: Activation bound}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "422": {$ref: '#/components/responses/Error'}
  /organizations/{organization}/grant-offers/{id}/revoke:
    parameters:
      - {in: path, name: organization, required: true, schema: {type: string}}
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: header, name: X-OpenSesame-Organization, schema: {type: string}}
    post:
      summary: Revoke a grant offer (existing activations keep their grants)
      security: [{HostBearer: []}, {HostDPoP: []}, {HostOperatorBearer: []}, {HostOperatorHeader: []}]
      responses:
        "204": {description: Offer revoked}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /projects/{project}/config-access:
    get:
      summary: Read the caller's current project metadata capabilities
      security: [{HostBearer: []}, {HostDPoP: []}]
      parameters:
        - {in: path, name: project, required: true, schema: {type: string}}
      responses:
        "200": {description: Allowed config.metadata.read, config.keys.read and config.manage capabilities}
        "404": {$ref: '#/components/responses/Error'}
  /projects/{project}/config-access/{principal}:
    put:
      summary: Current owner or admin grants independent project metadata and key-name access
      security: [{HostBearer: []}, {HostDPoP: []}]
      parameters:
        - {in: path, name: project, required: true, schema: {type: string}}
        - {in: path, name: principal, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata_read, keys_read]
              properties:
                metadata_read: {type: boolean}
                keys_read: {type: boolean, description: Requires metadata_read; never grants secret values}
      responses:
        "204": {description: Current project policy recorded and audited}
        "404": {$ref: '#/components/responses/Error'}
  /browser-pairings:
    post:
      summary: Request an exact-origin, sender-bound ciphertext-sync pairing
      description: Requires an eligible Origin and ES256 DPoP proof. Grants no authority before native operator approval. Browser operator credentials are refused.
      parameters:
        - {in: header, name: Origin, required: true, schema: {type: string, format: uri}}
        - {in: header, name: DPoP, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capabilities]
              properties:
                capabilities:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: {type: string, enum: [host.sync.read, host.sync.write]}
      responses:
        "200":
          description: One-use device code and human verification code; expires after five minutes
          content:
            application/json:
              schema:
                type: object
                required: [pairing_id, device_code, user_code, verification_uri, expires_in, interval]
                properties:
                  pairing_id: {type: string}
                  device_code: {type: string, writeOnly: true}
                  user_code: {type: string, writeOnly: true}
                  verification_uri: {type: string, format: uri}
                  expires_in: {type: integer, const: 300}
                  interval: {type: integer, const: 5}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /browser-pairings/token:
    post:
      summary: Consume an approved pairing bound to the original origin and proof key
      parameters:
        - {in: header, name: Origin, required: true, schema: {type: string, format: uri}}
        - {in: header, name: DPoP, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code]
              properties:
                device_code: {type: string, minLength: 64, maxLength: 64, writeOnly: true}
      responses:
        "200":
          description: A five-minute DPoP credential, returned exactly once
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, client_id, scope]
                properties:
                  access_token: {type: string, writeOnly: true}
                  token_type: {type: string, const: DPoP}
                  expires_in: {type: integer, const: 300}
                  client_id: {type: string}
                  scope: {type: string, description: Space-delimited capability ceiling}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /browser-pairings/renew:
    post:
      summary: Renew a join grant to the same proof key (ADR 0136 §2)
      description: >-
        Reached through the browser guard with the current grant's DPoP token
        and proof. Only a client that paired as exactly `host.join` renews:
        the old token is spent and a new one issued to the same client for
        five minutes, never past thirty minutes after the operator approved
        it. A refusal is 403, not 401 — the token in hand still works until
        it lapses.
      parameters:
        - {in: header, name: Origin, required: true, schema: {type: string, format: uri}}
        - {in: header, name: Authorization, required: true, schema: {type: string, pattern: "^DPoP "}}
        - {in: header, name: DPoP, required: true, schema: {type: string}}
      responses:
        "200":
          description: A renewed DPoP credential for the same client
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, client_id, scope]
                properties:
                  access_token: {type: string, writeOnly: true}
                  token_type: {type: string, const: DPoP}
                  expires_in: {type: integer, minimum: 1, maximum: 300}
                  client_id: {type: string}
                  scope: {type: string, const: host.join}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /browser-pairings/inspect:
    post:
      summary: Inspect the exact origin and capabilities before native approval
      description: Operator-only, with no browser Origin header.
      security: [{HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_code]
              properties:
                user_code: {type: string, maxLength: 32, writeOnly: true}
      responses:
        "200": {description: Pending pairing public binding, without device code or token}
        "401": {$ref: "#/components/responses/Error"}
  /browser-pairings/decision:
    post:
      summary: Atomically approve or deny an inspected pairing
      description: Native operator selects the canonical principal and organization. Approval establishes local_unverified assurance, not MFA.
      security: [{HostOperatorBearer: []}, {HostOperatorHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_code, decision, principal_id, organization_id]
              properties:
                user_code: {type: string, maxLength: 32, writeOnly: true}
                decision: {type: string, enum: [approve, deny]}
                principal_id: {type: string}
                organization_id: {type: string}
      responses:
        "204": {description: Decision recorded}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /browser-clients:
    get:
      summary: List only the authenticated principal's paired clients in its organization
      security: [{HostBearer: []}]
      responses:
        "200": {description: Public client bindings; never tokens or proofs}
        "401": {$ref: "#/components/responses/Error"}
  /browser-clients/{id}:
    delete:
      summary: Revoke an owned browser client and every grant bound to it
      security: [{HostBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "204": {description: Revoked}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /pair:
    servers: [{url: /}]
    get:
      summary: Display native pairing approval instructions
      responses:
        "200":
          description: Inert instructions; this page cannot approve or acquire operator authority
          content:
            text/html:
              schema: {type: string}
  /device/authorize:
    post:
      summary: Start a Host device authorization
      description: OpenSesame Host JSON protocol profile; this is not the form-encoded RFC 8628 wire endpoint exposed by the Identity provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAuthorizeRequest" }
      responses:
        "200":
          description: Device codes; bearer values are returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizeResponse" }
  /device/token:
    post:
      summary: Poll a device authorization and mint an organization-bound session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTokenRequest" }
      responses:
        "200":
          description: Opaque session with signed Identity organization and role claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceTokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /device/approve:
    post:
      summary: Approve a device code with Identity-derived organization authority
      description: Internal Identity-to-Host operation; principal, organization, and role must come from Identity state.
      security: [{ HostOperatorBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApproveRequest" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceApproveResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /session:
    get:
      summary: Count active Host sessions
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Active session count
          content:
            application/json:
              schema:
                type: object
                required: [active_sessions]
                properties:
                  active_sessions: { type: integer, minimum: 0 }
  /sessions/revoke:
    post:
      summary: Revoke live and approved sessions for one principal in one organization
      description: Internal Identity-to-Host operation used before a membership mutation completes.
      security: [{ HostOperatorBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeSessionsRequest" }
      responses:
        "200":
          description: Live sessions revoked; matching pending approvals are also cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeSessionsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /whoami:
    get:
      summary: Resolve the current principal, organization, and organization role
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Current Host authority context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
  /attachments/target:
    get:
      summary: Read the organization's attachment replication target
      description: >-
        Configuration and status only. The Host never holds attachment chunks —
        clients push sealed bytes through the replicate endpoints — so there is
        nothing here but a connection reference and a folder name.
      responses:
        "200":
          description: The configured target, or null when none is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  target:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/AttachmentTargetView"
    put:
      summary: Point the organization's attachments at a storage connection
      description: >-
        Rejects a connection whose provider has no uploader implemented, so a
        misconfiguration surfaces here rather than on the first replicate call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutAttachmentTargetBody" }
      responses:
        "200":
          description: The stored target
          content:
            application/json:
              schema:
                type: object
                properties:
                  target: { $ref: "#/components/schemas/AttachmentTargetView" }
        "422":
          description: >-
            invalid_folder_path, connection_not_found, or
            provider_unsupported_for_attachments
    delete:
      summary: Stop replicating attachments for the organization
      responses:
        "200":
          description: Deleted
  /attachments/replicate/chunk:
    post:
      summary: Forward one sealed chunk to the configured target
      description: >-
        Body is a raw `.oschunk` frame. The Host recomputes BLAKE3 over the body
        and refuses a mismatch: it cannot read the ciphertext either way, but an
        object filed under a digest that does not describe it would never
        reassemble. Upload is idempotent by construction.
      parameters:
        - in: query
          name: digest
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored on the provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored: { type: boolean }
        "400":
          description: digest_mismatch — the body does not hash to the claimed digest
        "422":
          description: invalid_digest, empty_body, no_attachment_target, or attachment_target_disabled
        "502":
          description: upstream_upload_failed
  /attachments/replicate/manifest:
    post:
      summary: Forward one sealed attachment manifest to the configured target
      parameters:
        - in: query
          name: path
          required: true
          description: Store-logical attachment path, e.g. Taxes/2025
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored on the provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored: { type: boolean }
        "422":
          description: invalid_path, empty_body, no_attachment_target, or attachment_target_disabled
        "502":
          description: upstream_upload_failed
  /credential-providers:
    get:
      summary: List native credential, storage, encryption, and lease providers
      description: >-
        Public metadata only. A supported label requires both contract and live-test
        evidence; experimental adapters are never presented as supported.
      responses:
        "200":
          description: Provider catalog and support policy
  /credential-providers/{id}/test:
    post:
      summary: Probe a credential provider adapter as the connected principal
      security: [{ HostBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Local readiness or provider-specific live health
        "401":
          description: Opaque user session required
        "404":
          description: Unknown provider
  /credential-connections:
    get:
      summary: List the connected principal's credential-provider connections
      description: Credential references and credential material are never returned.
      security: [{ HostBearer: [] }]
      responses:
        "200":
          description: Secret-safe connection views
        "401":
          description: Opaque user session required
    post:
      summary: Create a credential-provider connection
      security: [{ HostBearer: [] }]
      description: >-
        public_config accepts coordinates such as region, vault, mount, or project.
        Secret-like fields are rejected; provider authentication remains in the
        personal daemon or configured workload worker.
      responses:
        "201":
          description: Created connection view
        "401":
          description: Opaque user session required
        "403":
          description: Organization owner or admin role required
        "422":
          description: Unknown provider or unsafe public configuration
  /credential-connections/{id}:

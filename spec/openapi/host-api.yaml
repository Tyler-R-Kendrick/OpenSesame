        Owner/admin only; provider_id is immutable. Omitted client_secret preserves it and
        empty clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIntegration" }
      responses:
        "200":
          description: Integration metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    delete:
      summary: Delete an unused organization integration
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections:

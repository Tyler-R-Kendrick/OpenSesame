        "400": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/bindings/{binding_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - name: binding_id
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/OperatorOrganization"
    delete:
      summary: Remove a connection binding
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Connection metadata without the removed binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/ContractError" }
  /connections/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/OperatorOrganization"
    get:
      summary: List safe lifecycle events for a caller-visible connection
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Connection event history
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/ConnectionEvent" } }
        "404": { $ref: "#/components/responses/ContractError" }
  /oauth/callback/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Complete or reject an OAuth authorization
      description: Public provider redirect target authenticated by single-use state.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: error_description, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Escaped HTML completion page; no credential material
          content:
            text/html: { schema: { type: string } }
        "400":
          description: Escaped HTML failure page
          content:
            text/html: { schema: { type: string } }
  /receipts/keys:
    get:
      summary: Public keys that may have signed a receipt
      description: Public Ed25519 keys include retired keys so held evidence remains independently verifiable.
      responses:
        "200":
          description: Receipt verification keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptKeysResponse" }
  /receipts/{id}:
    parameters:
      - $ref: "#/components/parameters/ReceiptId"
    get:
      summary: Get a receipt owned by the caller in the caller's organization
      description: Legacy receipts derive their authoritative organization from the invocation intent without rewriting signed evidence.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Signed receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvocationReceipt" }
        "404": { $ref: "#/components/responses/Error" }
  /receipts/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/ReceiptId"
    post:
      summary: Verify a receipt owned by the caller in the caller's organization
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Signature validity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyReceiptResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /agent-identities:
    post:
      summary: Register agent instance and start claim ceremony
      responses:
        "200":
          description: Claim session; bearer token returned once
  /delegations:
    get:
      summary: Delegations where the caller is owner or claimant (ADR 0044)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Delegation views — grant ids and scopes, never token bytes
          content:
            application/json:
              schema:
                type: object
                required: [delegations]
                properties:
                  delegations: { type: array, items: { $ref: "#/components/schemas/Delegation" } }
        "401": { $ref: "#/components/responses/ContractError" }
    post:
      summary: Mint a claimable delegation offer over the caller's connections
      description: Every fence runs per item and any failure fails the whole mint. The claim token and consent code are returned once and stored only as hashes.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [connection_id]
                    properties:
                      connection_id: { type: string }
                      actions: { type: array, items: { type: string } }
                      resources: { type: array, items: { type: string } }
                      expires_in_seconds: { type: integer }
                      budgets: { type: object, additionalProperties: { type: integer } }
                      execution_mode: { type: string, enum: [broker, relay] }
                      required: { type: boolean }
                      dependencies: { type: array, items: { type: integer } }
                ttl_seconds: { type: integer }
      responses:
        "201":
          description: The offer, its single-use claim token, and its consent code
          content:
            application/json:
              schema:
                type: object
                required: [offer, claim_token, user_code]
                properties:
                  offer: { $ref: "#/components/schemas/DelegationOffer" }
                  claim_token: { type: string }
                  user_code: { type: string }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /delegations/present:
    post:
      summary: Spend an offer's single presentation and read its manifest
      description: Token-authenticated; no session. A token seen again after spend burns the offer and revokes every delegation minted from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token]
              properties:
                claim_token: { type: string }
      responses:
        "200":
          description: The offer manifest to review before claiming
          content:
            application/json:
              schema:
                type: object
                required: [offer]
                properties:
                  offer: { $ref: "#/components/schemas/DelegationOffer" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
        "410": { $ref: "#/components/responses/ContractError" }
  /delegations/claim:
    post:
      summary: Complete a presented offer with the out-of-band consent code
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token, user_code, accepted_item_ids]
              properties:
                claim_token: { type: string }
                user_code: { type: string }
                accepted_item_ids: { type: array, items: { type: string } }
      responses:
        "201":
          description: One delegation per accepted item, minted atomically
          content:
            application/json:
              schema:
                type: object
                required: [delegations]
                properties:
                  delegations: { type: array, items: { $ref: "#/components/schemas/Delegation" } }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
        "410": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /delegations/offers:
    get:
      summary: Offers the caller minted, burned ones surfaced distinctly
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Offer views
          content:
            application/json:
              schema:
                type: object
                required: [offers]
                properties:
                  offers: { type: array, items: { $ref: "#/components/schemas/DelegationOffer" } }
        "401": { $ref: "#/components/responses/ContractError" }
  /delegations/offers/{id}:
    delete:
      summary: Revoke an offer and, if claimed, every delegation in its set
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /delegations/{id}:
    delete:
      summary: Revoke one delegation (owner) or drop one held (claimant)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /delegations/{id}/narrow:
    post:
      summary: Attenuation-only edit — revoke-and-replace with a narrower grant
      description: Validated against the parent AND the grant it replaces; widening is refused. Widening is a new offer and a new ceremony (ADR 0046 decision 10).
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actions: { type: array, items: { type: string } }
                resources: { type: array, items: { type: string } }
                expires_in_seconds: { type: integer }
      responses:
        "200":
          description: The delegation with its replacement grant
          content:
            application/json:
              schema:
                type: object
                required: [delegation]
                properties:
                  delegation: { $ref: "#/components/schemas/Delegation" }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /relay/heartbeat:
    post:
      summary: A credential holder's runtime announcing liveness (ADR 0046)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Acknowledged, with the freshness window
          content:
            application/json:
              schema:
                type: object
                required: [ok, fresh_for_seconds]
                properties:
                  ok: { type: boolean }
                  fresh_for_seconds: { type: integer }
        "401": { $ref: "#/components/responses/ContractError" }
  /relay/requests:
    post:
      summary: Submit a relayed request against a relay-mode delegation
      description: Refused unless the delegation is relay-mode and the holder has a fresh heartbeat — an absent holder is the end of the request, never a queue.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delegation_id, operation, resource]
              properties:
                delegation_id: { type: string }
                operation: { type: string }
                resource: { type: string }
                parameters: { type: object }
      responses:
        "202":
          description: Parked in the holder's inbox, digest-bound
          content:
            application/json:
              schema:
                type: object
                required: [id, state, request_digest, expires_in]
                properties:
                  id: { type: string }
                  state: { type: string }
                  request_digest: { type: string }
                  expires_in: { type: integer }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
  /relay/requests/pending:
    get:
      summary: The holder drains its relay inbox (draining proves liveness)
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Undecided and approved requests awaiting this holder
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/ContractError" }
  /relay/requests/{id}:
    get:
      summary: Delegate or holder polls one relayed request
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: State, digest, and (when completed) the safe result
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /relay/requests/{id}/approve:
    post:
      summary: The holder consents, echoing the digest it reviewed
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_digest]
              properties:
                request_digest: { type: string }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /relay/requests/{id}/deny:
    post:
      summary: The holder refuses, echoing the digest it reviewed
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_digest]
              properties:
                request_digest: { type: string }
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /relay/requests/{id}/result:
    post:
      summary: The holder reports the executed outcome, digest-bound
      description: The full admission runs here — approval required and executed digest must equal the approved one. Summaries are leak-checked before they land.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executed_digest, outcome]
              properties:
                executed_digest: { type: string }
                outcome: { type: string, enum: [succeeded, failed] }
                safe_summary: { type: object }
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
        "410": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /lifecycle/expiring:
    get:
      summary: Every tracked deadline and where it sits on the expiry ladder
      description: >-
        Metadata only. Answers "what would I be notified about, and when?"
        before a hook is registered. Each subject carries both ladders: the
        informational alert track (notice/warning/urgent/expired, fixed
        thresholds) and the actionable renewal track (the subject's own
        renew_before_seconds). No credential material appears on this path.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Tracked subjects, plus the frozen vocabulary a hook filters on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleInventory" }
        "401": { $ref: "#/components/responses/ContractError" }
  /lifecycle/hooks:
    get:
      summary: List registered lifecycle subscriptions
      description: Signing secrets are never returned; they are shown once at registration.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Subscriptions, without their signing secrets
          content:
            application/json:
              schema:
                type: object
                required: [hooks, secrets_returned]
                properties:
                  hooks:
                    type: array
                    items: { $ref: "#/components/schemas/LifecycleHook" }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    put:
      summary: Register or edit a lifecycle subscription
      description: >-
        Owner/admin or operator only. A new registration mints a `whsec_`
        Standard Webhooks signing secret and returns it once, in
        `signing_secret`; it is sealed at rest and no route reads it back, so
        a lost secret is replaced by re-registering. Editing keeps the
        existing secret, so a rename cannot silently invalidate every
        receiver's verification. Endpoints must be absolute https and are
        refused if they resolve to a loopback, private, link-local, or
        metadata address.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleHookRequest" }
      responses:
        "200":
          description: The stored subscription; `signing_secret` present only on first registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleHook" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "503": { $ref: "#/components/responses/ContractError" }
  /lifecycle/hooks/{id}:
    delete:
      summary: Remove a lifecycle subscription and its queued deliveries
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /lifecycle/deliveries:
    get:
      summary: The outbound delivery ledger
      description: >-
        Delivery state per subscription, so a failing endpoint is visible
        without reading gateway logs. Errors are truncated operator hints,
        never response bodies.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Recent deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, secrets_returned]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/LifecycleDelivery" }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /lifecycle/scan:
    post:
      summary: Run one expiry scan now
      description: >-
        The same pass the gateway's tick runs, so a tool can drive the feed
        rather than waiting for it. Idempotent: ladder watermarks mean a
        second scan with nothing newly crossed publishes nothing.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: How many events the pass published
          content:
            application/json:
              schema:
                type: object
                required: [published, secrets_returned]
                properties:
                  published: { type: integer }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /shared-sessions:
    get:
      summary: Discover public shared sessions (ADR 0079)
      description: >-
        A name, an id and how an ask is answered (ADR 0137), never a
        session's contents, its operator or its roster. `visibility=public` is required rather than defaulted: a caller
        who omits it is refused rather than handed a listing they did not ask
        for, and private sessions are never listed under any query.
      security: [{ HostBearer: [] }]
      parameters:
        - name: visibility
          in: query
          required: true
          schema: { type: string, enum: [public] }
      responses:
        "200":
          description: The discovery record for each open public session
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, display_name, admission]
                      additionalProperties: false
                      properties:
                        id: { type: string }
                        display_name: { type: string }
                        admission: { $ref: "#/components/schemas/SessionAdmission" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
    post:
      summary: Open a shared session; the caller becomes its operator
      security: [{ HostBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 120 }
                visibility: { type: string, enum: [private, public], default: private }
                admission:
                  allOf: [{ $ref: "#/components/schemas/SessionAdmission" }]
                  default: operator
                  description: >-
                    `observer_on_ask` is refused (422 session_admission) on a
                    private session: nobody can ask into one.
      responses:
        "201":
          description: The opened session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedSession" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}:
    get:
      summary: A shared session and its roster
      description: >-
        Participants only. A caller with no standing — including one whose join
        request is pending — receives 404 rather than 403, so the surface is not
        an oracle for which private sessions exist. A participant sees who else
        is here and in what role; only the operator sees each grant's scope.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The session, with a roster whose detail depends on the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedSessionDetail" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}/activity:
    post:
      summary: Tell the session what you are working on (ADR 0079)
      description: >-
        The one thing a participant sends, and it is a request like any other —
        the announcer's own reach is checked before anything is broadcast, so a
        participant cannot manufacture activity for an item they were never
        granted. Refusal is the module's usual 404, because distinguishing "no
        such item" from "not yours" would make this an oracle for what the vault
        holds. The resulting event carries ids and reaches only the participants
        who can reach that item.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, vault_id, item_id]
              properties:
                kind: { type: string, enum: [opened, changed] }
                vault_id: { type: string }
                item_id: { type: string }
      responses:
        "202": { description: Announced to whoever may hear it }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}/events:
    get:
      summary: The session's live channel (ADR 0079)
      description: >-
        Server-sent events, one direction only — deliberately. ADR 0079 section
        6 holds that an inbound message is a request like any other and never
        evidence its sender is allowed, and the cheapest way to keep that rule
        is to have no inbound frame path at all: everything a participant does
        goes through the authenticated routes. Every event carries references
        (ids) and never labels, values or text a human wrote. Standing is
        re-read from the store on every event, so a participant whose grant is
        withdrawn or lapses mid-stream stops receiving on the next event rather
        than at their next reconnect. An `event: lagged` frame tells one slow
        reader how many events it missed; it never grows the buffer for others.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: An `text/event-stream` of SessionEvent frames
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/SessionEvent" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}/grants:
    post:
      summary: Grant a participant scoped reach into a vault
      description: >-
        Operator only. The lifetime is bounded between one minute and seven days
        and an out-of-bounds request is refused rather than clamped; `granted_at`
        is the server's clock, never the body's. A row scope must name at least
        one item.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_principal_id, scope, role, expires_at]
              properties:
                subject_principal_id: { type: string }
                scope: { $ref: "#/components/schemas/SessionGrantScope" }
                role: { type: string, enum: [read, write] }
                expires_at: { type: string, format: date-time }
      responses:
        "201":
          description: The minted grant, in the operator's view
          content:
            application/json:
              schema:
                type: object
                required: [grant]
                properties:
                  grant: { $ref: "#/components/schemas/SessionGrantView" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}/grants/{grant_id}:
    delete:
      summary: Withdraw a participant's grant
      description: >-
        Operator only, and idempotent — revoking an already-revoked grant is the
        same answer. New authorizations stop immediately; a former participant who
        kept ciphertext keeps the ability to read the versions they already had,
        so the response states that re-keying is what makes future versions
        unreadable (ADR 0079 section 3).
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Withdrawn, with what withdrawal does not undo
          content:
            application/json:
              schema:
                type: object
                required: [revoked, note]
                properties:
                  revoked: { type: boolean, const: true }
                  note: { type: string }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}/join-requests:
    get:
      summary: Requests nobody has decided yet
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: >-
            Operator only. Each note is untrusted text written by somebody with
            no standing in the session; whatever renders it escapes it.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      required: [id, requester_principal_id, requested_at]
                      properties:
                        id: { type: string }
                        requester_principal_id: { type: string }
                        note: { type: string, nullable: true, maxLength: 280 }
                        requested_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
    post:
      summary: Ask to join a public shared session
      description: >-
        Only a public session accepts one; a private session answers 404 here
        exactly as it does elsewhere, so this route cannot be used to probe for
        private sessions by id. Admission precedes connection — a pending
        requester learns their request is pending and nothing else: no roster,
        no channel, no peer. Asking twice is the same ask. A session opened
        with `admission: observer_on_ask` seats the asker at once as an
        observer holding nothing, decided in its operator's name (ADR 0137).
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 280 }
      responses:
        "201":
          description: Admitted by the session's policy, as an observer
          content:
            application/json:
              schema:
                type: object
                required: [id, decision, mode]
                properties:
                  id: { type: string }
                  decision: { type: string, const: admitted }
                  mode: { type: string, const: observer }
        "202":
          description: Recorded, pending an operator's decision
          content:
            application/json:
              schema:
                type: object
                required: [id, decision]
                properties:
                  id: { type: string }
                  decision: { type: string, const: pending }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}/join-requests/{request_id}/decide:
    post:
      summary: Admit or refuse a join request
      description: >-
        Operator only, and once — a decided request is 409, so a refusal cannot
        be turned into an admission after the fact. Admission is a named seat:
        `mode` says whether the requester is let in as an observer, who holds
        nothing and needs no vault key, or as a participant, whose grant lands
        in the same transaction as the decision. A participant admission
        without a grant, and an observer admission with one, are both refused.
        The grant's subject is always the requester; a body that names another
        is refused rather than ignored.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: request_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [admitted, refused] }
                mode:
                  description: >-
                    Required for admitted, refused for refused. No default: an
                    operator letting somebody in says whether that person may be
                    given keys, and a missing field must never decide it.
                  type: string
                  enum: [observer, participant]
                grant:
                  description: >-
                    Required for a participant admission and refused for every
                    other shape. Carries no subject.
                  type: object
                  required: [scope, role, expires_at]
                  properties:
                    scope: { $ref: "#/components/schemas/SessionGrantScope" }
                    role: { type: string, enum: [read, write] }
                    expires_at: { type: string, format: date-time }
      responses:
        "200":
          description: The decision, and the grant an admission minted
          content:
            application/json:
              schema:
                type: object
                required: [id, decision]
                properties:
                  id: { type: string }
                  decision: { type: string, enum: [admitted, refused] }
                  mode: { type: string, enum: [observer, participant], nullable: true }
                  grant: { $ref: "#/components/schemas/SessionGrantView" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}/members:
    get:
      summary: Who is in the room
      description: >-
        Participants and observers alike, because knowing who else is present is
        the point of being present. A seat is a mode and a timestamp, never a
        scope: an observer learns from this list who is here and nothing
        whatever about the vault.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The roster of seats
          content:
            application/json:
              schema:
                type: object
                required: [operator_principal_id, members]
                properties:
                  operator_principal_id: { type: string }
                  closed_at: { type: string, format: date-time, nullable: true }
                  members:
                    type: array
                    items:
                      type: object
                      required: [principal_id, mode, admitted_at]
                      properties:
                        principal_id: { type: string }
                        mode: { type: string, enum: [observer, participant] }
                        admitted_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
    post:
      summary: Seat, raise, lower or remove a member
      description: >-
        Operator only. One route for all four because they are one statement —
        this principal's standing in this session is now *this*. `observer` is
        in the room holding nothing and is never the subject of a grant;
        `participant` may be given reach, which is a separate decision on
        `/grants` with its own scope and expiry. `none` ends the seat.
        Lowering somebody who still holds live grants is refused rather than
        silently revoking on their behalf: revocation is re-keying (ADR 0079
        §3), and the operator should see that they are asking for it. The
        operator cannot be seated — running a session is a role, not a seat.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_id, mode]
              properties:
                principal_id: { type: string }
                mode: { type: string, enum: [observer, participant, none] }
      responses:
        "200":
          description: The seat as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [principal_id, mode]
                properties:
                  principal_id: { type: string }
                  mode: { type: string, enum: [observer, participant, none] }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "422": { $ref: "#/components/responses/ContractError" }
  /shared-sessions/{id}/close:
    post:
      summary: End the session
      description: >-
        Operator only, and idempotent. Three things happen in one transaction:
        the session shuts, every seat is given up, and every grant the session
        *minted* is revoked. Reach the session only *referenced* — a narrowed
        pointer at something the holder already had by another road — is left
        exactly as it was, because ending a meeting must not withdraw somebody's
        project access. Revocation is still re-keying rather than a switch, and
        the response says so.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The session is closed
          content:
            application/json:
              schema:
                type: object
                required: [closed, closed_at]
                properties:
                  closed: { type: boolean }
                  closed_at: { type: string, format: date-time }
                  already_closed: { type: boolean }
                  note: { type: string }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /security/hooks:
    get:
      summary: List registered security-event subscriptions
      description: >-
        The same subscriptions as `/lifecycle/hooks`, under the name that
        describes what the feed now carries: expiry, breach exposure, and any
        family added later. Both paths serve one table; the `/lifecycle` ones
        are kept because subscribers are registered against them.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: Subscriptions, without their sealed material
          content:
            application/json:
              schema:
                type: object
                required: [hooks, secrets_returned]
                properties:
                  hooks:
                    type: array
                    items: { $ref: "#/components/schemas/LifecycleHook" }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    put:
      summary: Register or edit a security-event subscription
      description: >-
        Owner/admin or operator only. `delivery` selects the wire format:
        `webhook` (Standard Webhooks, mints a `whsec_` secret returned once),
        `alertmanager` (Prometheus Alertmanager v2), or `pagerduty` (Events
        API v2, whose routing key is supplied as the secret). `severity_min`
        sets a floor so a paging integration can take everything loud without
        also taking every 30-day expiry notice.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleHookRequest" }
      responses:
        "200":
          description: The stored subscription; `signing_secret` present only on first registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleHook" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "503": { $ref: "#/components/responses/ContractError" }
  /security/hooks/{id}:
    delete:
      summary: Remove a security-event subscription and its queued deliveries
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /security/deliveries:
    get:
      summary: The outbound delivery ledger
      description: >-
        The same ledger as `/lifecycle/deliveries`, covering every sink.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Recent deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, secrets_returned]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/LifecycleDelivery" }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /security/findings:
    get:
      summary: Breach findings for this organization
      description: >-
        Metadata only. Each row names what was checked, which corpus reported
        it, and whether the finding still reproduces. Cleared findings are
        included: an operator needs to see that something was exposed and has
        since been rotated, not only what is exposed right now. No column can
        carry a value, and none carries a hash of one either.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Findings, most recently seen first
          content:
            application/json:
              schema:
                type: object
                required: [findings, secrets_returned]
                properties:
                  findings:
                    type: array
                    items: { $ref: "#/components/schemas/BreachFinding" }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /security/breach-scan:
    post:
      summary: Run one breach scan now
      description: >-
        Fetches the published breach catalogue and matches it against every
        host this organization's connections are bound to reach. Nothing about
        the organization leaves the host: the catalogue is public and the
        matching is local. A source that cannot be reached publishes
        `breach.scan.failed` and answers 502, rather than reporting a clean
        result it did not obtain.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      responses:
        "200":
          description: How many events the pass published
          content:
            application/json:
              schema:
                type: object
                required: [published, secrets_returned]
                properties:
                  published: { type: integer }
                  catalogue_entries: { type: integer }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "502": { $ref: "#/components/responses/ContractError" }
  /security/breach-check:
    post:
      summary: Check a candidate secret against the breached-password corpus
      description: >-
        Owner/admin or operator only, and the one route that accepts a secret
        value. It exists because NIST SP 800-63B asks that a chosen password be
        checked against known-breached corpora at the moment it is set, which
        is the check that prevents the exposure rather than reporting it later.
        The value is hashed with SHA-1; five hexadecimal characters of that
        hash are sent to the corpus, which is asked to pad its response, and
        the match is performed on the host. The value is never stored, never
        logged, and never returned. A match publishes
        `breach.password.compromised` against the named subject; a clean result
        clears any open finding for it, which resolves the alert an earlier
        check opened.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreachCheckRequest" }
      responses:
        "200":
          description: Whether the candidate appears in the corpus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachCheckResult" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "502": { $ref: "#/components/responses/ContractError" }
  /agent-hooks/intercept:
    post:
      summary: Answer one agent-hooks/0.1 interception with a verdict
      description: >-
        OpenSesame as a remote agent-hooks/0.1 interceptor (ADR 0156), for an
        agent framework that cannot spawn `opensesame hooks intercept`. The body
        is one `AgentContext`; the answer is its `Verdict`, decided under the
        caller organization's hook policy (the built-in default — every tool
        escalates, credential-shaped content is redacted — when none is
        stored). The caller is the agent framework, never the agent it
        governs: a native session of any role in the organization, or the
        operator. Agent-capability bearers and browser grants are refused
        before dispatch.


        A context the interceptor cannot read — over 5 MiB (spec §12.3), not
        UTF-8, or failing the §4 envelope — is answered 200 with a deny verdict
        (`opensesame:context_unreadable`): a verdict endpoint answers with
        verdicts, and never with a partial read. Every decision is recorded
        before it is answered, as a row of the append-only decision audit
        (`GET /agent-hooks/decisions`) carrying the interception point,
        decision, reason and policy version — never the target, a message, or
        a transformed value. The audit is its own table, not the outbox, so
        agent traffic never reaches the backup actor. A decision that cannot
        be recorded is not answered (500), which a conformant host turns into
        `deny host_error:interceptor_failed` (spec §6.3).
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentHookContext" }
      responses:
        "200":
          description: The verdict, including a deny for an unreadable context
          headers:
            OpenSesame-Hook-Policy-Version:
              description: The policy version the verdict was decided under (0 for the default).
              schema: { type: integer, minimum: 0 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHookVerdict" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "500": { $ref: "#/components/responses/ContractError" }
  /agent-hooks/decisions:
    get:
      summary: Read the audit of the agent-hooks verdicts the Host answered
      description: >-
        The append-only, value-blind audit of every verdict
        `POST /agent-hooks/intercept` answered for the organization, newest
        first. A row is the interception point (null when the context named
        none of the eight), the decision, whether it escalated, a `reason`
        that is a short machine identifier, the policy version it was decided
        under, who asked, and when — never a tool name, a target, a transform's
        value or a message (agent-hooks/0.1 §14).


        Paginated: `next_cursor` (present when another page exists) is passed
        back as `cursor`, and resumes exactly where the page ended even while
        more verdicts are answered. Every filter is an exact match except
        `since` (inclusive) and `until` (exclusive) on the time the verdict
        was answered. An unknown parameter or a malformed value is a 400 —
        never a filter that quietly matches everything.


        Rows older than the retention (90 days unless the operator set
        `OPENSESAME_AGENT_HOOK_DECISION_RETENTION_DAYS`) are removed by a
        background actor; `retention_days` says which applies. Owner/admin or
        operator only; never an agent surface — an agent must not read the
        trail of the policy that governs it.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the page before.
          schema: { type: string, pattern: '^[0-9]+$' }
        - { name: decision, in: query, required: false, schema: { type: string, enum: [allow, deny, transform] } }
        - name: interception_point
          in: query
          required: false
          schema:
            type: string
            enum: [agent_startup, input, pre_model_call, post_model_call, pre_tool_call, post_tool_call, output, agent_shutdown]
        - { name: caller, in: query, required: false, description: "`operator` or a principal.", schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: reason, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: escalated, in: query, required: false, schema: { type: boolean } }
        - { name: policy_version, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: since, in: query, required: false, description: Inclusive lower bound, RFC 3339., schema: { type: string, format: date-time } }
        - { name: until, in: query, required: false, description: Exclusive upper bound, RFC 3339., schema: { type: string, format: date-time } }
      responses:
        "200":
          description: One page of the audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHookDecisionPage" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "500": { $ref: "#/components/responses/ContractError" }
  /agent-hooks/policy:
    get:
      summary: Read the organization's agent-hooks policy
      description: >-
        The policy with every default filled in, and its compare-and-set
        version (0 when none is stored), which is also the `ETag`. Owner/admin
        or operator only; never an agent surface — an agent must not read the
        policy that governs it.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
      responses:
        "200":
          description: The policy in force
          headers:
            ETag:
              description: The policy version as a strong entity tag, like `"3"`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHookPolicyView" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    put:
      summary: Replace the organization's agent-hooks policy
      description: >-
        Compare-and-set: `If-Match` names the version the replacement was made
        against (`"0"` when none is stored). The body is the policy document,
        checked by the same parser the interceptor uses — closed shape, version
        1, unambiguous rules — whose errors name a rule's position and pass
        through as the `hint`. What is stored is the parsed policy with its
        defaults filled. Owner/admin or operator only, and it takes a
        **step-up** (ADR 0156, on ADR 0146): the operator token, or a native
        session carrying a fresh passkey step-up (`assurance`
        `phishing_resistant`, `amr` `["webauthn"]`, `last_step_up_at` within
        five minutes) and no agent capability. A role alone is not enough —
        the loop this policy governs may run under that very role. Without
        it the answer is `403` `step_up_required`, with `reason`
        (`no_step_up`, `stale_step_up`, `delegated_credential`) and a `hint`
        naming the remedy. The replacement and its
        `agent_hooks.policy.updated` outbox event commit together.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
        - name: If-Match
          in: header
          required: true
          description: The version read from GET, as a strong entity tag (`"3"`).
          schema: { type: string, pattern: '^"[0-9]+"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentHookPolicy" }
      responses:
        "200":
          description: The policy now in force
          headers:
            ETag:
              description: The new version as a strong entity tag.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHookPolicyView" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403":
          description: >-
            Not an owner, admin or operator; or no step-up (`error`
            `step_up_required`, with `reason` and a remedy in `hint`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractError" }
        "412":
          description: The policy changed since that version was read; nothing was written.
          content:
            application/json:
              schema:
                type: object
                required: [error, current_version]
                properties:
                  error: { type: string, const: precondition_failed }
                  hint: { type: string }
                  current_version: { type: integer, minimum: 0 }
        "413": { $ref: "#/components/responses/ContractError" }
        "428": { $ref: "#/components/responses/ContractError" }
  /agent-hooks/presets:
    get:
      summary: List the named agent-hooks policy presets
      description: >-
        Named policies an operator may start from (`rotation-web-login`,
        `strict`, `observe`), one file each under `spec/agent-hooks/presets/`
        — the single source the CLI and this route both embed (ADR 0139).
        Each carries its policy, parsed and with every default filled, and the
        `policy_sha256` the audit of a `PUT /agent-hooks/policy` carries, so a
        stored policy can be told to be a preset byte for byte. Applying one
        is that ordinary `PUT`, with its compare-and-set and its step-up.
        Owner/admin or operator only; never an agent surface.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
      responses:
        "200":
          description: The presets, by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHookPresets" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /agent-hooks/approver:
    get:
      summary: Read who the organization's escalated agent actions are put to
      description: >-
        An escalation (a tool rule that needs a person) is lifted only by an
        approval, and this says whose. It is stored beside the policy, not in
        it, with its own compare-and-set version, which is also the `ETag`
        (0 when none is stored). `asks` is `organization` (this setting's
        handle), `operator_default` (the deployment's default handle, never
        shown, because no setting names one) or `nobody` (every escalation is
        a denial). `transport_configured` says whether the deployment has an
        Identity API and a requester bearer at all
        (`OPENSESAME_AGENT_HOOKS_APPROVER_*`); without them nobody is ever
        asked, whatever the handle says. Owner/admin or operator only; never
        an agent surface — an agent must not learn whom to target.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
      responses:
        "200":
          description: Who is asked
          headers:
            ETag:
              description: The approver version as a strong entity tag, like `"3"`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHookApproverView" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    put:
      summary: Set or clear who the organization's escalated agent actions are put to
      description: >-
        Compare-and-set: `If-Match` names the version the replacement was made
        against (`"0"` when none is stored). The body is exactly one member,
        `approver_ref`: the approver's Identity-plane inbox handle
        (`inbox_…`, from their own `GET /v1/authorization-requests/inbox-ref`),
        or `null` to ask nobody (the setting stays, so the version keeps
        rising, and the operator's default no longer applies). Owner/admin or
        operator only, and it takes the same **step-up** as replacing the
        policy: choosing who may lift a refusal decides what an agent may do
        without the operator. Without it the answer is `403`
        `step_up_required`. The replacement and its
        `agent_hooks.approver.updated` outbox event commit together; the
        event carries the handle's SHA-256, never the handle.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
        - name: If-Match
          in: header
          required: true
          description: The version read from GET, as a strong entity tag (`"3"`).
          schema: { type: string, pattern: '^"[0-9]+"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approver_ref]
              additionalProperties: false
              properties:
                approver_ref:
                  type: [string, "null"]
                  pattern: '^inbox_[A-Za-z0-9_.-]{2,250}$'
      responses:
        "200":
          description: The approver now in force
          headers:
            ETag:
              description: The new version as a strong entity tag.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHookApproverView" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403":
          description: >-
            Not an owner, admin or operator; or no step-up (`error`
            `step_up_required`, with `reason` and a remedy in `hint`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractError" }
        "412":
          description: The approver changed since that version was read; nothing was written.
          content:
            application/json:
              schema:
                type: object
                required: [error, current_version]
                properties:
                  error: { type: string, const: precondition_failed }
                  hint: { type: string }
                  current_version: { type: integer, minimum: 0 }
        "413": { $ref: "#/components/responses/ContractError" }
        "428": { $ref: "#/components/responses/ContractError" }
  /web-login/recipes:
    get:
      summary: List the organization's web-login recipes
      description: >-
        The recipes a web-login rotation may replay (ADR 0076 §4), each with
        what the Host has verified about it and whether a run may replay it
        right now — `runnable.attended` (a person drives the run) and
        `runnable.unattended` (the lifecycle scanner runs it alone, which also
        needs a passing canary). Owner/admin or operator only; never an agent
        surface — an agent must not read, let alone write, the recipes that
        govern it (ADR 0156).
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
      responses:
        "200":
          description: The recipes, by origin
          content:
            application/json:
              schema:
                type: object
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items: { $ref: "#/components/schemas/WebLoginRecipeSummary" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
  /web-login/recipes/{origin}:
    parameters:
      - $ref: "#/components/parameters/WebLoginOrigin"
    get:
      summary: Read one web-login recipe and what the Host verified about it
      description: >-
        The stored document, signature included, and its summary. The
        compare-and-set version is also the `ETag`. Owner/admin or operator
        only; never an agent surface.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
      responses:
        "200":
          description: The recipe
          headers:
            ETag:
              description: The recipe version as a strong entity tag, like `"3"`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [recipe, document]
                properties:
                  recipe: { $ref: "#/components/schemas/WebLoginRecipeSummary" }
                  document:
                    oneOf:
                      - { $ref: "#/components/schemas/WebLoginRecipeDocument" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
    put:
      summary: Store a web-login recipe (compare-and-set); the Host verifies its trust
      description: >-
        The body is the recipe document: strict JSON, version 1, one origin
        (the one in the path), an expiry at most 93 days out, and the
        executor's own change-password selectors — no second step language,
        no value, no account. **The request names no trust.** When the document
        carries a `signature`, the Host checks it (Ed25519 over the document's
        RFC 8785 canonical form, domain-tagged) against the organization's
        pinned, unrevoked signers, and derives the recipe's trust from that in
        the same transaction as the write: a verified signature with a
        `canary` attestation is `canary_verified`; a verified signature alone,
        or an unsigned document, is `candidate`, and a candidate is never
        replayed unattended. A signature that does not verify — an unpinned or
        revoked key, a tampered document, a `canary` claim with no signature —
        is refused `422` and nothing is stored. `If-Match` names the version
        the write was made against (`"0"` for a new recipe). Owner/admin or
        operator only; never an agent surface. The write and its
        `web_login.recipe.put` outbox event (digests and ids, never the
        document) commit together.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
        - name: If-Match
          in: header
          required: true
          description: The version read from GET, as a strong entity tag (`"3"`); `"0"` for a new recipe.
          schema: { type: string, pattern: '^"[0-9]+"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebLoginRecipeDocument" }
      responses:
        "200":
          description: Replaced
          headers:
            ETag:
              description: The new version as a strong entity tag.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebLoginRecipeWritten" }
        "201":
          description: Created
          headers:
            ETag:
              description: The new version as a strong entity tag.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebLoginRecipeWritten" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "412":
          description: The recipe changed since that version was read; nothing was written.
          content:
            application/json:
              schema:
                type: object
                required: [error, current_version]
                properties:
                  error: { type: string, const: precondition_failed }
                  hint: { type: string }
                  current_version: { type: integer, minimum: 0 }
        "413": { $ref: "#/components/responses/ContractError" }
        "422":
          description: >-
            The signature cannot be verified (`error` `unknown_signer`,
            `signer_revoked`, `invalid_signature`) or a canary is claimed with
            no signature behind it (`canary_unsigned`); nothing was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractError" }
        "428": { $ref: "#/components/responses/ContractError" }
    delete:
      summary: Remove a web-login recipe (compare-and-set)
      description: >-
        `If-Match` names the version being removed. Owner/admin or operator
        only; never an agent surface. The removal and its
        `web_login.recipe.deleted` outbox event commit together.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
        - name: If-Match
          in: header
          required: true
          description: The version read from GET, as a strong entity tag (`"3"`).
          schema: { type: string, pattern: '^"[0-9]+"$' }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [deleted, origin]
                properties:
                  deleted: { type: boolean, const: true }
                  origin: { type: string }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "412":
          description: The recipe changed since that version was read; nothing was removed.
          content:
            application/json:
              schema:
                type: object
                required: [error, current_version]
                properties:
                  error: { type: string, const: precondition_failed }
                  hint: { type: string }
                  current_version: { type: integer, minimum: 0 }
        "428": { $ref: "#/components/responses/ContractError" }
  /web-login/recipes/{origin}/canary:
    parameters:
      - $ref: "#/components/parameters/WebLoginOrigin"
    post:
      summary: Start one attended run of a verified recipe (its canary)
      description: >-
        An unattended web-login run needs a recipe a real change has already
        proven (ADR 0076 §4), and the first proof has to come from a run
        somebody is watching. This starts that run for the caller, who drives
        it from their own browser — only the owner of a run may claim its steps
        (ADR 0081 §8) — and answers `202` while it goes on without the
        request. A completed run is recorded by the Host as the recipe's
        canary, against the document it replayed; a run that finds the page
        changed demotes it. The recipe must already be signed by a pinned,
        unrevoked key. Only the own native session of an owner or admin: never a
        member, the operator (no browser to drive), an agent capability, a
        browser grant, or a session whose ceiling carries agent capabilities.
      security: [{ HostBearer: [] }]
      responses:
        "202":
          description: The run was started
          content:
            application/json:
              schema:
                type: object
                required: [status, origin]
                properties:
                  status: { type: string, const: started }
                  origin: { type: string }
                  hint: { type: string }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "409":
          description: >-
            No verified recipe is stored for the origin (`recipe_not_runnable`),
            or a run for it is already queued or executing (`run_in_flight`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractError" }
        "503": { $ref: "#/components/responses/ContractError" }
  /web-login/signers:
    get:
      summary: List the keys the organization trusts to sign web-login recipes
      description: >-
        Pinned Ed25519 public keys, revoked ones included. Owner/admin or
        operator only; never an agent surface.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
      responses:
        "200":
          description: The signers, in the order they were pinned
          content:
            application/json:
              schema:
                type: object
                required: [signers]
                properties:
                  signers:
                    type: array
                    items: { $ref: "#/components/schemas/WebLoginRecipeSigner" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
    post:
      summary: Pin a public key as a web-login recipe signer
      description: >-
        The body is the public key and a label; the key id is derived from the
        key (`rsk_` and 32 hex of its SHA-256), so a request cannot choose one.
        The private half never reaches the Host. Owner/admin or operator only,
        and it takes the same **step-up** as replacing the agent-hooks policy
        (ADR 0156, on ADR 0146): a key an agent framework could pin under an
        administrator's own token would sign the recipes that govern it.
        Without it the answer is `403` `step_up_required`. A key already
        pinned, or revoked (revocation is final), is `409` `signer_exists`;
        an organization holds at most 32 (`signer_limit`). The pin and its
        `web_login.signer.pinned` outbox event commit together.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, label]
              additionalProperties: false
              properties:
                public_key: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: The Ed25519 public key, hex }
                label: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Pinned
          content:
            application/json:
              schema:
                type: object
                required: [signer]
                properties:
                  signer: { $ref: "#/components/schemas/WebLoginRecipeSigner" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403":
          description: >-
            Not an owner, admin or operator; or no step-up (`error`
            `step_up_required`, with `reason` and a remedy in `hint`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractError" }
        "409":
          description: Already pinned or revoked (`signer_exists`), or the limit is reached (`signer_limit`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractError" }
        "413": { $ref: "#/components/responses/ContractError" }
  /web-login/signers/{key_id}:
    delete:
      summary: Revoke a web-login recipe signer, for good
      description: >-
        Revocation is final: the row stays, so the key can never be pinned
        again. Recipes the key signed stop being replayable at their next run
        (the signature is checked against the key as it stands when a run
        starts), and none can be written under it. It is the safe direction,
        so it takes no step-up. Owner/admin or operator only; never an agent
        surface. The revocation and its `web_login.signer.revoked` outbox
        event commit together.
      security: [{ HostBearer: [] }, { HostOperatorHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/OperatorOrganization"
        - name: key_id
          in: path
          required: true
          schema: { type: string, pattern: '^rsk_[0-9a-f]{32}$' }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [signer]
                properties:
                  signer: { $ref: "#/components/schemas/WebLoginRecipeSigner" }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "403": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409":
          description: Already revoked (`already_revoked`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractError" }
  /a2h/callback:
    post:
      summary: Receive a human's A2H reply
      description: >-
        Callback for an A2H gateway (ADR 0081). Unauthenticated by design: the
        gateway holds no session, and the request's HMAC over
        `{timestamp}.{body}` under the subscription's `whsec_` secret is its
        authentication. Every failed check answers 401 identically, so the shape
        of a refusal cannot tell an unsigned caller whether an interaction
        exists.


        A verified reply may only *narrow* what is happening: acknowledge, or
        cancel the run. It can never grant the control lease or resume autonomy
        — taking the page needs the viewer key the log is sealed to, and
        resuming needs the run's preconditions re-asserted against the page.
        Neither is reachable from a phone, at any assurance level.
      security: []
      parameters:
        - name: X-A2H-Signature
          in: header
          required: true
          description: "`t=<unix>,v1=<base64 HMAC-SHA256>`"
          schema: { type: string }
        - name: X-A2H-Delivery-ID
          in: header
          required: false
          description: >-
            The gateway's per-attempt id, logged for correlation. Not the
            idempotency key: that is the interaction, which is stable across
            retries.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, interaction_id, responds_to]
              properties:
                type: { type: string, const: RESPONSE }
                interaction_id: { type: string }
                responds_to: { type: string }
                decision: { type: string, enum: [APPROVE, DECLINE] }
                decided_at: { type: string, format: date-time }
                evidence:
                  type: object
                  properties:
                    factor: { type: string }
                    proof: { type: object }
                signature: { type: string }
      responses:
        "200":
          description: The reply was applied, acknowledged, or already applied
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
        "401":
          description: >-
            The request did not verify. Returned identically for a bad
            signature, a stale timestamp, and an unknown interaction.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, const: invalid_request }
  /ceremonies:
    get:
      summary: Which connector registrations this build can automate
      description: >-
        The ceremony catalog, whole. Deliberately not a per-provider lookup:
        asking a server which ceremony covers `provider-x` tells it which
        provider is being onboarded, and the catalog is checked in precisely so
        nobody has to answer that (ADR 0052 §12 — a lookup is a disclosure). The
        caller takes the list and matches locally, as ADR 0080 §5 does for the
        public breach catalogue.


        Checked-in data, not tenant data: compiled from
        `crates/ceremony/catalog.json`, identical for every caller on the Host,
        and scoped to no organization. `declares` names the capture slots a
        ceremony is *permitted* to seal — never a value, and never a record of
        one that was.


        A provider absent from the list is not a gap: every phase resolves to
        `c3_blocked` and it keeps the setup instructions it has today (ADR
        0082).
      security: [{ HostBearer: [] }]
      responses:
        "200":
          description: Every provider the catalog covers
          content:
            application/json:
              schema:
                type: object
                required: [ceremonies, secrets_returned]
                properties:
                  ceremonies:
                    type: array
                    items: { $ref: "#/components/schemas/Ceremony" }
                  phases:
                    type: array
                    description: Every ceremony phase, in the order they run.
                    items: { type: string }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
  /agent/runs:
    get:
      summary: List the caller's own sandboxed runs
      description: >-
        Metadata only (ADR 0076 §5): a run row never carries a frame, a
        rationale, or page content. Filtered by entitlement rather than by
        tenant — an organization is not a person, and a run belongs to whoever's
        credential it rotates (ADR 0081 §8).
      security: [{ HostBearer: [] }]
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [runs, secrets_returned]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/AgentRun" } }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
  /agent/runs/{id}:
    get:
      summary: Read one run's state
      description: >-
        Carries `hook_records`, the count-and-verdict summary of the run's
        agent-hooks records (ADR 0156): counts only, never a reason or a
        digest. The listing does not carry it.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/ContractError" }
        "404":
          description: >-
            No such run, or not the caller's. Deliberately the same answer:
            whether a run exists is itself account information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunError" }
  /agent/runs/{id}/observe:
    get:
      summary: Tail the sealed observation log
      description: >-
        Server-sent events. Live and replay are the same read at different
        cursors (ADR 0081 §1) — pass the last sequence you hold for a tail, or
        omit `after` for the whole log, which is what the replay overlay does.


        Every entry is relayed as the ciphertext it was sealed as. The gateway
        cannot read what it forwards; the owner's viewer key is what opens it,
        so a client with a locked vault sees the stream and can make nothing of
        it.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: after
          in: query
          required: false
          description: Last sequence already held. Omit to read from the start.
          schema: { type: integer, default: -1 }
      responses:
        "200":
          description: An SSE stream of sealed log entries
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /agent/runs/{id}/log:
    get:
      summary: Read one page of the sealed observation log
      description: >-
        The same read as `observe`, without holding a connection open — for the
        replay overlay, which seeks and pages rather than follows, and for
        anything scripted, where a stream that stays open until it times out is
        a hang rather than a result.


        Entries are relayed as the ciphertext they were sealed as. `sealed` says
        so rather than leaving a caller to discover it.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: after
          in: query
          required: false
          schema: { type: integer, default: -1 }
      responses:
        "200":
          description: A page of sealed entries
          content:
            application/json:
              schema:
                type: object
                required: [run_id, entries, next_after, sealed, secrets_returned]
                properties:
                  run_id: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [seq, lane, sealed_payload, recorded_at]
                      properties:
                        seq: { type: integer }
                        lane: { type: string, enum: [action, thought, frame] }
                        of_step: { type: integer, nullable: true }
                        layout_epoch: { type: integer, nullable: true }
                        sealed_payload: { type: string, description: Base64 ciphertext. }
                        recorded_at: { type: string }
                  next_after: { type: integer }
                  run_next_seq: { type: integer }
                  sealed: { type: boolean, const: true }
                  observation: { $ref: "#/components/schemas/AgentRunObservation" }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /agent/runs/{id}/hook-records:
    get:
      summary: Read one page of a run's agent-hooks records
      description: >-
        The payload-free agent-hooks record of a Host-run agent (ADR 0156): one
        row per interception, in `sequence` order — interception point,
        decision, a machine reason, and the `sha256:` identities of the context
        before and after composition. No message, no target and no transform
        value exists to return.


        A run the Host opened holds no viewer key to seal to (ADR 0081 §9), so
        its sealed log is empty and this is its observation; `observation` says
        which a run has. Same entitlement as `log`: the credential's owner and
        nobody else, and anyone else gets the same 404 a missing run does.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: after
          in: query
          required: false
          description: Last `sequence` already held. Omit to read from the start.
          schema: { type: integer, default: -1 }
        - name: limit
          in: query
          required: false
          description: Most records to return, capped at 256.
          schema: { type: integer, minimum: 1, maximum: 256, default: 64 }
      responses:
        "200":
          description: A page of records, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [run_id, records, next_after, has_more, summary, observation, sealed, secrets_returned]
                properties:
                  run_id: { type: string }
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/AgentHookRecord" }
                  next_after: { type: integer, description: The cursor to pass as `after` for the next page. }
                  has_more: { type: boolean }
                  summary: { $ref: "#/components/schemas/AgentHookRecordSummary" }
                  observation: { $ref: "#/components/schemas/AgentRunObservation" }
                  sealed: { type: boolean, const: false }
                  secrets_returned: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /agent/runs/{id}/handoff:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BrowserControlRequest'}
      summary: Ask the agent for the page
      description: >-
        Accepted at a quiescent point and **queued** inside the critical section
        between the candidate assertion and the submit, where the answer says so
        rather than dropping the request (ADR 0081 §6). A request that vanishes
        teaches people to press the button again; that span is the one place a
        second actor would void the check standing between a rotation and a
        lockout. Requires a purpose-bound single-use passkey elevation.
      security: [{ HostDPoP: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: The request was accepted or queued
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted, queued] }
                  hint: { type: string }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409":
          description: The transition is not available from the run's current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunError" }
  /agent/runs/{id}/control:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BrowserControlRequest'}
      summary: Take the page
      description: >-
        Only from a parked run: there is no path that takes the page out from
        under the agent mid-step, which is what lets the receipt say who did
        what. Requires a fresh step-up, because decrypting frames and issuing
        input events are different capabilities (ADR 0081 §8).
      security: [{ HostDPoP: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The lease is held by the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409":
          description: >-
            Another viewer holds the lease, the run is not parked, or the
            version moved while the caller was deciding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunError" }
  /agent/runs/{id}/release:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BrowserControlRequest'}
      summary: Hand the page back
      description: >-
        Autonomy does not resume here. The run lands in `resume_requested`, and
        the runner re-asserts the run's preconditions against the page before
        driving again — what the assertion established was true of a page the
        agent controlled, and a person has been in it since (ADR 0081 §6).
      security: [{ HostDPoP: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The lease is released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409":
          description: The caller does not hold the lease
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunError" }
  /agent/runs/{id}/steps/claim:
    post:
      summary: Claim the run's outstanding step
      description: >-
        The driver's half of the step channel (ADR 0079 §4). The driver is the
        owner's own browser, so the entitlement is the one that gates watching:
        a run belongs to whoever's credential it rotates, and nobody else may
        drive it.


        One step is outstanding per run by design — a browser has one DOM, and a
        queue that could hold two steps for one page could reorder them. A claim
        is held under a lease, so a driver that crashed releases its work by the
        clock rather than by anybody deciding it is dead.


        The returned request names a credential *reference* and a selector. It
        has no field able to carry a value: the driver resolves the reference
        itself, because in the local model the driver holds the vault.


        Steps are enqueued by the Host's web-login runner, which hosts each run
        as an agent-hooks/0.1 session (ADR 0156): a verb the organization's
        hook policy refuses at `pre_tool_call` is never enqueued. Besides the
        browser's verbs (`navigate`, `wait_for`, `fill_credential` with
        `reference` `current_password` or a candidate handle, `assert_present`,
        `submit`, `verify_login`, `read_dom_redacted`, `screenshot_redacted`)
        the runner issues three custody steps for the candidate, which lives in
        the driver's vault: `generate_candidate`, `seal_candidate` and
        `promote_candidate`, each carrying only a Host-minted `handle`.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The claimed step
          content:
            application/json:
              schema:
                type: object
                required: [run_id, seq, request, secrets_returned]
                properties:
                  run_id: { type: string }
                  seq: { type: integer }
                  request:
                    type: object
                    description: The StepRequest, verbatim.
                  claim_expires_at: { type: string, nullable: true }
                  secrets_returned: { type: boolean, const: false }
        "204":
          description: >-
            Nothing to do, or another driver holds a live claim. A cheap answer
            for a polling driver rather than an error to interpret.
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
  /agent/runs/{id}/steps/{seq}/outcome:
    post:
      summary: Report what a step did
      description: >-
        Only the claimant may, and a claim that lapsed is not a claim. A driver
        that went away and came back finds its step taken and is told so, rather
        than settling a step somebody else is now executing. A run that has
        closed — its executor stopped waiting — takes no further outcome, so
        a late answer is refused rather than stored where nothing reads it.


        The outcome is checked against the step it answers before anything is
        stored: it must be one that step may produce (a `navigate` is answered
        `done` or `failed`, a `read_dom_redacted` `dom` or `failed`, a custody
        `seal_candidate` `sealed` or `failed`, and so on) and carry exactly that
        outcome's fields. An outcome that answers another step is refused with
        422 `wrong_outcome`; one with a field it does not have (`{"outcome":
        "done", "password": "x"}`), at any depth, is refused with 422
        `invalid_outcome`, never trimmed. What is stored is the canonical
        encoding of the decoded outcome. The claim stands after a refusal. A
        claim past its lease cannot settle even before another driver has
        reclaimed the step (409).


        The outcome is stored **scrubbed and bounded**, even when nobody is
        still waiting for it (a step that timed out with its run still open):
        credential-shaped strings and keys become `[redacted:<kind>]` markers
        (`redacted: true`), and an outcome over 1 MiB is refused with 413. Under
        a hook policy that denies credentials (`secret_guard: deny`, or
        `refuse_labels` naming `opensesame:credential_material`) the step is
        stored as refused instead (`refused: true`) — the executor fails closed,
        as it does on a `post_tool_call` deny.
      security: [{ HostBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: seq, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: object
                  description: >-
                    The StepOutcome, tagged by `outcome` (`done`, `filled`,
                    `presence`, `verified`, `dom`, `frame`, `captured`,
                    `failed`); a `seal_candidate` step answers `sealed` with
                    `backed_up`, and anything else is read as not backed up.
                    No variant carries a credential value. The runner reads
                    it once and rewrites the stored copy with any
                    credential-shaped text redacted.
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [status, redacted, refused]
                properties:
                  status: { type: string, const: settled }
                  redacted: { type: boolean, description: Credential-shaped text was found and not stored as sent. }
                  refused: { type: boolean, description: The step was stored as refused because the policy denies credentials. }
        "400": { $ref: "#/components/responses/ContractError" }
        "401": { $ref: "#/components/responses/ContractError" }
        "404": { $ref: "#/components/responses/ContractError" }
        "409":
          description: The caller does not hold this step's live claim (it was never theirs, or its lease ran out), or the run has closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunError" }
        "413":
          description: The outcome is over 1 MiB, before or after redaction. The claim stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunError" }
        "422":
          description: The outcome is not one this step may be answered with (`wrong_outcome`), or carries more than its own fields (`invalid_outcome`). Nothing was stored; the claim stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunError" }
components:
  securitySchemes:
    HostDPoP:
      type: http
      scheme: DPoP
      description: Five-minute sender-constrained browser credential. Every request also requires its exact Origin and a fresh ES256 DPoP proof binding method, canonical URL and token hash. Bearer presentation is refused.
    AgentBearer:
      type: http
      scheme: bearer
      description: Five-minute agent-capability credential with X-OpenSesame-Agent-Client and X-OpenSesame-Agent-Audience bindings. Only explicitly approved task and ciphertext sync operations are admitted.
    HostBearer:
      type: http
      scheme: bearer
      description: Opaque session bearer or `operator:<token>` break-glass bearer.
    HostOperatorBearer:
      type: http
      scheme: bearer
      description: Operator bearer in the form `operator:<token>`.
    HostOperatorHeader:
      type: apiKey
      in: header
      name: X-OpenSesame-Operator
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReceiptId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ConnectionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    WebLoginOrigin:
      name: origin
      in: path
      required: true
      description: >-
        The relying party's origin, percent-encoded (`https%3A%2F%2Flogin.example`):
        https, no path, query, fragment or credentials. The default port and
        the host's case are normalized, so it is the same origin a rotation
        target names.
      schema: { type: string }
    OperatorOrganization:
      name: X-OpenSesame-Organization
      in: header
      required: false
      description: >-
        Canonical org:<uuid> organization selection for authenticated operators. Operators
        default to the bootstrap organization when omitted. Session callers are always bound
        to their signed organization and must not send this header.
      schema:
        type: string
        pattern: '^org:[0-9a-fA-F-]{36}$'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ContractError:
      description: Stable broker error code and safe human hint
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContractError" }
  schemas:
    AgentHookContext:
      type: object
      description: >-
        One agent-hooks/0.1 `AgentContext` (spec §4). Validated by the
        canonical core, not by this schema; a context that fails is answered
        with a deny verdict.
      required: [spec, interception_point, timestamp, sequence, agent, session]
      properties:
        spec: { type: string, pattern: '^agent-hooks/[0-9]+\.[0-9]+$' }
        interception_point:
          type: string
          enum: [agent_startup, input, pre_model_call, post_model_call, pre_tool_call, post_tool_call, output, agent_shutdown]
        timestamp: { type: string }
        sequence: { type: integer, minimum: 0 }
        agent: { type: object }
        session: { type: object }
        target: {}
      additionalProperties: true
    AgentHookVerdict:
      type: object
      description: >-
        An agent-hooks/0.1 `Verdict` (spec §5). `reason` is a fixed
        `opensesame:*` identifier or the operator's own; `message` names
        credential kinds and counts, never content. An `approval` block marks
        a deny a person may lift.
      required: [decision]
      properties:
        decision: { type: string, enum: [allow, deny, transform] }
        reason: { type: string }
        message: { type: string }
        warnings: { type: array, items: { type: object } }
        approval: { type: object }
        transform: { type: object }
        evidence: { type: object }
        result_labels: { type: array, items: { type: string } }
    AgentHookDecision:
      type: object
      description: >-
        One answered interception, as the audit keeps it. Value-blind by
        construction: there is no field able to hold a tool name, a target, a
        transform's value or a message.
      required: [id, caller, interception_point, decision, escalated, reason, policy_version, created_at]
      properties:
        id: { type: integer, minimum: 1, description: Rises with every verdict; the pagination order. }
        caller: { type: string, description: "`operator`, or the calling session's principal." }
        interception_point:
          type: [string, "null"]
          enum: [agent_startup, input, pre_model_call, post_model_call, pre_tool_call, post_tool_call, output, agent_shutdown, null]
        decision: { type: string, enum: [allow, deny, transform] }
        escalated: { type: boolean, description: The deny carried an approval block. }
        reason: { type: [string, "null"], description: A short machine identifier; never prose. }
        policy_version: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    AgentHookDecisionPage:
      type: object
      required: [decisions, next_cursor, retention_days]
      properties:
        decisions: { type: array, items: { $ref: "#/components/schemas/AgentHookDecision" } }
        next_cursor: { type: [string, "null"], description: Pass as `cursor` for the next page; null on the last. }
        retention_days: { type: integer, minimum: 1, description: How long a decision is kept. }
    AgentHookToolRule:
      type: object
      additionalProperties: false
      required: [decision]
      description: Exactly one of `name` and `prefix`.
      properties:
        name: { type: string, minLength: 1 }
        prefix: { type: string, minLength: 1 }
        decision: { type: string, enum: [allow, escalate, deny] }
        reason: { type: string, maxLength: 128 }
        message: { type: string }
        labels: { type: array, items: { type: string }, maxItems: 16 }
        refuse_labels: { type: array, items: { type: string }, maxItems: 16 }
    AgentHookPolicy:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, const: 1 }
        tools: { type: array, items: { $ref: "#/components/schemas/AgentHookToolRule" } }
        unlisted_tools: { type: string, enum: [allow, escalate, deny], default: escalate }
        secret_guard: { type: string, enum: [redact, deny, "off"], default: redact }
        refuse_labels: { type: array, items: { type: string }, maxItems: 16 }
    AgentHookPolicyView:
      type: object
      required: [spec, version, stored, policy]
      properties:
        spec: { type: string, const: agent-hooks/0.1 }
        version: { type: integer, minimum: 0, description: 0 when no policy is stored }
        stored: { type: boolean }
        policy: { $ref: "#/components/schemas/AgentHookPolicy" }
        updated_at: { type: [string, "null"] }
        updated_by: { type: [string, "null"] }
    AgentHookApproverView:
      type: object
      required: [version, stored, approver_ref, asks, transport_configured]
      properties:
        version: { type: integer, minimum: 0, description: 0 when none is stored }
        stored: { type: boolean }
        approver_ref: { type: [string, "null"], description: This setting's handle; never the operator's default }
        asks: { type: string, enum: [organization, operator_default, nobody] }
        transport_configured: { type: boolean }
        updated_at: { type: [string, "null"] }
        updated_by: { type: [string, "null"] }
    AgentHookPresets:
      type: object
      required: [spec, presets]
      properties:
        spec: { type: string, const: agent-hooks/0.1 }
        presets:
          type: array
          items:
            type: object
            required: [name, summary, policy, policy_sha256]
            properties:
              name: { type: string }
              summary: { type: string }
              policy: { $ref: "#/components/schemas/AgentHookPolicy" }
              policy_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    WebLoginRecipeDocument:
      type: object
      description: >-
        A recipe document, version 1 (ADR 0076 §4). Every object is closed. It
        names the page and the fields the executor acts on and nothing about
        any user: no value, no account, no session. `canary` and `signature`
        are claims; only a signature the Host verifies against a pinned signer
        makes either of them count.
      required: [schema_version, recipe_id, origin, expires_at, change_password]
      additionalProperties: false
      properties:
        schema_version: { type: integer, const: 1 }
        recipe_id: { type: string, pattern: '^rcp_[a-z0-9_-]{1,63}$' }
        origin: { type: string, description: A canonical https origin; it must be the origin in the path }
        expires_at: { type: string, format: date-time, description: At most 93 days from now }
        change_password:
          type: object
          required: [change_url, new_password_selector, submit_selector]
          additionalProperties: false
          properties:
            change_url: { type: string, description: An https URL on the recipe's own origin }
            current_password_selector: { type: [string, "null"], maxLength: 512 }
            new_password_selector: { type: string, maxLength: 512 }
            confirm_password_selector: { type: [string, "null"], maxLength: 512 }
            submit_selector: { type: string, maxLength: 512 }
        canary:
          type: object
          description: A signer's attestation that the recipe completed a real change, verified by a fresh login. Counts only inside a verified signature.
          required: [verified_at]
          additionalProperties: false
          properties:
            verified_at: { type: string, format: date-time, description: Within the last 90 days }
        signature:
          type: object
          required: [alg, key_id, value]
          additionalProperties: false
          properties:
            alg: { type: string, const: ed25519 }
            key_id: { type: string, pattern: '^rsk_[0-9a-f]{32}$' }
            value: { type: string, pattern: '^[0-9a-f]{128}$', description: The signature, hex }
    WebLoginRecipeSummary:
      type: object
      required: [origin, recipe_id, version, trust, runnable]
      properties:
        origin: { type: string }
        recipe_id: { type: string }
        version: { type: integer, minimum: 1 }
        trust:
          type: string
          enum: [candidate, canary_verified, corpus]
          description: Derived by the Host from a verification, never from a request.
        digest: { type: [string, "null"], description: "`sha256:` of the document's signed form" }
        signer_key_id: { type: [string, "null"] }
        verified_at: { type: [string, "null"], description: When the Host verified the signature }
        canary:
          oneOf:
            - type: object
              required: [result, at, source]
              properties:
                result: { type: string, enum: [passed, failed] }
                at: { type: string }
                source: { type: string, enum: [signed, run] }
                run_id: { type: [string, "null"] }
            - { type: "null" }
        expires_at: { type: string }
        updated_at: { type: string }
        updated_by: { type: string }
        runnable:
          type: object
          required: [attended, unattended]
          properties:
            attended: { type: boolean }
            unattended: { type: boolean }
    WebLoginRecipeWritten:
      type: object
      required: [recipe]
      properties:
        recipe: { $ref: "#/components/schemas/WebLoginRecipeSummary" }
    WebLoginRecipeSigner:
      type: object
      required: [key_id, algorithm, public_key, label, pinned_by, pinned_at]
      properties:
        key_id: { type: string, pattern: '^rsk_[0-9a-f]{32}$' }
        algorithm: { type: string, const: ed25519 }
        public_key: { type: string, pattern: '^[0-9a-f]{64}$' }
        label: { type: string }
        pinned_by: { type: string }
        pinned_at: { type: string }
        revoked_at: { type: [string, "null"] }
        revoked_by: { type: [string, "null"] }
    AgentAudience:
      type: string
      enum: ['urn:opensesame:agent:mcp-host', 'urn:opensesame:agent:mcp-client']
    AccessDomain:
      type: object
      additionalProperties: false
      required: [id, organization_id, lifecycle, revision, depth]
      properties:
        id: {type: string}
        organization_id: {type: string}
        parent_id: {type: [string, 'null']}
        project_id: {type: [string, 'null']}
        lifecycle: {type: string, enum: [active, archived, terminated]}
        revision: {type: integer, minimum: 1}
        depth: {type: integer, minimum: 0, maximum: 32}
    SyncCursor:
      type: object
      additionalProperties: false
      required: [epoch, id]
      properties:
        epoch: {type: integer, minimum: 0, maximum: 9223372036854775807}
        id: {type: string, maxLength: 128}
    HostAuthorizationChallenge:
      type: object
      required: [challenge_id, challenge_digest, host_audience, organization_id, operation, target_id, transition, origin, dpop_jkt, expires_at]
      properties:
        challenge_id: {type: string, format: uuid}
        challenge_digest: {type: string}
        host_audience: {type: string}
        organization_id: {type: string}
        operation: {type: string, enum: [browser.authenticate, agent.browser.control]}
        target_id: {type: string}
        transition: {type: [string, 'null'], enum: [handoff, take, release, null]}
        origin: {type: string, format: uri}
        dpop_jkt: {type: string}
        expires_at: {type: integer}
    BrowserControlRequest:
      type: object
      additionalProperties: false
      required: [elevation]
      properties:
        elevation: {type: string, pattern: '^[0-9a-f]{64}$', writeOnly: true, description: One-use grant bound to this run version and transition after recent phishing-resistant verification}
    LifecycleEventType:
      type: string
      description: Frozen lifecycle event names. Additive only; never renamed.
      enum:
        - lifecycle.expiry.notice
        - lifecycle.expiry.warning
        - lifecycle.expiry.urgent
        - lifecycle.renewal.due
        - lifecycle.expiry.expired
        - lifecycle.renewal.succeeded
        - lifecycle.renewal.failed
    LifecycleSubjectKind:
      type: string
      description: >-
        The closed set of things whose expiry the platform tracks. Closed on
        purpose: each kind implies a platform-owned responder with real
        authority, so a subscription selects kinds but never adds one.
      enum: [certificate, certificate_authority, connection_credential, store_path, signer]
    LifecycleStage:
      type: string
      description: >-
        A rung of the expiry ladder. notice/warning/urgent/expired advance the
        alert watermark; renewal advances its own, so a per-subject renewal
        lead can never alias and suppress a fixed alert rung.
      enum: [notice, warning, urgent, expired, renewal]
    LifecycleRung:
      type: object
      required: [stage, track, event_type, fires_at, crossed]
      properties:
        stage: { $ref: "#/components/schemas/LifecycleStage" }
        track: { type: string, enum: [alert, renewal] }
        event_type: { $ref: "#/components/schemas/LifecycleEventType" }
        fires_at:
          type: [string, "null"]
          description: >-
            When this rung is reached. Null when the deadline sits too close to
            the start of the representable range to date the rung — a
            never-run rotation schedule, which is due now regardless.
        crossed: { type: boolean, description: Whether the deadline is already past it }
    LifecycleSubject:
      type: object
      required: [subject_kind, subject_id, organization_id, expires_at, remaining_seconds, renew_before_seconds, auto_respond, alerting, ladder, secrets_returned]
      properties:
        subject_kind: { $ref: "#/components/schemas/LifecycleSubjectKind" }
        subject_id: { type: string }
        organization_id: { type: string }
        label:
          type: [string, "null"]
          description: Operator-facing name — a common name, a store path, a provider. Never a credential.
        expires_at: { type: string }
        remaining_seconds: { type: integer, description: Negative once expired }
        renew_before_seconds: { type: integer }
        auto_respond:
          type: boolean
          description: Whether a platform responder may act. False still emits every event.
        responder:
          type: [string, "null"]
          description: The platform responder for this kind, or null when renewal is the subscriber's to perform.
        alerting:
          type: boolean
          description: >-
            False for recurring schedules such as rotation policies, whose
            deadline moves on every run; they use the renewal track only.
        ladder:
          type: array
          items: { $ref: "#/components/schemas/LifecycleRung" }
        secrets_returned: { type: boolean, const: false }
    LifecycleInventory:
      type: object
      required: [subjects, event_types, subject_kinds, stages, secrets_returned]
      properties:
        subjects:
          type: array
          items: { $ref: "#/components/schemas/LifecycleSubject" }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/LifecycleEventType" }
        subject_kinds:
          type: array
          items: { $ref: "#/components/schemas/LifecycleSubjectKind" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/LifecycleStage" }
        secrets_returned: { type: boolean, const: false }
    LifecycleHookRequest:
      type: object
      required: [name, event_types, endpoint_url]
      properties:
        id:
          type: string
          description: Omit to register; supply to edit in place.
        name: { type: string, minLength: 1, maxLength: 120 }
        event_types:
          type: array
          minItems: 1
          description: Event names, or the single wildcard `lifecycle.*`. An empty list is refused rather than read as "everything".
          items: { type: string }
        endpoint_url:
          type: string
          format: uri
          maxLength: 2048
          description: Absolute https endpoint. Private, loopback, link-local and metadata addresses are refused, as are embedded credentials.
        subject_kinds:
          type: [array, "null"]
          description: Optional narrowing. Null or absent means every kind.
          items: { $ref: "#/components/schemas/LifecycleSubjectKind" }
        enabled: { type: boolean, default: true }
    LifecycleHook:
      type: object
      required: [id, name, organization_id, event_types, delivery, enabled, version, secrets_returned]
      properties:
        id: { type: string }
        name: { type: string }
        organization_id: { type: string }
        event_types:
          type: array
          items: { type: string }
        delivery:
          type: string
          enum: [webhook, internal, alertmanager, pagerduty]
          description: >-
            `webhook` is the community surface — an observer, delivered
            asynchronously, unable to influence any decision. `internal` names
            a platform subscriber that runs in process and cannot be registered
            over this API; the built-in notifier and alerter are two such rows.
            `alertmanager` and `pagerduty` are the same observer surface
            rendered into the formats an on-call rotation already reads. There
            is deliberately no `syslog` delivery: RFC 5424 is a line format, and
            those lines go to the host's own log stream rather than over
            plaintext egress to a remote collector.
        severity_min:
          type: string
          enum: [info, warning, error, critical]
          description: >-
            Severity floor. `info` admits everything, which is what a
            subscription registered before floors existed carries.
        endpoint_url: { type: [string, "null"] }
        responder: { type: [string, "null"] }
        subject_kinds: { type: [array, "null"], items: { type: string } }
        enabled: { type: boolean }
        last_delivered_at: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
        signing_secret:
          type: string
          description: >-
            The `whsec_` Standard Webhooks secret. Present only in the response
            to a first registration; sealed at rest and never returned again.
        signing_secret_hint: { type: string }
        secrets_returned: { type: boolean, const: false }
    LifecycleDelivery:
      type: object
      required: [id, hook_id, event_type, subject_kind, subject_id, state, attempts, created_at]
      properties:
        id:
          type: string
          description: Sent as the `webhook-id` header; doubles as the receiver's idempotency key.
        hook_id: { type: string }
        event_type: { $ref: "#/components/schemas/LifecycleEventType" }
        subject_kind: { $ref: "#/components/schemas/LifecycleSubjectKind" }
        subject_id: { type: string }
        state: { type: string, enum: [pending, delivered, dead_lettered] }
        attempts: { type: integer }
        available_at: { type: [string, "null"], description: Backoff gate; claimable once past }
        last_error: { type: [string, "null"], description: Truncated operator hint, never a response body }
        delivered_at: { type: [string, "null"] }
        created_at: { type: string }
    SessionEvent:
      description: >-
        References only. Every field is an id, a closed enum or a timestamp;
        the type has no field able to carry an item label, a vault name, a note
        somebody typed, a token or a value. Each client renders the labels it
        can already decrypt.
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            [
              participant_joined,
              participant_left,
              grant_added,
              grant_withdrawn,
              item_opened,
              item_changed,
              join_requested,
            ]
        principal_id: { type: string }
        subject_principal_id: { type: string }
        by_principal_id: { type: string }
        grant_id: { type: string }
        request_id: { type: string }
        vault_id: { type: string }
        item_id: { type: string }
        role: { type: string, enum: [read, write] }
        expires_at: { type: string, format: date-time }
    SessionAdmission:
      type: string
      enum: [operator, observer_on_ask]
      description: >-
        How a public session answers an ask (ADR 0137): the operator decides
        each one, or whoever asks is seated at once as an observer holding
        nothing. There is no participant-on-ask.
    SharedSession:
      type: object
      required: [id, display_name, visibility, operator_principal_id, created_at]
      properties:
        id: { type: string }
        display_name: { type: string }
        visibility: { type: string, enum: [private, public] }
        admission: { $ref: "#/components/schemas/SessionAdmission" }
        operator_principal_id: { type: string }
        created_at: { type: string, format: date-time }
    SharedSessionDetail:
      allOf:
        - $ref: "#/components/schemas/SharedSession"
        - type: object
          required: [participants]
          properties:
            closed_at: { type: string, format: date-time, nullable: true }
            participants:
              description: >-
                Roster entries. A participant receives who and in what role; the
                operator additionally receives each grant's id and scope. Which
                rows a colleague holds is never published to a participant.
              type: array
              items: { $ref: "#/components/schemas/SessionRosterEntry" }
    SessionRosterEntry:
      type: object
      required: [principal_id, role, expires_at]
      properties:
        principal_id: { type: string }
        role: { type: string, enum: [read, write] }
        expires_at: { type: string, format: date-time }
    SessionGrantView:
      allOf:
        - $ref: "#/components/schemas/SessionRosterEntry"
        - type: object
          required: [grant_id, granted_by, scope]
          properties:
            grant_id: { type: string }
            granted_by: { type: string }
            scope: { $ref: "#/components/schemas/SessionGrantScope" }
    SessionGrantScope:
      description: >-
        The whole vault, or named rows within it. A row scope must name at least
        one item; an empty one is refused rather than read as "everything".
      type: object
      required: [kind, vault_id]
      properties:
        kind: { type: string, enum: [collection, rows] }
        vault_id: { type: string }
        items:
          type: array
          minItems: 1
          items: { type: string }
    BreachFinding:
      type: object
      required: [subject_kind, subject_id, source, severity, state, first_seen_at, last_seen_at]
      properties:
        subject_kind:
          type: string
          enum: [store_path, connection_credential, domain, breach_source]
        subject_id: { type: string }
        source:
          type: string
          enum: [hibp_passwords, hibp_breaches]
        reference:
          type: string
          description: >-
            The published breach name for a provider disclosure; empty for a
            password-corpus match, of which there is one per subject.
        severity: { type: string, enum: [info, warning, error, critical] }
        occurrences:
          type: [integer, "null"]
          description: >-
            How many times the corpus has seen this password. A property of the
            corpus; it says nothing about the value.
        state: { type: string, enum: [open, cleared] }
        first_seen_at: { type: string }
        last_seen_at: { type: string }
        cleared_at: { type: [string, "null"] }
    BreachCheckRequest:
      type: object
      required: [secret, subject_id]
      properties:
        secret:
          type: string
          maxLength: 4096
          description: >-
            The candidate value. Hashed on the host; never stored, logged, or
            returned. Only five hexadecimal characters of its SHA-1 leave the
            host.
        subject_id:
          type: string
          maxLength: 256
          description: What the secret belongs to — a store path or connection id.
        subject_kind:
          type: string
          enum: [store_path, connection_credential]
          default: store_path
    BreachCheckResult:
      type: object
      required: [compromised, occurrences, secrets_returned]
      properties:
        compromised: { type: boolean }
        occurrences:
          type: integer
          description: Times the corpus has seen this password; 0 when not found.
        published:
          type: boolean
          description: >-
            Whether this call opened the finding, and therefore published
            `breach.password.compromised`. False when it was already open.
        cleared:
          type: boolean
          description: >-
            Whether a clean result closed a previously open finding, publishing
            `breach.finding.cleared`.
        secrets_returned: { type: boolean, const: false }
    DelegationOffer:
      type: object
      required: [id, state, manifest_digest, expires_at, items]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, presented, claimed, revoked, expired, burned] }
        manifest_digest: { type: string }
        expires_at: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, connection_id, provider_id, actions, execution_mode, required]
            properties:
              id: { type: string }
              connection_id: { type: string }
              provider_id: { type: string }
              display_name: { type: string }
              actions: { type: array, items: { type: string } }
              resources: { type: array, items: { type: string } }
              expires_in_seconds: { type: integer }
              execution_mode: { type: string, enum: [broker, relay] }
              required: { type: boolean }
              dependencies: { type: array, items: { type: string } }
    Delegation:
      type: object
      required: [id, offer_id, connection_id, claimant_subject, grant_id, execution_mode, expires_at]
      properties:
        id: { type: string }
        offer_id: { type: string }
        connection_id: { type: string }
        claimant_subject: { type: string }
        grant_id: { type: string }
        execution_mode: { type: string, enum: [broker, relay] }
        actions: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        expires_at: { type: string }
        revoked_at: { type: string, nullable: true }
    AttachmentTargetView:
      type: object
      description: Where sealed attachment ciphertext is replicated. Carries no token material.
      properties:
        connection_id: { type: string }
        provider_id: { type: string }
        folder_path: { type: string }
        enabled: { type: boolean }
        status: { type: string }
        last_error:
          oneOf:
            - type: "null"
            - type: string
        updated_at_unix_ms: { type: integer }
    PutAttachmentTargetBody:
      type: object
      additionalProperties: false
      required: [connection_id, folder_path]
      properties:
        connection_id: { type: string }
        folder_path:
          type: string
          description: Absolute provider path such as /OpenSesame/attachments; no '../../api' or empty segments.
        enabled: { type: boolean }
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
    CallerRole:
      type: string
      enum: [owner, admin, member, operator]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
        hint: { type: string }
    DeviceAuthorizeRequest:
      type: object
      required: [client_id]
      properties:
        client_id: { type: string }
        scope: { type: string }
    DeviceAuthorizeResponse:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval, client_id, scope]
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        expires_in: { type: integer, minimum: 1 }
        interval: { type: integer, minimum: 1 }
        client_id: { type: string }
        scope: { type: string }
    DeviceTokenRequest:
      type: object
      required: [device_code, client_id, grant_type]
      properties:
        device_code: { type: string }
        client_id: { type: string, enum: [opensesame-cli, opensesame-pages] }
        grant_type: { type: string, const: "urn:ietf:params:oauth:grant-type:device_code" }
    HostSession:
      type: object
      required: [session_id, principal_id, actor_id, issuer, assurance, organization_id, organization_role, project_id, credential_handle, approved_as, expires_at]
      properties:
        session_id: { type: string }
        principal_id: { type: string }
        actor_id: { type: [string, "null"] }
        issuer: { type: string, format: uri }
        assurance: { type: string }
        organization_id: { type: string }
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
        project_id: { type: [string, "null"] }
        credential_handle: { type: [string, "null"] }
        approved_as: { type: string }
        expires_at: { type: string, format: date-time }
    DeviceTokenResponse:
      type: object
      required: [token_type, expires_in, session, access_token]
      properties:
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1 }
        session: { $ref: "#/components/schemas/HostSession" }
        access_token: { type: string }
    DeviceApproveRequest:
      type: object
      required: [user_code]
      properties:
        user_code: { type: string }
        principal: { type: string }
        organization_id: { type: string }
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
    DeviceApproveResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: approved }
    RevokeSessionsRequest:
      type: object
      required: [principal_id, organization_id]
      properties:
        principal_id: { type: string }
        organization_id: { type: string }
    RevokeSessionsResponse:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, minimum: 0 }
    WhoAmI:
      type: object
      required: [principal_id, actor_id, client_id, issuer, assurance, organization_id, organization_role, context]
      properties:
        principal_id: { type: string }
        actor_id: { type: [string, "null"] }
        client_id: { type: string }
        issuer: { type: string, format: uri }
        assurance: { type: string }
        organization_id: { type: string }
        organization_role: { $ref: "#/components/schemas/CallerRole" }
        context: { type: [string, "null"] }
    InvokeRequest:
      type: object
      required: [operation, resource]
      properties:
        connection_ref: { type: string }
        connection: { type: string }
        operation: { type: string }
        resource: { type: string }
        audience: { type: string, format: uri }
        parameters: {}
        idempotency_key: { type: string }
        invoke_level: { type: integer, minimum: 1, maximum: 3 }
        task_run_id: { type: string, deprecated: true }
        intent_digest: { type: string, deprecated: true }
    CapabilityRequest:
      type: object
      required: [action, resource]
      properties:
        action: { type: string }
        resource: { type: string }
    ResourceSelector:
      oneOf:
        - type: object
          required: [kind, value]
          properties:
            kind: { type: string, const: exact }
            value: { type: string }
        - type: object
          required: [kind, values]
          properties:
            kind: { type: string, const: enumerated }
            values: { type: array, items: { type: string } }
    Capability:
      type: object
      required: [action, resource]
      properties:
        action: { type: string }
        resource: { $ref: "#/components/schemas/ResourceSelector" }
    CapabilitySet:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
    StartTaskRequest:
      type: object
      required: [principal_id, organization_id, capabilities]
      properties:
        principal_id:
          type: string
          description: Canonical `principal:<uuid>`, bare UUID, or Identity `prn_<uuid>`.
        organization_id: { type: string }
        capabilities:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/CapabilityRequest" }
        ttl_seconds: { type: integer, minimum: 1, maximum: 86400, default: 3600 }
    StartTaskResponse:
      type: object
      required: [task_run_id, state_version, state_digest, ceiling_digest, status, capabilities]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        state_digest: { type: string }
        ceiling_digest: { type: string }
        status: { type: string, const: active }
        capabilities: { $ref: "#/components/schemas/CapabilitySet" }
    TaskSummary:
      type: object
      required: [task_run_id, state_version, status, principal_id]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        status: { type: string }
        principal_id: { type: string }
    ListTasksResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskSummary" }
    Task:
      type: object
      required: [task_run_id, state_version, state_digest, status, capability_ceiling, current_capabilities, authority_context_id, maximum_expires_at]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        state_digest: { type: string }
        status: { type: string }
        capability_ceiling: { $ref: "#/components/schemas/CapabilitySet" }
        current_capabilities: { $ref: "#/components/schemas/CapabilitySet" }
        authority_context_id: { type: string }
        maximum_expires_at: { type: string, format: date-time }
    FreezeTaskIntentRequest:
      type: object
      required: [task_run_id, expected_state_version, operation, resource, audience, arguments, idempotency_key]
      properties:
        task_run_id: { type: string }
        expected_state_version: { type: integer, minimum: 0 }
        operation: { type: string }
        resource: { type: string }
        audience: { type: string, format: uri }
        arguments: {}
        idempotency_key: { type: string }
    FreezeTaskIntentResponse:
      type: object
      required: [intent_id, intent_digest, task_run_id, task_state_version, canonical_arguments]
      properties:
        intent_id: { type: string }
        intent_digest: { type: string }
        task_run_id: { type: string }
        task_state_version: { type: integer, minimum: 0 }
        canonical_arguments: {}
    InvokeTaskRequest:
      type: object
      required: [intent_digest]
      properties:
        intent_digest: { type: string }
    TerminateTaskRequest:
      type: object
      properties:
        expected_state_version: { type: integer, minimum: 0 }
    TerminateTaskResponse:
      type: object
      required: [task_run_id, state_version, status]
      properties:
        task_run_id: { type: string }
        state_version: { type: integer, minimum: 0 }
        status: { type: string, const: cancelled }
    InvocationReceipt:
      type: object
      required: [id, invocation_id, intent_digest, principal_id, actor_id, delegation_chain, operation, resource, policy_decision_id, policy_version_digest, started_at, completed_at, outcome, authority_key_id, signature, receipt_schema_version]
      properties:
        id: { type: string }
        invocation_id: { type: string }
        intent_digest: { type: string }
        principal_id: { type: string }
        organization_id:
          type: string
          description: Present on schema 3 receipts; legacy receipts are authorized through their stored invocation intent.
        actor_id: { type: string }
        actor_instance_id: { type: [string, "null"] }
        client_id: { type: [string, "null"] }
        operator_id: { type: [string, "null"] }
        delegation_chain: { type: array, items: { type: string } }
        connection_id: { type: [string, "null"] }
        operation: { type: string }
        resource: { type: string }
        policy_decision_id: { type: string }
        policy_version_digest: { type: string }
        approval_id: { type: [string, "null"] }
        credential_handle_id: { type: [string, "null"] }
        connector_component_digest: { type: [string, "null"] }
        external_request_digest: { type: [string, "null"] }
        external_response_digest: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        outcome: { type: string, enum: [succeeded, failed, denied, cancelled] }
        safe_result_summary: {}
        authority_key_id: { type: string }
        signature: { type: string }
        receipt_schema_version: { type: integer, minimum: 1 }
        task_run_id: { type: string }
        task_state_version: { type: integer, minimum: 0 }
        task_state_digest: { type: string }
    ReceiptKey:
      type: object
      required: [key_id, algorithm, public_key_b64]
      properties:
        key_id: { type: string }
        algorithm: { type: string, const: ed25519 }
        public_key_b64: { type: string }
    ReceiptKeysResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/ReceiptKey" }
    VerifyReceiptResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        error: { type: string }
    ContractError:
      type: object
      additionalProperties: false
      required: [error, hint]
      properties:
        error:
          type: string
          enum:
            - catalog_unavailable
            - provider_unknown
            - provider_unconfigured
            - connection_not_found
            - integration_not_found
            - integration_required
            - integration_conflict
            - integration_read_only
            - integration_in_use
            - invalid_state
            - state_expired
            - exchange_failed
            - not_refreshable
            - needs_reauth
            - redirect_not_allowed
            - binding_exists
            - binding_not_found
            - unsupported_credential
            - materialization_denied
            - unmintable
            - invalid_request
            - internal_error
            - unauthorized
            - forbidden
        hint: { type: string }
    Integration:
      type: object
      additionalProperties: false
      required: [id, key, provider_id, display_name, source, enabled, configured, callback_url, scopes, client_id_hint, has_client_secret, configured_fields, connection_count, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        key: { type: string }
        provider_id: { type: string }
        display_name: { type: string }
        source: { type: string, enum: [organization, shared_dev, deployment] }
        enabled: { type: boolean }
        configured: { type: boolean }
        callback_url: { type: [string, "null"], format: uri }
        scopes: { type: array, items: { type: string } }
        client_id_hint: { type: [string, "null"] }
        has_client_secret: { type: boolean }
        configured_fields:
          type: array
          items: { $ref: "#/components/schemas/ConfiguredField" }
        connection_count: { type: integer, minimum: 0 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateIntegration:
      type: object
      additionalProperties: false
      required: [key, provider_id, display_name]
      properties:
        key: { type: string, minLength: 1 }
        provider_id: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        scopes: { type: array, items: { type: string } }
        client_id: { type: string, minLength: 1 }
        client_secret: { type: string, minLength: 1 }
        configuration: { $ref: "#/components/schemas/Configuration" }
    UpdateIntegration:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        scopes: { type: array, items: { type: string } }
        client_id: { type: string }
        client_secret: { type: string }
        configuration_set: { $ref: "#/components/schemas/Configuration" }
        configuration_clear:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1 }
    Configuration:
      type: object
      maxProperties: 64
      propertyNames: { pattern: "^[A-Za-z0-9_.-]{1,64}$" }
      additionalProperties: { type: string, minLength: 1, maxLength: 8192 }
    ConfigurationFieldDef:
      type: object
      additionalProperties: false
      required: [name, secret, required]
      properties:
        name: { type: string, minLength: 1 }
        secret: { type: boolean }
        required: { type: boolean }
    ConfiguredField:
      type: object
      additionalProperties: false
      required: [name, hint]
      properties:
        name: { type: string, minLength: 1 }
        hint: { type: [string, "null"] }
    Egress:
      type: object
      additionalProperties: false
      required: [scheme, authorities, path_prefixes]
      properties:
        scheme: { type: string }
        authorities: { type: array, items: { type: string } }
        path_prefixes: { type: array, items: { type: string } }
    Scope:
      type: object
      additionalProperties: false
      required: [name, description, sensitive, default]
      properties:
        name: { type: string }
        description: { type: string }
        sensitive: { type: boolean }
        default: { type: boolean }
    Provider:
      type: object
      additionalProperties: false
      required: [id, display_name, category, docs_url, provenance_url, catalog_revision, auth_kind, supports_refresh, configured, auto_configurable, callback_url, missing_config, scopes, egress, operations, integration_configuration_fields, connection_configuration_fields]
      properties:
        id: { type: string }
        display_name: { type: string }
        category: { type: string, enum: [encryption, cloud_secret_storage, password_managers, local_storage, developer, productivity, communication, storage, crm, payments, identity, testing, custom] }
        docs_url: { type: string, format: uri }
        provenance_url: { type: string, format: uri }
        catalog_revision: { type: string, minLength: 1 }
        auth_kind: { type: string, enum: [oauth2_authorization_code, api_key, configuration] }
        supports_refresh: { type: boolean }
        configured: { type: boolean }
        auto_configurable: { type: boolean }
        callback_url: { type: [string, "null"], format: uri }
        missing_config: { type: array, items: { type: string } }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        egress: { $ref: "#/components/schemas/Egress" }
        operations: { type: array, items: { type: string } }
        integration_configuration_fields:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationFieldDef" }
        connection_configuration_fields:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationFieldDef" }
    CreateCustomProvider:
      type: object
      additionalProperties: false
      required: [id, display_name, base_url, auth]
      properties:
        id: { type: string, pattern: "^custom-[a-z0-9][a-z0-9-]*$", maxLength: 64 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        base_url: { type: string, format: uri, maxLength: 512 }
        docs_url: { type: [string, "null"], format: uri, maxLength: 512 }
        auth: { $ref: "#/components/schemas/CustomProviderAuth" }
    CustomProviderAuth:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, authorize_url, token_url]
          properties:
            kind: { type: string, enum: [oauth2_authorization_code] }
            authorize_url: { type: string, format: uri, maxLength: 512 }
            token_url: { type: string, format: uri, maxLength: 512 }
            supports_refresh: { type: boolean }
            scopes: { type: array, maxItems: 32, items: { type: string, maxLength: 64 } }
        - type: object
          additionalProperties: false
          required: [kind, header]
          properties:
            kind: { type: string, enum: [api_key] }
            header: { type: string, maxLength: 64 }
            value_prefix: { type: string, maxLength: 32 }
    Binding:
      type: object
      additionalProperties: false
      required: [id, target_kind, target_id, target_label, created_at]
      properties:
        id: { type: string }
        target_kind: { type: string, enum: [organization, project, agent, group, device, identity] }
        target_id: { type: string }
        target_label: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    CreateBinding:
      type: object
      additionalProperties: false
      required: [target_kind, target_id]
      properties:
        target_kind: { type: string, enum: [organization, project, agent, group, device, identity] }
        target_id: { type: string, minLength: 1 }
        target_label: { type: string, minLength: 1 }
    ConnectionEvent:
      type: object
      additionalProperties: false
      required: [id, kind, at, detail]
      properties:
        id: { type: string }
        kind: { type: string, enum: [created, authorize_started, authorized, refreshed, refresh_failed, bound, unbound, policy_updated, revoked, error] }
        at: { type: string, format: date-time }
        detail: { type: [string, "null"] }
    UpdateConnectionPolicy:
      type: object
      additionalProperties: false
      required: [shareability, max_invoke_level]
      properties:
        shareability: { type: string, enum: [private, delegable, organization_wide] }
        max_invoke_level: { type: integer, minimum: 1, maximum: 2 }
    Connection:
      type: object
      additionalProperties: false
      required: [connection_id, integration_id, connection_ref, logical_name, display_name, provider_id, status, status_detail, organization_id, project_id, owner_kind, shareability, requested_scopes, granted_scopes, account_label, expires_at, refreshable, configured_fields, last_refreshed_at, max_invoke_level, egress, bindings, created_at, updated_at]
      properties:
        connection_id: { type: string }
        integration_id: { type: [string, "null"] }
        connection_ref: { type: string }
        logical_name: { type: string }
        display_name: { type: string }
        provider_id: { type: string }
        status: { type: string, enum: [pending, active, needs_reauth, expired, revoked, error] }
        status_detail: { type: [string, "null"] }
        organization_id: { type: string }
        project_id: { type: [string, "null"] }
        owner_kind: { type: string }
        shareability: { type: string, enum: [private, delegable, organization_wide] }
        requested_scopes: { type: array, items: { type: string } }
        granted_scopes: { type: array, items: { type: string } }
        account_label: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        refreshable: { type: boolean }
        configured_fields:
          type: array
          items: { $ref: "#/components/schemas/ConfiguredField" }
        last_refreshed_at: { type: [string, "null"], format: date-time }
        max_invoke_level: { type: integer }
        egress: { $ref: "#/components/schemas/Egress" }
        bindings: { type: array, items: { $ref: "#/components/schemas/Binding" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateConnection:
      type: object
      additionalProperties: false
      anyOf:
        - required: [integration_id]
        - required: [provider_id]
      properties:
        integration_id: { type: string, minLength: 1 }
        provider_id: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        logical_name: { type: string, minLength: 1 }
        project_id: { type: string, minLength: 1 }
        scopes: { type: array, items: { type: string } }
        shareability: { type: string, enum: [private, delegable, organization_wide] }
    AuthorizeRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_uri: { type: string, format: uri }
        scopes: { type: array, items: { type: string } }
    AuthorizeResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, state, expires_at]
      properties:
        authorization_url: { type: string, format: uri }
        state: { type: string }
        expires_at: { type: string, format: date-time }
    SetCredentialRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [value]
        - required: [configuration_set]
        - required: [configuration_clear]
      properties:
        value: { type: string, minLength: 1, maxLength: 8192 }
        configuration_set:
          allOf:
            - $ref: "#/components/schemas/Configuration"
          minProperties: 1
        configuration_clear:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string, minLength: 1 }
    RevokeOutcome:
      type: object
      additionalProperties: false
      required: [revoked, provider_revocation]
      properties:
        revoked: { type: boolean }
        provider_revocation: { type: string, enum: [ok, unsupported, failed] }
    MintRequest:
      type: object
      additionalProperties: false
      properties:
        installation_id:
          type: string
          description: Numeric GitHub App installation id; required for github connections.
    DerivedMaterialization:
      type: object
      additionalProperties: false
      required: [connection_id, provider_id, kind, derived_token, expires_at, subject, actor, issued_at]
      properties:
        connection_id: { type: string }
        provider_id: { type: string }
        kind:
          type: string
          description: Provider-native token kind, e.g. github_app_installation.
        derived_token:
          type: string
          description: Provider-minted derived token; short-lived, attenuated, revocable.
        expires_at: { type: string, format: date-time }
        subject:
          type: string
          description: RFC 8693 subject — the connection's owning principal acted upon.
        actor:
          type: string
          description: RFC 8693 actor — the caller that requested the mint.
        issued_at: { type: string, format: date-time }

    Ceremony:
      type: object
      description: >-
        One provider's ceremony coverage. Capabilities and the tiers they
        resolve to, never a captured value: a ceremony describes what it may
        seal, and the sealing happens somewhere this route cannot see.
      required: [provider_id]
      properties:
        provider_id: { type: string }
        native_registration:
          type: boolean
          description: >-
            The provider publishes an endpoint that creates the app or client.
            It covers registration and nothing else — it cannot make somebody
            signed in, install on an org, or prove the result works.
        native_registration_note: { type: string, nullable: true }
        recipe:
          type: boolean
          description: A signed, checked-in step IR covering this provider exists.
        agentic_allowed:
          type: boolean
          description: This deployment permits a model to drive the provider's UI.
        declares:
          type: array
          description: >-
            Capture slot names this ceremony may seal. A slot the recipe did not
            declare cannot be captured at all, whatever the page offers.
          items: { type: string }
        verifies_by:
          type: string
          nullable: true
          description: The round trip that proves the credential works (ADR 0082 §6).
        note: { type: string, nullable: true }
        runnable:
          type: boolean
          description: False when every phase is blocked — a provider still set up by hand.
        plan:
          type: array
          items:
            type: object
            required: [phase, tier]
            properties:
              phase: { type: string }
              tier:
                type: string
                enum: [c0_provider_native, c1_deterministic, c2_agentic, c3_blocked]
              uses_a_model: { type: boolean }
              requires_a_present_user: { type: boolean }
        secrets_returned: { type: boolean, const: false }
    AgentRun:
      type: object
      description: >-
        A sandboxed run, as metadata. Carries no frame, no rationale and no page
        content — `observation_included` says so explicitly rather than leaving
        a reader to infer it.
      required: [id, origin, control_state, secrets_returned, observation_included]
      properties:
        id: { type: string }
        job_id: { type: string }
        origin: { type: string, description: The relying party. An origin, never an account. }
        tier: { type: string, enum: [t3, t4] }
        control_state:
          type: string
          enum: [agent_driving, handoff_requested, awaiting_human, human_driving, resume_requested, suspended]
        quiescence: { type: string, enum: [quiescent, critical] }
        handoff_queued: { type: boolean }
        driver: { type: string, enum: [agent, human] }
        lease_expires_at: { type: string, nullable: true }
        blocked_reason: { type: string, nullable: true }
        next_seq: { type: integer }
        expires_at: { type: string }
        closed_at: { type: string, nullable: true }
        version: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
        secrets_returned: { type: boolean, const: false }
        observation_included: { type: boolean, const: false }
        observation: { $ref: "#/components/schemas/AgentRunObservation" }
        hook_records:
          allOf: [{ $ref: "#/components/schemas/AgentHookRecordSummary" }]
          description: Present on a single-run read, absent from the listing.
    AgentRunObservation:
      type: string
      enum: [sealed_log, hook_records_only]
      description: >-
        What observes the run. `sealed_log`: a viewer key exists and the log is
        sealed to it. `hook_records_only`: the Host opened the run and holds no
        viewer key (ADR 0081 §9), so it seals nothing and the agent-hooks records
        are the observation.
    AgentHookRecordSummary:
      type: object
      description: What a run's hook records add up to. Counts only.
      required: [count, allow, deny, transform, escalated, last_sequence]
      properties:
        count: { type: integer }
        allow: { type: integer }
        deny: { type: integer }
        transform: { type: integer }
        escalated: { type: integer, description: Denials that carried an approval block. }
        last_sequence: { type: integer, nullable: true }
    AgentHookRecord:
      type: object
      description: >-
        The payload-free agent-hooks/0.1 §10.3 projection of one interception.
        There is no member for a message, a target or a transform value.
      required: [sequence, interception_point, decision, escalated, policy_version, recorded_at]
      properties:
        sequence: { type: integer }
        interception_point:
          type: string
          enum: [agent_startup, input, pre_model_call, post_model_call, pre_tool_call, post_tool_call, output, agent_shutdown]
        decision: { type: string, enum: [allow, deny, transform] }
        escalated: { type: boolean }
        reason: { type: string, nullable: true, description: A short machine identifier, never prose. }
        decided_by: { type: integer, nullable: true }
        input_identity: { type: string, nullable: true }
        enforced_identity: { type: string, nullable: true }
        policy_version: { type: integer }
        recorded_at: { type: string }
    AgentRunError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        hint: { type: string }

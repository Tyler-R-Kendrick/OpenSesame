[package]
name = "opensesame-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.10", features = ["arbitrary-derive"] }
arbitrary = { version = "1.4.2", features = ["derive"] }
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.17.0", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }

opensesame-domain = { path = "../crates/domain" }
opensesame-grants = { path = "../crates/grants" }
opensesame-proof = { path = "../crates/proof" }
opensesame-authn = { path = "../crates/authn" }
opensesame-redaction = { path = "../crates/redaction" }
opensesame-human-vault = { path = "../crates/human-vault" }
opensesame-claims = { path = "../crates/claims" }
opensesame-audit = { path = "../crates/audit" }
opensesame-env-spec = { path = "../crates/env-spec" }
opensesame-rotation = { path = "../crates/rotation" }
opensesame-protocol-mcp = { path = "../crates/protocol-mcp" }
opensesame-protocol-aauth = { path = "../crates/protocol-aauth", features = ["experimental-aauth"] }
opensesame-connection-broker = { path = "../crates/connection-broker" }
opensesame-connector-host = { path = "../crates/connector-host" }
opensesame-authz = { path = "../crates/authz" }
opensesame-task-bus = { path = "../crates/task-bus" }
opensesame-xkeys = { path = "../crates/xkeys" }
opensesame-provider-openbao = { path = "../crates/provider-openbao" }
opensesame-provider-bitwarden = { path = "../crates/provider-bitwarden" }
opensesame-provider-openfga = { path = "../crates/provider-openfga" }
opensesame-connection-detect = { path = "../crates/connection-detect" }
opensesame-tailscale-authn = { path = "../crates/tailscale-authn" }
opensesame-kdbx-bridge = { path = "../crates/kdbx-bridge" }
opensesame-sealed-store = { path = "../crates/sealed-store" }
opensesame-gateway = { path = "../apps/gateway" }

[workspace]
members = ["."]


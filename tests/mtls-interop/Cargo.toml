# ## Why this crate exists
#
# `opensesame-mtls-interop` is SW-INTEROP's independent-oracle crate. It owns
# no production code: every test here drives an *already shipped* entry point
# (`opensesame_transport_security::SecureListener`, the Host gateway binary,
# the Identity plane's Node listener, the pinned `nats-server`, `bao`,
# `spire-agent` and `caddy`) from a runtime that did not build it.
#
# Deliberate dependency choices:
#
# * **No `testkit` feature of `opensesame-transport-security`.** Every
#   certificate in this crate is generated by the system `openssl` CLI
#   (`src/pki.rs`), so the oracle cannot repeat an `rcgen`-side bug the
#   production verifier also has.
# * **`opensesame-domain`** is here only for the real `ServiceBindingSet`
#   authorization types, so a test can tell a handshake refusal apart from a
#   post-handshake authorization denial.
# * Nothing in this crate is ever a dependency of a shipped binary; it is not
#   a `default-member` and it publishes nothing.
[package]
name = "opensesame-mtls-interop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Cross-runtime interoperability oracles for optional mTLS and workload identity (ADR 0130)"

[lib]
name = "opensesame_mtls_interop"
path = "src/lib.rs"

[dependencies]
opensesame-domain = { path = "../../crates/domain" }
opensesame-ingress-evidence = { path = "../../crates/ingress-evidence" }
opensesame-transport-security = { path = "../../crates/transport-security" }
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
async-nats = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
secrecy = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }

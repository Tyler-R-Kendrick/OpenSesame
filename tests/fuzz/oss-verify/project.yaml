#
# OpenSesame's OSS Verify enrollment pack (theorem-labs/oss-verify). OSS
# Verify proves, about the compiled fuzz binaries, that no input up to 64 MiB
# makes a fuzz target crash, hang, or trip a sanitizer. Enrollment is a PR
# adding projects/opensesame/ to that repository with these files; the
# decision is docs/adr/0211-oss-fuzz-and-oss-verify-enrollment.md and the
# filing checklist is docs/contributing/oss-programs.md.
repo: https://github.com/Tyler-R-Kendrick/OpenSesame
# TODO(enrollment): the one address that receives findings and build problems;
# OSS Verify checks it belongs to a maintainer. Set before filing.
primary_contact: set-before-filing@example.com
homepage: https://github.com/Tyler-R-Kendrick/OpenSesame
language: rust
# First wave (ADR 0211 §3): the security-boundary families the in-repo
# oracles already assert — authority algebra, seals, and parsers.
fuzz_targets:
  - capability_algebra
  - grant_attenuation
  - vault_envelope
  - broker_seal
  - canonical_json
  - jwt_jwk
  - pki_csr_parse
  - kdbx_parse
patch_style: patch_style.md

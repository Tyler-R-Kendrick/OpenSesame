# Node 24 matches package.json engines.node ">=24". npm workspaces replaced pnpm.
# Temurin 17 matches ci-prerelease-checks (JAVA_HOME_17_X64). 17.0.20+101 is
# the newest Temurin 17 build mise's catalog publishes for every locked
# platform; 17.0.21+9 has no windows-x64 metadata.

[tools]
node = "24"
# llvm-tools-preview is for cargo-llvm-cov and native Windows stack dumps.
# rust-toolchain.toml stays rustfmt and clippy.
rust = { version = "1.88.0", components = ["rustfmt", "clippy", "llvm-tools-preview"], targets = ["wasm32-unknown-unknown"] }
go = "1.26.10"
java = "temurin-17.0.20+101"
"cargo:cargo-ndk" = "4.1.2"

[env]
CARGO_TARGET_DIR = "{{env.HOME}}/.cache/packages/cargo-target"
# sdkmanager packages for the Android jobs. compileSdk is 36.
ANDROID_SDK_PLATFORM = "android-36"
ANDROID_BUILD_TOOLS = "35.0.0"
ANDROID_BUILD_TOOLS_LATEST = "36.0.0"
ANDROID_NDK_VERSION = "28.0.13004108"

[settings]
lockfile = true

[tasks.setup]
description = "Install workspace dependencies"
run = "bash scripts/dev/install-dependencies.sh"

[tasks.deps]
description = "Install workspace dependencies"
run = "bash scripts/dev/install-dependencies.sh"

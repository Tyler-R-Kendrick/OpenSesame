[package]
name = "opensesame-invoke-through"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Invoke-through broker: daemon-mediated upstream calls over a credential that never leaves the machine (ADR 0048 D6/D7)"

[dependencies]
secrecy = { workspace = true }
zeroize = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
# Named for the types `tls` exposes only; already in the tree via hyper-rustls / hyper-util.
rustls = { version = "0.23.43", default-features = false, features = ["std"] }
tower-service = "0.3.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Disposable PKI + a real mTLS listener for the TLS-injection tests. Never a
# normal dependency: the daemon's dependency budget is measured on normal edges.
opensesame-transport-security = { path = "../transport-security", features = ["testkit"] }
opensesame-domain = { path = "../domain" }
axum = { workspace = true }
chrono = { workspace = true }

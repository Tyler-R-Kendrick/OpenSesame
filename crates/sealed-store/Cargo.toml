[package]
name = "opensesame-sealed-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Git-native hierarchical sealed secret store (pass parity)"

[dependencies]
opensesame-authenticator-core = { path = "../authenticator-core" }
opensesame-human-vault = { path = "../human-vault" }
# Which `git`, `gpg`, `sops` and age plugin run, and what each is handed.
opensesame-trusted-exec = { path = "../trusted-exec" }
anyhow = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
hkdf = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
# Pinned upstream crypto update removes vulnerable crypto-bigint 0.5.
age = { git = "https://github.com/str4d/rage", rev = "b5b68c4f4f7ea5c368bc060f6fe0237549c3a13f", features = ["armor"] }
directories = "6.0.0"
libc = { workspace = true }
url = { workspace = true }
regex = "1.11.1"

[dev-dependencies]
# Exercise the maintained parser used by age's localization build macros.
i18n-config = "0.4.8"
opensesame-trusted-exec = { path = "../trusted-exec", features = ["testkit"] }
serde_json = { workspace = true }
tempfile = "3.20.0"
insta = { workspace = true, features = ["redactions"] }
proptest = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

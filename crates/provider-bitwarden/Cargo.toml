[package]
name = "opensesame-provider-bitwarden"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bitwarden/Vaultwarden consume-client (upstream credential source, ADR 0052)"

[dependencies]
aes = "0.8.4"
argon2 = { workspace = true }
base64 = { workspace = true }
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
hkdf = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
insta = { workspace = true, features = ["redactions"] }
tokio = { workspace = true }

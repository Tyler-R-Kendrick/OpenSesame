[package]
name = "opensesame-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenSesame host daemon — local session capabilities (ADR 0017)"

[dependencies]
opensesame-connection-detect = { path = "../../crates/connection-detect" }
opensesame-invoke-through = { path = "../../crates/invoke-through" }
# Fill by reference (ADR 0150 §6.4) reads the human-plane sealed store. It is
# already in this tree through host-core → broker → connector-host; the direct
# edge adds no crate to the closure `pnpm audit:daemon-deps` guards.
opensesame-sealed-store = { path = "../../crates/sealed-store" }
opensesame-host-core = { path = "../../crates/host-core" }
opensesame-uds-authn = { path = "../../crates/uds-authn" }
# Plugin settings only (ADR 0150 §7): the catalog and the settings file behind
# `/v1/plugins`, and the switch `/v1/fill` answers behind (it answers only
# while the `browser-autofill` plugin is on). serde + sha2 + hex +
# directories, all already in this tree; the daemon never links a plugin
# (`pnpm audit:plugin-boundary`).
opensesame-plugin-settings = { path = "../../crates/plugin-settings" }
opensesame-tailscale-authn = { path = "../../crates/tailscale-authn", optional = true }
# Tailnet device management (ADR 0169): the credential, role pairings, the
# Tailscale client and the audit trail. Everything it links is already here.
opensesame-tailnet-admin = { path = "../../crates/tailnet-admin" }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
ecdsa = { version = "0.16", default-features = false, features = ["verifying"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# D9 tailnet listener: whois-authorized, read-only, default OFF (ADR 0048 §8).
[features]
default = []
tailscale = ["dep:opensesame-tailscale-authn"]
# End-to-end harness only: let `OPENSESAME_TAILSCALE_API_BASE` name a
# loopback stub for api.tailscale.com. No release enables it.
tailnet-admin-test-upstream = ["opensesame-tailnet-admin/upstream-override"]

# Platform keychain backends for connector discovery (ADR 0048 §3c, §5).
# Budgeted additions only: labels are enumerated, values are never read.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1.0", default-features = false, features = [
    "rt-tokio-crypto-rust",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Security_Credentials"] }

[dev-dependencies]
opensesame-tailnet-admin = { path = "../../crates/tailnet-admin", features = ["upstream-override"] }
insta = { workspace = true, features = ["redactions"] }
tempfile = { workspace = true }
tower = { workspace = true }

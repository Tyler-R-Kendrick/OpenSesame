[package]
name = "opensesame-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workload connector host: readiness and provider listing behind a token or mTLS, served by `opensesame worker run` (ADR 0132)"

[dependencies]
opensesame-connector-host = { path = "../../crates/connector-host" }
opensesame-domain = { path = "../../crates/domain" }
opensesame-transport-security = { path = "../../crates/transport-security" }
chrono = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
opensesame-transport-security = { path = "../../crates/transport-security", features = ["testkit"] }
reqwest = { workspace = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tempfile = { workspace = true }

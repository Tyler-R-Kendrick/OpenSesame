[package]
name = "opensesame-human-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
subtle = { workspace = true }
chrono = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm = { workspace = true }
pbkdf2 = { workspace = true }
unicode-normalization = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.10.6"
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3.20.0"
chrono = { workspace = true }
insta = { workspace = true, features = ["redactions"] }
opensesame-domain = { path = "../domain" }
proptest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

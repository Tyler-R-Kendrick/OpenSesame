[package]
name = "opensesame-bitwarden-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bitwarden-compatible server surface: point a Bitwarden client at the Host (ADR 0141)"

[dependencies]
opensesame-storage = { path = "../storage" }
anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["simple"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
opensesame-provider-bitwarden = { path = "../provider-bitwarden" }
aws-lc-rs = "1.18.0"
hyper-util = { workspace = true, features = ["server", "server-auto", "http1", "tokio"] }
reqwest = { workspace = true }
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
secrecy = { workspace = true }
tempfile = { workspace = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }

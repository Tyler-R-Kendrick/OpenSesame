[package]
name = "opensesame-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure domain resources, invariants, IDs, and errors for OpenSesame"

[features]
concurrency-test = ["dep:shuttle"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shuttle = { version = "0.9.1", optional = true }
thiserror = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "shuttle_authority"
path = "tests/shuttle_authority.rs"
required-features = ["concurrency-test"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

[package]
name = "opensesame-collab-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Collaboration-platform authority adapter: projects an authority onto a Discord guild's roles and channel overwrites (bot only, never a user token)"

[lib]
name = "opensesame_collab_adapter"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["http1"] }
tokio = { workspace = true }

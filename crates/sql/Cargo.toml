[package]
description = "SQLite utilities for the OpenSesame host store"
name = "opensesame-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "chrono", "uuid", "migrate"] }
sqlx-sqlite = { version = "0.8.6", default-features = false, features = ["bundled", "chrono", "uuid", "migrate"] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["chrono", "uuid", "migrate"] }

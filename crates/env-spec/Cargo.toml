[package]
name = "opensesame-env-spec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenSesame consumer of @env-spec JSON (via env-spec-bridge)"

[dependencies]
opensesame-domain = { path = "../domain" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Who is asking (`geteuid`, `getegid`, `getgroups`), for the PATH trust rule in
# `src/node_bridge/trust.rs`. Already in the daemon's tree (mio, getrandom).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

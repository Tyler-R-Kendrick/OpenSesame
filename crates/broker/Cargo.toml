[package]
name = "opensesame-broker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
concurrency-test = ["dep:shuttle"]

[dependencies]
shuttle = { version = "0.9.1", optional = true }
opensesame-domain = { path = "../domain" }
opensesame-redaction = { path = "../redaction" }
opensesame-authz = { path = "../authz" }
opensesame-audit = { path = "../audit" }
opensesame-storage = { path = "../storage" }
opensesame-connector-host = { path = "../connector-host" }
opensesame-task-access = { path = "../task-access" }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "shuttle_idempotency"
path = "tests/shuttle_idempotency.rs"
required-features = ["concurrency-test"]

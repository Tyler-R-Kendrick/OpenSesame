[package]
name = "opensesame-rotation-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web-login rotation executor: step IR, tool boundary, and the ordering that must not be rearranged"

[features]
default = []
# Login-form surrogate substitution (ADR 0150 §6.3), an optional plugin
# feature (ADR 0150 §7): never in a default build. It is compiled only into
# the surrogate-proxy plugin, and even there it runs only while that plugin's
# switch is on (`LoginRoad::choose` over its `PluginState`). The dependencies
# below are the ones only substitution uses.
login-surrogate = [
  "dep:opensesame-plugin-settings",
  "dep:base64",
  "dep:secrecy",
  "dep:zeroize",
]

[dependencies]
# The canonical agent-hooks core (MIT, responsibleai/agent-hooks): this crate
# is an agent-hooks/0.1 *host* for its own runs (ADR 0156). Pinned exactly,
# with the same pin as crates/agent-hooks — the contract is pre-1.0, and the
# vendored CTK corpus in spec/agent-hooks/conformance moves with this line.
agent-hooks-sdk = "=0.1.0-alpha.5"
futures = { workspace = true }
opensesame-ceremony = { path = "../ceremony" }
opensesame-session-observe = { path = "../session-observe" }
async-trait = { workspace = true }
serde = { workspace = true }
# `float_roundtrip`: every hosted build links `opensesame-agent-hooks`, which turns
# it on for the whole build; naming it here keeps this crate's results (and its
# golden-vector test) the same whether or not that crate is in the same build.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
# login-surrogate only: the plugin switch's state, the credential's type, and
# the response scrub's base64 needles. serde_json stays required above: the
# agent-hooks host uses it in every build.
opensesame-plugin-settings = { path = "../plugin-settings", optional = true }
base64 = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
url.workspace = true
tokio = { workspace = true, features = ["sync"] }
# The recipe document (ADR 0076 §4): its timestamps, its Ed25519 signature and
# the digest a run records. None of them is login-surrogate-only.
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The crate tests itself with the plugin feature on, so the Rust CI job's
# `cargo test --workspace --all-targets` compiles and runs the substitution
# suites. A dev-dependency never reaches a normal build (resolver 2);
# `tests/default_build.rs` asks cargo to prove it.
opensesame-rotation-web = { path = ".", features = ["login-surrogate"] }
base64 = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
# The CTK runner and `Harness` seam (§13.2), for tests/agent_hooks_ctk.rs.
agent-hooks-sdk = { version = "=0.1.0-alpha.5", features = ["ctk"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[package]
name = "opensesame-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client-core SDK — E2EE vault + encrypted sync (native; wasm-ready)"

[features]
default = []
wasm-bindgen = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]

[dependencies]
opensesame-core = { path = "../core" }
opensesame-human-vault = { path = "../human-vault" }
anyhow = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = { workspace = true }

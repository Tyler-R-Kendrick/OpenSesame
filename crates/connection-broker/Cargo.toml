[package]
description = "Connector registry, registration ceremonies, and seal for OpenSesame connection authorization"
name = "opensesame-connection-broker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "opensesame_connection_broker"
path = "src/lib.rs"

[features]
# A loopback STS stand-in that verifies SigV4 (ADR 0217), for the gateway's
# tests. Never enabled by a shipped build.
sts-stand-in = []

[dependencies]
opensesame-claims = { path = "../claims" }
opensesame-connection-detect = { path = "../connection-detect" }
opensesame-domain = { path = "../domain" }
opensesame-event-seal = { path = "../event-seal" }
opensesame-relay = { path = "../relay" }
opensesame-rotation = { path = "../rotation" }
opensesame-invoke-through = { path = "../invoke-through" }
# ADR 0132 (SW-CONNECTOR): the connector's optional client identity. Verification,
# client configs and the disposable test PKI all live there; the broker never
# builds a TLS stack of its own.
opensesame-transport-security = { path = "../transport-security" }
secrecy = { workspace = true }
opensesame-task-bus = { path = "../task-bus" }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
# Bounded, scope-keyed connector client pools (CONN-POOLS). Already in the lock.
lru = "0.18.2"
oauth2 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
# The AWS STS mint (ADR 0217): SigV4 request signing, pinned exactly, with the
# HTTP signer alone (no SigV4a, no event-stream signing; `http1` is the
# `http` 1.x types its canonical request is built on, already in the tree).
# The credential and identity types are named only to hand the signer its key.
aws-sigv4 = { version = "=1.3.8", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "=1.2.11", default-features = false }
aws-smithy-runtime-api = { version = "=1.11.3", default-features = false, features = ["client"] }
# Bounded STS XML reading. Already in the lock through the KDBX bridge.
quick-xml = { version = "=0.41.0", default-features = false }

[dev-dependencies]
axum = { workspace = true }
opensesame-storage = { path = "../storage" }
# Disposable PKI and a real mTLS listener for the connector transport tests.
opensesame-transport-security = { path = "../transport-security", features = ["testkit"] }
rustls = { version = "0.23.43", default-features = false, features = ["std"] }
tempfile = { workspace = true }

[package]
name = "opensesame-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RFC 9449 DPoP validation and key custody for OpenSesame"

[dependencies]
opensesame-domain = { path = "../domain" }
base64 = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
shuttle = { version = "0.9.1", optional = true }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

[features]
concurrency-test = ["dep:shuttle"]

[[test]]
name = "shuttle_replay"
path = "tests/shuttle_replay.rs"
required-features = ["concurrency-test"]

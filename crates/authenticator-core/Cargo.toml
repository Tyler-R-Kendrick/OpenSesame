[package]
name = "opensesame-authenticator-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared native authenticator policy, invocation validation, and OTP core"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
ffi = ["dep:uniffi"]
bindgen = ["ffi", "uniffi/cli"]

[dependencies]
hmac = { workspace = true }
serde = { workspace = true }
sha1 = "0.10.6"
sha2 = { workspace = true }
thiserror = { workspace = true }
uniffi = { version = "0.32.0", default-features = false, optional = true }
url = { workspace = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

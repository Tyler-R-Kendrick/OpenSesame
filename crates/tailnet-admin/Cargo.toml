[package]
name = "opensesame-tailnet-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tailnet device management through the daemon (ADR 0166): the Tailscale credential, origin-bound role pairings, the upstream client and the audit trail"

# Everything here is already in the daemon's tree (ADR 0048 §5): the daemon
# serves these routes and the `opensesame` CLI configures them.
[dependencies]
opensesame-invoke-through = { path = "../invoke-through" }
# `is_pairable_origin`, `is_secret_shaped`, `unix_now`: one origin rule for
# every pairing the daemon issues.
opensesame-plugin-settings = { path = "../plugin-settings" }
base64 = { workspace = true }
bytes = { workspace = true }
directories = "6.0.0"
hex = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
# The OAuth access-token mint only (one fixed POST, redirects off); every
# device and key call goes through invoke-through.
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[features]
default = []
# Honour `OPENSESAME_TAILSCALE_API_BASE` (loopback http only) so the
# end-to-end harness can stand a stub in for api.tailscale.com. Test builds
# only: a shipped build reaches api.tailscale.com and nothing else.
upstream-override = []

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }

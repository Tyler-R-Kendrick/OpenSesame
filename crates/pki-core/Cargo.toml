# ## Dependency notes
#
# Pins settled after resolving against the workspace lockfile under rustc 1.88:
#
# * `rcgen` has no `crl` cargo feature — CRL support is unconditional in 0.13,
#   so the brief's `features = ["crl"]` is dropped rather than invented.
# * `x509-parser` gains `verify`, which `rcgen` also turns on; asking for it
#   explicitly means this crate's CRL and chain signature checks do not depend
#   on another crate's feature selection.
# * X.509 and Ed25519 retain their DER 0.7 interfaces. P-256/P-384 use
#   the patched RustCrypto generation; PEM/DER bytes bridge their newer
#   signature and PKCS#8 traits without changing encoded keys or signatures.
#   RSA key generation and PKCS#1 signing use AWS-LC through rcgen and aws-lc-rs.
# * PKCS#12 uses `p12-keystore` 0.4.1. `p12` 0.6 is `yasna`-based and
#   single-entry; RustCrypto `pkcs12` 0.2 is a pre-release with no high-level
#   keystore API. `p12-keystore` was the only crate that both builds here and
#   enumerates multiple entries with friendly names, which the brief requires.
#   It carries its own `der` 0.8 generation internally; the API surface this
#   crate uses is plain DER bytes, so the duplication is contained.
# * `cms` and `const-oid` were in the brief's list but proved unnecessary:
#   nothing here builds CMS, and `der` re-exports `ObjectIdentifier`.

[package]
description = "PKI primitives for OpenSesame: certificate requests, PKCS#12 bundles, CRLs, and OCSP requests"
name = "opensesame-pki-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "opensesame_pki_core"
path = "src/lib.rs"

[dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["crypto", "aws_lc_rs", "x509-parser", "pem", "zeroize"] }
x509-parser = { version = "0.16.0", features = ["verify"] }
x509-cert = "0.2.5"
der = { version = "0.7.10", features = ["oid", "derive", "alloc"] }
spki = "0.7.3"
pkcs8 = { version = "0.11.0", features = ["alloc", "pem"] }
p12-keystore = "0.4.1"
aws-lc-rs = "1.18.0"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
signature = "3.0.0"
sha2 = { workspace = true }
time = { version = "0.3.41", default-features = false, features = ["std", "serde", "serde-well-known", "parsing", "formatting"] }
zeroize = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true, features = ["redactions", "json"] }
serde_json = { workspace = true }

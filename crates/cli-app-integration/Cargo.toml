[package]
name = "opensesame-cli-app-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI ↔ OpenSesame app integration session store (1Password-style)"

[lib]
name = "opensesame_cli_app_integration"
path = "src/lib.rs"

[features]
test-seams = []

[dependencies]
# Which `ps` runs (macOS session lookup), and what it is handed.
opensesame-trusted-exec = { path = "../trusted-exec" }
base64 = { workspace = true }
ecdsa = { version = "0.17", default-features = false, features = ["algorithm"] }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
p256 = { version = "0.14", default-features = false, features = ["getrandom", "ecdsa", "pkcs8", "alloc", "arithmetic", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
opensesame-trusted-exec = { path = "../trusted-exec", features = ["testkit"] }

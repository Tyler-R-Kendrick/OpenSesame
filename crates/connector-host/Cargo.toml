[package]
name = "opensesame-connector-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opensesame-cli-app-integration = { path = "../cli-app-integration" }
opensesame-domain = { path = "../domain" }
# L2 constrained HTTP admits through the surrogate ledger and executes through
# the broker (ADR 0150 §6.7). A more stable crate than this one, with no
# workspace dependencies of its own, so the edge points the right way.
opensesame-invoke-through = { path = "../invoke-through" }
opensesame-sealed-store = { path = "../sealed-store" }
anyhow = { workspace = true }
# `bytes`, `http` and `secrecy` are named only for the types the broker's
# request takes; all three are already in the tree through invoke-through.
bytes = { workspace = true }
http = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# Entropy for the placeholder an L2 connection is issued.
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
wasmtime = { workspace = true, optional = true }

[features]
# ADR 0065 §3: the component runtime is default-off; only the gateway may
# enable it. The daemon dependency gate bans wasmtime from daemon trees.
wasm-connectors = ["dep:wasmtime"]

[dev-dependencies]
tempfile = "3.20.0"
# A real TLS upstream for the constrained-HTTP end-to-end suite: disposable
# PKI and a listener, never a normal dependency.
opensesame-transport-security = { path = "../transport-security", features = ["testkit"] }
axum = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }

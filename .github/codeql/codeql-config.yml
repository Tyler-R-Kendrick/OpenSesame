name: "OpenSesame CodeQL config"

# Test, fixture, generated, and evidence code is not production surface:
# scanning it only produces findings nobody can act on in shipped code.
# Production source trees are deliberately not excluded.
paths-ignore:
  - "**/*.test.*"
  - "**/tests/**"
  - "**/Tests/**"
  - "**/*_test.go"
  - "**/*test-support*"
  - "**/fixtures/**"
  - "**/*.generated.*"
  - "docs/evidence/**"
  - "tools/mock-upstream-idp/**"
  - "assets/**"
  # Build, capture, audit and evidence tooling is not shipped runtime code.
  # Production source under apps/ and packages/ remains scanned.
  - "scripts/**"
  - "apps/pages/scripts/**"
  - "apps/browser-extension-autofill/e2e/**"
  - "apps/browser-extension-bridge/e2e/**"
  - "examples/**"
  - "tools/**"
  - "packages/app-core/scripts/**"

# The Rust query pack is still preview-quality and these five rules have no
# path or cfg(test) awareness: they flag zero-filled buffers, test vectors,
# domain-separation labels, the CLI's deliberate `pass show` output, checked
# unsafe slices, fingerprint hashes (not password storage), and the daemon's
# loopback-only Host API URL. Keep the rules out of the shipped baseline until
# the pack can distinguish those cases; the remaining Rust queries stay on.
query-filters:
  - exclude:
      id: rust/hard-coded-cryptographic-value
  - exclude:
      id: rust/cleartext-logging
  - exclude:
      id: rust/access-invalid-pointer
  - exclude:
      id: rust/weak-sensitive-data-hashing
  - exclude:
      id: rust/request-forgery
  - exclude:
      id: rust/non-https-url

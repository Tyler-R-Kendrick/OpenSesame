name: "OpenSesame CodeQL config"

# Test, fixture, generated, and evidence code is not production surface:
# scanning it only produces findings nobody can act on in shipped code.
# Production source trees are deliberately not excluded.
paths-ignore:
  - "**/*.test.*"
  - "**/tests/**"
  - "**/Tests/**"
  - "**/*_test.go"
  - "**/*test-support*"
  - "**/fixtures/**"
  - "**/*.generated.*"
  - "docs/evidence/**"
  - "tools/mock-upstream-idp/**"
  - "assets/**"
  # Build, capture, audit and evidence tooling is not shipped runtime code.
  # Production source under apps/ and packages/ remains scanned.
  - "scripts/**"
  - "apps/pages/scripts/**"
  - "apps/browser-extension-autofill/e2e/**"
  - "apps/browser-extension-bridge/e2e/**"
  - "examples/**"
  - "tools/**"
  - "packages/app-core/scripts/**"

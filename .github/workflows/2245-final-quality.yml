name: Review reconciled skills candidate
on:
  push:
    branches: [review/2245-final-quality-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/2245-final-quality-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 0d68e28b5bb45b30f22b9424c0a43ccaa46aecfa
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify exact candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0d68e28b5bb45b30f22b9424c0a43ccaa46aecfa
          test "$(git rev-parse HEAD^{tree})" = 598eab7cbaad60f6ec10533408aeafbc81da452d
          test "$(git rev-parse HEAD^1)" = e831441dbbf96a0b992f277827bd335ffb62aa33
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Quality, hook and installer checks
        run: |
          set -euo pipefail
          pnpm quality:gate
          node scripts/quality/docs-index.mjs --check
          node scripts/dev/sync-agent-skills.mjs --check
          node --test scripts/test/git-hooks.test.mjs scripts/security/agent-skills.test.mjs
          bash scripts/dev/install-agent-skills.test.sh
      - name: Check relative links in extracted guidance
        run: |
          python3 - <<'PY'
          import pathlib, re, urllib.parse
          paths = [pathlib.Path('AGENTS.md'), pathlib.Path('docs/architecture/layout-map.md'), pathlib.Path('skills/README.md')]
          paths += list(pathlib.Path('docs/contributing').glob('*.md'))
          paths += [pathlib.Path('docs/design/tooling.md')]
          missing = []
          for path in paths:
              text = path.read_text()
              for dest in re.findall(r'\]\(([^)\s]+)', text):
                  if dest.startswith(('http:', 'https:', 'mailto:', '#', 'data:')) or '<' in dest:
                      continue
                  target = urllib.parse.unquote(dest.split('#', 1)[0])
                  if not target or '$' in target or '{' in target:
                      continue
                  if not (path.parent / target).exists():
                      missing.append(f'{path}: {dest}')
          if missing:
              raise SystemExit('\n'.join(missing))
          print(f'Checked local Markdown links in {len(paths)} guidance files')
          PY
      - name: Verify source after tests
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0d68e28b5bb45b30f22b9424c0a43ccaa46aecfa
          test "$(git rev-parse HEAD^{tree})" = 598eab7cbaad60f6ec10533408aeafbc81da452d
          git diff --exit-code

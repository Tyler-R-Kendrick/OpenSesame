name: Ed25519 audit strict clippy
on:
  push:
    branches: [review/ed25519-2258-clippy-proof-b400-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/ed25519-2258-clippy-proof-b400-20261030' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: b4008e3b87444f3eb904be67aeddcdf4764c3754
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b4008e3b87444f3eb904be67aeddcdf4764c3754
          test "$(git rev-parse HEAD^{tree})" = 7fac5f1b8492047977b53ea488f33cc6325651af
          test "$(git rev-parse HEAD^)" = 802582def874d4bb09e4cd22a098656b29fbc93c
      - name: Strict audit Clippy
        run: >-
          cargo +1.88.0 clippy --locked -p opensesame-audit --all-targets --all-features --
          -D warnings -D clippy::pedantic -D clippy::cognitive_complexity
          -D clippy::excessive_nesting -D clippy::too_many_lines
          -D clippy::too_many_arguments -D clippy::type_complexity
      - name: Audit signing tests
        run: cargo +1.88.0 test --locked -p opensesame-audit --lib
      - name: Rust format and clean source
        run: |
          set -euo pipefail
          rustfmt +1.88.0 --edition 2021 --check crates/audit/src/tests.rs
          git diff --exit-code
          git diff --cached --exit-code

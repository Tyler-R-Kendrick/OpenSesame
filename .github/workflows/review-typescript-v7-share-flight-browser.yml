name: Review TypeScript 7 wallet browser compatibility
on:
  push:
    branches: [review/typescript-v7-share-flight-browser-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-share-flight-browser-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 8fa087739215ddc5ec8c5a9c3c256b25cf057097
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact source candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 0a480754888b1af92baf50a45ab285873413775a
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify no-copy share views in Chromium
        run: |
          set -euo pipefail
          trap 'rm -f review-share-flight-browser.cjs' EXIT
          printf '%s' '' | base64 -d > review-share-flight-browser.cjs
          node review-share-flight-browser.cjs
      - name: Confirm source tree unchanged
        if: always()
        run: git diff --exit-code

name: Stage reviewed PWA restack with GitHub signatures
run-name: Signed staging only dc597773b9cdf6ed
on:
  push:
    branches: ["work/pwa-restack-sign-dc597773b9cdf6ed-20261024"]
    paths: [".github/workflows/connector-restack-dc597773b9cdf6ed.yml"]
permissions: {}
concurrency:
  group: pwa-signed-restack-dc597773b9cdf6ed
  cancel-in-progress: false
jobs:
  staging:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.ref == 'refs/heads/work/pwa-restack-sign-dc597773b9cdf6ed-20261024' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Reconcile and independently prove isolated signed stages
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          """Actions-only isolated signing transport. Never promote topic/main refs."""
          import base64
          import copy
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import sys
          
          PLAN_SHA = 'dc597773b9cdf6ed9d5c84bbbc419768212d5801f73abc8203bf9f7199e1beb3'
          BASE = '5b8272b337fa7e4dc9b10568b5fdae16c043390c'
          FINAL_TREE = '8c450ebd9b19d3a42eb22b56327632c2cc2c3876'
          BOOTSTRAP_BRANCH = 'work/pwa-restack-sign-dc597773b9cdf6ed-20261024'
          PAYLOAD_PATH = '.github/connector-stack/restack-dc597773b9cdf6ed.json'
          PAYLOAD_SHA = '48f0a0b8274fc3802d7a7c2963fe5470da9eee988d7d208b8c9bc4a15b3b873c'
          PAYLOAD_OID = '99c927bae1b2f0e68bdd97ddcb7b08b29057182a'
          CANONICAL = {'signer': {'sha256': '4c7f5a1ecfc6bb5bc4db542ecef50872a5e0864863ce338ea145a725973b2b2a', 'base64': ''}, 'stages': {'sha256': 'deea71e882b92c59c6d655492c9268ac67b345b8be33c42d6ab6ed1865390f23', 'base64': ''}}
          
          OUTPUT = Path('connector-signed-checkpoints')
          OUTPUT.mkdir(mode=0o700, exist_ok=True)
          sys.dont_write_bytecode = True
          
          def need(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          def digest(content):
              return hashlib.sha256(content).hexdigest()
          
          def load_canonical(name):
              descriptor = CANONICAL[name]
              source = base64.b64decode(descriptor['base64'], validate=True)
              need(digest(source) == descriptor['sha256'], 'Canonical helper digest mismatch')
              path = Path(os.environ['RUNNER_TEMP']) / ('pwa-reviewed-' + name + '.py')
              with path.open('xb') as stream:
                  stream.write(source)
              spec = importlib.util.spec_from_file_location('reviewed_' + name, path)
              value = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(value)
              return value
          
          need(os.environ.get('GITHUB_REPOSITORY') == 'Tyler-R-Kendrick/OpenSesame', 'Wrong repository')
          need(os.environ.get('GITHUB_REF') == 'refs/heads/' + BOOTSTRAP_BRANCH, 'Wrong isolated bootstrap ref')
          need(os.environ.get('GITHUB_EVENT_NAME') == 'push', 'Only isolated bootstrap push allowed')
          source_commit = os.environ.get('PUBLISHER_SOURCE_COMMIT', '')
          need(re.fullmatch('[0-9a-f]{40}', source_commit), 'Exact workflow source commit required')
          p = load_canonical('signer')
          h = load_canonical('stages')
          PREFIX = 'connector-signed-stage/restack-' + PLAN_SHA[:16] + '/'
          REF_QUERY = 'query($qualifiedName:String!){repository(owner:"Tyler-R-Kendrick",name:"OpenSesame"){ref(qualifiedName:$qualifiedName){target{__typename oid}}}}'
          
          class RestRefView:
              """Run unchanged canonical optional/created-ref methods against real REST refs."""
              def __init__(self, api):
                  self.api = api
              def ref(self, branch):
                  return p.GitHub.ref(self.api, branch)
              def __getattr__(self, name):
                  return getattr(self.api, name)
          
          class IsolatedGitHub(p.GitHub):
              """Cache only exact immutable OIDs, preserving all canonical proof predicates."""
              def __init__(self, token):
                  super().__init__(token)
                  self.cache = {}
                  self.rates = {}
                  self.fresh_graphql_refs = 0
                  self.requests = 0
                  self.cache_hits = 0
          
              def call(self, method, path, data=None, limit=32_000_000):
                  root = '/repos/' + p.REPOSITORY + '/'
                  immutable = method == 'GET' and re.fullmatch(
                      re.escape(root) + r'(?:git/(?:blobs|commits)/[0-9a-f]{40}|commits/[0-9a-f]{40}\?per_page=300&page=[1-9][0-9]*)', path)
                  if immutable and path in self.cache:
                      self.cache_hits += 1
                      return copy.deepcopy(self.cache[path])
                  if method != 'GET':
                      if path == '/graphql':
                          need(method == 'POST', 'GraphQL method refused')
                          if data.get('query') == REF_QUERY:
                              qualified = data['variables']['qualifiedName']
                              need(qualified == 'refs/heads/main' or qualified.startswith('refs/heads/' + PREFIX),
                                   'Fresh GraphQL ref-read scope refused')
                          else:
                              need(data.get('query') == p.MUTATION, 'Only exact ref query or canonical createCommitOnBranch allowed')
                              item = data['variables']['input']
                              need(item['branch']['repositoryNameWithOwner'] == p.REPOSITORY
                                   and item['branch']['branchName'].startswith(PREFIX), 'GraphQL staging scope refused')
                      else:
                          need(method == 'POST' and path == root + 'git/refs'
                               and data['ref'].startswith('refs/heads/' + PREFIX), 'Only isolated stage creation allowed')
                  resource = 'graphql' if path == '/graphql' else 'core'
                  rate = self.rates.get(resource)
                  need(rate is None or rate['remaining'] > 1, 'Actual GitHub ' + resource + ' quota exhausted; inspect preserved journal before a reconciled retry')
                  result, headers = super().call(method, path, data, limit)
                  self.requests += 1
                  reported_resource = headers.get('X-RateLimit-Resource')
                  if reported_resource in ('core', 'graphql'):
                      self.rates[reported_resource] = {key: int(headers['X-RateLimit-' + key.title()])
                          for key in ('remaining', 'limit', 'reset')}
                  # HTTPMessage preserves the canonical case-insensitive Link/header semantics.
                  answer = (result, headers)
                  if immutable:
                      self.cache[path] = copy.deepcopy(answer)
                      # Keep actual signature inputs for exact signed-object import, never credentials.
                      relative = path.removeprefix(root)
                      if relative.startswith('git/commits/') or relative.startswith('commits/'):
                          name = ('git-' if relative.startswith('git/') else 'rest-') + relative.split('/')[2 if relative.startswith('git/') else 1].split('?')[0]
                          if relative.startswith('commits/'):
                              name += '-page-' + relative.rsplit('page=', 1)[1]
                          h.write_new(OUTPUT / (name + '.json'), result)
                  return answer
          
              def ref(self, branch):
                  need(branch == 'main' or branch.startswith(PREFIX), 'Fresh ref-read scope refused')
                  result, _ = self.call('POST', '/graphql', {'query': REF_QUERY,
                      'variables': {'qualifiedName': 'refs/heads/' + branch}})
                  need(not result.get('errors'), 'GraphQL fresh ref read rejected')
                  repository = result.get('data', {}).get('repository')
                  need(isinstance(repository, dict), 'Fresh ref repository unavailable')
                  ref = repository.get('ref')
                  need(isinstance(ref, dict), 'Fresh exact qualified ref unavailable')
                  target = ref.get('target')
                  need(isinstance(target, dict) and target.get('__typename') == 'Commit'
                       and isinstance(target.get('oid'), str) and p.SHA1.fullmatch(target['oid']), 'Fresh ref target is not a valid commit')
                  self.fresh_graphql_refs += 1
                  return target['oid']
          
              def optional_stage_ref(self, branch):
                  return p.GitHub.optional_stage_ref(RestRefView(self), branch)
          
              def created_ref(self, branch, parent):
                  return p.GitHub.created_ref(RestRefView(self), branch, parent)
          
          token = os.environ.get('GH_TOKEN', '')
          need(bool(token), 'Actions-scoped token required')
          api = IsolatedGitHub(token)
          file, _ = api.get('contents/' + PAYLOAD_PATH + '?ref=' + source_commit)
          need(file.get('type') == 'file' and file.get('encoding') == 'base64' and file.get('sha') == PAYLOAD_OID,
               'Frozen bootstrap payload file mismatch')
          content = base64.b64decode(file['content'].replace('\n', ''), validate=True)
          need(digest(content) == PAYLOAD_SHA and p.git_blob_oid(content) == PAYLOAD_OID, 'Payload digest/OID mismatch')
          plan = json.loads(content)
          need(plan['schemaVersion'] == 1 and plan['repository'] == p.REPOSITORY and plan['planSha256'] == PLAN_SHA,
               'Frozen plan projection differs')
          need(plan['newBase'] == BASE and plan['expectedTree'] == FINAL_TREE and len(plan['rows']) == 96,
               'Reviewed source interval differs')
          need(plan['rows'][0]['pr'] == 1993 and plan['rows'][-1]['pr'] == 2109
               and plan['upstreamUntouchedEveryStage'] == 7 and len(plan['blobs']) == 291, 'Frozen inventory differs')
          prior = plan['mainTree']
          used = set()
          prs = set()
          branches = set()
          for row in plan['rows']:
              need(type(row['pr']) is int and row['pr'] not in prs and row['branch'] not in branches
                   and row['branch'] != 'main' and not row['branch'].startswith(PREFIX), 'Duplicate/out-of-scope source slice')
              prs.add(row['pr'])
              branches.add(row['branch'])
              need(row['parentTree'] == prior and row['changes'], 'Tree chain/empty slice mismatch')
              for field in ('oldHead', 'oldParent', 'parentTree', 'resultTree'):
                  need(p.SHA1.fullmatch(row[field]), 'Malformed immutable object identifier')
              paths = set()
              for change in row['changes']:
                  path = change['path']
                  need(type(path) is str and path and not path.startswith('/') and '\\' not in path
                       and all(part not in ('', '.', '..', '.git') for part in path.split('/')) and path not in paths,
                       'Invalid/duplicate changed path')
                  paths.add(path)
                  need(change['status'] in ('A', 'M') and change['mode'] in ('100644', '100755'), 'Unsupported reviewed mode/status')
                  need(p.SHA1.fullmatch(change['blobOid']), 'Invalid blob OID')
                  descriptor = plan['blobs'][change['blobOid']]
                  need(set(descriptor) == {'bytes', 'sha256'} and descriptor['bytes'] == change['bytes']
                       and descriptor['sha256'] == change['postimageSha256'] and type(descriptor['bytes']) is int
                       and 0 <= descriptor['bytes'] <= 2_000_000 and p.SHA256.fullmatch(descriptor['sha256']), 'Blob descriptor differs')
                  used.add(change['blobOid'])
              prior = row['resultTree']
          need(prior == FINAL_TREE and used == set(plan['blobs']), 'Incomplete frozen source projection')
          need(api.ref('main') == BASE, 'Pinned main lease changed')
          blobs = p.load_blobs(api, plan)
          
          def checked_files(row):
              result = {}
              for change in row['changes']:
                  oid = change['blobOid']
                  body = base64.b64decode(blobs[oid], validate=True)
                  p.check_blob(oid, plan['blobs'][oid], body)
                  result[oid] = blobs[oid]
              return result
          
          h.checked_files = checked_files
          original_git_commit = h.git_commit
          
          def signed_git_commit(api, oid, parent=None, tree=None):
              proof = original_git_commit(api, oid, parent, tree)
              commit, _ = api.get('git/commits/' + oid)
              need(commit['committer']['name'] == 'GitHub' and commit['committer']['email'] == 'noreply@github.com',
                   'GitHub signer/committer required')
              return proof
          
          h.git_commit = signed_git_commit
          h.write_new(OUTPUT / 'actions-staging-scope.json', {
              'planSHA256': PLAN_SHA, 'payloadSHA256': PAYLOAD_SHA, 'payloadBlobOid': PAYLOAD_OID,
              'workflowSourceCommit': source_commit, 'canonicalSources': {k: v['sha256'] for k, v in CANONICAL.items()},
              'runId': os.environ.get('GITHUB_RUN_ID'), 'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'proofFreshness': 'Only immutable exact-OID GET bodies memoized in this run; original proof predicates rerun; mutable main/stage refs never cached. Ref current-head reads use exact GraphQL repository.ref; original optional/created-ref REST reconciliation preserved',
              'promotionExcluded': 'No topic/main mutation; separate connector promoter requires fresh exact PR metadata/reviews and branch leases',
          })
          h.journal(OUTPUT, 'all-frozen-blobs-verified', {'count': len(blobs), 'main': BASE, 'sourceCommit': source_commit})
          proofs = h.stages(api, p, plan, PLAN_SHA, OUTPUT, create=True)
          need(len(proofs) == 96 and proofs[-1]['tree'] == FINAL_TREE and api.ref('main') == BASE, 'Final staged interval/main differs')
          receipt = {'planSHA256': PLAN_SHA, 'proofs': proofs, 'finalCommit': proofs[-1]['commit'], 'finalTree': FINAL_TREE,
              'topicRefsChanged': False, 'mainChanged': False,
              'promotion': 'Separate root execution through leased connector REST updates; never atomic updateRefs'}
          h.write_new(OUTPUT / 'staged-receipt.json', receipt)
          h.write_new(OUTPUT / 'transport-counters.json', {'requests': api.requests, 'immutableCacheHits': api.cache_hits,
              'immutableBodies': len(api.cache), 'freshGraphqlRefReads': api.fresh_graphql_refs, 'actualRateLimits': api.rates,
              'sourceCommit': source_commit, 'originalStrictStagePredicatesPreserved': True})
          print(json.dumps({'stages': len(proofs), 'finalCommit': receipt['finalCommit'], 'finalTree': FINAL_TREE,
              'topicRefsChanged': False, 'mainChanged': False}), flush=True)
      - name: Preserve complete or interrupted staging proofs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pwa-restack-stages-dc597773b9cdf6ed
          path: connector-signed-checkpoints/
          if-no-files-found: error
          retention-days: 30

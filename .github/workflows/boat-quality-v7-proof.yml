name: Boat security and structural quality proof
on:
  push:
    branches: [review/boat-quality-v7-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/boat-quality-v7-proof-20261029' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: d68cc3c75ebf43224e339f2d1448afadd671bedc
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d68cc3c75ebf43224e339f2d1448afadd671bedc
          test "$(git rev-parse HEAD^{tree})" = 6400049687022ccfe17e4a1a1756605e1b021b5e
          test "$(git rev-parse HEAD^)" = 391ea89488958f572d1913bcbd812cc670a8a87a
          git diff --exit-code
          git diff --cached --exit-code
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Strict changed-file lint and repository structure
        run: |
          set -euo pipefail
          pnpm exec biome check packages/agent-sandboxes/e2e/boat.spec.ts packages/agent-sandboxes/src/boat-client.ts packages/agent-sandboxes/src/boat-endpoints.ts
          pnpm lint:anti-slop:files packages/agent-sandboxes/e2e/boat.spec.ts packages/agent-sandboxes/src/boat-client.ts packages/agent-sandboxes/src/boat-endpoints.ts
          pnpm quality:gate
      - name: Package typecheck and unit tests
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/agent-sandboxes typecheck
          pnpm --filter @opensesame/agent-sandboxes test
      - name: Real browser Boat flow
        run: |
          set -euo pipefail
          test -x /usr/bin/google-chrome
          cd packages/cua-password-reset
          AGENT_BROWSER="$(realpath node_modules/.bin/agent-browser)"
          export AGENT_BROWSER AGENT_BROWSER_CHROME=/usr/bin/google-chrome
          cd ../agent-sandboxes
          pnpm exec playwright test e2e/boat.spec.ts
      - name: Verify source unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 6400049687022ccfe17e4a1a1756605e1b021b5e
          git diff --exit-code
          git diff --cached --exit-code

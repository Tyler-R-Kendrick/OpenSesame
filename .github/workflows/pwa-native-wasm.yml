name: PWA native WASM cold validation

# This build-only workflow never deploys or supplies an application backend.
# A reviewed owner push to this explicit branch also works before the new
# workflow has reached the default branch's manual-dispatch registry.
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact signed commit at the selected same-repository branch
        required: true
        type: string
  push:
    branches: ['ci/pwa-native-wasm-*']

permissions:
  contents: read

concurrency:
  group: pwa-native-wasm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-wasm:
    if: github.actor == github.repository_owner && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      REQUESTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact signed branch source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$REQUESTED_HEAD" = "$EXPECTED_HEAD"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/release/check-merge-group-signature.mjs "$GITHUB_REPOSITORY" "$EXPECTED_HEAD"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify all four original native phases
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/pwa-native-wasm-logs"
          df -h . | tee "$RUNNER_TEMP/pwa-native-wasm-logs/disk.log"
          free -h | tee "$RUNNER_TEMP/pwa-native-wasm-logs/memory.log"
          timeout --signal=TERM --kill-after=10s 900s node scripts/ci-native-wasm.mjs 2>&1 | tee "$RUNNER_TEMP/pwa-native-wasm-logs/validation.log"
      - name: Retain exact source, raw phases, emitted assets and failure logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pwa-native-wasm-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pwa-native-wasm-logs
            .cache/pwa-tailscale-native-http/ci-evidence
            .cache/pwa-tailscale-native-http/work/*/*.log
            .cache/pwa-tailscale-native-http/work/*/build/logs

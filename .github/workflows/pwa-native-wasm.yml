name: PWA native WASM cold validation

# This build-only workflow never deploys or supplies an application backend.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pwa-native-wasm-${{ github.run_id }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  native-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify exact signed branch source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/release/check-merge-group-signature.mjs "$GITHUB_REPOSITORY" "$EXPECTED_HEAD"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify all four original native phases
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/pwa-native-wasm-logs"
          df -h . | tee "$RUNNER_TEMP/pwa-native-wasm-logs/disk.log"
          free -h | tee "$RUNNER_TEMP/pwa-native-wasm-logs/memory.log"
          timeout --signal=TERM --kill-after=10s 900s node scripts/ci-native-wasm.mjs 2>&1 | tee "$RUNNER_TEMP/pwa-native-wasm-logs/validation.log"
      - name: Retain exact source, raw phases, emitted assets and failure logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pwa-native-wasm-${{ inputs.source_sha }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pwa-native-wasm-logs
            .cache/pwa-tailscale-native-http/ci-evidence
            .cache/pwa-tailscale-native-http/work/*/*.log
            .cache/pwa-tailscale-native-http/work/*/build/logs

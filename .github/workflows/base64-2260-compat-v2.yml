name: Base64 workspace and fuzz compatibility
on:
  push:
    branches: [review/base64-2260-compat-v2-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/base64-2260-compat-v2-20261030' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: b081ec068b0ca38df0af13bf9014ca54c588df2d
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - name: Verify immutable candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b081ec068b0ca38df0af13bf9014ca54c588df2d
          test "$(git rev-parse HEAD^{tree})" = a9f8e6cc509ec135cc96ef8b8f6efda76f265e15
          test "$(git rev-parse HEAD^)" = 2d37a054c1f060d2e6d05084df8ecea17ddc82cb
      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config clang
      - name: Check all workspace targets with locked graph
        if: matrix.suite == 'workspace'
        run: cargo +1.88.0 check --locked --workspace --all-targets
      - name: Test security-sensitive base64 consumers
        if: matrix.suite == 'workspace'
        run: cargo +1.88.0 test --locked -p opensesame-a2h -p opensesame-proof -p opensesame-human-vault --lib
      - name: Check fuzz targets with their locked graph
        if: matrix.suite == 'fuzz'
        run: cargo +1.88.0 check --locked --manifest-path tests/fuzz/cargo/Cargo.toml --bins
      - name: Check source remains unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = a9f8e6cc509ec135cc96ef8b8f6efda76f265e15
          git diff --exit-code
          git diff --cached --exit-code

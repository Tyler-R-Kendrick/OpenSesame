name: Verify live route draft preservation
on:
  push:
    branches: [review/live-draft-race-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'Tyler-R-Kendrick/OpenSesame' &&
      github.actor_id == '145080887' &&
      github.ref == 'refs/heads/review/live-draft-race-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: b7f7a85a6bcc25870dc8f115ef7f9a876946b3c0
    steps:
      - name: Check out exact baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Check out reviewed tests and patch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: work/draft-evidence
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and reviewed test bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object apps/pages/src/modules/sharing.live/LiveRoutesPanel.test.tsx)" = 4dc12a0dce746d10321291d81315910ca174a9ae
          test "$(git hash-object apps/pages/src/modules/sharing.live/LiveRoutesPanel.tsx)" = f1de978d25292bd3223649823365302bb68d29af
          test "$(git hash-object apps/pages/src/modules/sharing.live/LiveCarriers.tsx)" = 422ce876cd6391ee1ecf2d421543cca319da09f5
          test "$(git hash-object apps/pages/src/modules/sharing.live/live-route-parts.tsx)" = 8cd433cdadcac47673b3586b5493a44974e87338
          cd work/draft-evidence/scripts/review/live-draft
          printf '%s  %s\n' \
            12e67da99ad09540a96e16a1994c2bb5bc33fb838eff9de0be80a2ecabf8844f LiveRoutesDraftRace.test.tsx \
            a1beda393c1af531790fb9f1b058d4fe104810491ce13b0d142defe526be9b3d LiveRouteCredentialRace.test.tsx \
            12fac778a23291d2fec3c3204404242d3462e726601b2731fe5380b51e1e4e6d LiveRouteRefusalRace.test.tsx \
            7aabdbc44bd595e085c50150dd1915efbf8edc0fbf40f3366562eff19aa0d50e live-route-race.test-support.ts \
            3474ba62f3b15f0e6e70a520971eb2700fe8cca4cb6a47685e7d24301bd4aac7 LiveRoutesPanel.tsx \
            bd44e828f338331b416e37326c46ece8717087925145da9cd25b1a55dce8f6dd LiveCarriers.tsx \
            777d19d1be4fafa6304328b0daed0ff3266a71ed62e4ac221654fc5ec907288f live-route-parts.tsx | sha256sum --check
      - name: Reproduce lost drafts on the exact baseline
        shell: bash
        run: |
          set -euo pipefail
          cp work/draft-evidence/scripts/review/live-draft/LiveRoutesDraftRace.test.tsx apps/pages/src/modules/sharing.live/LiveRoutesDraftRace.test.tsx
          cp work/draft-evidence/scripts/review/live-draft/LiveRouteCredentialRace.test.tsx apps/pages/src/modules/sharing.live/LiveRouteCredentialRace.test.tsx
          cp work/draft-evidence/scripts/review/live-draft/LiveRouteRefusalRace.test.tsx apps/pages/src/modules/sharing.live/LiveRouteRefusalRace.test.tsx
          cp work/draft-evidence/scripts/review/live-draft/live-route-race.test-support.ts apps/pages/src/modules/sharing.live/live-route-race.test-support.ts
          mkdir -p "$RUNNER_TEMP/live-draft-evidence"
          set +e
          pnpm --filter @opensesame/pages exec vitest run src/modules/sharing.live/LiveRoutesDraftRace.test.tsx \
            --testNamePattern 'keeps (a newer address typed|newer TURN server and credentials|a newer carrier draft)' \
            --reporter=json --outputFile "$RUNNER_TEMP/live-draft-evidence/before.json"
          result=$?
          set -e
          test "$result" = 1
          node work/draft-evidence/scripts/review/live-draft/check-results.mjs "$RUNNER_TEMP/live-draft-evidence/before.json" before
      - name: Test the same three cases with the reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          cp work/draft-evidence/scripts/review/live-draft/LiveRoutesPanel.tsx apps/pages/src/modules/sharing.live/LiveRoutesPanel.tsx
          cp work/draft-evidence/scripts/review/live-draft/LiveCarriers.tsx apps/pages/src/modules/sharing.live/LiveCarriers.tsx
          cp work/draft-evidence/scripts/review/live-draft/live-route-parts.tsx apps/pages/src/modules/sharing.live/live-route-parts.tsx
          pnpm --filter @opensesame/pages exec vitest run src/modules/sharing.live/LiveRoutesDraftRace.test.tsx \
            --testNamePattern 'keeps (a newer address typed|newer TURN server and credentials|a newer carrier draft)' \
            --reporter=json --outputFile "$RUNNER_TEMP/live-draft-evidence/after.json"
          node work/draft-evidence/scripts/review/live-draft/check-results.mjs "$RUNNER_TEMP/live-draft-evidence/after.json" after
      - name: Run complete related form suites
        run: >-
          pnpm --filter @opensesame/pages exec vitest run
          src/modules/sharing.live/LiveRoutesPanel.test.tsx
          src/modules/sharing.live/LiveRoutesDraftRace.test.tsx
          src/modules/sharing.live/LiveRouteCredentialRace.test.tsx
          src/modules/sharing.live/LiveRouteRefusalRace.test.tsx
          src/modules/sharing.live/LiveRoutes.test.tsx
          src/modules/sharing.live/LiveNatsRoutes.test.tsx
      - name: Typecheck Pages
        run: pnpm --filter @opensesame/pages typecheck
      - name: Run full-config targeted lint and repository footprint gate
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/pages/src/modules/sharing.live/LiveCarriers.tsx
            apps/pages/src/modules/sharing.live/LiveRoutesPanel.tsx
            apps/pages/src/modules/sharing.live/live-route-parts.tsx
            apps/pages/src/modules/sharing.live/LiveRoutesDraftRace.test.tsx
            apps/pages/src/modules/sharing.live/LiveRouteCredentialRace.test.tsx
            apps/pages/src/modules/sharing.live/LiveRouteRefusalRace.test.tsx
            apps/pages/src/modules/sharing.live/live-route-race.test-support.ts
          )
          pnpm exec biome check "${files[@]}"
          pnpm lint:anti-slop:files "${files[@]}"
          node scripts/quality/repository-size-gate.mjs
      - name: Keep the before and after test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: live-draft-before-after
          path: ${{ runner.temp }}/live-draft-evidence
          if-no-files-found: error

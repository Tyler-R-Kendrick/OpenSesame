name: Scanner policy proof
on:
  push:
    branches: [review/scanner-policy-hosted-20261028]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.ref == 'refs/heads/review/scanner-policy-hosted-20261028' && github.event_name == 'push' && github.actor_id == '145080887' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: 056f19f3cdf9cdea6ce24cb8ecf9551351293c0a
      SOURCE_TREE: 95e87d35d3b33374f9194875151bec1e2a3e75eb
      SOURCE_PARENT: be91866333d56870a58ce903d4fe885566eab82d
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify candidate compatibility behavior
        run: node --test scripts/release/candidate-policy-scanner.test.mjs scripts/release/candidate-service.test.mjs
      - name: Check scanner policy lint
        run: |
          set -euo pipefail
          pnpm exec biome check scripts/release/lib/candidate-api.mjs scripts/release/candidate-policy-scanner.test.mjs
          pnpm lint:anti-slop:files scripts/release/lib/candidate-api.mjs scripts/release/candidate-policy-scanner.test.mjs
      - name: Run complete promotion tests and structural gate
        run: |
          set -euo pipefail
          pnpm test:ci-promotion
          pnpm quality:gate
      - name: Verify source remains unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

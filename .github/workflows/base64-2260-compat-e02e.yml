name: Base64 workspace and fuzz compatibility
on:
  push:
    branches: [review/base64-2260-compat-e02e-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/base64-2260-compat-e02e-20261030' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e02e05989c496b37560bb4fa5ba11ca934218599
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - name: Verify immutable candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e02e05989c496b37560bb4fa5ba11ca934218599
          test "$(git rev-parse HEAD^{tree})" = 573c65ffe607dfe3798c0c3685601dce4bbf8143
          test "$(git rev-parse HEAD^)" = fa76ad0bda3ea66c2257e0c9f912446c49ebdfe0
          test "$(git rev-parse HEAD^2)" = 1086235eb789c0baa49dc3fe0a51e1487cf18fe5
      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config clang
      - name: Check all workspace targets with locked graph
        if: matrix.suite == 'workspace'
        run: cargo +1.88.0 check --locked --workspace --all-targets
      - name: Test security-sensitive base64 consumers
        if: matrix.suite == 'workspace'
        run: cargo +1.88.0 test --locked -p opensesame-a2h -p opensesame-proof -p opensesame-human-vault --lib
      - name: Check fuzz targets with their locked graph
        if: matrix.suite == 'fuzz'
        run: cargo +1.88.0 check --locked --manifest-path tests/fuzz/cargo/Cargo.toml --bins
      - name: Check source remains unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 573c65ffe607dfe3798c0c3685601dce4bbf8143
          git diff --exit-code
          git diff --cached --exit-code

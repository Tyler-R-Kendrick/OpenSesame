name: CodeQL policy after CI change proof
on:
  push:
    branches: [review/codeql-policy-2d8-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/codeql-policy-2d8-proof-20261029' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 0a4cf6ad1aaf1c68416b6c1573d0bfc3ebe6b9ac
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify immutable candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0a4cf6ad1aaf1c68416b6c1573d0bfc3ebe6b9ac
          test "$(git rev-parse HEAD^{tree})" = 77e1b0e07fd5399b8eb7c1193fc02c46abd11ea6
          test "$(git rev-parse HEAD^)" = 2d8ad2307d3a2b535f6b09a37d35aee7c08ba8b1
          git diff --exit-code
          git diff --cached --exit-code
      - name: Install frozen graph
        run: pnpm install --frozen-lockfile
      - name: Test CodeQL review, scanner-policy and release selection
        run: |
          set -euo pipefail
          node --check scripts/release/lib/candidate-api.mjs
          node --test scripts/release/check-codeql-artifacts.test.mjs scripts/release/check-codeql-sarif.test.mjs scripts/release/candidate-policy-scanner.test.mjs scripts/release/candidate-service.test.mjs scripts/release/candidate-selection.test.mjs
      - name: Test CI release and delivery contracts
        run: pnpm exec vitest run scripts/lib/ci-cd-triggers.test.mjs scripts/lib/ci-full-run.test.mjs scripts/lib/ci-release-qualification.test.mjs
      - name: Check selected real policy files and modes
        shell: bash
        run: |
          set -euo pipefail
          git ls-tree -r -z HEAD > "$RUNNER_TEMP/source-tree.bin"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { policyEntriesForTree } from './scripts/release/lib/candidate-api.mjs';
          const entries = readFileSync(process.env.RUNNER_TEMP + '/source-tree.bin', 'utf8').split('\0').filter(Boolean).map((item) => {
            const tab = item.indexOf('\t');
            return [item.slice(tab + 1), item.slice(0, tab).split(' ')[0]];
          });
          const selected = policyEntriesForTree(new Map(entries));
          if (selected.some(([, mode]) => mode !== '100644' && mode !== '100755')) throw new Error('Unexpected non-regular policy entry');
          for (const name of ['tools/pwa-tailscale-native-http/source.json', 'apps/android/android/app/build.gradle.kts', 'apps/android/scripts/build-core.sh', 'packages/app-core/scripts/sops-oracle/oracle.mjs', 'scripts/lib/ci-affected-builds.mjs', 'scripts/lib/ci-affected-graph.mjs']) {
            if (!selected.some(([path]) => path === name)) throw new Error(`Missing expected policy input: ${name}`);
          }
          console.log(`Checked ${selected.length} policy paths`);
          NODE
      - name: Run repository structural quality gate
        run: pnpm quality:gate
      - name: Verify source remains unchanged
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 77e1b0e07fd5399b8eb7c1193fc02c46abd11ea6
          git diff --exit-code
          git diff --cached --exit-code

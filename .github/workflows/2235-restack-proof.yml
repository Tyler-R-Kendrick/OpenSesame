name: Review sandbox relay and virtual network
on:
  push:
    branches: [review/2235-restack-6cf-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/2235-restack-6cf-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout review controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: controller
          persist-credentials: false
      - name: Checkout exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 6cfed7f946f3398d6f6d4b807ec53bb9a8ba866e
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify exact source and proposed patch
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6cfed7f946f3398d6f6d4b807ec53bb9a8ba866e
          test "$(git rev-parse HEAD^{tree})" = b672f264a4558e6fa8bc88013467f59354f6fdb7
          printf '%s  %s\n' 2d2564c312ca272930793056908a043118319b1e894fcd982d910d92ff5206c2 ../controller/.github/verify-inputs/2235-combined-security.patch | sha256sum --check
          git apply --index ../controller/.github/verify-inputs/2235-combined-security.patch
          test "$(git write-tree)" = 7ea2fae0e02a7c8a5b2d065e9e949960632597d5
          git diff --exit-code
      - name: Install frozen dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck and unit tests
        working-directory: candidate
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/agent-sandboxes typecheck
          pnpm --filter @opensesame/agent-sandboxes test
      - name: Real browser end-to-end suite
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          test -x "$AGENT_BROWSER_CHROME"
          export AGENT_BROWSER="$PWD/packages/cua-password-reset/node_modules/.bin/agent-browser"
          test -x "$AGENT_BROWSER"
          pnpm --filter @opensesame/agent-sandboxes test:e2e
      - name: Full quality gate
        if: success() || failure()
        working-directory: candidate
        run: pnpm quality:gate
      - name: Verify source after tests
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6cfed7f946f3398d6f6d4b807ec53bb9a8ba866e
          test "$(git write-tree)" = 7ea2fae0e02a7c8a5b2d065e9e949960632597d5
          git diff --exit-code

name: Final stack v8 ordinary UI verification
on:
  push:
    branches: [review/final-ui-v8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    if: >-
      github.repository == 'Tyler-R-Kendrick/OpenSesame' &&
      github.actor_id == '145080887' &&
      github.ref == 'refs/heads/review/final-ui-v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        phase: [after]
    env:
      AFTER_SHA: b115add6f1645cf0f2d6a125d1ab6b3e3822c6f1
      EVIDENCE_DIR: ${{ github.workspace }}/work/review-output/final-ui-v8-${{ matrix.phase }}
      OPENSESAME_CAPABILITY_PROFILE: capability-profiles/rich-explicit.json
      VITE_BASE: /OpenSesame/
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.AFTER_SHA }}
          persist-credentials: false
      - name: Check out transient capture tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: work/evidence-tools
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Reuse normal CI pinned native distribution cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build real rich distribution and capture provenance
        shell: bash
        env:
          PHASE: ${{ matrix.phase }}
          TOOLING_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          export SOURCE_SHA="$(git rev-parse HEAD)"
          node -e 'const e=process.env; const expected=e.AFTER_SHA; if(e.SOURCE_SHA!==expected)throw Error("source mismatch"); require("node:fs").writeFileSync(e.EVIDENCE_DIR+"/provenance.json",JSON.stringify({source:e.SOURCE_SHA,tooling:e.TOOLING_SHA,profile:"rich-explicit",mode:"selective",state:"front door, PIN lock, gate Support, unlocked Support",approval:"unapproved review artifact"},null,2));'
          sha256sum pnpm-lock.yaml package.json apps/pages/package.json > "$EVIDENCE_DIR/dependency-fingerprints.txt"
          node --version > "$EVIDENCE_DIR/node-version.txt"
          pnpm --version > "$EVIDENCE_DIR/pnpm-version.txt"
          "$PLAYWRIGHT_CHROMIUM" --version > "$EVIDENCE_DIR/browser-version.txt"
          set -o pipefail
          pnpm --filter @opensesame/pages build 2>&1 | tee "$EVIDENCE_DIR/build.log"
          git diff --exit-code
      - name: Capture project navigation at phone and desktop widths
        env:
          PHASE: ${{ matrix.phase }}
        run: >-
          node work/evidence-tools/scripts/review/project-navigation-evidence.mjs
          "$PHASE" "$GITHUB_WORKSPACE" "$EVIDENCE_DIR"
      - name: Verify keyboard contract on the new source
        env:
          PAGES_VERIFY_OUT: ${{ env.EVIDENCE_DIR }}/keyboard
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @opensesame/pages verify:keyboard 2>&1 | tee "$EVIDENCE_DIR/keyboard.log"
      - name: Verify full mobile contract on the new source
        env:
          PAGES_VERIFY_OUT: ${{ env.EVIDENCE_DIR }}/mobile
        shell: bash
        run: |
          test -z "${MOBILE_SIZES:-}"
          set -o pipefail
          pnpm --filter @opensesame/pages verify:mobile 2>&1 | tee "$EVIDENCE_DIR/mobile.log"
      - name: Upload review screenshots and measured geometry
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: final-ui-v8-${{ matrix.phase }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 14
          if-no-files-found: error

name: Review TypeScript 7 quorum and portable drop byte ownership
on:
  push:
    branches: [review/typescript-v7-quorum-format-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-quorum-format-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 33fea6394ecd2d20d14fe10e6bf47ba243a6d6fc
          fetch-depth: 3
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 82cbcdb14138b78794af1a2c3e09adf5d7116a8b
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record original compiler errors
        run: |
          set -euo pipefail
          files=(packages/app-core/src/lib/quorum/slip39/cipher.ts packages/app-core/src/lib/vault/portable-drop-crypto.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^^:$f" > "$f"; done
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-original.log 2>&1; then exit 1; fi
          grep -E '(slip39/cipher|vault/portable-drop-crypto).ts.*error TS[0-9]+' /tmp/duress-original.log
      - name: Check exact TypeScript results
        run: |
          set -euo pipefail
          pnpm exec biome check packages/app-core/src/lib/quorum/slip39/cipher.ts packages/app-core/src/lib/vault/portable-drop-crypto.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-fixed.log 2>&1; then
            echo 'Pages typecheck passed.'
          else
            before=$(grep -cE 'error TS[0-9]+' /tmp/duress-original.log || true)
            after=$(grep -cE 'error TS[0-9]+' /tmp/duress-fixed.log || true)
            echo "Pages diagnostics before=$before after=$after; remaining errors block complete migration."
            grep -E 'error TS[0-9]+' /tmp/duress-fixed.log || true
            test "$after" -lt "$before"
          fi
      - name: Verify security and byte round trips
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/app-core exec vitest run src/lib/quorum/slip39/slip39.test.ts src/lib/vault/portable-drop.test.ts
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 82cbcdb14138b78794af1a2c3e09adf5d7116a8b
          git diff --exit-code

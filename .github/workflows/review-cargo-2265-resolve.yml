name: Rust 1.88 workspace update proof
on:
  push:
    branches: [review/cargo-2265-resolve-proof-20261030]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 28f1f1560f34ae1f7a9bf629b8156d88f8689733
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - name: Verify current-base transport compile and agent-hooks conformance
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          cargo check -p opensesame-transport-security --all-targets --locked
          cargo test -p opensesame-rotation-web --test agent_hooks_ctk --locked

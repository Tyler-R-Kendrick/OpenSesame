name: Review TypeScript 7 peer WebCrypto buffer validation
on:
  push:
    branches: [review/typescript-v7-detach-guard-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-detach-guard-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 444d4312422fdffb347da8ff796cc7b1f9d429df
          fetch-depth: 3
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = bda1e04830a8f1d5e1ed4159d360f47f3b86f5d5
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record original compiler errors
        run: |
          set -euo pipefail
          files=(packages/app-core/src/lib/peer-trust/webcrypto.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^^:$f" > "$f"; done
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-original.log 2>&1; then exit 1; fi
          grep -E 'peer-trust/webcrypto.ts.*error TS[0-9]+' /tmp/duress-original.log
      - name: Prove detached-view tests fail on the prior implementation
        run: |
          set -euo pipefail
          files=(packages/os-domain/src/buffer-source.ts packages/app-core/src/lib/peer-trust/webcrypto.ts packages/wallet-consent/src/verify.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^:$f" > "$f"; done
          if pnpm --filter @opensesame/os-domain exec vitest run src/__tests__/buffer-source.test.ts > /tmp/guard-original.log 2>&1; then cat /tmp/guard-original.log; exit 1; fi
          grep -E 'refuses a detached ArrayBuffer view' /tmp/guard-original.log
          if pnpm --filter @opensesame/app-core exec vitest run src/lib/peer-trust/webcrypto.test.ts > /tmp/peer-original.log 2>&1; then cat /tmp/peer-original.log; exit 1; fi
          grep -E 'refuses already-detached views|refuses a payload detached while' /tmp/peer-original.log
          if pnpm --filter @opensesame/wallet-consent exec vitest run src/verify.test.ts -t 'detached while WebCrypto verification is in flight' > /tmp/wallet-original.log 2>&1; then cat /tmp/wallet-original.log; exit 1; fi
          grep -E 'detached while WebCrypto verification is in flight' /tmp/wallet-original.log
      - name: Check exact TypeScript results
        run: |
          set -euo pipefail
          pnpm exec biome check packages/app-core/src/lib/peer-trust/webcrypto.ts packages/app-core/src/lib/peer-trust/webcrypto.test.ts packages/os-domain/src/buffer-source.ts packages/os-domain/src/__tests__/buffer-source.test.ts packages/os-domain/src/index.ts packages/os-domain/src/browser.ts packages/wallet-consent/src/verify.ts packages/wallet-consent/src/verify.test.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-fixed.log 2>&1; then
            echo 'Pages typecheck passed.'
          else
            before=$(grep -cE 'error TS[0-9]+' /tmp/duress-original.log || true)
            after=$(grep -cE 'error TS[0-9]+' /tmp/duress-fixed.log || true)
            echo "Pages diagnostics before=$before after=$after; remaining errors block complete migration."
            grep -E 'error TS[0-9]+' /tmp/duress-fixed.log || true
            test "$after" -lt "$before"
          fi
      - name: Verify security and byte round trips
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/os-domain exec vitest run src/__tests__/buffer-source.test.ts
          pnpm --filter @opensesame/wallet-consent exec vitest run src/verify.test.ts
          pnpm --filter @opensesame/app-core exec vitest run src/lib/peer-trust/webcrypto.test.ts src/lib/peer-trust/peer-trust.test.ts src/lib/peer-trust/handshake.test.ts
          pnpm quality:app-core
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = bda1e04830a8f1d5e1ed4159d360f47f3b86f5d5
          git diff --exit-code

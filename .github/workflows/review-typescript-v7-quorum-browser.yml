name: Review TypeScript 7 quorum browser compatibility
on:
  push:
    branches: [review/typescript-v7-quorum-browser-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-quorum-browser-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 20ecca427de4702c4e581e6644119eab28079483
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact source candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 91dd39014aa4a3aa8bbd909662389ddaf68a56fc
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Chromium WebAuthn with a CTAP2 virtual authenticator
        run: |
          set -euo pipefail
          trap 'rm -f review-quorum-browser.cjs' EXIT
          printf '%s' '' | base64 -d > review-quorum-browser.cjs
          node review-quorum-browser.cjs
      - name: Confirm source tree unchanged
        if: always()
        run: git diff --exit-code

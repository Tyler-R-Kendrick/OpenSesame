name: Review TypeScript 7 payment digest ownership
on:
  push:
    branches: [review/typescript-v7-spending-hosted-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-spending-hosted-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1514a1b77da91544e59d1dce6fefefb50ee33d54
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 820f2d03c718073922318ac564a8846da4732a2f
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Confirm original compiler diagnostic
        run: |
          set -euo pipefail
          trap 'git restore -- packages/app-core/src/lib/spending-consent.ts' EXIT
          git show HEAD^:packages/app-core/src/lib/spending-consent.ts > packages/app-core/src/lib/spending-consent.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/spending-original.log 2>&1; then
            echo 'Original Pages typecheck unexpectedly passed' >&2
            exit 1
          fi
          grep -E 'spending-consent.ts.*error TS[0-9]+' /tmp/spending-original.log
      - name: Confirm owned result removes that diagnostic
        run: |
          set -euo pipefail
          pnpm exec biome check packages/app-core/src/lib/spending-consent.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/spending-fixed.log 2>&1; then
            echo 'Pages typecheck passed; all other diagnostics also resolved.'
          else
            echo "Remaining Pages diagnostics: $(grep -cE 'error TS[0-9]+' /tmp/spending-fixed.log || true)"
            if grep -E 'spending-consent.ts.*error TS[0-9]+' /tmp/spending-fixed.log; then
              echo 'Payment digest diagnostic remains' >&2
              exit 1
            fi
            grep -qE 'error TS[0-9]+' /tmp/spending-fixed.log
          fi
      - name: Verify payment digest and approval behavior
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/app-core exec vitest run src/lib/spending-consent.test.ts src/lib/spending-leases.test.ts
          pnpm --filter @opensesame/wallet-consent test
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 820f2d03c718073922318ac564a8846da4732a2f
          git diff --exit-code

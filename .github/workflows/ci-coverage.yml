name: Candidate coverage
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  coverage:
    name: Coverage (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [typescript, rust]
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      DATABASE_URL: postgres://opensesame:opensesame@127.0.0.1:5432/postgres
      OPENSESAME_CLAIM_PEPPER: ci-pepper-ci-pepper-ci-pepper-ci-pepper
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: opensesame
          POSTGRES_PASSWORD: opensesame
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U opensesame"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: coverage-${{ matrix.suite }}
      - name: Prepare exact source and native dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
          echo "OPENSESAME_NODE=$(readlink -f "$(command -v node)")" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Prepare native PWA assets
        if: matrix.suite == 'typescript'
        run: >-
          node --input-type=module -e
          'import { loadTailscaleAssets } from "./apps/pages/scripts/tailscale-wasm-assets.mjs"; await loadTailscaleAssets();'
      - name: TypeScript coverage ratchets
        if: matrix.suite == 'typescript'
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          pnpm test:coverage:ts
      - name: Install pinned Rust coverage driver
        if: matrix.suite == 'rust'
        run: cargo +1.88.0 install cargo-llvm-cov --version 0.6.21 --locked
      - name: Rust coverage ratchets
        if: matrix.suite == 'rust'
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          mkdir -p coverage
          pnpm test:coverage:rust
          test -s coverage/rust-summary.json
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate-coverage-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error
          retention-days: 35

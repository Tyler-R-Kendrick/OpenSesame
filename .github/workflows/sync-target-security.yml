name: Sync target authorization

on:
  # These regressions qualify delivery; integration only builds affected code.
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-target-security-${{ inputs.source_sha && github.run_id || github.ref }}-${{ inputs.source_sha || 'direct' }}
  cancel-in-progress: ${{ !inputs.source_sha }}

jobs:
  authorization:
    name: Sync authorization regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Broker revocation, fan-out, fingerprint and retry tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/sync-target-security
          cargo test --locked -p opensesame-connection-broker --test sync_target_authority -- --nocapture 2>&1 | tee artifacts/sync-target-security/broker.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/sync-target-security/broker.log
      - name: Gateway route and materialization tests
        if: success() || failure()
        run: |
          set -euo pipefail
          mkdir -p artifacts/sync-target-security
          cargo test --locked -p opensesame-gateway routes::sync_targets -- --nocapture 2>&1 | tee artifacts/sync-target-security/gateway.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/sync-target-security/gateway.log
          grep -Fq 'background_outbox_retries_and_regrant_cannot_resurrect_revoked_authority ... ok' artifacts/sync-target-security/gateway.log
      - name: Connection broker compatibility tests
        if: success() || failure()
        run: |
          set -euo pipefail
          cargo test --locked -p opensesame-connection-broker 2>&1 | tee artifacts/sync-target-security/broker-suite.log
      - name: Canonical secret-config authorization tests
        if: success() || failure()
        run: |
          set -euo pipefail
          cargo test --locked -p opensesame-gateway routes::secret_config -- --nocapture 2>&1 | tee artifacts/sync-target-security/secret-config.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/sync-target-security/secret-config.log
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sync-target-security-results-${{ inputs.source_sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/sync-target-security/
          if-no-files-found: warn

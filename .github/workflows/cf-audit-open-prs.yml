name: Open Cloudflare audit draft PRs

# The session token can push branches but cannot open pull requests.
# This repository also forbids GitHub Actions from creating pull requests,
# so a push trigger only fails. Run this by hand after an admin enables
# "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    name: Open draft PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the opener
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Open the audit stack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Tyler-R-Kendrick/OpenSesame
        run: node .github/workflows/cf-audit-open-prs.mjs

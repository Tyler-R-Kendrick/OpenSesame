name: Open Cloudflare audit draft PRs

# One-shot helper. The session token can push branches but cannot open
# pull requests. This workflow uses the repository token, which can.
on:
  push:
    branches:
      - cursor/cf-audit-open-prs

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    name: Open draft PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the opener
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Open the audit stack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Tyler-R-Kendrick/OpenSesame
        run: node .github/workflows/cf-audit-open-prs.mjs

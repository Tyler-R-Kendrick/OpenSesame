name: Open Cloudflare audit draft PRs

# One-shot helper. The session token can push branches but cannot open
# pull requests. This workflow uses the repository token, which can.
on:
  push:
    branches:
      - cursor/cf-audit-open-prs

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    name: Open draft PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open the audit stack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Tyler-R-Kendrick/OpenSesame
        run: |
          set -euo pipefail
          create() {
            local base="$1" head="$2" title="$3" body="$4"
            local existing url
            existing=$(gh pr list --repo "$GH_REPO" --head "$head" --state open --json number,baseRefName \
              --jq "map(select(.baseRefName==\"${base}\")) | .[0].number // empty")
            if [ -n "$existing" ]; then
              echo "ALREADY #${existing} ${head} base ${base}" >&2
              echo "$existing"
              return
            fi
            url=$(gh pr create --repo "$GH_REPO" --draft --base "$base" --head "$head" --title "$title" --body "$body")
            echo "OPENED ${url}" >&2
            echo "${url##*/}"
          }

          art=$(create main cursor/cf-audit-run-1-artifacts \
            "Record Cloudflare security audit run 1" \
            "$(cat <<'BODY'
Cloudflare audit run 1 record. Docs only: the run report, findings, and needs-validation notes. No product code.

The eight fixes are a separate stack based on main.

Credit: Grok Build
BODY
)")

          token=$(create main cursor/cf-audit-token-endpoint \
            "Reject a storage-chosen federation token endpoint" \
            "$(cat <<BODY
Cloudflare audit run 1, finding app-core.federation.storage-selected-token-endpoint

Stack: 1/8, base main

Credit: Grok Build
BODY
)")

          ld=$(create cursor/cf-audit-token-endpoint cursor/cf-audit-ld-audit \
            "Reserve LD_AUDIT on the startup-hook denylist" \
            "$(cat <<BODY
Cloudflare audit run 1, finding packages/cli/startup-env-denylist-omits-ld-audit

Stack: 2/8, base #${token}

Credit: Grok Build
BODY
)")

          email=$(create cursor/cf-audit-ld-audit cursor/cf-audit-email-retarget \
            "Refuse a caller membership when verified email retargets the join" \
            "$(cat <<BODY
Cloudflare audit run 1, finding control-plane.org-join.email-retarget-membership

Stack: 3/8, base #${ld}

Credit: Grok Build
BODY
)")

          scim=$(create cursor/cf-audit-email-retarget cursor/cf-audit-scim-issuer \
            "Deprovision SCIM members under the directory issuer" \
            "$(cat <<BODY
Cloudflare audit run 1, finding control-plane.scim.principalsForSubject.omits-directory-issuer

Stack: 4/8, base #${email}

Credit: Grok Build
BODY
)")

          ipv4=$(create cursor/cf-audit-scim-issuer cursor/cf-audit-ipv4-mapped \
            "Reject private IPv4-mapped OpenID4VP request URIs" \
            "$(cat <<BODY
Cloudflare audit run 1, finding crates/authenticator-core/host_is_private/ipv4-mapped-request-uri

Stack: 5/8, base #${scim}

Credit: Grok Build
BODY
)")

          body=$(create cursor/cf-audit-ipv4-mapped cursor/cf-audit-body-limit \
            "Reject an oversized relay body with 413" \
            "$(cat <<BODY
Cloudflare audit run 1, finding apps/pages/server/manage.mjs/readRawBody/unbounded-buffer

Stack: 6/8, base #${ipv4}

Credit: Grok Build
BODY
)")

          slash=$(create cursor/cf-audit-body-limit cursor/cf-audit-backslash \
            "Reject raw-backslash local-session proxy paths" \
            "$(cat <<BODY
Cloudflare audit run 1, finding daemon.proxy.backslash-canonicalizes-local-session

Stack: 7/8, base #${body}

Credit: Grok Build
BODY
)")

          getrun=$(create cursor/cf-audit-backslash cursor/cf-audit-getrun \
            "Require the opened run when getRun changes origin" \
            "$(cat <<BODY
Cloudflare audit run 1, finding runner.drive.getRun-origin-unbound

Stack: 8/8, base #${slash}

Credit: Grok Build
BODY
)")

          echo "ART=${art} TOKEN=${token} LD=${ld} EMAIL=${email} SCIM=${scim} IPV4=${ipv4} BODY=${body} SLASH=${slash} GETRUN=${getrun}"

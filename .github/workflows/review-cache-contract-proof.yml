name: Cache contract proof
on:
  push:
    branches: [review/cache-contract-proof-20261030]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ce3038fd5987abc3714efd0c936905aa99cf6549
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check scripts/lib/ci-full-run.test.mjs
      - run: pnpm exec vitest run scripts/lib/ci-full-run.test.mjs

# CI — required up-to-date pull-request checks (personal-account repository).
# Apply/verify the default-branch policy with ops/github/governance.mjs.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # pnpm lint diffs changed files against origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify merge-required commit signatures
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release/check-pr-signatures.mjs "$GITHUB_REPOSITORY" "$PR_NUMBER" "$PR_HEAD"
      - name: Install
        # Not `pnpm bootstrap`: that also runs db:migrate (needs a live
        # DATABASE_URL) and installs git hooks, neither of which belongs in CI.
        run: pnpm install --frozen-lockfile
      - name: Lint (changed files)
        run: pnpm lint
      - name: Quality gates (structure + component coupling)
        # Ratchets against tools/quality/quality-baseline.json / tools/quality/package-metrics-baseline.json
        # and hard-fails on dependency cycles and phantom deps. Sub-second.
        run: pnpm quality
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Product-experience contracts
        run: pnpm verify:experience

  bundle:
    name: Bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and measure shipped bundles
        # apps/pages precaches its whole dist for offline use, so growth here is
        # growth in what every installing device downloads.
        run: pnpm quality:bundle
      - name: Native Chrome WebMCP discovery and control
        # Chrome's WebMCP CDP domain backs the Application pane. No polyfill;
        # unavailable native support or zero tools must fail this required job.
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome
          VITE_BASE: /OpenSesame/
        run: |
          google-chrome --version
          pnpm --filter @opensesame/pages verify:webmcp
      - name: Keyboard-only first-load and navigation contract
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:keyboard
      - name: Phone and tablet layout and touch contract
        # Real coarse-pointer contexts at 320/390/430 and landscape: 44px
        # targets, no field under 16px (iOS zooms a smaller one on focus and
        # never zooms back), one-row statusline, safe areas, nothing floating
        # over a control. Then a finger above 900px, where the wide
        # arrangement is drawn: a width rule that hid the strip without
        # putting the phone's top bar back left a tablet in landscape with no
        # support, notifications or plane truth at all, and every other gate
        # was green. DESIGN.md § Touch.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:mobile
      - name: Browser-local application sign-in contract
        # Real cross-origin popup and virtual WebAuthn, no Identity/Host backend.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:local-iam
      - name: Self-Issued OpenID Provider v2 contract
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:siop

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (toolchain pinned below)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test (workspace, all targets)
        run: cargo test --workspace --all-targets

  mtls:
    # Optional mTLS / workload identity (ADR 0132): the fast suite, then the
    # real-protocol suite against pinned, checksum-verified fixtures
    # (scripts/mtls/mtls-fixtures.sh). Both write artifacts/mtls/ through
    # scripts/lib/mtls-manifest.mjs; a required step that ran nothing, a
    # fixture that cannot start, or an all-ignored suite fails the job
    # (AT-EVIDENCE-NORUN). Not yet in the required-checks ruleset: that is a
    # remote governance change (ops/github/governance.mjs).
    name: mTLS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (toolchain pinned below)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Cache pinned native fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/mtls-fixtures
          key: mtls-fixtures-${{ hashFiles('scripts/mtls/mtls-fixtures.sh') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fast mTLS suite (unit, contracts, static bundle boundary)
        env:
          VITE_BASE: /OpenSesame/
        run: pnpm test:mtls
      - name: Real-protocol mTLS suite (pinned nats-server, OpenBao, SPIRE, Caddy; Chromium)
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm test:mtls:integration
      - name: Upload sanitized evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mtls-evidence
          path: artifacts/mtls/
          if-no-files-found: error
          retention-days: 30

name: Combined DERP and network final verification (no scanning)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: aa971fe2af98f16ffb1371102ec850bea86b6bde
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      CI: 'true'
    steps:
      - name: Check out exact final source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: aa971fe2af98f16ffb1371102ec850bea86b6bde
          persist-credentials: false
      - name: Assert source identity and available Chromium
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -x "$PLAYWRIGHT_CHROMIUM"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild and verify the final pinned native distribution
        shell: bash
        run: |
          set -euo pipefail
          # Simulate the weekly controller context in this invocation only;
          # the checkout above and native source snapshot are exact.
          env GITHUB_SHA=7e6c6ec549e335686b91fb1345c5697424143e93 GITHUB_WORKFLOW_SHA=7e6c6ec549e335686b91fb1345c5697424143e93 GITHUB_EVENT_NAME=schedule GITHUB_REF=refs/heads/main GITHUB_WORKFLOW_REF="$GITHUB_REPOSITORY/.github/workflows/release-weekly.yml@refs/heads/main" REQUESTED_HEAD="$EXPECTED_HEAD" \
            timeout --signal=TERM --kill-after=10s 900s node scripts/ci-native-wasm.mjs
      - name: Verify SARIF mapping and exact rebuilt asset length
        shell: bash
        run: |
          pnpm exec vitest run scripts/lib/native-wasm-proof.test.mjs
          node --test scripts/security/map-composed-go-sarif.test.mjs scripts/security/map-composed-go-sarif-uri.test.mjs
          pnpm exec vitest run apps/pages/scripts/tailscale-wasm-assets.test.mjs
      - name: Build the actual tailnet browser profile
        env:
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages run build:tailnet-browser-verify
      - name: Run real Headscale, DERP and installed-PWA browser flow
        env:
          VITE_BASE: /OpenSesame/
          PAGES_VERIFY_OUT: ${{ runner.temp }}/tailnet-browser-proof
        run: pnpm --filter @opensesame/pages run verify:tailnet-browser-node
      - name: Confirm source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

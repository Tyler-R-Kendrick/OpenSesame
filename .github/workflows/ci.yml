name: Combined DERP and native network bootstrap (no scanning)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact bootstrap source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 0d85c5599d01aeb83c4afeb1e54180395a910a98
          persist-credentials: false
      - name: Assert proposed input identity
        run: test "$(git rev-parse HEAD)" = 0d85c5599d01aeb83c4afeb1e54180395a910a98
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and validate exact pinned source and compiler
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./tools/pwa-tailscale-native-http/source.json"); console.log(p.source.archiveURL); console.log(p.compiler.archiveURL); console.log(p.source.archiveSha256); console.log(p.compiler.archiveSha256)' > "$RUNNER_TEMP/archive-inputs"
          mapfile -t input < "$RUNNER_TEMP/archive-inputs"
          test "${#input[@]}" = 4
          curl --fail --show-error --location --retry 3 --proto '=https' --proto-redir '=https' --max-time 600 --max-filesize 1073741824 "${input[0]}" -o "$RUNNER_TEMP/tailscale-source.tar.gz"
          curl --fail --show-error --location --retry 3 --proto '=https' --proto-redir '=https' --max-time 600 --max-filesize 1073741824 "${input[1]}" -o "$RUNNER_TEMP/tailscale-compiler.tar.gz"
          printf '%s  %s\n' "${input[2]}" "$RUNNER_TEMP/tailscale-source.tar.gz" | sha256sum -c
          printf '%s  %s\n' "${input[3]}" "$RUNNER_TEMP/tailscale-compiler.tar.gz" | sha256sum -c
          mkdir "$RUNNER_TEMP/verified-source"
          tar -xzf "$RUNNER_TEMP/tailscale-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/verified-source"
      - name: Test exact source selector and pinned metadata
        env:
          PWA_NATIVE_HTTP_SOURCE: ${{ runner.temp }}/verified-source
        run: |
          node --test tools/pwa-tailscale-native-http/select-toolchain.test.mjs
          pnpm exec biome format tools/pwa-tailscale-native-http/source.json apps/pages/src/lib/capabilities/tailscale-artifacts.json
      - name: Cold compile and verify all four phases without any scanner
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 2100s node tools/pwa-tailscale-native-http/build.mjs "$RUNNER_TEMP/tailscale-source.tar.gz" "$RUNNER_TEMP/tailscale-compiler.tar.gz" "$RUNNER_TEMP/native-build"
      - name: Print only rebuilt asset pins and manifest digest
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),c=require("crypto"),p=process.argv[1],b=fs.readFileSync(p),m=JSON.parse(b); console.log(JSON.stringify({manifestSha256:c.createHash("sha256").update(b).digest("hex"),sourceCommit:m.sourceCommit,compilerCommit:m.compilerCommit,rawWasm:m.rawWasm,assets:m.assets,license:m.license,upstreamNotices:m.upstreamNotices}));' "$RUNNER_TEMP/native-build/artifacts/native-artifacts.json"

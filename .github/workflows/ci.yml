name: Native signature verifier proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested:
    uses: ./.github/workflows/signature-proof-middle.yml
  proof:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: b965fa2885643e4c6ae9658a2348b7b4b65395d3
      CONTROLLER_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Check out signed proposed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: b965fa2885643e4c6ae9658a2348b7b4b65395d3
          persist-credentials: false
      - name: Copy exact candidate guard and verifier scripts
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/controller-guard" <<'GUARD'
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Tyler-R-Kendrick/OpenSesame
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-weekly.yml@refs/heads/main"
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e .opensesame-signature-controller && test ! -L .opensesame-signature-controller
          GUARD
          cat > "$RUNNER_TEMP/controller-verify" <<'VERIFY'
          set -euo pipefail
          test "$(git -C .opensesame-signature-controller rev-parse HEAD)" = "$CONTROLLER_SHA"
          controller="$RUNNER_TEMP/opensesame-signature-controller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$controller" && test ! -L "$controller"
          mv .opensesame-signature-controller "$controller"
          test -z "$(git status --porcelain --untracked-files=all)"
          node "$controller/scripts/release/check-merge-group-signature.mjs" "$GITHUB_REPOSITORY" "$EXPECTED_HEAD"
          VERIFY
      - name: Refuse the real non-main workflow context
        shell: bash
        run: |
          if bash "$RUNNER_TEMP/controller-guard"; then
            echo 'non-main controller unexpectedly accepted' >&2
            exit 1
          fi
      - name: Accept exact-source validation with simulated main caller context
        shell: bash
        run: |
          env GITHUB_REF=refs/heads/main GITHUB_EVENT_NAME=workflow_dispatch \
            GITHUB_WORKFLOW_REF="$GITHUB_REPOSITORY/.github/workflows/release-weekly.yml@refs/heads/main" \
            bash "$RUNNER_TEMP/controller-guard"
      - name: Check out exact proof controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          path: .opensesame-signature-controller
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release/check-merge-group-signature.mjs
            scripts/lib/pr-signatures.mjs
      - name: Verify real signed source with the exact candidate verifier script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: bash "$RUNNER_TEMP/controller-verify"
      - name: Reject a synthetic unsigned response even if candidate helper is malicious
        shell: bash
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          set -euo pipefail
          controller="$RUNNER_TEMP/opensesame-signature-controller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mv "$controller" .opensesame-signature-controller
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/gh" <<'MOCK'
          #!/usr/bin/env bash
          printf '{"sha":"%s","commit":{"verification":{"verified":false,"reason":"unsigned"}}}\n' "$EXPECTED_HEAD"
          MOCK
          chmod +x "$RUNNER_TEMP/fakebin/gh"
          if PATH="$RUNNER_TEMP/fakebin:$PATH" bash "$RUNNER_TEMP/controller-verify"; then
            echo 'unsigned source unexpectedly accepted' >&2
            exit 1
          fi
      - name: Reject a dirty candidate before an altered helper can run
        shell: bash
        run: |
          set -euo pipefail
          printf 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/candidate-helper-ran", "bad")\n' > scripts/release/check-merge-group-signature.mjs
          if env GITHUB_REF=refs/heads/main GITHUB_EVENT_NAME=workflow_dispatch \
              GITHUB_WORKFLOW_REF="$GITHUB_REPOSITORY/.github/workflows/release-weekly.yml@refs/heads/main" \
              bash "$RUNNER_TEMP/controller-guard"; then
            echo 'dirty candidate unexpectedly accepted' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/candidate-helper-ran"
  native-cold:
    name: Exact candidate native WASM cold build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: b965fa2885643e4c6ae9658a2348b7b4b65395d3
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: b965fa2885643e4c6ae9658a2348b7b4b65395d3
        persist-credentials: false
    - name: Require the exact clean source and main release controller
      shell: bash
      env:
        CONTROLLER_SHA: ${{ github.workflow_sha }}
      run: 'export GITHUB_REF=refs/heads/main GITHUB_EVENT_NAME=workflow_dispatch

        export GITHUB_WORKFLOW_REF="$GITHUB_REPOSITORY/.github/workflows/release-weekly.yml@refs/heads/main"

        set -euo pipefail

        test "$GITHUB_REPOSITORY" = Tyler-R-Kendrick/OpenSesame

        test "$GITHUB_REF" = refs/heads/main

        test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-weekly.yml@refs/heads/main"

        case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac

        [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

        test -z "$(git status --porcelain --untracked-files=all)"

        test ! -e .opensesame-signature-controller && test ! -L .opensesame-signature-controller

        '
    - name: Check out the main release controller as data
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.workflow_sha }}
        path: .opensesame-signature-controller
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: 'scripts/release/check-merge-group-signature.mjs

          scripts/lib/pr-signatures.mjs

          '
    - name: Verify the selected source with the main controller
      shell: bash
      env:
        CONTROLLER_SHA: ${{ github.workflow_sha }}
        GH_TOKEN: ${{ github.token }}
        NODE_OPTIONS: ''
        NODE_PATH: ''
      run: 'set -euo pipefail

        test "$(git -C .opensesame-signature-controller rev-parse HEAD)" = "$CONTROLLER_SHA"

        controller="$RUNNER_TEMP/opensesame-signature-controller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

        test ! -e "$controller" && test ! -L "$controller"

        mv .opensesame-signature-controller "$controller"

        test -z "$(git status --porcelain --untracked-files=all)"

        node "$controller/scripts/release/check-merge-group-signature.mjs" "$GITHUB_REPOSITORY" "$EXPECTED_HEAD"

        '
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install exact locked build dependencies
      run: pnpm install --frozen-lockfile
    - name: Run native admission regression tests
      run: pnpm exec vitest run scripts/lib/native-wasm-proof.test.mjs
    - name: Build and verify all four original native phases
      run: 'export GITHUB_REF=refs/heads/main GITHUB_EVENT_NAME=schedule

        export GITHUB_WORKFLOW_REF="$GITHUB_REPOSITORY/.github/workflows/release-weekly.yml@refs/heads/main"

        set -euo pipefail

        mkdir -m 700 "$RUNNER_TEMP/pwa-native-wasm-logs"

        df -h . | tee "$RUNNER_TEMP/pwa-native-wasm-logs/disk.log"

        free -h | tee "$RUNNER_TEMP/pwa-native-wasm-logs/memory.log"

        timeout --signal=TERM --kill-after=10s 900s node scripts/ci-native-wasm.mjs 2>&1 | tee "$RUNNER_TEMP/pwa-native-wasm-logs/validation.log"

        '
    - name: Retain exact source, raw phases, emitted assets and failure logs
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: pwa-native-wasm-b965fa2885643e4c6ae9658a2348b7b4b65395d3-${{ github.run_attempt }}
        retention-days: 14
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ runner.temp }}/pwa-native-wasm-logs

          .cache/pwa-tailscale-native-http/ci-evidence

          .cache/pwa-tailscale-native-http/work/*/*.log

          .cache/pwa-tailscale-native-http/work/*/build/logs

          '

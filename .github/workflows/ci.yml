name: Isolated signed commit capability proof
on:
  push:
    branches:
      - review/action-signature-controller-20261030
permissions:
  contents: write
jobs:
  marker:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.ref == 'refs/heads/review/action-signature-controller-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Commit the fixed marker to the isolated target branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const request = {
            query: 'mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}',
            variables: {input: {
              branch: {repositoryNameWithOwner:'Tyler-R-Kendrick/OpenSesame',branchName:'review/action-signature-target-20261030'},
              expectedHeadOid:'ffe76449bb4c81644df59169e095005f5a2916f8',
              message:{headline:'test: verify Actions signed commit capability'},
              fileChanges:{additions:[{path:'.github/action-signature-capability-proof.txt',contents:'R2l0SHViIEFjdGlvbnMgc2lnbmVkIGNvbW1pdCBjYXBhYmlsaXR5IHByb29mLgo='}]}
            }}
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/commit-request.json', JSON.stringify(request));
          NODE
          gh api graphql --input "$RUNNER_TEMP/commit-request.json" > "$RUNNER_TEMP/commit-result.json"
          sha="$(node -e 'const r=require(process.argv[1]); if(r.errors?.length || !/^[0-9a-f]{40}$/.test(r.data?.createCommitOnBranch?.commit?.oid ?? "")) process.exit(1); process.stdout.write(r.data.createCommitOnBranch.commit.oid)' "$RUNNER_TEMP/commit-result.json")"
          gh api "repos/Tyler-R-Kendrick/OpenSesame/commits/$sha" --jq '{sha, parent: .parents[0].sha, parentCount: (.parents|length), tree: .commit.tree.sha, verified: .commit.verification.verified, reason: .commit.verification.reason, committer: .committer.login}'

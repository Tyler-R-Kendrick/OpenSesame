# CI — required up-to-date pull-request checks (personal-account repository).
# Apply/verify the default-branch policy with ops/github/governance.mjs.
#
# The ruleset requires the check names TypeScript, Bundle budgets, and Rust.
# A skipped required check does not satisfy it, and a workflow that does not
# run leaves the check pending. The heavy jobs are conditional. The three
# gate jobs always run and pass when their suite succeeded or was skipped
# because the diff does not touch it (scripts/lib/ci-changed-areas.mjs).
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.areas.outputs.typescript }}
      bundle: ${{ steps.areas.outputs.bundle }}
      rust: ${{ steps.areas.outputs.rust }}
      mtls: ${{ steps.areas.outputs.mtls }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The classifier diffs the pull request against its merge base.
          fetch-depth: 0
      - name: Verify merge-required commit signatures
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release/check-pr-signatures.mjs "$GITHUB_REPOSITORY" "$PR_NUMBER" "$PR_HEAD"
      - name: Classify changed areas
        id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/lib/ci-changed-areas.mjs

  typescript-tests:
    name: TypeScript tests
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # pnpm lint diffs changed files against origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        # Not `pnpm bootstrap`: that also runs db:migrate (needs a live
        # DATABASE_URL) and installs git hooks, neither of which belongs in CI.
        run: pnpm install --frozen-lockfile
      - name: Lint (changed files)
        run: pnpm lint
      - name: Quality gates (structure + component coupling)
        # Ratchets against tools/quality/quality-baseline.json / tools/quality/package-metrics-baseline.json
        # and hard-fails on dependency cycles and phantom deps. Sub-second.
        run: pnpm quality
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Product-experience contracts
        run: pnpm verify:experience

  bundle-tests:
    name: Bundle budget tests
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and measure shipped bundles
        # apps/pages precaches its whole dist for offline use, so growth here is
        # growth in what every installing device downloads. The two hardened
        # capability profiles are built too: each build fails on an excluded
        # module reachable from an entry (ADR 0130), and the gate measures them
        # only when their dist-profiles directory exists.
        run: |
          pnpm exec turbo run build --filter=@opensesame/pages
          for profile in minimal-local family-local; do
            VITE_BASE=/OpenSesame/ pnpm --filter @opensesame/pages build:profile \
              --profile "capability-profiles/$profile.json" --mode hardened
          done
          node scripts/quality/bundle-budget-gate.mjs
      - name: Native Chrome WebMCP discovery and control
        # Chrome's WebMCP CDP domain backs the Application pane. No polyfill;
        # unavailable native support or zero tools must fail this required job.
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome
          VITE_BASE: /OpenSesame/
        run: |
          google-chrome --version
          pnpm --filter @opensesame/pages verify:webmcp
      - name: Keyboard-only first-load and navigation contract
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:keyboard
      - name: Phone and tablet layout and touch contract
        # Real coarse-pointer contexts at 320/390/430 and landscape: 44px
        # targets, no field under 16px (iOS zooms a smaller one on focus and
        # never zooms back), one-row statusline, safe areas, nothing floating
        # over a control. Then a finger above 900px, where the wide
        # arrangement is drawn: a width rule that hid the strip without
        # putting the phone's top bar back left a tablet in landscape with no
        # support, notifications or plane truth at all, and every other gate
        # was green. DESIGN.md § Touch.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:mobile
      - name: Browser-local application sign-in contract
        # Real cross-origin popup and virtual WebAuthn, no Identity/Host backend.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:local-iam
      - name: Self-Issued OpenID Provider v2 contract
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:siop
      - name: Static front end complete without a backend
        # ADR 0090: first screen is sign-in + guest, deep links resolve, no
        # loopback request or backend copy. verify:experience in the
        # TypeScript job skips browser gates (it builds no dist), so this is
        # the one place CI runs it.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:static
      - name: Unlock methods and second steps
        # ADR 0091: key first, then scan, then a code; lock → PIN → code.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages verify:auth
      - name: Experience journeys
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: node apps/pages/scripts/verify-experience-journeys.mjs

  rust-tests:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (toolchain pinned below)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test (workspace, all targets)
        run: cargo test --workspace --all-targets
      - name: Test the Bitwarden bridge build (ADR 0148)
        # Default builds leave the bridge out; this compiles it in.
        run: cargo test -p opensesame-gateway -p opensesame-cli --features bitwarden-compat bitwarden

  mtls:
    # Optional mTLS / workload identity (ADR 0132): the fast suite, then the
    # real-protocol suite against pinned, checksum-verified fixtures
    # (scripts/mtls/mtls-fixtures.sh). Both write artifacts/mtls/ through
    # scripts/lib/mtls-manifest.mjs; a required step that ran nothing, a
    # fixture that cannot start, or an all-ignored suite fails the job
    # (AT-EVIDENCE-NORUN). Not in the required-checks ruleset.
    name: mTLS
    needs: changes
    if: needs.changes.outputs.mtls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (toolchain pinned below)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Cache pinned native fixtures
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/mtls-fixtures
          key: mtls-fixtures-${{ hashFiles('scripts/mtls/mtls-fixtures.sh') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fast mTLS suite (unit, contracts, static bundle boundary)
        env:
          VITE_BASE: /OpenSesame/
        run: pnpm test:mtls
      - name: Real-protocol mTLS suite (pinned nats-server, OpenBao, SPIRE, Caddy; Chromium)
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          VITE_BASE: /OpenSesame/
        run: pnpm test:mtls:integration
      - name: Upload sanitized evidence manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mtls-evidence
          path: artifacts/mtls/
          if-no-files-found: error
          retention-days: 30

  typescript:
    name: TypeScript
    needs: [changes, typescript-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the required check
        run: |
          changes="${{ needs.changes.result }}"
          heavy="${{ needs.typescript-tests.result }}"
          if [ "$changes" != "success" ]; then
            echo "change detection result: $changes"
            exit 1
          fi
          case "$heavy" in
            success|skipped) exit 0 ;;
            *) echo "typescript tests result: $heavy"; exit 1 ;;
          esac

  bundle:
    name: Bundle budgets
    needs: [changes, bundle-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the required check
        run: |
          changes="${{ needs.changes.result }}"
          heavy="${{ needs.bundle-tests.result }}"
          if [ "$changes" != "success" ]; then
            echo "change detection result: $changes"
            exit 1
          fi
          case "$heavy" in
            success|skipped) exit 0 ;;
            *) echo "bundle tests result: $heavy"; exit 1 ;;
          esac

  rust:
    name: Rust
    needs: [changes, rust-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the required check
        run: |
          changes="${{ needs.changes.result }}"
          heavy="${{ needs.rust-tests.result }}"
          if [ "$changes" != "success" ]; then
            echo "change detection result: $changes"
            exit 1
          fi
          case "$heavy" in
            success|skipped) exit 0 ;;
            *) echo "rust tests result: $heavy"; exit 1 ;;
          esac

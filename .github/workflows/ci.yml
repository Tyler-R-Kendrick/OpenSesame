name: Combined DERP and network final verification (no scanning)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: de5f7b1e82cc3df58a5dd1c65914d191e4aeb649
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      CI: 'true'
    steps:
      - name: Check out exact final source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: de5f7b1e82cc3df58a5dd1c65914d191e4aeb649
          persist-credentials: false
      - name: Assert source identity and available Chromium
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -x "$PLAYWRIGHT_CHROMIUM"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test MCP browser and workflow contracts
        run: |
          pnpm exec vitest run scripts/lib/ci-bundle-shards.test.mjs scripts/lib/ci-full-run.test.mjs
          pnpm --filter @opensesame/pages test:mcp-cross-realm
      - name: Rebuild and verify the final pinned native distribution
        shell: bash
        run: |
          set -euo pipefail
          # Simulate the weekly controller context in this invocation only;
          # the checkout above and native source snapshot are exact.
          env GITHUB_SHA=d274a433eaaf8fc507e3fe58c7ee220fa5c0ee9a GITHUB_WORKFLOW_SHA=d274a433eaaf8fc507e3fe58c7ee220fa5c0ee9a GITHUB_EVENT_NAME=schedule GITHUB_REF=refs/heads/main GITHUB_WORKFLOW_REF="$GITHUB_REPOSITORY/.github/workflows/release-weekly.yml@refs/heads/main" REQUESTED_HEAD="$EXPECTED_HEAD" \
            timeout --signal=TERM --kill-after=10s 900s node scripts/ci-native-wasm.mjs
      - name: Check one fixed module and production package reachability locally
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t owned < <(find .cache/pwa-tailscale-native-http/work -mindepth 1 -maxdepth 1 -type d)
          test "${#owned[@]}" = 1
          build="$GITHUB_WORKSPACE/${owned[0]}/build"
          go="$build/compiler/bin/go"
          cd "$build/source"
          export GOTOOLCHAIN=local GOENV=off GOWORK=off GOTELEMETRY=off
          export GOPATH="$build/cache/gopath" GOMODCACHE="$build/cache/mod" GOCACHE="$build/cache/build" TMPDIR="$build/tmp"
          export GOFLAGS="-p=2 -buildvcs=false -mod=readonly -modfile=$build/native.mod"
          "$go" run "$build/upstream-command.go" tags "$RUNNER_TEMP/native-production-tags.json"
          tags=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"))' "$RUNNER_TEMP/native-production-tags.json")
          [[ "$tags" =~ (^|,)tailscale_go(,|$) ]]
          [[ ! "$tags" =~ (^|,)ts_omit_useexitnode(,|$) ]]
          version=$("$go" list -m -f '{{.Version}}' golang.org/x/net)
          test "$version" = v0.62.0
          GOOS=js GOARCH=wasm "$go" list -deps -f '{{.ImportPath}}' -tags "$tags" tailscale.com/cmd/tsconnect/wasm > "$RUNNER_TEMP/native-local-packages"
          if grep -Fxq golang.org/x/net/html "$RUNNER_TEMP/native-local-packages"; then
            echo 'x/net/html appears in the selected production package graph'
            exit 1
          fi
          echo "x/net=$version; x/net/html absent from selected production package graph"
      - name: Verify SARIF mapping and exact rebuilt asset length
        shell: bash
        run: |
          pnpm exec vitest run scripts/lib/native-wasm-proof.test.mjs
          node --test scripts/security/map-composed-go-sarif.test.mjs scripts/security/map-composed-go-sarif-uri.test.mjs scripts/security/map-composed-go-sarif-nested.test.mjs
          pnpm exec vitest run apps/pages/scripts/tailscale-wasm-assets.test.mjs
      - name: Build the actual tailnet browser profile
        env:
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages run build:tailnet-browser-verify
      - name: Run real Headscale, DERP and installed-PWA browser flow
        env:
          VITE_BASE: /OpenSesame/
          PAGES_VERIFY_OUT: ${{ runner.temp }}/tailnet-browser-proof
        run: pnpm --filter @opensesame/pages run verify:tailnet-browser-node
      - name: Report aggregate browser failure evidence
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const file = process.env.PAGES_DIAG_RESULTS;
          try {
            const r = JSON.parse(readFileSync(file, 'utf8'));
            const count = (v) => Array.isArray(v) ? v.length : null;
            const kinds = {};
            for (const entry of r.log ?? []) kinds[entry.kind] = (kinds[entry.kind] ?? 0) + 1;
            console.log(JSON.stringify({failureCount: count(r.failures), controlEvents: count(r.fixture?.control), derpEvents: count(r.fixture?.derp), peerEvents: count(r.fixture?.peer), kinds}));
          } catch { console.log('browser aggregate evidence unavailable'); }
          NODE
        env:
          PAGES_DIAG_RESULTS: ${{ runner.temp }}/tailnet-browser-proof/results.json
      - name: Confirm source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

name: Isolated cache no-save proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  seed:
    runs-on: ubuntu-24.04
    steps:
      - name: Make minimal Rust workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-proof-project/src" "$RUNNER_TEMP/direct-proof-seed"
          printf '[package]\nname = "cache-proof"\nversion = "0.0.0"\nedition = "2021"\n' > "$RUNNER_TEMP/cache-proof-project/Cargo.toml"
          printf 'pub fn ready() {}\n' > "$RUNNER_TEMP/cache-proof-project/src/lib.rs"
          printf 'direct seeded\n' > "$RUNNER_TEMP/direct-proof-seed/value"
      - name: Seed direct hit with isolated proof key
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/direct-proof-seed
          key: cache-proof-${{ github.run_id }}-direct-hit
      - name: Seed Rust hit with isolated proof key
        id: rust_seed
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          lookup-only: true
          prefix-key: cache-proof-${{ github.run_id }}-rust-hit
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ${{ runner.temp }}/cache-proof-project
          cache-targets: false
          cache-bin: false
          cache-directories: ${{ runner.temp }}/rust-proof-seed
      - name: Populate Rust seed after lookup
        shell: bash
        run: |
          test '${{ steps.rust_seed.outputs.cache-hit }}' = 'false'
          mkdir -p "$RUNNER_TEMP/rust-proof-seed"
          printf 'rust seeded\n' > "$RUNNER_TEMP/rust-proof-seed/value"
  challenge:
    needs: seed
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact proposed source as data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 77c7716ab6a03916773744b5a7f3288f8b785be8
          persist-credentials: false
      - name: Verify the proposed source and create minimal Rust workspace
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 77c7716ab6a03916773744b5a7f3288f8b785be8
          mkdir -p "$RUNNER_TEMP/cache-proof-project/src"
          printf '[package]\nname = "cache-proof"\nversion = "0.0.0"\nedition = "2021"\n' > "$RUNNER_TEMP/cache-proof-project/Cargo.toml"
          printf 'pub fn ready() {}\n' > "$RUNNER_TEMP/cache-proof-project/src/lib.rs"
      - name: Direct lookup hit without restore or save
        id: direct_hit
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          lookup-only: true
          path: ${{ runner.temp }}/direct-proof-seed
          key: cache-proof-${{ github.run_id }}-direct-hit
      - name: Direct lookup miss without restore or save
        id: direct_miss
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          lookup-only: true
          path: ${{ runner.temp }}/direct-proof-miss
          key: cache-proof-${{ github.run_id }}-direct-miss
      - name: Rust lookup hit without restore or save
        id: rust_hit
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          lookup-only: true
          save-if: false
          prefix-key: cache-proof-${{ github.run_id }}-rust-hit
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ${{ runner.temp }}/cache-proof-project
          cache-targets: false
          cache-bin: false
          cache-directories: ${{ runner.temp }}/rust-proof-seed
      - name: Rust lookup miss without restore or save
        id: rust_miss
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          lookup-only: true
          save-if: false
          prefix-key: cache-proof-${{ github.run_id }}-rust-miss
          add-job-id-key: false
          add-rust-environment-hash-key: false
          workspaces: ${{ runner.temp }}/cache-proof-project
          cache-targets: false
          cache-bin: false
          cache-directories: ${{ runner.temp }}/rust-proof-miss
      - name: Check hits and misses, then create paths to expose an accidental save
        shell: bash
        env:
          DIRECT_HIT: ${{ steps.direct_hit.outputs.cache-hit }}
          DIRECT_MISS: ${{ steps.direct_miss.outputs.cache-hit }}
          RUST_HIT: ${{ steps.rust_hit.outputs.cache-hit }}
          RUST_MISS: ${{ steps.rust_miss.outputs.cache-hit }}
        run: |
          test "$DIRECT_HIT" = true
          test -z "$DIRECT_MISS"
          test "$RUST_HIT" = true
          test "$RUST_MISS" = false
          test "$CARGO_INCREMENTAL" = 0
          test ! -e "$RUNNER_TEMP/direct-proof-seed/value"
          test ! -e "$RUNNER_TEMP/rust-proof-seed/value"
          mkdir -p "$RUNNER_TEMP/direct-proof-miss" "$RUNNER_TEMP/rust-proof-miss"
          printf 'must not save\n' | tee "$RUNNER_TEMP/direct-proof-miss/value" > "$RUNNER_TEMP/rust-proof-miss/value"
  verify:
    needs: [seed, challenge]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify unique cache keys after post-job handlers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for item in direct-hit rust-hit; do
            count=$(gh api --method GET "repos/$GH_REPO/actions/caches" -f key="cache-proof-$GITHUB_RUN_ID-$item" --jq '.total_count')
            test "$count" = 1
          done
          for item in direct-miss rust-miss; do
            count=$(gh api --method GET "repos/$GH_REPO/actions/caches" -f key="cache-proof-$GITHUB_RUN_ID-$item" --jq '.total_count')
            test "$count" = 0
          done

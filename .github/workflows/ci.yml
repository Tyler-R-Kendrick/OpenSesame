# CI — the merge-queue gate.
#
# Runs on pull requests (feedback while reviewing) and on merge_group
# (the checks the queue requires before a PR lands on main). Configure the
# main branch ruleset to require merge queue with the "TypeScript" and
# "Rust" checks below.
name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # pnpm lint diffs changed files against origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        # Not `pnpm bootstrap`: that also runs db:migrate (needs a live
        # DATABASE_URL) and installs git hooks, neither of which belongs in CI.
        run: pnpm install --frozen-lockfile
      - name: Lint (changed files)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Test (workspace, all targets)
        run: cargo test --workspace --all-targets

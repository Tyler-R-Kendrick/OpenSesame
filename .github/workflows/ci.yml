name: Diagnose sandbox browser executable on exact candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      AGENT_BROWSER_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: de5f7b1e82cc3df58a5dd1c65914d191e4aeb649
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check command resolution without printing environment
        shell: bash
        run: |
          set -euo pipefail
          AGENT_BROWSER="$(cd packages/cua-password-reset && realpath "$(pnpm exec which agent-browser)")"
          export AGENT_BROWSER
          node -e 'const fs=require("fs"),p=require("path"),v=process.env.AGENT_BROWSER; console.log(JSON.stringify({absolute:p.isAbsolute(v),newline:v.includes("\n"),existsFromWorkspace:fs.existsSync(v)})); process.chdir("packages/agent-sandboxes"); console.log(JSON.stringify({existsFromSandbox:fs.existsSync(v)}));'
      - name: CUA password-reset browser E2E
        run: AGENT_BROWSER="$(cd packages/cua-password-reset && realpath "$(pnpm exec which agent-browser)")" pnpm --filter @opensesame/cua-password-reset test:e2e
      - name: Agent sandbox browser E2E
        run: AGENT_BROWSER="$(cd packages/cua-password-reset && realpath "$(pnpm exec which agent-browser)")" pnpm --fail-if-no-match --filter @opensesame/agent-sandboxes test:e2e

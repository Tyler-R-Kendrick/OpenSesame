# CI — required up-to-date pull-request checks (personal-account repository).
# Apply/verify the default-branch policy with ops/github/governance.mjs.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # pnpm lint diffs changed files against origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        # Not `pnpm bootstrap`: that also runs db:migrate (needs a live
        # DATABASE_URL) and installs git hooks, neither of which belongs in CI.
        run: pnpm install --frozen-lockfile
      - name: Lint (changed files)
        run: pnpm lint
      - name: Quality gates (structure + component coupling)
        # Ratchets against quality-baseline.json / package-metrics-baseline.json
        # and hard-fails on dependency cycles and phantom deps. Sub-second.
        run: pnpm quality
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  bundle:
    name: Bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and measure shipped bundles
        # apps/pages precaches its whole dist for offline use, so growth here is
        # growth in what every installing device downloads.
        run: pnpm quality:bundle

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (toolchain pinned below)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test (workspace, all targets)
        run: cargo test --workspace --all-targets

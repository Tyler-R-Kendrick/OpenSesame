name: Promotion quality proof

on:
  push:
    branches: [review/promotion-quality-proof]

permissions:
  contents: read

jobs:
  quality:
    name: Unchanged promotion quality suite
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.ref == 'refs/heads/review/promotion-quality-proof' && github.event_name == 'push' && github.actor_id == '145080887' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_SHA: 637c1e6dff4f8ffe430179c044ab8ae9139461eb
      SOURCE_TREE: 46bfa0a98a9a732b954a64beefc98d640ec626bf
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Validate immutable source identifiers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify candidate commit and complete tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the unmodified complete quality suite
        run: pnpm quality:test
      - name: Run the qualification contract directly
        run: pnpm exec vitest run scripts/lib/ci-release-qualification.test.mjs --testTimeout=30000
      - name: Run the composed Go mapper tests directly
        run: node --test scripts/security/map-composed-go-sarif.test.mjs
      - name: Run the unchanged structural quality gate
        run: pnpm quality:gate

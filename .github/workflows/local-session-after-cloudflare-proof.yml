name: Local sandbox session quality proof
on:
  push:
    branches: [review/local-session-after-cloudflare-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/local-session-after-cloudflare-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 2fceb233fac38d9e57cbd463688e866ef5dcf160
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2fceb233fac38d9e57cbd463688e866ef5dcf160
          test "$(git rev-parse HEAD^{tree})" = 48576e0555088457bb62fbdc41f9dd6b80f4a090
          test -z "$(git status --porcelain)"
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exact anti-slop and format
        run: |
          set -euo pipefail
          pnpm exec biome check packages/agent-sandboxes/e2e/local-session.spec.ts packages/agent-sandboxes/src/vnet-pinned-fetch.ts packages/agent-sandboxes/src/vnet-server.test.ts packages/agent-sandboxes/src/vnet-server.ts packages/agent-sandboxes/src/vnet.ts
          pnpm lint:anti-slop:files packages/agent-sandboxes/e2e/local-session.spec.ts packages/agent-sandboxes/src/vnet-pinned-fetch.ts packages/agent-sandboxes/src/vnet-server.test.ts packages/agent-sandboxes/src/vnet-server.ts packages/agent-sandboxes/src/vnet.ts
          pnpm lint:anti-slop
      - name: Typecheck and test sandbox
        run: |
          pnpm --filter @opensesame/agent-sandboxes typecheck
          pnpm --filter @opensesame/agent-sandboxes test
      - name: Real Chromium session resume
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          test -x "$AGENT_BROWSER_CHROME"
          export AGENT_BROWSER="$PWD/packages/cua-password-reset/node_modules/.bin/agent-browser"
          test -x "$AGENT_BROWSER"
          pnpm --filter @opensesame/agent-sandboxes test:e2e
      - name: Verify source unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = 2fceb233fac38d9e57cbd463688e866ef5dcf160
          test "$(git rev-parse HEAD^{tree})" = 48576e0555088457bb62fbdc41f9dd6b80f4a090
          git diff --exit-code

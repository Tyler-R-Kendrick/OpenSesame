# Retired publication entry point. Only release-weekly.yml may promote candidates.
name: Deploy Pages (retired)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    name: Use the qualified weekly release workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse unqualified publication
        run: |
          echo "::error::This publisher is retired. Run release-weekly.yml on main to qualify and promote an immutable candidate."
          exit 1

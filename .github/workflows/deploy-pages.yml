# Deploy Pages — publish apps/pages to GitHub Pages on every push to main.
#
# Replaces the manual scripts/release/deploy-pages.sh gh-pages-branch flow: with the
# up-to-date PR checks gating main, every squash-merged PR ships automatically.
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source).
#
# Deployment endpoints ride beside the bundle as os-runtime-config.json,
# read by the app at boot (packages/app-core/src/lib/runtime-config.ts). Set them
# as repository Actions *variables* (Settings → Secrets and variables →
# Actions → Variables): PAGES_IDENTITY_API, PAGES_HOST_API,
# PAGES_DAEMON_API. All optional — with none set the
# build still ships `{}` from apps/pages/public/ so the boot fetch is a
# 200, and the offline app remains complete without an Identity service.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs supersede, in-flight deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_BASE_PATH: /OpenSesame/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build @opensesame/pages
        # Through turbo, not `pnpm --filter ... build`: the app depends on six
        # workspace packages and turbo's `dependsOn: ["^build"]` builds those
        # first. A bare filtered build would bundle stale or missing dist output.
        run: VITE_BASE="$PAGES_BASE_PATH" pnpm exec turbo run build --filter=@opensesame/pages
      - name: SPA fallback (404.html)
        # GitHub Pages has no SPA rewrite; serving index.html as 404.html
        # makes deep links load the app instead of a dead page.
        run: cp apps/pages/dist/index.html apps/pages/dist/404.html
      - name: Write os-runtime-config.json (deployment endpoints)
        env:
          PAGES_IDENTITY_API: ${{ vars.PAGES_IDENTITY_API }}
          PAGES_HOST_API: ${{ vars.PAGES_HOST_API }}
          PAGES_DAEMON_API: ${{ vars.PAGES_DAEMON_API }}
          PAGES_LINEAR_CLIENT_ID: ${{ vars.PAGES_LINEAR_CLIENT_ID }}
        run: node apps/pages/scripts/write-runtime-config.mjs
      - name: Stamp exact release and served-file digests
        run: node scripts/release/pages-release.mjs stamp apps/pages/dist "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/pages/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # This job installs no pnpm, so v5's caching keyed on package.json's
          # packageManager field would fail looking for it.
          package-manager-cache: false
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the live site serves this release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/release/pages-release.mjs verify "$PAGES_URL" "$GITHUB_SHA"

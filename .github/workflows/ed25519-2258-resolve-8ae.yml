name: Ed25519 regenerate and format
on:
  push:
    branches: [review/ed25519-2258-resolve-8ae-20261030]
permissions:
  contents: read
jobs:
  prepare:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/ed25519-2258-resolve-8ae-20261030' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 8ae4c3db48a36204d4443e3180d74f0205b8af5b
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8ae4c3db48a36204d4443e3180d74f0205b8af5b
          test "$(git rev-parse HEAD^{tree})" = fd6490b295d0ff44811c1c8104958c6aea7279c1
          test "$(git rev-parse HEAD^)" = e48f177c10d33dbf66d24f13e4be2cc9e992d429
      - name: Reconcile Cargo lockfiles without changing requested pins
        run: |
          set -euo pipefail
          cargo +1.88.0 metadata --format-version 1 > /dev/null
          cargo +1.88.0 metadata --format-version 1 --manifest-path tests/fuzz/cargo/Cargo.toml > /dev/null
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps > /dev/null
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path tests/fuzz/cargo/Cargo.toml --no-deps > /dev/null
          git diff --stat -- Cargo.lock tests/fuzz/cargo/Cargo.lock
      - name: Format changed Rust sources
        run: |
          set -euo pipefail
          rustfmt +1.88.0 --edition 2021 --config skip_children=true crates/audit/src/lib.rs crates/audit/src/tests.rs crates/proof/src/http_message_signature.rs crates/pki-core/src/signer/tests.rs
          mkdir -p "$RUNNER_TEMP/ed25519-prepared"
          for file in Cargo.lock tests/fuzz/cargo/Cargo.lock crates/audit/src/lib.rs crates/audit/src/tests.rs crates/proof/src/http_message_signature.rs crates/pki-core/src/signer/tests.rs; do
            mkdir -p "$RUNNER_TEMP/ed25519-prepared/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/ed25519-prepared/$file"
          done
          (cd "$RUNNER_TEMP/ed25519-prepared" && sha256sum Cargo.lock tests/fuzz/cargo/Cargo.lock crates/audit/src/lib.rs crates/audit/src/tests.rs crates/proof/src/http_message_signature.rs crates/pki-core/src/signer/tests.rs > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ed25519-2258-prepared
          path: ${{ runner.temp }}/ed25519-prepared
          if-no-files-found: error
          retention-days: 7

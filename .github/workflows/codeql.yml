name: Prepare final-main CodeQL read-only verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-main-codeql-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  readiness:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/final-main-codeql-readiness-2149' && github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' }}
    name: Preparation/read-only verification (not a CI gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      security-events: read
    steps:
      - name: Observe PR merge readiness and guarded main CodeQL count
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          repo = "Tyler-R-Kendrick/OpenSesame"
          pr_number = 2149
          expected_head = "af6d468773d7564bd523601c402e92f1eb8f6308"
          expected_tree = "d21faf8e82ea4ef4aba2be065afefb639f773bf3"
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "final-main-readiness"
          output.mkdir()
          report = {
              "repository": repo, "pull_request": pr_number,
              "expected_head": expected_head, "expected_tree": expected_tree,
              "observed_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "state": "not_verified", "verified": False,
              "codeql": {"status": "not_checked", "open_count": None},
              "dependabot": {"status": "permission_unavailable", "open_count": None,
                             "reason": "Existing workflow token previously returned HTTP 403; this job makes no Dependabot zero claim."},
              "scope": "Read-only dashboard observation; CodeQL scan freshness, merge approval and global CI gates are not verified by this job.",
              "analysis_freshness": "not_verified_by_this_job"
          }
          def api(endpoint):
              result = subprocess.run(["gh", "api", "--method", "GET", endpoint], text=True, capture_output=True)
              if result.returncode:
                  raise RuntimeError(f"GET {endpoint} failed: {result.stderr.strip()}")
              return json.loads(result.stdout)
          def checked_pr():
              pr = api(f"repos/{repo}/pulls/{pr_number}")
              if (pr["number"] != pr_number or pr["head"]["sha"] != expected_head or
                  pr["head"]["repo"]["full_name"] != repo or pr["base"]["ref"] != "main" or
                  pr["base"]["repo"]["full_name"] != repo):
                  raise RuntimeError("PR identity, source head or base differs from the independently reviewed snapshot")
              return pr
          def checked_main(pr):
              if not pr["merged"] or not pr.get("merge_commit_sha"):
                  raise RuntimeError("PR is not merged; final-main verification refused")
              main = api(f"repos/{repo}/git/ref/heads/main")["object"]["sha"]
              if main != pr["merge_commit_sha"]:
                  raise RuntimeError("Current main is not the PR merge commit")
              tree = api(f"repos/{repo}/git/commits/{main}")["tree"]["sha"]
              if tree != expected_tree:
                  raise RuntimeError("Main tree differs from the reviewed PR head tree")
              return main
          def codeql_alerts():
              alerts = []
              for page in range(1, 1001):
                  batch = api(f"repos/{repo}/code-scanning/alerts?state=open&ref=refs%2Fheads%2Fmain&tool_name=CodeQL&per_page=100&page={page}")
                  if not isinstance(batch, list):
                      raise RuntimeError("Expected a paginated alert list")
                  if any(a["tool"]["name"] != "CodeQL" or a["state"] != "open" for a in batch):
                      raise RuntimeError("Alert response differs from the requested CodeQL/open scope")
                  alerts.extend(batch)
                  if len(batch) < 100:
                      return alerts
              raise RuntimeError("Pagination bound exceeded; incomplete count refused")
          failure = None
          try:
              source_tree = api(f"repos/{repo}/git/commits/{expected_head}")["tree"]["sha"]
              if source_tree != expected_tree:
                  raise RuntimeError("Immutable source commit tree does not match the recorded tree")
              pr = checked_pr()
              if not pr["merged"]:
                  if pr["state"] != "open":
                      raise RuntimeError("PR closed without merging; readiness cannot proceed")
                  report["state"] = "awaiting_merge"
              else:
                  main = checked_main(pr)
                  alerts = codeql_alerts()
                  if checked_main(checked_pr()) != main:
                      raise RuntimeError("Main changed during the paginated dashboard read")
                  rows = [{"number": a["number"], "rule": a["rule"]["id"],
                           "severity": a["rule"].get("security_severity_level"), "url": a["html_url"],
                           "most_recent_instance": {"ref": a["most_recent_instance"]["ref"],
                               "path": a["most_recent_instance"]["location"]["path"],
                               "line": a["most_recent_instance"]["location"].get("start_line")}}
                          for a in alerts]
                  report.update(main_sha=main, state="dashboard_zero" if not rows else "open_findings", verified=not rows)
                  report["codeql"] = {"status": "ok", "ref": "refs/heads/main", "open_count": len(rows), "alerts": rows}
                  if rows:
                      failure = "Main has open CodeQL findings; zero is not verified"
          except Exception as error:
              failure = str(error)
              report.update(state="verification_error", verified=False, error=failure)
              report["codeql"] = {"status": "not_verified", "open_count": None}
          (output / "readiness.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Read-only dashboard readiness: **{report['state']}**.\n\n")
              summary.write(f"Main CodeQL open count: {report['codeql']['open_count']}. Dependabot count: unknown (permission unavailable).\n\n")
              summary.write("This is not a global CI gate, a merge approval, or evidence of zero before merge.\n")
          if failure:
              raise SystemExit(failure)
          PY
      - name: Keep provisional or verified read-only report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: final-main-codeql-readiness
          path: ${{ runner.temp }}/final-main-readiness/readiness.json
          if-no-files-found: error
          retention-days: 7

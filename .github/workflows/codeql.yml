name: CodeQL

# Switch Security > Code scanning > CodeQL from default to advanced setup
# before enabling this workflow: GitHub rejects advanced uploads while default
# setup is active. Both native projects have explicit build commands below.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.run_id }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            mode: none
          - language: javascript-typescript
            runner: ubuntu-latest
            mode: none
          - language: python
            runner: ubuntu-latest
            mode: none
          - language: rust
            runner: ubuntu-latest
            mode: none
          - language: go
            runner: ubuntu-latest
            mode: autobuild
          - language: java-kotlin
            runner: ubuntu-latest
            mode: manual
          # Swift/mobile is intentionally not analyzed here: the Pages/native
          # product is exercised on Linux runners, and the macOS XCTest harness
          # is not part of this CodeQL gate.
        # The repository's only C/C++ file is the generated Swift FFI header;
        # there is no independent C/C++ program for autobuild to compile.
    env:
      CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS: 'true'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.language == 'go'
        with:
          go-version-file: scripts/test/live-turn/go.mod
          cache-dependency-path: scripts/test/live-turn/go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: matrix.language == 'rust' || matrix.language == 'java-kotlin'
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.language == 'java-kotlin' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || '' }}
      - name: Prepare Android SDK and pinned Gradle
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android native libraries
        if: matrix.language == 'java-kotlin'
        run: apps/android/scripts/build-core.sh android
      - name: Initialize analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended
      - name: Build Go modules and standalone tools
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      - name: Compile Android production and test Kotlin
        if: matrix.language == 'java-kotlin'
        run: |
          gradle --no-daemon --no-build-cache --rerun-tasks --max-workers=2 \
            -p apps/android/android -Pkotlin.compiler.execution.strategy=in-process \
            :app:compileDebugKotlin :app:compileDebugUnitTestKotlin \
            -PopensesameWalletBackendUrl=https://identity.example
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
          ref: refs/heads/main
          sha: ${{ inputs.source_sha }}
          output: ${{ runner.temp }}/codeql-results
      - name: Reject findings and incomplete analysis
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: node scripts/release/check-codeql-sarif.mjs "$SARIF_DIRECTORY"
      - name: Keep SARIF for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error

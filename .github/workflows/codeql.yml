name: CodeQL

# Switch Security > Code scanning > CodeQL from default to advanced setup
# before enabling this workflow: GitHub rejects advanced uploads while default
# setup is active. Both native projects have explicit build commands below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            mode: none
          - language: javascript-typescript
            runner: ubuntu-latest
            mode: none
          - language: python
            runner: ubuntu-latest
            mode: none
          - language: rust
            runner: ubuntu-latest
            mode: none
          - language: go
            runner: ubuntu-latest
            mode: autobuild
          - language: java-kotlin
            runner: ubuntu-latest
            mode: manual
          - language: swift
            runner: macos-26
            mode: manual
        # The repository's only C/C++ file is the generated Swift FFI header;
        # there is no independent C/C++ program for autobuild to compile.
    env:
      CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS: 'true'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.language == 'go'
        with:
          go-version-file: scripts/test/live-turn/go.mod
          cache-dependency-path: scripts/test/live-turn/go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: matrix.language == 'rust' || matrix.language == 'java-kotlin'
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.language == 'java-kotlin' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || '' }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: matrix.language == 'swift'
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Prepare Android SDK and pinned Gradle
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android native libraries
        if: matrix.language == 'java-kotlin'
        run: apps/android/scripts/build-core.sh android
      - name: Initialize analysis
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          queries: security-extended
      - name: Build Go modules and standalone tools
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      - name: Compile Android production and test Kotlin
        if: matrix.language == 'java-kotlin'
        run: |
          gradle --no-daemon --no-build-cache --rerun-tasks --max-workers=2 \
            -p apps/android/android -Pkotlin.compiler.execution.strategy=in-process \
            :app:compileDebugKotlin :app:compileDebugUnitTestKotlin \
            -PopensesameWalletBackendUrl=https://identity.example
      - name: Build and test all iOS package targets
        if: matrix.language == 'swift'
        run: bash scripts/test/mobile-apple.sh ios
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}

name: Repository security inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' && github.ref == 'refs/heads/codex/security-inventory' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Read security alert metadata without secret values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json,os,pathlib,subprocess,datetime
          repo="Tyler-R-Kendrick/OpenSesame"
          assert os.environ["GITHUB_REPOSITORY"]==repo and os.environ["GITHUB_ACTOR"]=="Tyler-R-Kendrick"
          assert os.environ["GITHUB_REF"]=="refs/heads/codex/security-inventory" and os.environ["GITHUB_EVENT_NAME"]=="workflow_dispatch"
          def api(endpoint):
           r=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
           if r.returncode: return {"error":"API request denied or failed", "endpoint":endpoint.split("?")[0]}
           return json.loads(r.stdout)
          def pages(endpoint):
           rows=[]
           for page in range(1,101):
            batch=api(endpoint+("&" if "?" in endpoint else "?")+f"per_page=100&page={page}")
            if not isinstance(batch,list): return batch
            rows+=batch
            if len(batch)<100:return rows
           raise RuntimeError("Pagination overflow")
          main=api(f"repos/{repo}/git/ref/heads/main")["object"]["sha"]
          report={"repository":repo,"main":main,"observed_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          alerts=pages(f"repos/{repo}/code-scanning/alerts?state=open&ref=refs%2Fheads%2Fmain")
          if isinstance(alerts,list):
           report["code_scanning"]=[{"number":a["number"],"state":a["state"],"rule":a["rule"],"tool":a["tool"],"url":a["html_url"],"instance":{"ref":a["most_recent_instance"].get("ref"),"commit_sha":a["most_recent_instance"].get("commit_sha"),"location":a["most_recent_instance"].get("location"),"analysis_key":a["most_recent_instance"].get("analysis_key"),"category":a["most_recent_instance"].get("category")}} for a in alerts]
          else:report["code_scanning"]=alerts
          analyses=pages(f"repos/{repo}/code-scanning/analyses?ref=refs%2Fheads%2Fmain")
          if isinstance(analyses,list): report["analyses"]=[{k:a.get(k) for k in ["id","commit_sha","ref","category","tool","created_at","results_count","error","warning"]} for a in analyses[:150]]
          else:report["analyses"]=analyses
          for kind in ["dependabot","secret-scanning"]:
           rows=pages(f"repos/{repo}/{kind}/alerts?state=open")
           if isinstance(rows,list): report[kind]=[{k:a.get(k) for k in ["number","state","html_url","secret_type","secret_type_display_name","resolution","dependency","security_advisory","security_vulnerability"] if k in a} for a in rows]
           else:report[kind]=rows
          report["main_after"]=api(f"repos/{repo}/git/ref/heads/main")["object"]["sha"]
          assert main==report["main_after"],"main changed during snapshot"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"security-inventory"
          out.mkdir(exist_ok=True)
          (out/"inventory.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({"main":main,"counts":{k:len(v) if isinstance(v,list) else v for k,v in report.items() if k in ["code_scanning","dependabot","secret-scanning"]}}))
          PYTHON
      - name: Retain metadata inventory
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-inventory
          path: ${{ runner.temp }}/security-inventory/inventory.json
          if-no-files-found: error
          retention-days: 1

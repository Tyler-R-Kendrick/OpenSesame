name: Review TypeScript 7 wallet browser compatibility
on:
  push:
    branches: [review/typescript-v7-cli-browser-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-cli-browser-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 58b9900112d3de6d2b0d0abc542a35446ca5ebb3
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact source candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 892bcff7c56091040a7e4c78e525e94a8d28bc2e
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify CLI WebAuthn with a CTAP2 virtual authenticator
        run: |
          set -euo pipefail
          trap 'rm -f review-cli-browser.cjs' EXIT
          printf '%s' '' | base64 -d > review-cli-browser.cjs
          node review-cli-browser.cjs
      - name: Confirm source tree unchanged
        if: always()
        run: git diff --exit-code

name: Review TypeScript 7 CLI passkey challenge snapshots
on:
  push:
    branches: [review/typescript-v7-cli-challenge-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-cli-challenge-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 7f8b3ed37bfa253ce375dcec29e0e7cea573392a
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 6e66b439bc80e2b8c03cb4c81b3e0f2121429225
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record original compiler errors
        run: |
          set -euo pipefail
          files=(packages/app-core/src/lib/cli-app-integration/webauthn-credential.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^:$f" > "$f"; done
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-original.log 2>&1; then exit 1; fi
          grep -E 'cli-app-integration/webauthn-credential.ts.*error TS[0-9]+' /tmp/duress-original.log
      - name: Prove shared and mutable challenges fail against the prior implementation
        run: |
          set -euo pipefail
          file=packages/app-core/src/lib/cli-app-integration/webauthn-credential.ts
          trap 'git restore -- "$file"' EXIT
          git show "HEAD^:$file" > "$file"
          if pnpm --filter @opensesame/app-core exec vitest run src/lib/cli-app-integration/webauthn-credential.test.ts > /tmp/cli-original.log 2>&1; then cat /tmp/cli-original.log; exit 1; fi
          cat /tmp/cli-original.log
          grep -Eq 'FAIL.*registers the authenticator rawId' /tmp/cli-original.log
          grep -Eq 'FAIL.*rejects a shared challenge before calling the authenticator' /tmp/cli-original.log
          grep -Eq 'FAIL.*snapshots an approval challenge before asynchronous storage access' /tmp/cli-original.log
      - name: Check exact TypeScript results
        run: |
          set -euo pipefail
          pnpm exec biome check packages/app-core/src/lib/cli-app-integration/webauthn-credential.ts packages/app-core/src/lib/cli-app-integration/webauthn-credential.test.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-fixed.log 2>&1; then
            echo 'Pages typecheck passed.'
          else
            before=$(grep -cE 'error TS[0-9]+' /tmp/duress-original.log || true)
            after=$(grep -cE 'error TS[0-9]+' /tmp/duress-fixed.log || true)
            echo "Pages diagnostics before=$before after=$after; remaining errors block complete migration."
            grep -E 'error TS[0-9]+' /tmp/duress-fixed.log || true
            test "$after" -lt "$before"
          fi
      - name: Verify security and byte round trips
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/app-core exec vitest run src/lib/cli-app-integration/webauthn-credential.test.ts src/lib/cli-app-integration/pairing.test.ts src/lib/cli-app-integration/human-proof.test.ts src/lib/cli-app-integration/session-hygiene.test.ts
          pnpm quality:app-core
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 6e66b439bc80e2b8c03cb4c81b3e0f2121429225
          git diff --exit-code

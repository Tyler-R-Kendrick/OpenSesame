name: Connector session real browser proof
on:
  push:
    branches: [review/2239-browser-b315-v2-20261029]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/2239-browser-b315-v2-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OPENSESAME_CAPABILITY_PROFILE: capability-profiles/rich-explicit.json
      VITE_BASE: /OpenSesame/
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      EVIDENCE_DIR: ${{ github.workspace }}/work/guest-visual
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: af7ffa2b4aba5058ed7d3fccb3aaf41409dfc527
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout capture controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: work/guest-visual-tools
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify immutable source and capture code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = af7ffa2b4aba5058ed7d3fccb3aaf41409dfc527
          test "$(git rev-parse HEAD^{tree})" = f9227caf675250c6b4ab73d2ef48bc572076ab6d
          test "$(git rev-parse HEAD^)" = b315dc17837d2eadd056b1b54dc2a0b68ce19380
          printf '%s  %s\n' 3e2e2c3e9dce101232b86f769152d33ddb7c87a6f60b6d387400d3477dbbf960 work/guest-visual-tools/scripts/review/guest-connector-visual.mjs | sha256sum --check
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE_DIR/source-tree.txt"
          sha256sum pnpm-lock.yaml > "$EVIDENCE_DIR/lock-sha256.txt"
          node --version > "$EVIDENCE_DIR/node-version.txt"
          "$PLAYWRIGHT_CHROMIUM" --version > "$EVIDENCE_DIR/browser-version.txt"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build real Pages distribution
        run: pnpm --filter @opensesame/pages exec vite build
      - name: Capture real guest, locked and genuine vault flows
        run: node work/guest-visual-tools/scripts/review/guest-connector-visual.mjs after "$GITHUB_WORKSPACE" "$EVIDENCE_DIR"
      - name: Upload unapproved review evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: guest-connector-browser-b315-v2
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 14
          if-no-files-found: error

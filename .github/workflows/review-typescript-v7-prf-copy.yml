name: Review TypeScript 7 passkey PRF view copies
on:
  push:
    branches: [review/typescript-v7-prf-copy-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-prf-copy-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: c695766539c14b80cee4cc947e371a5200d98c95
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 1eeaa53cf0cfe62bffa85c371f6ac12c83f0685e
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record original compiler errors
        run: |
          set -euo pipefail
          files=(packages/app-core/src/lib/local-passkeys.ts packages/app-core/src/lib/local-passkey-prf.ts packages/app-core/src/lib/vault/protection/adapters/webauthn-prf-ops.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^:$f" > "$f"; done
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-original.log 2>&1; then exit 1; fi
          grep -E '(local-passkeys|local-passkey-prf|webauthn-prf-ops).ts.*error TS[0-9]+' /tmp/duress-original.log
      - name: Prove prior local passkey copy trusts spoofed buffer metadata
        run: |
          set -euo pipefail
          file=packages/app-core/src/lib/local-passkeys.ts
          trap 'git restore -- "$file"' EXIT
          git show "HEAD^:$file" > "$file"
          if pnpm --filter @opensesame/app-core exec vitest run src/lib/local-passkeys.test.ts -t 'copies local passkey views from their real backing bytes' > /tmp/prf-original.log 2>&1; then cat /tmp/prf-original.log; exit 1; fi
          grep -E 'FAIL.*copies local passkey views from their real backing bytes' /tmp/prf-original.log
      - name: Check exact TypeScript results
        run: |
          set -euo pipefail
          pnpm exec biome check packages/app-core/src/lib/local-passkeys.ts packages/app-core/src/lib/local-passkey-prf.ts packages/app-core/src/lib/vault/protection/adapters/webauthn-prf-ops.ts packages/app-core/src/lib/local-passkeys.test.ts packages/app-core/src/lib/vault/protection/adapters/webauthn-prf.test.ts packages/os-domain/src/buffer-source.ts packages/os-domain/src/__tests__/buffer-source.test.ts packages/os-domain/src/index.ts packages/os-domain/src/browser.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-fixed.log 2>&1; then
            echo 'Pages typecheck passed.'
          else
            before=$(grep -cE 'error TS[0-9]+' /tmp/duress-original.log || true)
            after=$(grep -cE 'error TS[0-9]+' /tmp/duress-fixed.log || true)
            echo "Pages diagnostics before=$before after=$after; remaining errors block complete migration."
            grep -E 'error TS[0-9]+' /tmp/duress-fixed.log || true
            test "$after" -lt "$before"
          fi
      - name: Verify security and byte round trips
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/os-domain exec vitest run src/__tests__/buffer-source.test.ts
          pnpm --filter @opensesame/app-core exec vitest run src/lib/local-passkeys.test.ts src/lib/local-passkeys-lazy.test.ts src/lib/vault/protection/adapters/webauthn-prf.test.ts src/lib/vault/passkey-unlock-session.test.ts
          pnpm quality:app-core
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 1eeaa53cf0cfe62bffa85c371f6ac12c83f0685e
          git diff --exit-code

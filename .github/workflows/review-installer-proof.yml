name: Installer data preservation proof
on:
  push:
    branches: [review/installer-proof-20261029]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 9638640e2688dff59ccc430bf2dd3517f6a8722f
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - run: npx --yes @biomejs/biome@1.9.4 check scripts/security/install-agent-skills-status.test.mjs
      - run: node --test scripts/security/install-agent-skills-status.test.mjs

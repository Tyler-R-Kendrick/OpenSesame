name: Review TypeScript 7 passkey enrolled-key snapshot
on:
  push:
    branches: [review/typescript-v7-auth-snapshot-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-auth-snapshot-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: cfe91524b4a1d5d60cd0d479dca61b2ec14a8b53
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 9bddc24fe5c842520b3f3c18375d6aba2eba03d2
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record original compiler errors
        run: |
          set -euo pipefail
          files=(packages/auth-upstream/src/passkey-verification.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^:$f" > "$f"; done
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-original.log 2>&1; then exit 1; fi
          grep -E 'auth-upstream/src/passkey-verification.ts.*error TS[0-9]+' /tmp/duress-original.log
      - name: Prove mutable and shared keys fail the old verification boundary
        run: |
          set -euo pipefail
          file=packages/auth-upstream/src/passkey-verification.ts
          trap 'git restore -- "$file"' EXIT
          git show "HEAD^:$file" > "$file"
          if pnpm --filter @opensesame/auth-upstream exec vitest run src/__tests__/passkey-verification.test.ts > /tmp/auth-original.log 2>&1; then cat /tmp/auth-original.log; exit 1; fi
          cat /tmp/auth-original.log
          grep -q '2 failed' /tmp/auth-original.log
      - name: Check exact TypeScript results
        run: |
          set -euo pipefail
          pnpm exec biome check packages/auth-upstream/src/passkey-verification.ts packages/auth-upstream/src/__tests__/passkey-verification.test.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-fixed.log 2>&1; then
            echo 'Pages typecheck passed.'
          else
            before=$(grep -cE 'error TS[0-9]+' /tmp/duress-original.log || true)
            after=$(grep -cE 'error TS[0-9]+' /tmp/duress-fixed.log || true)
            echo "Pages diagnostics before=$before after=$after; remaining errors block complete migration."
            grep -E 'error TS[0-9]+' /tmp/duress-fixed.log || true
            test "$after" -lt "$before"
          fi
      - name: Verify security and byte round trips
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/auth-upstream exec vitest run src/__tests__/passkey-verification.test.ts src/__tests__/passkey.test.ts src/__tests__/webauthn-adapter.test.ts
          pnpm quality:app-core
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 9bddc24fe5c842520b3f3c18375d6aba2eba03d2
          git diff --exit-code

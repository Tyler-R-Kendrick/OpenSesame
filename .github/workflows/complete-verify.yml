name: Complete verify

# Execute the full package.json gate on the immutable event commit. Area CI and
# password parity remain separate checks; neither substitutes for this chain.
on:
  pull_request:
    paths:
      - '.github/workflows/complete-verify.yml'
      - 'packages/app-core/src/lib/retired-credentials/**'
      - 'packages/app-core/src/lib/duress/**'
      - 'packages/app-core/src/lib/vault/**'
      - 'packages/app-core/src/lib/secret-fs/**'
      - 'packages/app-core/src/screens/unlock/**'
      - 'packages/app-core/src/sections/settings/security/**'
      - 'packages/vault-core/**'
      - 'apps/pages/src/components/duress/**'
      - 'apps/pages/src/bootstrap/**'
      - 'apps/cli/**'
      - 'apps/android/**'
      - 'apps/browser-extension/**'
      - 'apps/browser-extension-autofill/**'
      - 'crates/human-vault/**'
      - 'crates/sealed-store/**'
      - 'crates/storage/**'
      - 'scripts/test/2password*'
      - 'scripts/test/battle-test.sh'
      - 'scripts/audit/clippy-gate.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Complete pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Require the exact source and physical browser
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          test -x "$PLAYWRIGHT_CHROMIUM"
          "$PLAYWRIGHT_CHROMIUM" --version
          command -v cc
          command -v cmake
          OPENSESAME_AUDIT_DIR="$RUNNER_TEMP/opensesame-full-verify"
          printf 'OPENSESAME_AUDIT_DIR=%s\n' "$OPENSESAME_AUDIT_DIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$OPENSESAME_AUDIT_DIR"
          printf '%s\n' "$EXPECTED_HEAD" > "$OPENSESAME_AUDIT_DIR/source-head.txt"
      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Execute the complete repository gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify 2>&1 | tee "$OPENSESAME_AUDIT_DIR/verify.log"
      - name: Check the original source after the gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Preserve complete-gate logs and failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: complete-verify-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/opensesame-full-verify/
            tests/visual-contract/output/
          if-no-files-found: error

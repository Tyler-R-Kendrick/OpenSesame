name: Local sandbox session quality proof
on:
  push:
    branches: [review/local-session-quality-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/local-session-quality-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 725bada59d436dc5f8f08fc3d7cf465f74880e44
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 725bada59d436dc5f8f08fc3d7cf465f74880e44
          test "$(git rev-parse HEAD^{tree})" = e6289a645204dfa1bb4d916376d36c3c89698c9d
          test -z "$(git status --porcelain)"
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exact anti-slop and format
        run: |
          set -euo pipefail
          pnpm exec biome check packages/agent-sandboxes/e2e/local-session.spec.ts
          pnpm lint:anti-slop
      - name: Typecheck sandbox
        run: pnpm --filter @opensesame/agent-sandboxes typecheck
      - name: Real Chromium session resume
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          test -x "$AGENT_BROWSER_CHROME"
          export AGENT_BROWSER="$PWD/packages/cua-password-reset/node_modules/.bin/agent-browser"
          test -x "$AGENT_BROWSER"
          pnpm --filter @opensesame/agent-sandboxes exec playwright test local-session.spec.ts
      - name: Verify source unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = 725bada59d436dc5f8f08fc3d7cf465f74880e44
          test "$(git rev-parse HEAD^{tree})" = e6289a645204dfa1bb4d916376d36c3c89698c9d
          git diff --exit-code

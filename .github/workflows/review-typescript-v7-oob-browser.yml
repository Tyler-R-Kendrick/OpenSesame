name: Review TypeScript 7 wallet browser compatibility
on:
  push:
    branches: [review/typescript-v7-oob-browser-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-oob-browser-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 9294ef80e00e509ef312af43b136af3d71ed555b
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact source candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 53e56b39ab69447be8221f1a8e0f0713eee554c7
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify actual Chromium WebCrypto behavior
        run: |
          set -euo pipefail
          trap 'rm -f review-wallet-browser.cjs' EXIT
          printf '%s' '' | base64 -d > review-wallet-browser.cjs
          node review-wallet-browser.cjs
      - name: Confirm source tree unchanged
        if: always()
        run: git diff --exit-code

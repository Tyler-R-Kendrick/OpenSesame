name: Password workflow parity
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/password-parity.yml'
      - 'apps/cli/**'
      - 'apps/pages/**'
      - 'apps/browser-extension/**'
      - 'crates/**'
      - 'packages/app-core/**'
      - 'packages/cli/**'
      - 'packages/vault-core/**'
      - 'packages/capability-registry/**'
      - 'packages/mcp-client/**'
      - 'scripts/test/2password*'
      - 'spec/conformance/2password*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'rust-toolchain.toml'
permissions:
  contents: read
concurrency:
  group: password-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: 2password parity gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      VITE_BASE: /OpenSesame/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> .cache/cargo-target'
      - name: Install Linux keychain build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config dbus-daemon
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild and exercise every declared parity contract
        run: pnpm test:2password-parity
      - name: Preserve assertion reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: password-parity-reports
          path: work/2password*report.json
          if-no-files-found: error

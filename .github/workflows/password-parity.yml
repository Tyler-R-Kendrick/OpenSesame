name: Password workflow parity
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: password-parity-${{ github.run_id }}-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  parity:
    name: 2password parity gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      VITE_BASE: /OpenSesame/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          lookup-only: true
          save-if: false
          workspaces: '. -> .cache/cargo-target'
      - name: Install Linux keychain build and test dependencies
        run: bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
      - name: Install dependencies
        run: npm ci
      - name: Rebuild and exercise every declared parity contract
        run: |
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          npm run test:2password-parity
      - name: Preserve assertion reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: password-parity-reports
          path: work/2password*report.json
          if-no-files-found: error

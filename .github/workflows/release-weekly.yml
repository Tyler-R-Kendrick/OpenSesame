# Immutable candidate promotion; schedules qualify one selected source snapshot.
name: Weekly release promotion

on:
  schedule:
    - cron: "17 4 * * 4"
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  attestations: read

# Freeze and qualify one candidate through publication. A newer run must not
# cancel expensive checks or replace a shared prerelease target underneath them.
concurrency:
  group: candidate-release
  cancel-in-progress: false

jobs:
  select:
    name: Weekly selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      candidate_id: ${{ steps.select.outputs.candidate_id }}
      run_id: ${{ steps.select.outputs.run_id }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest }}
      payload_digest: ${{ steps.select.outputs.payload_digest }}
      dev_receipt: ${{ steps.select.outputs.dev_receipt }}
      promote: ${{ steps.select.outputs.promote }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node
      - name: Require implemented and activated release policy
        env:
          GH_TOKEN: ${{ github.token }}
        # Explicit readiness includes implemented publishers and bypass removal.
        # An unset policy must fail; do not turn publish into a silently skipped job.
        run: node scripts/release/candidate.mjs policy --controller release-weekly
      - name: Select once or resume this run's original candidate
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/candidate.mjs select-dev
          --workflow .github/workflows/dev-nightly.yml --max-age-hours 48
          --selection-file "$RUNNER_TEMP/weekly-selection/selection.json"
          --output "$GITHUB_OUTPUT"
      - name: Retain this attempt's immutable selection record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-selection/selection.json
          if-no-files-found: error
          retention-days: 35

  prerelease:
    needs: select
    if: ${{ needs.select.outputs.promote == 'true' }}
    uses: ./.github/workflows/ci-prerelease-checks.yml
    with:
      source_sha: ${{ needs.select.outputs.source_sha }}
      candidate_id: ${{ needs.select.outputs.candidate_id }}
      run_id: ${{ needs.select.outputs.run_id }}
      run_attempt: ${{ needs.select.outputs.run_attempt }}
      artifact_id: ${{ needs.select.outputs.artifact_id }}
      artifact_digest: ${{ needs.select.outputs.artifact_digest }}
      payload_digest: ${{ needs.select.outputs.payload_digest }}
      prerequisite_receipt: ${{ needs.select.outputs.dev_receipt }}
      # Qualification channel: run acceptance against the exact artifact. Any
      # real staging host must be explicitly configured and its payload verified.

  mutation:
    needs: [select, prerelease]
    uses: ./.github/workflows/ci-release-checks.yml
    permissions:
      actions: read
      contents: read
      attestations: read
      security-events: write
    with:
      suite: mutation
      source_sha: ${{ needs.select.outputs.source_sha }}
      candidate_id: ${{ needs.select.outputs.candidate_id }}
      run_id: ${{ needs.select.outputs.run_id }}
      run_attempt: ${{ needs.select.outputs.run_attempt }}
      artifact_id: ${{ needs.select.outputs.artifact_id }}
      artifact_digest: ${{ needs.select.outputs.artifact_digest }}
      payload_digest: ${{ needs.select.outputs.payload_digest }}
      prerequisite_receipt: ${{ needs.prerelease.outputs.receipt }}
      # Mutation builds are disposable test products, never production inputs.

  security:
    needs: [select, prerelease]
    uses: ./.github/workflows/ci-release-checks.yml
    permissions:
      actions: read
      contents: read
      attestations: read
      security-events: write
    with:
      suite: security
      source_sha: ${{ needs.select.outputs.source_sha }}
      candidate_id: ${{ needs.select.outputs.candidate_id }}
      run_id: ${{ needs.select.outputs.run_id }}
      run_attempt: ${{ needs.select.outputs.run_attempt }}
      artifact_id: ${{ needs.select.outputs.artifact_id }}
      artifact_digest: ${{ needs.select.outputs.artifact_digest }}
      payload_digest: ${{ needs.select.outputs.payload_digest }}
      prerequisite_receipt: ${{ needs.prerelease.outputs.receipt }}

  publish:
    needs: [select, prerelease, mutation, security]
    uses: ./.github/workflows/release-publish.yml
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
      attestations: write
    with:
      source_sha: ${{ needs.select.outputs.source_sha }}
      candidate_id: ${{ needs.select.outputs.candidate_id }}
      run_id: ${{ needs.select.outputs.run_id }}
      run_attempt: ${{ needs.select.outputs.run_attempt }}
      artifact_id: ${{ needs.select.outputs.artifact_id }}
      artifact_digest: ${{ needs.select.outputs.artifact_digest }}
      payload_digest: ${{ needs.select.outputs.payload_digest }}
      prerelease_receipt: ${{ needs.prerelease.outputs.receipt }}
      mutation_receipt: ${{ needs.mutation.outputs.receipt }}
      security_receipt: ${{ needs.security.outputs.receipt }}
      # Reusable's credential-bearing jobs use release / github-pages environment
      # protections. Test jobs above receive no environment deployment secrets.
      # Recheck monotonicity, tag/version binding and all receipts before writes.
      # Pages: download exact dist; upload-pages-artifact may repackage it into
      # this run, then deploy-pages. Payload bytes/hash stay fixed; no rebuild or
      # restamping. Use existing pinned actions and the live revision verifier.
      # Publish native runtime packages from production/ only. Preserve explicitly
      # named TEST archives for downstream validation through a separate asset
      # allowlist; never install them as production executables or wildcard-upload.

  result:
    name: Weekly promotion result
    needs: [select, prerelease, mutation, security, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SELECT_RESULT: ${{ needs.select.result }}
      PROMOTE: ${{ needs.select.outputs.promote }}
      PRERELEASE_RESULT: ${{ needs.prerelease.result }}
      MUTATION_RESULT: ${{ needs.mutation.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
    steps:
      - name: Accept only complete publication or the explicit identical-release no-op
        run: |
          test "$SELECT_RESULT" = success
          case "$PROMOTE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$PRERELEASE_RESULT" = "$expected"
          test "$MUTATION_RESULT" = "$expected"
          test "$SECURITY_RESULT" = "$expected"
          test "$PUBLISH_RESULT" = "$expected"

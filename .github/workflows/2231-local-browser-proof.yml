name: Review agent-sandboxes local browser session
on:
  push:
    branches: [review/2231-local-browser-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/2231-local-browser-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: controller
          persist-credentials: false
      - name: Checkout exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 94ae8c354144bffe0a40076cae6021c60f63cc85
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify exact source and proposed Playwright config
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 94ae8c354144bffe0a40076cae6021c60f63cc85
          test "$(git rev-parse HEAD^{tree})" = 355288831f10b818d9985040cab7b49194e82977
          printf '%s  %s\n' 29970eca8417c89be81f7a8cf3d3d1a99afcbe1a13c7fda32f88257e6de41f99 ../controller/.github/verify-inputs/2231-playwright-config.patch | sha256sum --check
          git apply --index ../controller/.github/verify-inputs/2231-playwright-config.patch
          test "$(git write-tree)" = c544711432e4f4aa40a8d83072b4065319f839e6
          git diff --exit-code
      - name: Install frozen dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run unfiltered package browser suite
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          test -x "$AGENT_BROWSER_CHROME"
          export AGENT_BROWSER="$PWD/packages/cua-password-reset/node_modules/.bin/agent-browser"
          test -x "$AGENT_BROWSER"
          pnpm --filter @opensesame/agent-sandboxes test:e2e
      - name: Verify source after test
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 94ae8c354144bffe0a40076cae6021c60f63cc85
          test "$(git write-tree)" = c544711432e4f4aa40a8d83072b4065319f839e6
          git diff --exit-code

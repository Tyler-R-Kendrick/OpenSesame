name: Review TypeScript 7 passkey user ID byte range
on:
  push:
    branches: [review/typescript-v7-passkey-userid-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-passkey-userid-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3f55a8eb3bb45ac4710092e999c28f3cd3a8dc52
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 23e00297572f58be93a3b77b5aec73645fabb949
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record original compiler errors
        run: |
          set -euo pipefail
          files=(packages/app-core/src/lib/vault/passkey-unlock-session.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^:$f" > "$f"; done
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-original.log 2>&1; then exit 1; fi
          grep -E 'vault/passkey-unlock-session.ts.*error TS[0-9]+' /tmp/duress-original.log
      - name: Check exact TypeScript results
        run: |
          set -euo pipefail
          pnpm exec biome check packages/app-core/src/lib/vault/passkey-unlock-session.ts packages/app-core/src/lib/vault/passkey-unlock-session.test.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-fixed.log 2>&1; then
            echo 'Pages typecheck passed.'
          else
            before=$(grep -cE 'error TS[0-9]+' /tmp/duress-original.log || true)
            after=$(grep -cE 'error TS[0-9]+' /tmp/duress-fixed.log || true)
            echo "Pages diagnostics before=$before after=$after; remaining errors block complete migration."
            grep -E 'error TS[0-9]+' /tmp/duress-fixed.log || true
            test "$after" -lt "$before"
          fi
      - name: Verify security and byte round trips
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/app-core exec vitest run src/lib/vault/passkey-unlock-session.test.ts src/lib/vault/unlock-factor-prf-crypto.test.ts src/lib/vault/protection/adapters/webauthn-prf.test.ts
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 23e00297572f58be93a3b77b5aec73645fabb949
          git diff --exit-code

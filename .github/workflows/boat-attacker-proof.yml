name: Review Boat hosted relay destination binding
on:
  push:
    branches: [review/boat-attacker-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/boat-attacker-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: controller
          persist-credentials: false
      - name: Checkout main for baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: baseline
          ref: 7e2b44d22673abdf710f5e611887b663744f1868
          persist-credentials: false
      - name: Checkout main for candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: d68cc3c75ebf43224e339f2d1448afadd671bedc
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Apply exact synthetic regression and candidate
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = 7e2b44d22673abdf710f5e611887b663744f1868
          test "$(git -C candidate rev-parse HEAD)" = d68cc3c75ebf43224e339f2d1448afadd671bedc
          test "$(git -C candidate rev-parse HEAD^{tree})" = 6400049687022ccfe17e4a1a1756605e1b021b5e
          printf '%s  %s\n' 992913a56660f416ed31ae530ec153ae1f03b0e6dd56e7faba8249d3011b3afe controller/.github/verify-inputs/boat-attack-baseline.patch | sha256sum --check
          git -C baseline apply --index ../controller/.github/verify-inputs/boat-attack-baseline.patch
          git -C candidate apply --index ../controller/.github/verify-inputs/boat-attack-baseline.patch
          test "$(git -C baseline write-tree)" = 4027801f1cb7e6868c409a55a3fa611d71543685
          test "$(git -C candidate write-tree)" = c19035e53636a4522f8561b662876facd5596c56
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code
      - name: Install frozen graphs
        run: |
          set -euo pipefail
          (cd baseline && pnpm install --frozen-lockfile --ignore-scripts)
          (cd candidate && pnpm install --frozen-lockfile --ignore-scripts)
      - name: Demonstrate baseline synthetic token and secret delivery
        working-directory: baseline
        run: |
          set -uo pipefail
          set +e
          pnpm --filter @opensesame/agent-sandboxes exec vitest run src/boat-hosted-destination.test.ts --maxWorkers=1 > "$RUNNER_TEMP/boat-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/boat-red.log"
          test "$status" -ne 0
          grep -F 'BOAT_RELAY_PROBE bearer=true secret=true connections=' "$RUNNER_TEMP/boat-red.log"
      - name: Verify destination binding, tests and types
        working-directory: candidate
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/agent-sandboxes typecheck
          pnpm --filter @opensesame/agent-sandboxes test
      - name: Verify real-browser provider suite
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          export AGENT_BROWSER="$PWD/packages/cua-password-reset/node_modules/.bin/agent-browser"
          test -x "$AGENT_BROWSER"
          pnpm --fail-if-no-match --filter @opensesame/agent-sandboxes test:e2e
      - name: Full quality gate
        if: success() || failure()
        working-directory: candidate
        run: pnpm quality:gate
      - name: Verify tested source trees
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C baseline write-tree)" = 4027801f1cb7e6868c409a55a3fa611d71543685
          test "$(git -C candidate write-tree)" = c19035e53636a4522f8561b662876facd5596c56
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code

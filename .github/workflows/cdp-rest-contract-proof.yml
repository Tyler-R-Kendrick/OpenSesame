name: Review Cloudflare REST contract and credential routing
on:
  push:
    branches: [review/cdp-rest-contract-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/cdp-rest-contract-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated review controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: controller
          persist-credentials: false
      - name: Checkout exact draft source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: c4681fa6e08fec30bbe116b49ac4c678145590f8
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify and apply exact candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c4681fa6e08fec30bbe116b49ac4c678145590f8
          test "$(git rev-parse HEAD^{tree})" = 926de276804e924b89ddb2a39a533c3317ae83a2
          printf '%s  %s\n' f497b89bdd9479e32229aae0bf69b58f76f857c6d589584e40a98e2423d0a2bf ../controller/.github/verify-inputs/cdp-rest-contract.patch | sha256sum --check
          git apply --index ../controller/.github/verify-inputs/cdp-rest-contract.patch
          test "$(git write-tree)" = 7ede46251d37a3f152705cd57698ccefb00f1610
          git diff --exit-code
      - name: Install frozen dependency graph
        working-directory: candidate
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify formatting and types
        working-directory: candidate
        run: |
          set -euo pipefail
          pnpm exec biome check packages/agent-sandboxes/src/cloudflare-client.ts packages/agent-sandboxes/src/cloudflare-client.test.ts packages/agent-sandboxes/src/cloudflare-redirect.test.ts packages/agent-sandboxes/src/cloudflare-provider.ts packages/agent-sandboxes/src/cloudflare-provider.test.ts packages/agent-sandboxes/src/cdp-node-socket.ts packages/agent-sandboxes/e2e/cloudflare.spec.ts
          pnpm --filter @opensesame/agent-sandboxes typecheck
      - name: Verify provider and real redirect negative controls
        working-directory: candidate
        run: pnpm --filter @opensesame/agent-sandboxes test
      - name: Verify fake REST and real browser end to end
        working-directory: candidate
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          test -x "$PLAYWRIGHT_CHROMIUM"
          export AGENT_BROWSER="$PWD/packages/cua-password-reset/node_modules/.bin/agent-browser"
          test -x "$AGENT_BROWSER"
          pnpm --filter @opensesame/agent-sandboxes test:e2e
      - name: Full quality gate
        working-directory: candidate
        run: pnpm quality:gate
      - name: Verify exact source after checks
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c4681fa6e08fec30bbe116b49ac4c678145590f8
          test "$(git write-tree)" = 7ede46251d37a3f152705cd57698ccefb00f1610
          git diff --exit-code

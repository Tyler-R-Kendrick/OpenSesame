name: Autofill browser E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/autofill-browser.yml'
      - 'apps/browser-extension-autofill/**'
      - 'crates/daemon/src/fill/**'
      - 'apps/cli/src/daemon_fill.rs'
      - 'packages/capability-registry/**'
      - 'packages/os-domain/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Cargo.lock'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autofill-browser-${{ inputs.source_sha && github.run_id || github.event.pull_request.number || github.ref }}-${{ inputs.source_sha || 'direct' }}
  cancel-in-progress: ${{ !inputs.source_sha }}

jobs:
  browser:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install full Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the built autofill extension
        env:
          AUTOFILL_E2E_EVIDENCE_DIR: ${{ runner.temp }}/autofill-review
        run: pnpm --filter @opensesame/browser-extension-autofill test:e2e
      # Review material only: screenshots show the real popup and never the
      # login field, browser profile, pairing bearer, console or daemon state.
      - name: Retain popup captures for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: autofill-review-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autofill-review/*.png
          if-no-files-found: ignore
          retention-days: 7

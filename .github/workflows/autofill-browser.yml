name: Autofill browser E2E

on:
  # Browser tests qualify the frozen prerelease candidate, or run on demand.
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autofill-browser-${{ inputs.source_sha && github.run_id || github.ref }}-${{ inputs.source_sha || 'direct' }}
  cancel-in-progress: ${{ !inputs.source_sha }}

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node
      - name: Install locked dependencies
        run: npm ci
      - name: Install full Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Exercise the built autofill extension
        env:
          AUTOFILL_E2E_EVIDENCE_DIR: ${{ runner.temp }}/autofill-review
        run: npm run test:e2e -w @opensesame/browser-extension-autofill
      # Review material only: screenshots show the real popup and never the
      # login field, browser profile, pairing bearer, console or daemon state.
      - name: Retain popup captures for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autofill-review-${{ inputs.source_sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autofill-review/*.png
          if-no-files-found: ignore
          retention-days: 7

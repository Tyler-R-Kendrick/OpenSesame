name: JWT fail-closed upgrade proof
on:
  push:
    branches: [review/jwt-tests-only-proof-fe93-20261030]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5d4e568ecc11e92159f2668545af73458c33f8c3
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = 5d4e568ecc11e92159f2668545af73458c33f8c3
          test "$(git rev-parse HEAD^{tree})" = df62d29ed99ab9f7ca91a956524b411ce6970adf
          test "$(git rev-parse HEAD^)" = fe93e63e9849be949aa72994a2c5dc08b45d4759
      - name: Check formatting
        run: rustfmt --edition 2021 --check crates/proof/src/jwk.rs crates/proof/src/adversarial.rs crates/proof/src/adversarial_jwk.rs crates/proof/src/lib.rs
      - name: Prepare DBus
        run: bash scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
      - name: Test proof policy and negative controls
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          cargo test -p opensesame-proof --locked
      - name: Apply repository Clippy policy to the proof crate
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/opensesame-dbus/env.sh"
          cargo clippy -p opensesame-proof --all-targets --all-features --message-format=short -- \
            -D warnings -D clippy::pedantic -D clippy::cognitive_complexity \
            -D clippy::excessive_nesting -D clippy::too_many_lines \
            -D clippy::too_many_arguments -D clippy::type_complexity

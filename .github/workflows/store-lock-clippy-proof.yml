name: Verify store lock lint and contracts
on:
  push:
    branches: [review/store-lock-clippy-proof]
permissions:
  contents: read
jobs:
  proof:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/store-lock-clippy-proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: bf9a13f6b00466c6a346252159f61195e9a47a78
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bf9a13f6b00466c6a346252159f61195e9a47a78
          test "$(git rev-parse HEAD^{tree})" = 6c9e824a4dc947d8745098f078d6a5d8c375a9ca
          test "$(git rev-parse HEAD^)" = 63f05c8ea433fbb4fa130ad9af66ba43b8e38db3
          git diff --exit-code
          git diff --cached --exit-code
      - name: Prepare Linux keychain build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config dbus-daemon
      - name: Check formatting and the original strict Clippy rules
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package opensesame-sealed-store -- --check
          cargo clippy --locked -p opensesame-sealed-store --all-targets --all-features --message-format=short -- \
            -D warnings -D clippy::pedantic -D clippy::cognitive_complexity -D clippy::excessive_nesting \
            -D clippy::too_many_lines -D clippy::too_many_arguments -D clippy::type_complexity
      - name: Check fork and physical lock contracts
        run: |
          cargo test --locked -p opensesame-sealed-store --lib store_lock:: -- --nocapture
      - name: Verify source stayed unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 6c9e824a4dc947d8745098f078d6a5d8c375a9ca
          git diff --exit-code
          git diff --cached --exit-code

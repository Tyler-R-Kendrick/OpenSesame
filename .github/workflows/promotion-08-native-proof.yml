name: Review promotion ce7 native assets
on:
  workflow_dispatch:
  push:
    branches: [review/promotion-08-native-proof]
permissions:
  contents: read
jobs:
  verify:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/promotion-08-native-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ce7d267c3d4dc3fc2424e145a4426557de27fc0c
          persist-credentials: false
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ce7d267c3d4dc3fc2424e145a4426557de27fc0c
          test "$(git rev-parse HEAD^{tree})" = f636d2300426eccf151656385e0a9de5e433b6fe
          test "$(git rev-parse HEAD^)" = 08b55360d0c153603d8311444131565fc0b498a7
          git diff --exit-code
          git diff --cached --exit-code
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify native assets and exact assertions
        run: pnpm --filter @opensesame/pages exec vitest run scripts/tailscale-wasm-assets.test.mjs
      - name: Verify source after test
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ce7d267c3d4dc3fc2424e145a4426557de27fc0c
          git diff --exit-code
          git diff --cached --exit-code

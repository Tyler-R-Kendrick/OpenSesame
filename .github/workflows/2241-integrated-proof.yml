name: Review combined connector scope and wallet policy
on:
  push:
    branches: [review/2241-integrated-proof-v2-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/2241-integrated-proof-v2-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: e50c6e32117de1ea96a8ce4f29cffb389d0ab6aa
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify source and candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e50c6e32117de1ea96a8ce4f29cffb389d0ab6aa
          test "$(git rev-parse HEAD^{tree})" = b5e81fadaf3862f8c97afcf0377eeee5580a5d9d
          printf '%s  %s\n' fdf809d0c4cfb76f0b1917aa31b6f6699482a3494aa108aa6c64eb36f3e03e5e ../controller/.github/verify-inputs/2241-combined.patch | sha256sum --check
          git apply --index ../controller/.github/verify-inputs/2241-combined.patch
          test "$(git write-tree)" = ae4c6d7fb45255eb6abcc42421b8934fcbf1e0cf
          git diff --exit-code
      - name: Install frozen dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check affected formatting and types
        working-directory: candidate
        run: |
          set -euo pipefail
          pnpm exec biome check packages/app-core/package.json packages/app-core/scripts/emit-google-wallet-configuration.d.mts packages/app-core/scripts/emit-google-wallet-configuration.mjs packages/app-core/src/lib/native-catalog-configuration-validation.ts packages/app-core/src/lib/native-catalog-google-wallet-conformance.test.ts packages/app-core/src/lib/native-connector-scope-view.test.ts packages/app-core/src/lib/native-connector-view.ts packages/app-core/src/lib/native-google-wallet-configuration.ts packages/app-core/src/lib/native-google-wallet-policy.test.ts packages/app-core/src/lib/native-mcp-attestation.ts packages/app-core/src/lib/native-mcp-authorization.ts packages/app-core/src/lib/native-mcp-cleanup.ts packages/app-core/src/lib/native-mcp-connectors.test-support.ts packages/app-core/src/lib/native-mcp-oauth.ts packages/app-core/src/lib/native-mcp-partial-refresh.ts packages/app-core/src/lib/native-mcp-proof.ts packages/app-core/src/lib/native-mcp-refresh-recovery.test.ts packages/app-core/src/lib/native-mcp-refresh.ts packages/app-core/src/lib/native-mcp-scope-recovery.test.ts packages/app-core/src/lib/native-mcp-session.ts packages/app-core/src/lib/native-mcp-token-receipt.ts packages/app-core/src/lib/native-oauth-client-exchange.ts packages/app-core/src/lib/native-oauth-client-google-exchange.test.ts packages/app-core/src/lib/native-oauth-client-scope-retention.test.ts packages/app-core/src/lib/native-oauth-client-scopes.ts packages/app-core/src/lib/native-oauth-client.test.ts packages/app-core/src/lib/native-oauth-mcp-resource.ts packages/app-core/src/lib/native-oauth-resource.ts packages/wallet/package.json packages/wallet/src/config.ts packages/wallet/src/google-wallet-policy.generated.ts packages/wallet/src/google-wallet-policy.test.ts packages/wallet/src/google-wallet-policy.ts spec/conformance/google-wallet-configuration.json spec/connectors/google-wallet-configuration.json
          pnpm lint:anti-slop:files packages/app-core/scripts/emit-google-wallet-configuration.d.mts packages/app-core/scripts/emit-google-wallet-configuration.mjs packages/app-core/src/lib/native-catalog-configuration-validation.ts packages/app-core/src/lib/native-catalog-google-wallet-conformance.test.ts packages/app-core/src/lib/native-connector-scope-view.test.ts packages/app-core/src/lib/native-connector-view.ts packages/app-core/src/lib/native-google-wallet-configuration.ts packages/app-core/src/lib/native-google-wallet-policy.test.ts packages/app-core/src/lib/native-mcp-attestation.ts packages/app-core/src/lib/native-mcp-authorization.ts packages/app-core/src/lib/native-mcp-cleanup.ts packages/app-core/src/lib/native-mcp-connectors.test-support.ts packages/app-core/src/lib/native-mcp-oauth.ts packages/app-core/src/lib/native-mcp-partial-refresh.ts packages/app-core/src/lib/native-mcp-proof.ts packages/app-core/src/lib/native-mcp-refresh-recovery.test.ts packages/app-core/src/lib/native-mcp-refresh.ts packages/app-core/src/lib/native-mcp-scope-recovery.test.ts packages/app-core/src/lib/native-mcp-session.ts packages/app-core/src/lib/native-mcp-token-receipt.ts packages/app-core/src/lib/native-oauth-client-exchange.ts packages/app-core/src/lib/native-oauth-client-google-exchange.test.ts packages/app-core/src/lib/native-oauth-client-scope-retention.test.ts packages/app-core/src/lib/native-oauth-client-scopes.ts packages/app-core/src/lib/native-oauth-client.test.ts packages/app-core/src/lib/native-oauth-mcp-resource.ts packages/app-core/src/lib/native-oauth-resource.ts packages/wallet/src/config.ts packages/wallet/src/google-wallet-policy.generated.ts packages/wallet/src/google-wallet-policy.test.ts packages/wallet/src/google-wallet-policy.ts
          pnpm --filter @opensesame/app-core typecheck
          pnpm --filter @opensesame/wallet typecheck
          pnpm quality:gate
      - name: Exercise OAuth and wallet policy
        working-directory: candidate
        run: pnpm --filter @opensesame/app-core exec vitest run src/lib/native-oauth-client-google-exchange.test.ts src/lib/native-oauth-client-scope-retention.test.ts src/lib/native-connector-scope-view.test.ts src/lib/native-oauth-client.test.ts src/lib/native-connector-records.storage.test.ts src/lib/native-oauth-resource-acceptance.test.ts src/lib/native-oauth-resource.test.ts src/lib/native-oauth-mcp.integration.test.ts src/lib/native-oauth-mcp-binding.integration.test.ts src/lib/native-google-wallet-policy.test.ts src/lib/native-catalog-configuration.test.ts src/lib/native-catalog-google-wallet-conformance.test.ts
      - name: Exercise MCP authorization and recovery
        working-directory: candidate
        run: pnpm --filter @opensesame/app-core exec vitest run src/lib/native-mcp-connectors.test.ts src/lib/native-mcp-scope-recovery.test.ts src/lib/native-mcp-refresh-recovery.test.ts src/lib/native-mcp-oauth.test.ts src/lib/native-mcp-registration-cleanup.test.ts src/lib/native-mcp-registration-retention.test.ts
      - name: Run wallet tests
        working-directory: candidate
        run: pnpm --filter @opensesame/wallet test
      - name: Check candidate unchanged
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e50c6e32117de1ea96a8ce4f29cffb389d0ab6aa
          test "$(git write-tree)" = ae4c6d7fb45255eb6abcc42421b8934fcbf1e0cf
          git diff --exit-code

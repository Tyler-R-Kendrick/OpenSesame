name: Review TypeScript 7 quorum WebAuthn input snapshots
on:
  push:
    branches: [review/typescript-v7-quorum-toctou-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-quorum-toctou-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 20ecca427de4702c4e581e6644119eab28079483
          fetch-depth: 3
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 91dd39014aa4a3aa8bbd909662389ddaf68a56fc
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record original compiler errors
        run: |
          set -euo pipefail
          files=(packages/app-core/src/lib/quorum/ceremony.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^^:$f" > "$f"; done
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-original.log 2>&1; then exit 1; fi
          grep -E 'quorum/ceremony.ts.*error TS[0-9]+' /tmp/duress-original.log
      - name: Prove unowned and mutable ceremony bytes fail the prior boundary tests
        run: |
          set -euo pipefail
          file=packages/app-core/src/lib/quorum/ceremony.ts
          trap 'git restore -- "$file"' EXIT
          git show "HEAD^^:$file" > "$file"
          if pnpm --filter @opensesame/app-core exec vitest run src/lib/quorum/ceremony-boundaries.test.ts > /tmp/ceremony-original.log 2>&1; then cat /tmp/ceremony-original.log; exit 1; fi
          cat /tmp/ceremony-original.log
          grep -q 'requires PRF output when the first PRF getter value requested it' /tmp/ceremony-original.log
          grep -q 'does not allow the container to relax required PRF policy in flight' /tmp/ceremony-original.log
      - name: Prove later getter mutates the previous candidate PRF input
        run: |
          set -euo pipefail
          file=packages/app-core/src/lib/quorum/ceremony.ts
          trap 'git restore -- "$file"' EXIT
          git show "HEAD^:$file" > "$file"
          if pnpm --filter @opensesame/app-core exec vitest run src/lib/quorum/ceremony-boundaries.test.ts -t 'snapshots the PRF view before later option getters' > /tmp/ceremony-race.log 2>&1; then cat /tmp/ceremony-race.log; exit 1; fi
          grep -E 'snapshots the PRF view before later option getters' /tmp/ceremony-race.log
      - name: Check exact TypeScript results
        run: |
          set -euo pipefail
          pnpm exec biome check packages/app-core/src/lib/quorum/ceremony.ts packages/app-core/src/lib/quorum/ceremony-boundaries.test.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-fixed.log 2>&1; then
            echo 'Pages typecheck passed.'
          else
            before=$(grep -cE 'error TS[0-9]+' /tmp/duress-original.log || true)
            after=$(grep -cE 'error TS[0-9]+' /tmp/duress-fixed.log || true)
            echo "Pages diagnostics before=$before after=$after; remaining errors block complete migration."
            grep -E 'error TS[0-9]+' /tmp/duress-fixed.log || true
            test "$after" -lt "$before"
          fi
      - name: Verify security and byte round trips
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/app-core exec vitest run src/lib/quorum/ceremony-boundaries.test.ts src/lib/quorum/webauthn.test.ts src/lib/quorum/protocol.test.ts src/lib/quorum/protocol.defense.test.ts
          pnpm quality:app-core
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 91dd39014aa4a3aa8bbd909662389ddaf68a56fc
          git diff --exit-code

name: Deploy GitHub Pages PWA

on:
  push:
    branches: [main]
    paths:
      - "apps/pages/**"
      - "packages/api-client/**"
      - "packages/client-core/**"
      - "packages/sdk-browser/**"
      - "packages/contracts/**"
      - ".github/workflows/pages.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Pages PWA
        env:
          VITE_BASE: /OpenSesame/
        run: pnpm --filter @opensesame/pages build
      - name: SPA fallback for deep links
        run: cp apps/pages/dist/index.html apps/pages/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pages/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Build selected successful main snapshots once; no publishing or independent schedule.
# Trusted pipeline helpers and selected application source have separate checkouts.
name: Candidate build
'on':
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_ci_run_id:
        required: true
        type: string
      source_ci_run_attempt:
        required: true
        type: string
    outputs:
      candidate_id:
        value: ${{ jobs.resolve.outputs.candidate_id }}
      source_sha:
        value: ${{ jobs.resolve.outputs.source_sha }}
      run_id:
        value: ${{ github.run_id }}
      run_attempt:
        value: ${{ github.run_attempt }}
      artifact_id:
        value: ${{ jobs.manifest.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.manifest.outputs.artifact_digest }}
      payload_digest:
        value: ${{ jobs.manifest.outputs.payload_digest }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit; 40 lowercase hex
        required: true
        type: string
      source_ci_run_id:
        description: Successful push-main CI run
        required: true
        type: string
      source_ci_run_attempt:
        description: Exact successful CI attempt
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-build-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      candidate_id: ${{ steps.identity.outputs.candidate_id }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      epoch: ${{ steps.identity.outputs.epoch }}
    steps:
    - name: Refuse a caller or manual dispatch outside main
      run: '[ "$GITHUB_REF" = refs/heads/main ]'
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.workflow_sha }}
        fetch-depth: 0
        persist-credentials: false
        path: .ci-control
    - name: Resolve exact identity and successful fast-CI evidence
      id: identity
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        CI_RUN_ID: ${{ inputs.source_ci_run_id }}
        CI_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ && "$CI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
        gh api "repos/$GH_REPO/actions/workflows/ci.yml" > "$RUNNER_TEMP/workflow.json"
        gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/attempts/$CI_ATTEMPT" > "$RUNNER_TEMP/ci.json"
        python3 - <<'PY'
        import json, os, pathlib, re, subprocess, tomllib
        env = os.environ
        run = json.loads(pathlib.Path(env['RUNNER_TEMP'], 'ci.json').read_text())
        workflow = json.loads(pathlib.Path(env['RUNNER_TEMP'], 'workflow.json').read_text())
        expected = {'id': int(env['CI_RUN_ID']), 'run_attempt': int(env['CI_ATTEMPT']),
                    'workflow_id': workflow['id'], 'head_sha': env['SOURCE_SHA'],
                    'head_branch': 'main', 'event': 'push', 'status': 'completed', 'conclusion': 'success'}
        if workflow.get('path') != '.github/workflows/ci.yml':
            raise SystemExit('Unexpected fast-CI workflow')
        if any(run.get(key) != value for key, value in expected.items()):
            raise SystemExit('Source does not have the specified successful push-main CI attempt')
        if any(run.get(key, {}).get('full_name') != env['GH_REPO']
               for key in ('repository', 'head_repository')):
            raise SystemExit('CI evidence belongs to another repository')
        def git(*args):
            return subprocess.check_output(['git', *args], text=True).strip()
        version = tomllib.loads(git('show', env['SOURCE_SHA'] + ':Cargo.toml'))['workspace']['package']['version']
        if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version):
            raise SystemExit('Choose a prospective stable workspace version before building')
        identity = f"{env['SOURCE_SHA']}-{env['GITHUB_RUN_ID']}-{env['GITHUB_RUN_ATTEMPT']}"
        values = {'source_sha': env['SOURCE_SHA'], 'candidate_id': identity, 'version': version,
                  'tag': 'v' + version, 'epoch': git('show', '-s', '--format=%ct', env['SOURCE_SHA'])}
        with open(env['GITHUB_OUTPUT'], 'a') as output:
            for key, value in values.items(): output.write(f'{key}={value}\n')
        PY
      working-directory: .ci-control
  bridge:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Check out trusted pipeline helpers
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.workflow_sha }}
        path: .ci-control
        persist-credentials: false
        sparse-checkout: |-
          .github/workflows
          scripts/release
          scripts/lib
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ needs.resolve.outputs.source_sha }}
        persist-credentials: false
        path: src
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      with:
        version: 9.15.0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 22
    - run: pnpm install --frozen-lockfile --ignore-scripts --filter "@opensesame/env-spec-bridge..."
    - run: pnpm --filter @opensesame/env-spec-bridge test
    - run: node packages/env-spec-bridge/scripts/bundle.mjs dist/opensesame-env-parse.mjs
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ needs.resolve.outputs.candidate_id }}-bridge
        path: src/dist/opensesame-env-parse.mjs
        if-no-files-found: error
        retention-days: 7
    defaults:
      run:
        working-directory: src
  pages:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.epoch }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VITE_BASE: /OpenSesame/
      PAGES_DEPLOYMENT_PROFILE: shared_origin_demo
      PAGES_CANONICAL_ORIGIN: https://tyler-r-kendrick.github.io
      PAGES_HEADER_SECURITY: '0'
    steps:
    - name: Check out trusted pipeline helpers
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.workflow_sha }}
        path: .ci-control
        persist-credentials: false
        sparse-checkout: |-
          .github/workflows
          scripts/release
          scripts/lib
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ needs.resolve.outputs.source_sha }}
        persist-credentials: false
        path: src
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      with:
        version: 9.15.0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 22
        package-manager-cache: false
    - run: pnpm install --frozen-lockfile
    - name: Build all dependencies and production Pages, then freeze its bytes
      run: |
        set -euo pipefail
        pnpm exec turbo run build --filter=@opensesame/pages --force --env-mode=loose
        cp apps/pages/dist/index.html apps/pages/dist/404.html
        touch apps/pages/dist/.nojekyll
        node apps/pages/scripts/write-runtime-config.mjs
        node ../.ci-control/scripts/release/pages-release.mjs stamp apps/pages/dist "$SOURCE_SHA"
        mkdir -p packed
        tar -C apps/pages/dist --format=ustar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
          --owner=0 --group=0 --numeric-owner -cf - . | gzip -n -9 > "packed/opensesame-pages_${TAG}.tar.gz"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ needs.resolve.outputs.candidate_id }}-pages
        path: src/packed/*.tar.gz
        if-no-files-found: error
        retention-days: 7
    defaults:
      run:
        working-directory: src
  native:
    needs:
    - resolve
    - bridge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.epoch }}
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
    - name: Check out trusted pipeline helpers
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.workflow_sha }}
        path: .ci-control
        persist-credentials: false
        sparse-checkout: |-
          .github/workflows
          scripts/release
          scripts/lib
          scripts/ci
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ needs.resolve.outputs.source_sha }}
        persist-credentials: false
        path: src
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: 1.88.0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 22
        package-manager-cache: false
    - name: Prepare Linux keychain dependencies without changing system packages
      run: bash ../.ci-control/scripts/ci/prepare-dbus.sh "$RUNNER_TEMP/opensesame-dbus"
    - name: Verify the original bridge upload before extraction
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_ID: ${{ needs.resolve.outputs.candidate_id }}
      run: node ../.ci-control/scripts/release/artifact-transfer.mjs named "${CANDIDATE_ID}-bridge" bridge
    - name: Build shipped binaries and separately capture the test proxy
      run: |
        set -euo pipefail
        source "$RUNNER_TEMP/opensesame-dbus/env.sh"
        [ "$(rustc +1.88.0 -vV | sed -n 's/^host: //p')" = "$TARGET" ]
        export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/opensesame --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
        export CARGO_TARGET_DIR="$PWD/target"
        mkdir -p bins
        cargo +1.88.0 build --locked --release -p opensesame-cli --bin opensesame
        cp target/release/opensesame bins/opensesame
        [ "$(bins/opensesame --version)" = "opensesame ${TAG#v}" ]
        cargo +1.88.0 build --locked --release -p opensesame-surrogate-proxy --bin opensesame-surrogate-proxy
        cp target/release/opensesame-surrogate-proxy bins/opensesame-surrogate-proxy
        cargo +1.88.0 build --locked --release -p opensesame-surrogate-proxy --features upstream-override --bin opensesame-surrogate-proxy
        cp target/release/opensesame-surrogate-proxy bins/opensesame-surrogate-proxy-TEST-upstream-override
        OPENSESAME_RELEASE_LICENSE="$PWD/LICENSE" ../.ci-control/scripts/release/kit-archive.sh pack "$TAG" "$TARGET" bins bridge/opensesame-env-parse.mjs dist
    - name: Smoke the actual archived kit and reject a writable bridge
      run: bash ../.ci-control/scripts/release/smoke-kit.sh "dist/opensesame-kit_${TAG}_${TARGET}.tar.gz"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ needs.resolve.outputs.candidate_id }}-kit-${{ matrix.target }}
        path: src/dist/opensesame-kit_*.tar.gz
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ needs.resolve.outputs.candidate_id }}-test-proxy-${{ matrix.target }}
        path: src/dist/opensesame-surrogate-proxy-TEST-upstream-override_*.tar.gz
        if-no-files-found: error
        retention-days: 7
    defaults:
      run:
        working-directory: src
  manifest:
    needs:
    - resolve
    - bridge
    - pages
    - native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      payload_digest: ${{ steps.manifest.outputs.payload_digest }}
    steps:
    - name: Check out trusted pipeline helpers
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.workflow_sha }}
        path: .ci-control
        persist-credentials: false
        sparse-checkout: |-
          .github/workflows
          scripts/release
          scripts/lib
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 22
        package-manager-cache: false
    - name: Download each exact original upload with a failing SHA256 comparison
      run: node .ci-control/scripts/release/collect-build.mjs
    - name: Validate the complete production and test inventory
      id: manifest
      run: |-
        python3 .ci-control/scripts/release/build-manifest.py payload
        node .ci-control/scripts/release/provenance.mjs prepare payload build-predicate.json build-subjects.sha256
    - name: Sign original build evidence for the selected snapshot
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-checksums: build-subjects.sha256
        predicate-type: https://opensesame.dev/attestations/candidate-build/v1
        predicate-path: build-predicate.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: upload
      with:
        name: ${{ needs.resolve.outputs.candidate_id }}-complete
        path: payload/
        if-no-files-found: error
        retention-days: 35
    name: Candidate build gate
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      CANDIDATE_ID: ${{ needs.resolve.outputs.candidate_id }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
      SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
      GH_TOKEN: ${{ github.token }}

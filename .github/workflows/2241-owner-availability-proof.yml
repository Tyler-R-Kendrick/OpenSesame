name: Connector owner and local availability proof
on:
  push:
    branches: [review/2241-owner-availability-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/2241-owner-availability-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 0cab13b48795c979b45564589d1650e39b57216f
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify exact input
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0cab13b48795c979b45564589d1650e39b57216f
          test "$(git rev-parse HEAD^{tree})" = a64ca35498944e38f527e68ed70dce5d497f4852
          printf '%s  %s\n' ca76ac8f805b39fa3b96bb74357efab4397415089e79c4b01f039e593b393804 ../controller/.github/verify-inputs/2241-owner-availability.patch | sha256sum --check
          git apply --index ../controller/.github/verify-inputs/2241-owner-availability.patch
          test "$(git write-tree)" = 475ea84f408d7eea4cb32eb2ce6b7f512c797d0e
          git diff --exit-code
      - name: Install frozen dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting and strict lint
        working-directory: candidate
        run: |
          set -euo pipefail
          pnpm exec biome check apps/pages/src/sections/connections/connect/NativeConnectorForm.tsx apps/pages/src/sections/connections/connect/NativeConnectorPanels.tsx apps/pages/src/sections/connections/connect/NativeConnectorPanels.native-local.integration.test.tsx apps/pages/src/sections/connections/connect/NativeConnectorPanels.custody.test.tsx apps/pages/src/modules/connectors.external/native-catalog-configuration-runtime.integration.test.ts
          pnpm lint:anti-slop:files apps/pages/src/sections/connections/connect/NativeConnectorForm.tsx apps/pages/src/sections/connections/connect/NativeConnectorPanels.tsx apps/pages/src/sections/connections/connect/NativeConnectorPanels.native-local.integration.test.tsx apps/pages/src/sections/connections/connect/NativeConnectorPanels.custody.test.tsx apps/pages/src/modules/connectors.external/native-catalog-configuration-runtime.integration.test.ts
      - name: Typecheck and exercise owner and availability
        working-directory: candidate
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/pages typecheck
          pnpm --filter @opensesame/pages exec vitest run src/sections/connections/connect/NativeConnectorPanels.custody.test.tsx src/sections/connections/connect/NativeConnectorPanels.native-local.integration.test.tsx src/sections/connections/connect/native-catalog-configuration-descriptor.test.ts src/modules/connectors.external/native-catalog-configuration-runtime.integration.test.ts
      - name: Verify candidate unchanged
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0cab13b48795c979b45564589d1650e39b57216f
          test "$(git write-tree)" = 475ea84f408d7eea4cb32eb2ce6b7f512c797d0e
          git diff --exit-code

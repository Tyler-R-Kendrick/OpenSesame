name: Capture real live route draft behavior
on:
  push:
    branches: [review/live-draft-visual-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    if: >-
      github.repository == 'Tyler-R-Kendrick/OpenSesame' &&
      github.actor_id == '145080887' &&
      github.ref == 'refs/heads/review/live-draft-visual-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
    env:
      SOURCE_SHA: b7f7a85a6bcc25870dc8f115ef7f9a876946b3c0
      DRAFT_PHASE: ${{ matrix.phase }}
      PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      VITE_BASE: /OpenSesame/
    steps:
      - name: Check out exact baseline source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Check out evidence harness and reviewed files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          path: work/live-draft-visual-tools
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source, harness and patch bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object apps/pages/src/modules/sharing.live/LiveRoutesPanel.tsx)" = f1de978d25292bd3223649823365302bb68d29af
          test "$(git hash-object apps/pages/src/modules/sharing.live/LiveCarriers.tsx)" = 422ce876cd6391ee1ecf2d421543cca319da09f5
          cd work/live-draft-visual-tools/scripts/review/live-draft
          printf '%s  %s\n' \
            dd4fc74b03bb97abc33124882237e11d25f13b3c3de417f44c66ceb25def7e0f LiveRoutesPanel.tsx \
            c51738a396d815870bee9d7710c38965b5d777a86256b0c808997138f10e8186 LiveCarriers.tsx \
            a3457ba10ad063da41995ac005c10543e2eb22fc9e71da2c0e981be02f2c9e77 visual.mjs | sha256sum --check
      - name: Apply reviewed source only for the after build
        if: matrix.phase == 'after'
        run: |
          cp work/live-draft-visual-tools/scripts/review/live-draft/LiveRoutesPanel.tsx apps/pages/src/modules/sharing.live/LiveRoutesPanel.tsx
          cp work/live-draft-visual-tools/scripts/review/live-draft/LiveCarriers.tsx apps/pages/src/modules/sharing.live/LiveCarriers.tsx
      - name: Build the actual Pages profile
        run: node scripts/lib/ci-pages-build.mjs
      - name: Walk real forms at desktop and phone widths
        env:
          DRAFT_EVIDENCE: ${{ runner.temp }}/live-draft-visual-${{ matrix.phase }}
        shell: bash
        run: |
          set -euo pipefail
          cp work/live-draft-visual-tools/scripts/review/live-draft/visual.mjs apps/pages/scripts/review-live-draft-visual.mjs
          cd apps/pages
          node scripts/review-live-draft-visual.mjs
      - name: Keep screenshots and browser measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: live-draft-visual-${{ matrix.phase }}
          path: ${{ runner.temp }}/live-draft-visual-${{ matrix.phase }}
          if-no-files-found: error

name: Review composed Go CodeQL extraction
on:
  workflow_dispatch:
  push:
    branches: [review/codeql-go-extraction-proof]
permissions:
  contents: read
concurrency:
  group: codeql-go-extraction-review
  cancel-in-progress: false
jobs:
  composed-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: b7f7a85a6bcc25870dc8f115ef7f9a876946b3c0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch and compose exact pinned native production graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b7f7a85a6bcc25870dc8f115ef7f9a876946b3c0
          mkdir -p "$RUNNER_TEMP/native-input"
          node -e 'const p=require("./tools/pwa-tailscale-native-http/source.json"); for(const x of [p.source,p.compiler]) {if(!/^https:\/\//.test(x.archiveURL)||!/^[0-9a-f]{64}$/.test(x.archiveSha256)) process.exit(1);console.log(x.archiveURL);console.log(x.archiveSha256)}' > "$RUNNER_TEMP/native-input/pins"
          mapfile -t pins < "$RUNNER_TEMP/native-input/pins"
          test "${#pins[@]}" = 4
          for n in 0 2; do
            i=$((n / 2))
            curl --fail --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 1073741824 --output "$RUNNER_TEMP/native-input/$i.tar.gz" -- "${pins[$n]}"
            printf '%s  %s\n' "${pins[$((n + 1))]}" "$RUNNER_TEMP/native-input/$i.tar.gz" | sha256sum --check
          done
          node tools/pwa-tailscale-native-http/build.mjs "$RUNNER_TEMP/native-input/0.tar.gz" "$RUNNER_TEMP/native-input/1.tar.gz" "$GITHUB_WORKSPACE/.codeql-native" --audit
          test -s .codeql-native/native-audit.json
          test -s .codeql-native/native-package-graph.json
      - name: Initialize manual Go analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended
      - name: Trace the upstream production WASM compile
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.codeql-native"
          cd "$out/source"
          export GOMAXPROCS=2 GOMEMLIMIT=2GiB GOTOOLCHAIN=local GOENV=off GOWORK=off GOTELEMETRY=off
          export GOCACHE="$out/cache/build" GOMODCACHE="$out/cache/mod" GOPATH="$out/cache/gopath" TMPDIR="$out/tmp"
          export GOFLAGS="-p=2 -buildvcs=false -mod=readonly -modfile=$out/native.mod"
          export PATH="$out/compiler/bin:$PATH"
          "$out/compiler/bin/go" clean -cache
          "$out/compiler/bin/go" run "$out/upstream-command.go" "$out/compiler/bin/go" codeql "$out/codeql.wasm" "$out/codeql-build.json"
          test -s "$out/codeql.wasm"
          node -e 'const x=require(process.argv[1]);if(x.pass!==true || !Array.isArray(x.tags) && typeof x.tags!=="string") process.exit(1)' "$out/codeql-build.json"
      - name: Analyze without uploading provisional source paths
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:go-composed-native-review
          upload: never
          output: ${{ runner.temp }}/codeql-native-sarif
      - name: Keep raw SARIF and native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: codeql-native-review
          path: |
            ${{ runner.temp }}/codeql-native-sarif
            .codeql-native/native-audit.json
            .codeql-native/native-package-graph.json
            .codeql-native/codeql-build.json
          if-no-files-found: error

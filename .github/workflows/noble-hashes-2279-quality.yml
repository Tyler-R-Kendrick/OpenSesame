name: Review noble hashes quality
on:
  push:
    branches: [review/noble-hashes-2279-quality-20261030]
permissions:
  contents: read
jobs:
  quality:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.ref == 'refs/heads/review/noble-hashes-2279-quality-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 511c9278391f22d811a8e260675a66c22e54ec5e
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = 511c9278391f22d811a8e260675a66c22e54ec5e
          test "$(git rev-parse HEAD^{tree})" = e6647636aefc326dbfc35cc101a7d24aa10be326
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm quality:gate
      - run: pnpm lint:anti-slop

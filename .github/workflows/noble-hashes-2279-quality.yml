name: Review noble hashes quality
on:
  push:
    branches: [review/noble-hashes-2279-quality-20261030]
permissions:
  contents: read
jobs:
  quality:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.ref == 'refs/heads/review/noble-hashes-2279-quality-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e16f61d7a2f9f0d5f4d4eedd64264b720673fd17
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = e16f61d7a2f9f0d5f4d4eedd64264b720673fd17
          test "$(git rev-parse HEAD^{tree})" = 5fee20173c45b7bd58be64a99bba45a92271fe6e
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm quality:gate
      - run: pnpm lint:anti-slop

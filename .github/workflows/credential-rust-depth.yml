name: Credential Rust depth
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth:
    name: Credential Rust (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: coverage
            label: coverage
            tools: coverage-rust
            runner: ubuntu-latest
            python: python3
          - family: mutation-core
            label: mutation-core-0of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 0
          - family: mutation-core
            label: mutation-core-1of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 1
          - family: mutation-core
            label: mutation-core-2of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 2
          - family: mutation-core
            label: mutation-core-3of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 3
          - family: mutation-core
            label: mutation-core-4of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 4
          - family: mutation-core
            label: mutation-core-5of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 5
          - family: mutation-core
            label: mutation-core-6of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 6
          - family: mutation-core
            label: mutation-core-7of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 7
          - family: mutation-adapters
            label: mutation-adapters-linux-0of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 0
          - family: mutation-adapters
            label: mutation-adapters-linux-1of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 1
          - family: mutation-adapters
            label: mutation-adapters-linux-2of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 2
          - family: mutation-adapters
            label: mutation-adapters-linux-3of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 3
          - family: mutation-adapters
            label: mutation-adapters-linux-4of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 4
          - family: mutation-adapters
            label: mutation-adapters-linux-5of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 5
          - family: mutation-adapters
            label: mutation-adapters-linux-6of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 6
          - family: mutation-adapters
            label: mutation-adapters-linux-7of8
            tools: mutation-rust
            runner: ubuntu-latest
            python: python3
            platform: linux
            shard: 7
          - family: mutation-adapters
            label: mutation-adapters-windows-0of8
            tools: mutation-rust
            runner: windows-2022
            python: python
            platform: windows
            shard: 0
          - family: mutation-adapters
            label: mutation-adapters-windows-1of8
            tools: mutation-rust
            runner: windows-2022
            python: python
            platform: windows
            shard: 1
          - family: mutation-adapters
            label: mutation-adapters-windows-2of8
            tools: mutation-rust
            runner: windows-2022
            python: python
            platform: windows
            shard: 2
          - family: mutation-adapters
            label: mutation-adapters-windows-3of8
            tools: mutation-rust
            runner: windows-2022
            python: python
            platform: windows
            shard: 3
          - family: mutation-adapters
            label: mutation-adapters-windows-4of8
            tools: mutation-rust
            runner: windows-2022
            python: python
            platform: windows
            shard: 4
          - family: mutation-adapters
            label: mutation-adapters-windows-5of8
            tools: mutation-rust
            runner: windows-2022
            python: python
            platform: windows
            shard: 5
          - family: mutation-adapters
            label: mutation-adapters-windows-6of8
            tools: mutation-rust
            runner: windows-2022
            python: python
            platform: windows
            shard: 6
          - family: mutation-adapters
            label: mutation-adapters-windows-7of8
            tools: mutation-rust
            runner: windows-2022
            python: python
            platform: windows
            shard: 7
          - family: mutation-adapters
            label: mutation-adapters-macos-0of8
            tools: mutation-rust
            runner: macos-14
            python: python3
            platform: macos
            shard: 0
          - family: mutation-adapters
            label: mutation-adapters-macos-1of8
            tools: mutation-rust
            runner: macos-14
            python: python3
            platform: macos
            shard: 1
          - family: mutation-adapters
            label: mutation-adapters-macos-2of8
            tools: mutation-rust
            runner: macos-14
            python: python3
            platform: macos
            shard: 2
          - family: mutation-adapters
            label: mutation-adapters-macos-3of8
            tools: mutation-rust
            runner: macos-14
            python: python3
            platform: macos
            shard: 3
          - family: mutation-adapters
            label: mutation-adapters-macos-4of8
            tools: mutation-rust
            runner: macos-14
            python: python3
            platform: macos
            shard: 4
          - family: mutation-adapters
            label: mutation-adapters-macos-5of8
            tools: mutation-rust
            runner: macos-14
            python: python3
            platform: macos
            shard: 5
          - family: mutation-adapters
            label: mutation-adapters-macos-6of8
            tools: mutation-rust
            runner: macos-14
            python: python3
            platform: macos
            shard: 6
          - family: mutation-adapters
            label: mutation-adapters-macos-7of8
            tools: mutation-rust
            runner: macos-14
            python: python3
            platform: macos
            shard: 7
          - family: retired_records_parse
            label: retired_records_parse
            tools: fuzz-rust
            runner: ubuntu-latest
            python: python3
          - family: canary_registry_validator
            label: canary_registry_validator
            tools: fuzz-rust
            runner: ubuntu-latest
            python: python3
          - family: observation_wire
            label: observation_wire
            tools: fuzz-rust
            runner: ubuntu-latest
            python: python3
          - family: observation_outbox_fsm
            label: observation_outbox_fsm
            tools: fuzz-rust
            runner: ubuntu-latest
            python: python3
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    env:
      PYTHON: ${{ matrix.python }}
      EXPECTED_PYTHON_OS: ${{ matrix.runner == 'windows-2022' && 'nt' || 'posix' }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      FUZZ_SECONDS: 60
      RUST_BACKTRACE: 1
    steps:
      - name: Fresh private evidence
        run: |
          evidence="$RUNNER_TEMP/credential-rust-depth"
          test ! -e "$evidence"
          mkdir -m 700 "$evidence"
          printf 'not_started\n' > "$evidence/family.status"
          echo "TEST_DEPTH_EVIDENCE=$evidence" >> "$GITHUB_ENV"
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: source
        name: Pin source before tool installation
        run: |
          node scripts/lib/test-depth-inputs.mjs capture "$TEST_DEPTH_EVIDENCE/inputs.before.json"
          git rev-parse HEAD HEAD^{tree} > "$TEST_DEPTH_EVIDENCE/source.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          df -k "$PWD" "$RUNNER_TEMP" > "$TEST_DEPTH_EVIDENCE/capacity.before.txt"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - id: python
        name: Verify actual native Python before tool installation
        run: |
          "$PYTHON" -I -c 'import json,os,sys; sys.version_info >= (3,11) or sys.exit("Python 3.11+ required"); os.name == os.environ["EXPECTED_PYTHON_OS"] or sys.exit("Unexpected Python native domain"); print(json.dumps({"executable":sys.executable,"version":list(sys.version_info[:3]),"os":os.name}))' > "$TEST_DEPTH_EVIDENCE/python.json"
      - id: tools
        name: Pinned genuine tools
        env:
          FAMILY: ${{ matrix.tools }}
        run: |
          set -o pipefail
          bash scripts/test/test-depth-tools.sh "$FAMILY" 2>&1 | tee "$TEST_DEPTH_EVIDENCE/tools.log"
      - name: Metadata parser controls
        run: |
          "$PYTHON" -B scripts/quality/credential-rust-report-test.py
          "$PYTHON" -B scripts/quality/credential-adapter-platform-test.py
          "$PYTHON" -B scripts/quality/rust-mutation-shard-test.py
      - id: execute
        name: Execute actual family (adapters require independently classified behavior)
        env:
          FAMILY: ${{ matrix.family }}
          PLATFORM: ${{ matrix.platform }}
          SHARD: ${{ matrix.shard }}
        run: |
          printf 'running\n' > "$TEST_DEPTH_EVIDENCE/family.status"
          if [[ "$FAMILY" == mutation-adapters ]]; then
            "$PYTHON" -B scripts/quality/credential-equivalence/adapter_classified_run.py "$PLATFORM" "$SHARD" "$TEST_DEPTH_EVIDENCE/mutation-shard"
            if [[ "${{ matrix.family }}" == mutation-adapters && "${{ matrix.platform }}" == linux && "${{ matrix.shard }}" == 0 ]]; then "$PYTHON" -B scripts/quality/credential-equivalence/controls_all.py; fi
          elif [[ "$FAMILY" == mutation-* ]]; then
            "$PYTHON" -B scripts/quality/rust-mutation-shard.py "${FAMILY#mutation-}" "$PLATFORM" "$SHARD" "$TEST_DEPTH_EVIDENCE/mutation-shard"
          elif [[ "$FAMILY" == coverage ]]; then
            bash scripts/quality/credential-rust-depth.sh "$FAMILY"
          else
            bash scripts/quality/credential-rust-depth.sh fuzz "$FAMILY"
          fi
          printf 'completed\n' > "$TEST_DEPTH_EVIDENCE/family.status"
      - id: freshness
        name: Preserve source freshness on failure too
        if: always()
        run: |
          node scripts/lib/test-depth-inputs.mjs check "$TEST_DEPTH_EVIDENCE/inputs.before.json"
          df -k "$PWD" "$RUNNER_TEMP" > "$TEST_DEPTH_EVIDENCE/capacity.after.txt"
      - name: Outcome metadata
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          TOOLS: ${{ steps.tools.outcome }}
          EXECUTE: ${{ steps.execute.outcome }}
          FRESHNESS: ${{ steps.freshness.outcome }}
        run: printf '%s\n' "checkout=$CHECKOUT" "source=$SOURCE" "python=$PYTHON" "rust=$RUST" "tools=$TOOLS" "execute=$EXECUTE" "freshness=$FRESHNESS" > "$TEST_DEPTH_EVIDENCE/steps.txt"
      - name: Preserve actual logs reports and crash artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: credential-rust-${{ matrix.label }}
          path: ${{ runner.temp }}/credential-rust-depth/
          if-no-files-found: error
          retention-days: 30
  admission:
    name: Credential Rust depth admission
    if: always()
    needs: depth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: credential-rust-mutation-*
          path: ${{ runner.temp }}/credential-mutation-shards
          merge-multiple: false
      - name: Require strict core and exact independent classified adapters
        if: always()
        env:
          DEPTH: ${{ needs.depth.result }}
        run: python3 -B scripts/quality/credential-equivalence/classified_collect.py "$RUNNER_TEMP/credential-mutation-shards" "$DEPTH" "$RUNNER_TEMP/credential-classified-union.json"
      - name: Preserve union admission on failure too
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: credential-rust-native-union
          path: |
            ${{ runner.temp }}/credential-native-union.json
            ${{ runner.temp }}/credential-classified-union.json
            ${{ runner.temp }}/credential-classified-union-work/
            ${{ runner.temp }}/credential-raw-collector.*
          if-no-files-found: error
          retention-days: 30

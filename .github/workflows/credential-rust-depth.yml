name: Credential Rust depth
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth:
    name: Credential Rust (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: coverage
            tools: coverage-rust
          - family: mutation-core
            tools: mutation-rust
          - family: mutation-adapters
            tools: mutation-rust
          - family: retired_records_parse
            tools: fuzz-rust
          - family: canary_registry_validator
            tools: fuzz-rust
          - family: observation_wire
            tools: fuzz-rust
          - family: observation_outbox_fsm
            tools: fuzz-rust
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      FUZZ_SECONDS: 60
      RUST_BACKTRACE: 1
    steps:
      - name: Fresh private evidence
        run: |
          evidence="$RUNNER_TEMP/credential-rust-depth"
          test ! -e "$evidence"
          mkdir -m 700 "$evidence"
          printf 'not_started\n' > "$evidence/family.status"
          echo "TEST_DEPTH_EVIDENCE=$evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Pin source before tool installation
        run: |
          node scripts/lib/test-depth-inputs.mjs capture "$TEST_DEPTH_EVIDENCE/inputs.before.json"
          git rev-parse HEAD HEAD^{tree} > "$TEST_DEPTH_EVIDENCE/source.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          df -B1 "$PWD" "$RUNNER_TEMP" > "$TEST_DEPTH_EVIDENCE/capacity.before.txt"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - name: Pinned genuine tools
        env:
          FAMILY: ${{ matrix.tools }}
        run: |
          set -o pipefail
          bash scripts/test/test-depth-tools.sh "$FAMILY" 2>&1 | tee "$TEST_DEPTH_EVIDENCE/tools.log"
      - name: Metadata parser controls
        run: python3 -B scripts/quality/credential-rust-report-test.py
      - id: execute
        name: Execute actual credential family
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          printf 'running\n' > "$TEST_DEPTH_EVIDENCE/family.status"
          if [[ "$FAMILY" == coverage || "$FAMILY" == mutation-* ]]; then
            bash scripts/quality/credential-rust-depth.sh "$FAMILY"
          else
            bash scripts/quality/credential-rust-depth.sh fuzz "$FAMILY"
          fi
          printf 'completed\n' > "$TEST_DEPTH_EVIDENCE/family.status"
      - id: freshness
        name: Preserve source freshness on failure too
        if: always()
        run: |
          node scripts/lib/test-depth-inputs.mjs check "$TEST_DEPTH_EVIDENCE/inputs.before.json"
          df -B1 "$PWD" "$RUNNER_TEMP" > "$TEST_DEPTH_EVIDENCE/capacity.after.txt"
      - name: Outcome metadata
        if: always()
        env:
          EXECUTE: ${{ steps.execute.outcome }}
          FRESHNESS: ${{ steps.freshness.outcome }}
        run: printf '%s\n' "execute=$EXECUTE" "freshness=$FRESHNESS" > "$TEST_DEPTH_EVIDENCE/steps.txt"
      - name: Preserve actual logs reports and crash artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: credential-rust-${{ matrix.family }}
          path: ${{ runner.temp }}/credential-rust-depth/
          if-no-files-found: error
          retention-days: 30
  admission:
    name: Credential Rust depth admission
    if: always()
    needs: depth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          DEPTH: ${{ needs.depth.result }}
        run: test "$DEPTH" = success

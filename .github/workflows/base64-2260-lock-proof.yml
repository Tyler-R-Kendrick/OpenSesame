name: Base64 2260 isolated lock resolution
on:
  push:
    branches: [review/base64-2260-lock-proof-ea87-20261030]
permissions:
  contents: read
jobs:
  resolve:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/base64-2260-lock-proof-ea87-20261030' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3ca76c740ef572727e8543bbd2095248208636e0
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - name: Verify exact staged candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3ca76c740ef572727e8543bbd2095248208636e0
          test "$(git rev-parse HEAD^{tree})" = e6ef5851a217e966542d8cc84d8d8d02c61bf9a6
          test "$(git rev-parse HEAD^)" = ea87a9576a53e525a7e3624af44baa77b75c618c
      - name: Reconcile root lock using Rust 1.88
        run: |
          set -euo pipefail
          cargo +1.88.0 update -p base64@0.22.1
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --stat -- Cargo.lock
          git diff -- Cargo.lock
          test "$(git diff --name-only)" = Cargo.lock
          mkdir -p "$RUNNER_TEMP/base64-lock"
          cp Cargo.lock "$RUNNER_TEMP/base64-lock/Cargo.lock"
          sha256sum Cargo.lock > "$RUNNER_TEMP/base64-lock/SHA256SUMS"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: base64-2260-root-lock
          path: ${{ runner.temp }}/base64-lock
          if-no-files-found: error
          retention-days: 7

name: Boat endpoint security proof
on:
  push:
    branches: [review/boat-security-proof-v7-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/boat-security-proof-v7-20261029' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 05166b21fc5c1f44d13221d587528c8361f58a2a
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '05166b21fc5c1f44d13221d587528c8361f58a2a'
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/boat-security.patch"
          printf '%s  %s\n' '299c5fe23f306072fe2b00e571251203ef4abb15b44d1bc37b50de871b653f14' "$RUNNER_TEMP/boat-security.patch" | sha256sum -c -
          git apply --index "$RUNNER_TEMP/boat-security.patch"
          test "$(git write-tree)" = '415505c89053384866421f16b9e0b2f59c2a1cea'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Check Boat types and tests
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/agent-sandboxes typecheck
          pnpm --filter @opensesame/agent-sandboxes test
      - name: Run real browser Boat flow
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/google-chrome
          cd packages/cua-password-reset
          AGENT_BROWSER="$(realpath node_modules/.bin/agent-browser)"
          export AGENT_BROWSER AGENT_BROWSER_CHROME=/usr/bin/google-chrome
          cd ../agent-sandboxes
          pnpm exec playwright test e2e/boat.spec.ts
      - name: Verify candidate tree unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = '05166b21fc5c1f44d13221d587528c8361f58a2a'
          test "$(git write-tree)" = '415505c89053384866421f16b9e0b2f59c2a1cea'
          git diff --exit-code

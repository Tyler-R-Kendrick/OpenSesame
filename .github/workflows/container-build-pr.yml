name: Container build validation

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-build-pr-${{ github.run_id }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build opensesame image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/compose/Dockerfile
          push: false
          tags: opensesame:candidate-${{ inputs.source_sha }}

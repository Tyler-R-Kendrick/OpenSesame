name: Current-base exact source structural quality
on:
  push:
    branches: [review/uuid-ed25519-quality-ba0-20261030]
permissions:
  contents: read
jobs:
  quality:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/uuid-ed25519-quality-ba0-20261030' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: d3801360ec3d9f3c2c294cc9740731c1e2b82576
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d3801360ec3d9f3c2c294cc9740731c1e2b82576
          test "$(git rev-parse HEAD^{tree})" = 7c305c63894873b1b91029893a3cdfccad4c5d46
          test "$(git rev-parse HEAD^)" = ba0b06030dd47cd1872055fd056872e30173cc2d
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check structural quality without modifying limits
        run: pnpm quality:gate
      - name: Check source unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

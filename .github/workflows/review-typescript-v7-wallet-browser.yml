name: Review TypeScript 7 wallet browser compatibility
on:
  push:
    branches: [review/typescript-v7-wallet-browser-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-wallet-browser-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 4fc1d09ad1f44ec2213ed6d4015cfe06ff0784c3
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact source candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 089b58a61e34be2cab4f183e97d17883dc901823
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify actual Chromium WebCrypto behavior
        run: |
          set -euo pipefail
          trap 'rm -f review-wallet-browser.cjs' EXIT
          printf '%s' '' | base64 -d > review-wallet-browser.cjs
          node review-wallet-browser.cjs
      - name: Confirm source tree unchanged
        if: always()
        run: git diff --exit-code

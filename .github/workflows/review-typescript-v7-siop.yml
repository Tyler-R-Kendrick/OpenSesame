name: Review TypeScript 7 SIOP buffer fix
on:
  push:
    branches: [review/typescript-v7-siop-hosted-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-siop-hosted-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6b9f697239fb00a80a30b5ebae00f786553eeb7f
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Check exact source and install frozen graph
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6b9f697239fb00a80a30b5ebae00f786553eeb7f
          test "$(git rev-parse HEAD^{tree})" = 0bd580768e4db3586747a692d043187d0f2acdd8
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --version
      - name: Confirm original TypeScript 7 error
        run: |
          set -euo pipefail
          trap 'git restore -- packages/siop-v2/src/jwk.ts' EXIT
          git show HEAD^:packages/siop-v2/src/jwk.ts > packages/siop-v2/src/jwk.ts
          if pnpm --filter @opensesame/siop-v2 typecheck > /tmp/siop-original-ts7.log 2>&1; then
            echo 'Original source unexpectedly compiled' >&2
            exit 1
          fi
          grep -E 'jwk.ts\(100,56\).*error TS2769' /tmp/siop-original-ts7.log
      - name: Verify fixed TypeScript 7 module and cryptographic tests
        run: |
          set -euo pipefail
          pnpm exec biome check packages/siop-v2/src/jwk.ts
          pnpm --filter @opensesame/siop-v2 typecheck
          pnpm --filter @opensesame/siop-v2 test
      - name: Verify exact source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 0bd580768e4db3586747a692d043187d0f2acdd8
          git diff --exit-code

name: Relay conformance focused verification
on:
  push:
    branches: [review/relay-conformance-verify]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/relay-conformance-verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 22afed11cd52d41c1618d29ede8d1d366c266417
      - name: Verify immutable source and exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 22afed11cd52d41c1618d29ede8d1d366c266417
          test "$(git rev-parse HEAD^{tree})" = 270e77237ab79dc73b0179876697d853c525c12e
          test "$(git rev-parse HEAD^)" = 55f6f90a0e4a3d5a5c855c1006559f4bf2922603
          git diff --binary --full-index --no-renames HEAD^ HEAD > "$RUNNER_TEMP/conformance.patch"
          printf '%s  %s\n' 82c7fe4728a142b4030fb755a04f6414d146aa499908a2816e6daee9942fc502 "$RUNNER_TEMP/conformance.patch" | sha256sum --check
          git diff --exit-code
          git diff --cached --exit-code
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check relay and conformance cases
        run: |
          set -euo pipefail
          node apps/pages/scripts/emit-connect-verify-targets.mjs
          pnpm exec biome format --write apps/pages/server/connect-verify-targets.generated.mjs
          git diff --exit-code -- apps/pages/server/connect-verify-targets.generated.mjs
          pnpm --filter @opensesame/app-core generate:connect
          git diff --exit-code -- packages/app-core/src/lib/connect-presets.generated.ts
          pnpm --filter @opensesame/pages exec vitest run src/lib/connect-conformance/connect-conformance.test.ts
          node --test apps/pages/server/test/connect-manage.test.mjs apps/pages/server/test/connect-verify*.test.mjs
      - name: Typecheck and lint the changed contract
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/pages typecheck
          pnpm lint:anti-slop:files apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify*.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm exec biome check spec/connectors/relay-verification-presets.json spec/connectors/connect-presets.json spec/connectors/verification-hosts.json apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify-targets.generated.mjs apps/pages/server/connect-verify-targets.generated.d.mts apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify*.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm quality:gate
      - name: Check source after tests
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 22afed11cd52d41c1618d29ede8d1d366c266417
          git diff --exit-code
          git diff --cached --exit-code

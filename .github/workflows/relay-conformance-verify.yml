name: Relay conformance focused verification
on:
  push:
    branches: [review/relay-conformance-verify]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/relay-conformance-verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 6a2fc3f2925a950cedf47c28ddabc89c26cd7119
      - name: Verify immutable source and exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6a2fc3f2925a950cedf47c28ddabc89c26cd7119
          test "$(git rev-parse HEAD^{tree})" = 22ae9f8067aea391d864d4a316e47d572d71e0a7
          test "$(git rev-parse HEAD^)" = 2c5759e47ad01c9377b653064578ae59691463e8
          git diff --binary --full-index --no-renames HEAD^ HEAD > "$RUNNER_TEMP/conformance.patch"
          printf '%s  %s\n' d5075703e0b90cadc1cbb7465f8b4312cb84a6b243d031a3ae1fdd03c954bdc2 "$RUNNER_TEMP/conformance.patch" | sha256sum --check
          git diff --exit-code
          git diff --cached --exit-code
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check relay and conformance cases
        run: |
          set -euo pipefail
          node apps/pages/scripts/emit-connect-verify-targets.mjs
          pnpm exec biome format --write apps/pages/server/connect-verify-targets.generated.mjs
          git diff --exit-code -- apps/pages/server/connect-verify-targets.generated.mjs
          pnpm --filter @opensesame/pages exec vitest run src/lib/connect-conformance/connect-conformance.test.ts
          node --test apps/pages/server/test/connect-manage.test.mjs apps/pages/server/test/connect-verify-compatibility.test.mjs apps/pages/server/test/connect-verify-predicates.test.mjs apps/pages/server/test/connect-verify-unbound-host.test.mjs apps/pages/server/test/connect-verify.test.mjs
      - name: Typecheck and lint the changed contract
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/pages typecheck
          pnpm lint:anti-slop:files apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm exec biome check spec/connectors/verification-trust.json apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify-targets.generated.mjs apps/pages/server/connect-verify-targets.generated.d.mts apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm quality:gate
      - name: Check source after tests
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6a2fc3f2925a950cedf47c28ddabc89c26cd7119
          git diff --exit-code
          git diff --cached --exit-code

name: Relay conformance focused verification
on:
  push:
    branches: [review/relay-conformance-verify]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/relay-conformance-verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: e7e3ec343941fbab652c79ba891f79a6370cfc04
      - name: Verify immutable source and exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e7e3ec343941fbab652c79ba891f79a6370cfc04
          test "$(git rev-parse HEAD^{tree})" = 40fac3aabfd104546c921bb9f55f684b5b1b2b43
          test "$(git rev-parse HEAD^)" = 1f32b8afeb345f8e5dc7711098c1794b9c52eeeb
          git diff --binary --full-index --no-renames HEAD^ HEAD > "$RUNNER_TEMP/conformance.patch"
          printf '%s  %s\n' f9d456149ee63aba6d9d2e71e3ce679d3c0db549e31e3ee2ec72fda45a2792be "$RUNNER_TEMP/conformance.patch" | sha256sum --check
          git diff --exit-code
          git diff --cached --exit-code
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check relay and conformance cases
        run: |
          set -euo pipefail
          node apps/pages/scripts/emit-connect-verify-targets.mjs
          pnpm exec biome format --write apps/pages/server/connect-verify-targets.generated.mjs
          git diff --exit-code -- apps/pages/server/connect-verify-targets.generated.mjs
          pnpm --filter @opensesame/pages exec vitest run src/lib/connect-conformance/connect-conformance.test.ts
          node --test apps/pages/server/test/connect-manage.test.mjs apps/pages/server/test/connect-verify-compatibility.test.mjs apps/pages/server/test/connect-verify-predicates.test.mjs apps/pages/server/test/connect-verify-unbound-host.test.mjs apps/pages/server/test/connect-verify.test.mjs
      - name: Typecheck and lint the changed contract
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/pages typecheck
          pnpm lint:anti-slop:files apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify.test.mjs apps/pages/server/test/connect-verify-compatibility.test.mjs apps/pages/server/test/connect-verify-unbound-host.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm exec biome check spec/connectors/verification-hosts.json apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify-targets.generated.mjs apps/pages/server/connect-verify-targets.generated.d.mts apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify.test.mjs apps/pages/server/test/connect-verify-compatibility.test.mjs apps/pages/server/test/connect-verify-unbound-host.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm quality:gate
      - name: Check source after tests
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e7e3ec343941fbab652c79ba891f79a6370cfc04
          git diff --exit-code
          git diff --cached --exit-code

name: Relay conformance focused verification
on:
  push:
    branches: [review/relay-conformance-verify]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/relay-conformance-verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: c1b40f3b961fcef03162f0814b159df9a7c81b07
      - name: Verify immutable source and exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c1b40f3b961fcef03162f0814b159df9a7c81b07
          test "$(git rev-parse HEAD^{tree})" = 480729b93981a3711f32dd4c6862e4d07da47ab3
          test "$(git rev-parse HEAD^)" = 844fea8f0a51cfe711d5b8a59655b95875373be0
          git diff --binary --full-index --no-renames HEAD^ HEAD > "$RUNNER_TEMP/conformance.patch"
          printf '%s  %s\n' 747933ae196e6df420536adb51297dc0a1e555e7df9408aab474b2a27eb64adc "$RUNNER_TEMP/conformance.patch" | sha256sum --check
          git diff --exit-code
          git diff --cached --exit-code
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check relay and conformance cases
        run: |
          set -euo pipefail
          node apps/pages/scripts/emit-connect-verify-targets.mjs
          pnpm exec biome format --write apps/pages/server/connect-verify-targets.generated.mjs
          git diff --exit-code -- apps/pages/server/connect-verify-targets.generated.mjs
          pnpm --filter @opensesame/app-core generate:connect
          git diff --exit-code -- packages/app-core/src/lib/connect-presets.generated.ts
          pnpm --filter @opensesame/app-core exec vitest run src/lib/native-api-higgsfield.test.ts src/lib/native-api-obsidian.test.ts src/lib/native-api-fal.test.ts src/lib/native-api-target.test.ts src/lib/native-api-dot-segment.test.ts src/lib/native-api-auth.test.ts src/lib/native-api-verify.test.ts src/lib/connect-presets.test.ts src/lib/generated-json.test.ts
          pnpm --filter @opensesame/pages exec vitest run src/lib/connect-conformance/connect-conformance.test.ts
          node --test apps/pages/server/test/connect-manage.test.mjs apps/pages/server/test/connect-verify*.test.mjs
      - name: Typecheck and lint the changed contract
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/app-core typecheck
          pnpm --filter @opensesame/pages typecheck
          pnpm lint:anti-slop:files apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify*.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm exec biome check spec/connectors/relay-verification-presets.json spec/connectors/connect-presets.json spec/connectors/verification-hosts.json apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify-targets.generated.mjs apps/pages/server/connect-verify-targets.generated.d.mts apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify*.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm lint:anti-slop:files packages/app-core/scripts/connect-verification-policy.mjs packages/app-core/scripts/emit-connect-presets.mjs packages/app-core/src/lib/connect-provider-auth-schema.ts packages/app-core/src/lib/native-api-target.ts packages/app-core/src/lib/native-api-verify.ts packages/app-core/src/lib/native-api-connectors.ts packages/app-core/src/lib/native-api-higgsfield.test.ts packages/app-core/src/lib/native-api-obsidian.test.ts packages/app-core/src/lib/native-api-fal.test.ts packages/app-core/src/lib/native-api-target.test.ts packages/app-core/src/lib/native-api-dot-segment.test.ts packages/app-core/src/lib/native-api-auth.test.ts packages/app-core/src/lib/native-api-verify.test.ts
          pnpm exec biome check packages/app-core/scripts/connect-verification-policy.mjs packages/app-core/scripts/emit-connect-presets.mjs packages/app-core/src/lib/connect-provider-auth-schema.ts packages/app-core/src/lib/native-api-target.ts packages/app-core/src/lib/native-api-verify.ts packages/app-core/src/lib/native-api-connectors.ts packages/app-core/src/lib/native-api-higgsfield.test.ts packages/app-core/src/lib/native-api-obsidian.test.ts packages/app-core/src/lib/native-api-fal.test.ts packages/app-core/src/lib/native-api-target.test.ts packages/app-core/src/lib/native-api-dot-segment.test.ts packages/app-core/src/lib/native-api-auth.test.ts packages/app-core/src/lib/native-api-verify.test.ts
          pnpm quality:gate
      - name: Check source after tests
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c1b40f3b961fcef03162f0814b159df9a7c81b07
          git diff --exit-code
          git diff --cached --exit-code

name: Relay conformance focused verification
on:
  push:
    branches: [review/relay-conformance-verify]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/relay-conformance-verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 52621766e975311be29f96a3af042c6cb4996f3f
      - name: Verify immutable source and exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 52621766e975311be29f96a3af042c6cb4996f3f
          test "$(git rev-parse HEAD^{tree})" = de11ea35f98bcc20815ba946f8172c33f1db60e8
          test "$(git rev-parse HEAD^)" = cf1cc69fea7920e8eabd6b92a5f1762354546a9b
          git diff --binary --full-index --no-renames HEAD^ HEAD > "$RUNNER_TEMP/conformance.patch"
          printf '%s  %s\n' 48362fbafca57977f7066d91cb934d212ad68a745c82008b1e268956c3c31282 "$RUNNER_TEMP/conformance.patch" | sha256sum --check
          git diff --exit-code
          git diff --cached --exit-code
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check relay and conformance cases
        run: |
          set -euo pipefail
          node apps/pages/scripts/emit-connect-verify-targets.mjs
          pnpm exec biome format --write apps/pages/server/connect-verify-targets.generated.mjs
          git diff --exit-code -- apps/pages/server/connect-verify-targets.generated.mjs
          pnpm --filter @opensesame/app-core generate:connect
          git diff --exit-code -- packages/app-core/src/lib/connect-presets.generated.ts packages/app-core/src/lib/native-google-account-policy.generated.ts
          pnpm --filter @opensesame/app-core exec vitest run src/lib/native-connector-availability.test.ts src/lib/native-google-account-policy.test.ts src/lib/native-google-drive-account.test.ts src/lib/native-api-higgsfield.test.ts src/lib/native-api-obsidian.test.ts src/lib/native-api-fal.test.ts src/lib/native-api-target.test.ts src/lib/native-api-dot-segment.test.ts src/lib/native-api-auth.test.ts src/lib/native-api-verify.test.ts src/lib/connect-presets.test.ts src/lib/generated-json.test.ts
          pnpm --filter @opensesame/pages exec vitest run src/lib/connect-conformance/connect-conformance.test.ts
          pnpm exec vitest run scripts/lib/ci-release-kit.test.mjs
          node --test scripts/security/map-composed-go-sarif.test.mjs scripts/release/check-codeql-sarif.test.mjs scripts/release/candidate-policy-scanner.test.mjs scripts/release/release-environment.test.mjs
          node --test apps/pages/server/test/connect-manage.test.mjs apps/pages/server/test/connect-verify*.test.mjs
      - name: Typecheck and lint the changed contract
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/app-core typecheck
          pnpm --filter @opensesame/pages typecheck
          pnpm lint:anti-slop:files apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify*.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm exec biome check spec/connectors/relay-verification-presets.json spec/connectors/connect-presets.json spec/connectors/verification-hosts.json apps/pages/scripts/emit-connect-verify-targets.mjs apps/pages/server/connect-verify-targets.generated.mjs apps/pages/server/connect-verify-targets.generated.d.mts apps/pages/server/connect-verify.mjs apps/pages/server/test/connect-verify*.test.mjs apps/pages/src/lib/connect-conformance/connect-conformance.test.ts apps/pages/src/lib/connect-conformance/conformance-proof.ts
          pnpm lint:anti-slop:files packages/app-core/scripts/emit-google-account-policy.mjs packages/app-core/src/lib/native-google-account-policy.test.ts packages/app-core/src/lib/native-google-drive-account.ts packages/app-core/scripts/connect-verification-policy.mjs packages/app-core/scripts/emit-connect-presets.mjs packages/app-core/src/lib/connect-provider-auth-schema.ts packages/app-core/src/lib/native-api-target.ts packages/app-core/src/lib/native-api-verify.ts packages/app-core/src/lib/native-api-connectors.ts packages/app-core/src/lib/native-api-higgsfield.test.ts packages/app-core/src/lib/native-api-obsidian.test.ts packages/app-core/src/lib/native-api-fal.test.ts packages/app-core/src/lib/native-api-target.test.ts packages/app-core/src/lib/native-api-dot-segment.test.ts packages/app-core/src/lib/native-api-auth.test.ts packages/app-core/src/lib/native-api-verify.test.ts
          pnpm exec biome check packages/app-core/scripts/emit-google-account-policy.mjs packages/app-core/src/lib/native-google-account-policy.test.ts packages/app-core/src/lib/native-google-drive-account.ts packages/app-core/scripts/connect-verification-policy.mjs packages/app-core/scripts/emit-connect-presets.mjs packages/app-core/src/lib/connect-provider-auth-schema.ts packages/app-core/src/lib/native-api-target.ts packages/app-core/src/lib/native-api-verify.ts packages/app-core/src/lib/native-api-connectors.ts packages/app-core/src/lib/native-api-higgsfield.test.ts packages/app-core/src/lib/native-api-obsidian.test.ts packages/app-core/src/lib/native-api-fal.test.ts packages/app-core/src/lib/native-api-target.test.ts packages/app-core/src/lib/native-api-dot-segment.test.ts packages/app-core/src/lib/native-api-auth.test.ts packages/app-core/src/lib/native-api-verify.test.ts
          pnpm quality:gate
      - name: Check source after tests
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 52621766e975311be29f96a3af042c6cb4996f3f
          git diff --exit-code
          git diff --cached --exit-code

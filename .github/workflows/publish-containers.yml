# Build and push the native `opensesame` image to GitHub Container Registry.
#
# Manual publication is limited to main; releases must already be on main.
# Workflow guards do not constrain a collaborator who can edit a workflow.
# See docs/operators/publishing.md for the external GHCR trust boundary.
name: Publish containers

on:
  workflow_dispatch:
    inputs:
      features:
        description: "Cargo features for opensesame-cli (comma-separated, optional)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  source:
    name: Verify publication source
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the immutable commit before granting publication permissions
        id: check
        env:
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            sha="$(scripts/release/tag-check.sh verify "$TAG" "$EVENT_SHA")"
          else
            sha="$(scripts/release/tag-check.sh commit "$EVENT_SHA")"
            git merge-base --is-ancestor "$sha" refs/remotes/origin/main
            [ "$(git rev-parse HEAD)" = "$sha" ]
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  ghcr:
    needs: source
    permissions:
      contents: read
      packages: write
    name: GHCR opensesame
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Check the publication checkout
        env:
          VERIFIED_SHA: ${{ needs.source.outputs.sha }}
        run: '[ "$(git rev-parse HEAD)" = "$VERIFIED_SHA" ]'
      - name: Log in to GHCR
        uses: docker/login-action@5e57cdca8bd33bd31c8f2a4eabd65eb91159b82d # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f88e8b696d8d65b0d1d6933ef0551 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ops/compose/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENSESAME_FEATURES=${{ inputs.features }}

name: Verify Noble classification
on:
  push:
    branches: [review/noble-classification-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/noble-classification-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 4d4a8032caa3ded9c2c86b730b790ef21ff6e5ce
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify immutable candidate
        run: |
          test "$(git rev-parse HEAD)" = 4d4a8032caa3ded9c2c86b730b790ef21ff6e5ce
          test "$(git rev-parse HEAD^{tree})" = 78c1e49bc819b4df4e76c13326bed500d2e91e29
          test "$(git rev-parse HEAD^)" = b2dda340c682f4cd38a71e4ded7dfc647d50d7da
          git diff --exit-code
      - name: Install frozen graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check changed classification format
        run: |
          pnpm exec biome check apps/pages/src/lib/capabilities/classification-cross.ts apps/pages/src/lib/capabilities/classification-noble-compat.test.ts
          pnpm lint:anti-slop:files apps/pages/src/lib/capabilities/classification-cross.ts apps/pages/src/lib/capabilities/classification-noble-compat.test.ts
      - name: Verify Pages classification and narrowed rule
        run: pnpm --filter @opensesame/pages exec vitest run src/lib/capabilities/classification.test.ts src/lib/capabilities/classification-noble-compat.test.ts
      - name: Confirm clean source
        run: git diff --exit-code

name: Review native-host Go CodeQL extraction
on:
  workflow_dispatch:
  push:
    branches: [review/codeql-native-host-proof]
permissions:
  contents: read
  security-events: read
concurrency:
  group: codeql-native-host-review
  cancel-in-progress: false
jobs:
  native-host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: 69e60b69be2348fef8c1bed84f21d853af444148
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch and compose exact pinned native production graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 69e60b69be2348fef8c1bed84f21d853af444148
          mkdir -p "$RUNNER_TEMP/native-input"
          node -e 'const p=require("./tools/pwa-tailscale-native-http/source.json"); for(const x of [p.source,p.compiler]) {if(!/^https:\/\//.test(x.archiveURL)||!/^[0-9a-f]{64}$/.test(x.archiveSha256)) process.exit(1);console.log(x.archiveURL);console.log(x.archiveSha256)}' > "$RUNNER_TEMP/native-input/pins"
          mapfile -t pins < "$RUNNER_TEMP/native-input/pins"
          test "${#pins[@]}" = 4
          for n in 0 2; do
            i=$((n / 2))
            curl --fail --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 1073741824 --output "$RUNNER_TEMP/native-input/$i.tar.gz" -- "${pins[$n]}"
            printf '%s  %s\n' "${pins[$((n + 1))]}" "$RUNNER_TEMP/native-input/$i.tar.gz" | sha256sum --check
          done
          node tools/pwa-tailscale-native-http/build.mjs "$RUNNER_TEMP/native-input/0.tar.gz" "$RUNNER_TEMP/native-input/1.tar.gz" "$GITHUB_WORKSPACE/.codeql-native" --audit
          test -s .codeql-native/native-audit.json
          test -s .codeql-native/native-package-graph.json
          echo "$GITHUB_WORKSPACE/.codeql-native/compiler/bin" >> "$GITHUB_PATH"
      - name: Initialize manual Go analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended
      - name: Trace native host test compilation
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.codeql-native"
          compiler_version="$(node -p 'require("./tools/pwa-tailscale-native-http/source.json").compiler.version')"
          cd "$out/source"
          export GOMAXPROCS=2 GOMEMLIMIT=2GiB GOTOOLCHAIN=local GOENV=off GOWORK=off GOTELEMETRY=off
          export GOCACHE="$out/cache/build" GOMODCACHE="$out/cache/mod" GOPATH="$out/cache/gopath" TMPDIR="$out/tmp"
          export GOFLAGS="-p=2 -buildvcs=false -mod=readonly -modfile=$out/native.mod"
          export VERSION_LONG='' VERSION_SHORT=''
          test "$(command -v go)" = "$CODEQL_ACTION_GO_BINARY"
          test "$(go env GOVERSION)" = "$compiler_version"
          go clean -cache
          go test -c -o "$out/native-http.test" ./cmd/tsconnect/nativehttp
          go test -c -o "$out/native-node.test" ./cmd/tsconnect/wasm
          test -s "$out/native-http.test"
          test -s "$out/native-node.test"
      - name: Analyze without uploading provisional source paths
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:go-native-host-review
          upload: never
          output: ${{ runner.temp }}/codeql-native-sarif
      - name: Keep raw SARIF and native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: codeql-native-host-review
          path: |
            ${{ runner.temp }}/codeql-native-sarif
            .codeql-native/native-audit.json
            .codeql-native/native-package-graph.json
            .codeql-native/audit-tags.json
            .codeql-native/logs
          if-no-files-found: error

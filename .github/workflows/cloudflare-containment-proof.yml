name: Verify fail-closed Cloudflare browser containment
on:
  push:
    branches: [review/cloudflare-containment-proof-20261029]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor == 'Tyler-R-Kendrick' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/cloudflare-containment-proof-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact signed stack
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 62dd1f3328b83bd63024f6fe5d75777d0b0c0e59
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify immutable candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 62dd1f3328b83bd63024f6fe5d75777d0b0c0e59
          test "$(git rev-parse HEAD^{tree})" = bf640fcf0fc676044338339434bb7c59cb7f6160
          test -z "$(git status --porcelain)"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package tests and workflow contract
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file) }' .github/workflows/ci.yml .github/workflows/ci-prerelease-checks.yml .github/workflows/full-suite.yml
          pnpm --filter @opensesame/agent-sandboxes typecheck
          pnpm --filter @opensesame/agent-sandboxes test
          pnpm exec vitest run scripts/lib/ci-cd-triggers.test.mjs
      - name: Unfiltered real-browser provider suite
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          test -x "$PLAYWRIGHT_CHROMIUM"
          export AGENT_BROWSER="$PWD/packages/cua-password-reset/node_modules/.bin/agent-browser"
          test -x "$AGENT_BROWSER"
          pnpm --fail-if-no-match --filter @opensesame/agent-sandboxes test:e2e
      - name: Full quality gate
        if: success() || failure()
        run: pnpm quality:gate
      - name: Verify immutable source after tests
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 62dd1f3328b83bd63024f6fe5d75777d0b0c0e59
          test "$(git rev-parse HEAD^{tree})" = bf640fcf0fc676044338339434bb7c59cb7f6160
          git diff --exit-code

name: Review TypeScript 7 at-rest byte ownership
on:
  push:
    branches: [review/typescript-v7-rest-proof-20261030]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Tyler-R-Kendrick/OpenSesame' && github.actor_id == '145080887' && github.ref == 'refs/heads/review/typescript-v7-rest-proof-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 45c186665e8315cdd52086d41f39c0786bd4558d
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 3051b4f524f55cba67c0cf71e432971c46848a26
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record original compiler errors
        run: |
          set -euo pipefail
          files=(packages/browser-at-rest/src/seal.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for f in "${files[@]}"; do git show "HEAD^:$f" > "$f"; done
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-original.log 2>&1; then exit 1; fi
          grep -E 'browser-at-rest/src/seal.ts.*error TS[0-9]+' /tmp/duress-original.log
      - name: Check exact TypeScript results
        run: |
          set -euo pipefail
          pnpm exec biome check packages/browser-at-rest/src/seal.ts
          if pnpm --filter @opensesame/pages typecheck > /tmp/duress-fixed.log 2>&1; then
            echo 'Pages typecheck passed.'
          else
            before=$(grep -cE 'error TS[0-9]+' /tmp/duress-original.log || true)
            after=$(grep -cE 'error TS[0-9]+' /tmp/duress-fixed.log || true)
            echo "Pages diagnostics before=$before after=$after; remaining errors block complete migration."
            grep -E 'error TS[0-9]+' /tmp/duress-fixed.log || true
            test "$after" -lt "$before"
          fi
      - name: Verify security and byte round trips
        run: |
          set -euo pipefail
          pnpm --filter @opensesame/browser-at-rest exec vitest run src/at-rest.test.ts src/envelope.test.ts
      - name: Verify source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD^{tree})" = 3051b4f524f55cba67c0cf71e432971c46848a26
          git diff --exit-code

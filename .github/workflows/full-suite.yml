name: Full TypeScript suite

# Development delivery tests the exact selected candidate source. This complete
# workspace suite catches failures outside the latest integration diff, while
# trunk only compiles the impacted build graph.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source selected by the release controller
        required: true
        type: string

permissions:
  contents: read

jobs:
  typescript-full:
    name: Full TypeScript suite
    runs-on: ubuntu-latest
    # Complete serial candidate workload; retain individual test deadlines.
    timeout-minutes: 180
    services:
      postgres:
        # The same mirror and digest as ci.yml (see the comment there).
        image: mirror.gcr.io/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: opensesame
          POSTGRES_PASSWORD: opensesame
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensesame"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Cache the pinned native PWA distribution
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: .cache/pwa-tailscale-native-http/distributions
          key: pwa-native-distribution-${{ hashFiles('tools/pwa-tailscale-native-http/source.json', 'apps/pages/src/lib/capabilities/tailscale-artifacts.json') }}
      - name: Prepare and verify native PWA assets before package concurrency
        # Uses the normal Vite asset loader, including verification on cache hits.
        # Cold preparation keeps its original deadlines, pins and resource limits.
        run: >-
          node --input-type=module -e
          'import { loadTailscaleAssets } from "./apps/pages/scripts/tailscale-wasm-assets.mjs"; await loadTailscaleAssets();'
      - name: Typecheck and test every package
        run: pnpm exec turbo run typecheck test --concurrency=1
      - name: CUA password-reset browser e2e
        # Explicit delivery coverage: these real-browser tests are excluded
        # from the package's unit-test script.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: >-
          AGENT_BROWSER="$(pnpm --filter @opensesame/cua-password-reset exec which agent-browser)"
          pnpm --filter @opensesame/cua-password-reset test:e2e
      - name: Agent sandbox providers browser e2e
        # Exercise the local, relay, virtual-network and CDP lanes.
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          AGENT_BROWSER_CHROME: /usr/bin/google-chrome
        run: >-
          AGENT_BROWSER="$(pnpm --filter @opensesame/cua-password-reset exec which agent-browser)"
          pnpm --fail-if-no-match --filter @opensesame/agent-sandboxes test:e2e
      - name: Repository contract on a real Postgres
        env:
          DATABASE_URL: postgres://opensesame:opensesame@127.0.0.1:5432/postgres
          OPENSESAME_CLAIM_PEPPER: ci-pepper-ci-pepper-ci-pepper-ci-pepper
        run: pnpm --filter @opensesame/database test:postgres
      - name: Worker delivery on a real Postgres
        env:
          DATABASE_URL: postgres://opensesame:opensesame@127.0.0.1:5432/postgres
        run: pnpm --filter @opensesame/identity-worker test:postgres

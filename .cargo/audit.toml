# cargo-audit configuration (RustSec)
# Looked up from `.cargo/audit.toml` (project) or `~/.cargo/audit.toml`.
# https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
ignore = [
  # No fixed rsa release. The existing exception remains; direct PKI and SQLx
  # edges and the variable-time RSA library signer are documented in
  # docs/security/audits/2026-10-06-rsa-marvin-reachability.md. Current gateway
  # CA/EST issuance uses rcgen/ring; do not expose the RustCrypto signer as an
  # attacker-timable service. This exception is not a constant-time proof.
  "RUSTSEC-2023-0071",
]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>OpenSesame</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <p class="brand">OpenSesame</p>
      <h1>Extension</h1>
      <p class="lede">Host API health and sealed sync cursor. No secrets.</p>
      <section id="security" aria-label="Vault security"></section>
      <div id="production-controls" hidden>
      <button id="security-open" type="button">Security settings</button>
      <ul id="status" class="status" aria-live="polite">
        <li>Checking…</li>
      </ul>
      <label class="field">
        Host API base
        <input id="host" type="url" placeholder="http://127.0.0.1:8787" />
      </label>
      <div class="actions">
        <button id="save" type="button">Save host</button>
        <button id="retry" type="button" class="secondary">Retry</button>
      </div>
      <p id="hint" class="hint" hidden></p>
      <section aria-label="Vault tasks">
        <h2>Credentials</h2>
        <p class="hint">Continue in your vault. Unlock and confirm private actions there.</p>
        <button class="workflow-link" type="button" data-workflow="inventory">Find references, inventory and audit</button>
        <ul class="workflow-actions">
          <li><button type="button" data-workflow="create">Create a credential</button></li>
          <li><button type="button" data-workflow="compare">Compare a login password</button></li>
          <li><button type="button" data-workflow="update">Update a login password</button></li>
          <li><button type="button" data-workflow="read">Read a credential privately</button></li>
          <li><button type="button" data-workflow="env-resolve">Resolve an environment template</button></li>
        </ul>
      </section>
      <section aria-label="Authorization tasks">
        <h2>Requests</h2>
        <button class="workflow-link" type="button" data-workflow="requests">Review access requests</button>
        <p class="hint">Identity and local-vault approvals. Native provider requests stay with their native approver.</p>
      </section>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

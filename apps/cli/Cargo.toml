[package]
description = "The OpenSesame native binary: Host API, daemon, worker, credential helpers, and the pass store CLI"
name = "opensesame-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opensesame"
path = "src/main.rs"

[dependencies]
opensesame-storage = { path = "../../crates/storage" }
opensesame-redaction = { path = "../../crates/redaction", features = ["tracing"] }
opensesame-sealed-log = { path = "../../crates/sealed-log" }
base64 = { workspace = true }
opensesame-agent-hooks = { path = "../../crates/agent-hooks" }
opensesame-ceremony = { path = "../../crates/ceremony" }
opensesame-authn = { path = "../../crates/authn" }
opensesame-domain = { path = "../../crates/domain" }
opensesame-env-spec = { path = "../../crates/env-spec" }
# Which `gh`, `vercel`, `kill` and browser opener run, and what each is handed.
opensesame-trusted-exec = { path = "../../crates/trusted-exec" }
opensesame-cli-app-integration = { path = "../../crates/cli-app-integration" }
opensesame-invoke-through = { path = "../../crates/invoke-through" }
opensesame-connector-host = { path = "../../crates/connector-host" }
opensesame-kdbx-bridge = { path = "../../crates/kdbx-bridge" }
opensesame-provider-bitwarden = { path = "../../crates/provider-bitwarden" }
opensesame-bitwarden-server = { path = "../../crates/bitwarden-server", optional = true }
opensesame-sealed-store = { path = "../../crates/sealed-store" }
opensesame-human-vault = { path = "../../crates/human-vault" }
# The native reader of a trusted-contacts recovery (ADR 0187): `vault circle`.
opensesame-quorum-recovery = { path = "../../crates/quorum-recovery" }
opensesame-vault-item-types = { path = "../../crates/vault-item-types" }
opensesame-pm-bridges = { path = "../../crates/pm-bridges" }
opensesame-credential-helpers = { path = "../../crates/credential-helpers" }
opensesame-daemon = { path = "../../crates/daemon" }
opensesame-gateway = { path = "../../crates/gateway" }
# The recipe document and its Ed25519 signing (ADR 0076 §4): `rotate recipe sign`
# and `rotate signer keygen` are local acts that never name a Host.
opensesame-rotation-web = { path = "../../crates/rotation-web" }
opensesame-host-core = { path = "../../crates/host-core" }
opensesame-worker = { path = "../../crates/worker" }
# Settings for optional plugins only (ADR 0150 §7). The plugins themselves are
# separate executables this binary never links (`pnpm audit:plugin-boundary`).
opensesame-plugin-settings = { path = "../../crates/plugin-settings" }
opensesame-tailnet-admin = { path = "../../crates/tailnet-admin" }
# The run lease's credential hook (ADR 0150 §6.2): a tripwire ends a dev
# run's plugin session through `RunCredentials`. serde + thiserror only.
opensesame-session-observe = { path = "../../crates/session-observe" }
anyhow = { workspace = true }
clap = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
sqlx = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
directories = "6.0.0"
qr2term = "0.3.3"
regex = "1.11.1"
tempfile = "3.20.0"
# `dev run` catches SIGTERM and SIGHUP (src/dev_signal.rs) and signals its child;
# the journey tests also sit a person at a real terminal via openpty.
libc = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
opensesame-trusted-exec = { path = "../../crates/trusted-exec", features = ["testkit"] }
# The AWS helper tests serialize the Host's real mint shape and run it against
# the loopback STS stand-in (ADR 0217). The feature builds the stand-in and the
# test-only endpoint knob into the binary these tests start; a shipped build
# never has either.
opensesame-connection-broker = { path = "../../crates/connection-broker", features = ["sts-stand-in"] }
ecdsa = { version = "0.17", default-features = false, features = ["algorithm"] }
p256 = { version = "0.14", default-features = false, features = ["getrandom", "ecdsa", "pkcs8", "alloc", "arithmetic"] }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
# The dev-run tests point the CLI at their own settings file, which a shipped
# build refuses to take from the environment.
opensesame-plugin-settings = { path = "../../crates/plugin-settings", features = ["path-override"] }
insta = { workspace = true, features = ["redactions"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
# The proxied-run end-to-end test (`tests/proxied_run_e2e.rs`) stands a
# recording TLS server in for the provider's API, with disposable PKI.
bytes = { workspace = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
opensesame-transport-security = { path = "../../crates/transport-security", features = ["testkit"] }

[features]
default = []
# Password-manager bridges stay out of a default build (ADR 0053).
browserpass = ["opensesame-pm-bridges/browserpass"]
gopass = ["opensesame-pm-bridges/gopass"]
keepassxc = ["opensesame-pm-bridges/keepassxc"]
# The Bitwarden-compatible server, a password-manager bridge (ADR 0148).
bitwarden-compat = ["opensesame-gateway/bitwarden-compat", "dep:opensesame-bitwarden-server"]
tailscale = ["opensesame-daemon/tailscale"]
# End-to-end harness only: a loopback stub stands in for api.tailscale.com
# (`OPENSESAME_TAILSCALE_API_BASE`). No release enables it.
tailnet-admin-test-upstream = ["opensesame-daemon/tailnet-admin-test-upstream", "opensesame-tailnet-admin/upstream-override"]
wasm-connectors = ["opensesame-gateway/wasm-connectors"]

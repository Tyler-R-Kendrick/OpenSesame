[package]
name = "opensesame-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opensesame-gateway"
path = "src/main.rs"

[dependencies]
opensesame-domain = { path = "../../crates/domain" }
opensesame-authn = { path = "../../crates/authn" }
opensesame-authz = { path = "../../crates/authz" }
opensesame-broker = { path = "../../crates/broker" }
opensesame-connection-broker = { path = "../../crates/connection-broker" }
opensesame-task-access = { path = "../../crates/task-access" }
opensesame-proof = { path = "../../crates/proof" }
opensesame-protocol-aauth = { path = "../../crates/protocol-aauth", features = ["experimental-aauth"] }
opensesame-audit = { path = "../../crates/audit" }
opensesame-pki-core = { path = "../../crates/pki-core" }
base64 = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
opensesame-agent-events = { path = "../../crates/agent-events" }
opensesame-a2h = { path = "../../crates/a2h" }
opensesame-session-observe = { path = "../../crates/session-observe" }
url = { workspace = true }
opensesame-lifecycle = { path = "../../crates/lifecycle" }
opensesame-security-events = { path = "../../crates/security-events" }
opensesame-breach-intel = { path = "../../crates/breach-intel" }
opensesame-storage = { path = "../../crates/storage" }
opensesame-claims = { path = "../../crates/claims" }
opensesame-connector-host = { path = "../../crates/connector-host" }
opensesame-client-core = { path = "../../crates/client-core" }
opensesame-host-core = { path = "../../crates/host-core" }
opensesame-redaction = { path = "../../crates/redaction" }
opensesame-relay = { path = "../../crates/relay" }
opensesame-provider-openfga = { path = "../../crates/provider-openfga" }
opensesame-provider-openbao = { path = "../../crates/provider-openbao" }
opensesame-task-bus = { path = "../../crates/task-bus", features = ["jetstream"] }
sqlx = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = "0.1.3"
instant-acme = { version = "=0.8.5", default-features = false, features = ["aws-lc-rs"] }
rcgen = { version = "0.13.2", features = ["x509-parser"] }
time = { version = "0.3.41", default-features = false, features = ["std"] }
x509-parser = "0.16.0"
zeroize = { workspace = true }

[features]
# Pass-through for the ADR 0065 §3 community connector runtime. Default off;
# enabling it is a gateway deployment decision, never the daemon's.
wasm-connectors = ["opensesame-connector-host/wasm-connectors"]

[dev-dependencies]
async-trait = { workspace = true }
insta = { workspace = true, features = ["redactions", "json"] }
proptest = { workspace = true }
sqlx = { workspace = true }
tower = { workspace = true }

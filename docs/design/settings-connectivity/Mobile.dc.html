<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
  .os {
    --canvas: #f2f5f9; --surface: #ffffff; --surface-2: #f7f9fc; --surface-3: #eef2f8;
    --rail: #101a2b; --rail-2: #17253a; --rail-fg: #dbe6f4; --rail-muted: #8ba0bb; --rail-line: #24354e;
    --ink: #0e1826; --ink-2: #566880; --ink-3: #7e8fa6; --line: #dce4ef; --line-strong: #c4d1e2;
    --accent: #0d7268; --accent-hover: #0a5c54; --accent-ink: #ffffff; --accent-wash: #e4f6f3; --accent-line: #9fd8d0;
    --ok: #0f7a51; --ok-wash: #e3f6ec; --warn: #a25a05; --warn-wash: #fdf1de; --err: #b32424; --err-wash: #fceaea;
    --radius: 10px; --radius-lg: 14px; --radius-pill: 999px;
    --shadow-sm: 0 1px 2px rgba(14, 24, 38, 0.06), 0 1px 1px rgba(14, 24, 38, 0.04);
    --shadow: 0 6px 16px -4px rgba(14, 24, 38, 0.12), 0 2px 6px -2px rgba(14, 24, 38, 0.08);
    --shadow-lg: 0 24px 48px -12px rgba(14, 24, 38, 0.22), 0 8px 20px -8px rgba(14, 24, 38, 0.12);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: light;
    background: var(--canvas); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; font-synthesis-weight: none;
  }
  .os[data-theme="dark"] {
    --canvas: #0a121d; --surface: #111d2c; --surface-2: #162435; --surface-3: #1c2c40;
    --rail: #070f19; --rail-2: #0f1c2b; --rail-fg: #dbe6f4; --rail-muted: #7d92ae; --rail-line: #1b2b3f;
    --ink: #e7eefa; --ink-2: #9db0c8; --ink-3: #7488a2; --line: #223349; --line-strong: #2e4262;
    --accent: #2fb3a3; --accent-hover: #43c8b7; --accent-ink: #04231f; --accent-wash: #0f2f2c; --accent-line: #1d5c55;
    --ok: #35b57e; --ok-wash: #0f2c22; --warn: #d99320; --warn-wash: #33240c; --err: #ef6d6d; --err-wash: #351717;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.5), 0 2px 6px -2px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.6), 0 8px 20px -8px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  .os *, .os *::before, .os *::after { box-sizing: border-box; }
  .os h1, .os h2, .os h3, .os h4 { margin: 0; letter-spacing: -0.021em; text-wrap: balance; font-weight: 650; }
  .os h1 { font-size: 1.5rem; } .os h2 { font-size: 1.125rem; } .os h3 { font-size: 0.9375rem; }
  .os p { margin: 0; }
  .os a { color: var(--accent); text-underline-offset: 2px; }
  .os code { font-family: var(--mono); font-size: 0.875em; font-variant-ligatures: none; }
  .os :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .os { width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.7rem; background: var(--rail); color: var(--rail-fg); flex: none; }
  .mark { display: grid; place-items: center; width: 1.75rem; height: 1.75rem; flex: none; border-radius: 8px; background: var(--accent); color: #fff; box-shadow: inset 0 -1px 0 rgba(0,0,0,0.22); }
  .topbar__title { font-size: 0.875rem; font-weight: 650; }
  .topbar__spacer { margin-left: auto; }
  .cx { display: flex; align-items: center; gap: 0; }
  .cx__btn { appearance: none; border: 0; background: transparent; cursor: pointer; display: grid; justify-items: center; gap: 3px; padding: 6px 5px 5px; border-radius: 8px; color: var(--rail-fg); font: inherit; min-width: 2.1rem; }
  .cx__btn svg { display: block; }
  .cx__pip { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .is-live .cx__pip { background: #35b57e; box-shadow: 0 0 0 2.5px rgba(53,181,126,0.22); }
  .is-attn .cx__pip { background: #d99320; box-shadow: 0 0 0 2.5px rgba(217,147,32,0.24); }
  .cx__btn.is-attn { color: #f0b95c; }
  .cx__btn.is-off svg { opacity: 0.32; }
  .lockbtn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.125rem; padding: 0 0.6rem; border: 1px solid var(--rail-line); border-radius: var(--radius); background: var(--rail-2); color: var(--rail-fg); font: inherit; font-size: 0.8125rem; font-weight: 600; }

  .section { flex: 1; min-height: 0; overflow-y: auto; padding: 1.15rem 1rem 1.5rem; display: grid; gap: 1rem; align-content: start; }
  .section__head { display: grid; gap: 0.3rem; }
  .section__head p { color: var(--ink-2); font-size: 0.875rem; }
  .set__nav { display: flex; gap: 0.25rem; padding: 0.25rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); overflow-x: auto; }
  .set__nav-link { appearance: none; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); font: inherit; font-size: 0.8125rem; font-weight: 550; padding: 0.4rem 0.65rem; cursor: pointer; white-space: nowrap; }
  .set__nav-link[aria-current="true"] { color: var(--accent-ink); background: var(--accent); font-weight: 600; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .panel__head { padding: 0.9rem 1rem; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 0.6rem; }
  .panel__head h2 { font-size: 1rem; margin-bottom: 0.15rem; }
  .panel__head p { font-size: 0.8125rem; color: var(--ink-2); }
  .panel__body { padding: 0.85rem; display: grid; gap: 0.5rem; }

  .conn { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.7rem; padding: 0.75rem 0.8rem; min-height: 3.5rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .conn__mark { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; flex: none; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
  .conn.is-live .conn__mark { color: var(--accent); border-color: var(--accent-line); background: var(--accent-wash); }
  .conn.is-attn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); background: var(--warn-wash); }
  .conn.is-attn .conn__mark { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); background: var(--surface); }
  .conn__grow { min-width: 0; display: grid; gap: 1px; }
  .conn__name { font-size: 0.9375rem; font-weight: 600; }
  .conn__state { font-size: 0.8125rem; color: var(--ink-2); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn.is-attn .conn__state { color: var(--warn); font-family: var(--font); font-weight: 550; }
  .conn svg.chev { color: var(--ink-3); flex: none; }

  .chip { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.5rem; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface-2); font-size: 0.75rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .chip--warn { color: var(--warn); background: var(--warn-wash); border-color: color-mix(in srgb, var(--warn) 30%, var(--line)); }
  .chip--ok { color: var(--ok); background: var(--ok-wash); border-color: color-mix(in srgb, var(--ok) 30%, var(--line)); }

  .tabbar { position: relative; z-index: 20; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.1rem; padding: 0.35rem 0.35rem 0.7rem; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px -8px rgba(14,24,38,0.25); flex: none; }
  .tabbar__link { display: grid; justify-items: center; gap: 0.15rem; min-width: 0; padding: 0.4rem 0.15rem; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 0.625rem; font-weight: 600; }
  .tabbar__link.is-active { color: var(--accent); background: var(--accent-wash); }

  /* bottom sheet ceremony */
  .scrim { position: absolute; inset: 0; background: rgba(10,18,29,0.45); z-index: 30; border: 0; }
  .bsheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-top-left-radius: 18px; border-top-right-radius: 18px; box-shadow: var(--shadow-lg); padding: 0.6rem 1rem calc(1rem + 0.4rem); display: grid; gap: 0.85rem; animation: up 260ms var(--ease); }
  @keyframes up { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .bsheet__grab { width: 2.4rem; height: 0.25rem; border-radius: 999px; background: var(--line-strong); justify-self: center; }
  .bsheet h2 { font-size: 1.0625rem; }
  .bsheet__lead { font-size: 0.875rem; color: var(--ink-2); line-height: 1.45; }
  .found { display: grid; gap: 0.55rem; padding: 0.85rem; border: 1px solid var(--accent-line); border-radius: var(--radius); background: var(--accent-wash); }
  .found__top { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
  .found__name { font-family: var(--mono); font-size: 0.9375rem; font-weight: 600; overflow-wrap: anywhere; }
  .found dl { display: grid; grid-template-columns: auto 1fr; gap: 0.1rem 0.6rem; margin: 0; font-size: 0.8125rem; }
  .found dt { color: var(--ink-2); }
  .found dd { margin: 0; font-family: var(--mono); }
  .btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 2.75rem; padding: 0 0.85rem; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink); font: inherit; font-weight: 550; font-size: 0.9375rem; cursor: pointer; }
  .btn--primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn--ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .bsheet .btn { width: 100%; }
  .position { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  </style>
</helmet>

<div class="os" data-theme="{{theme}}">

  <header class="topbar">
    <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10.5" rx="2.2"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="15.5" r="1.15"></circle><path d="M12 16.65V18"></path></svg></span>
    <p class="topbar__title">OpenSesame</p>
    <span class="topbar__spacer"></span>
    <div class="cx">
      <button type="button" class="cx__btn is-live" aria-label="Host — live" onClick="{{openHost}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3.2v5.1c0 4.7-3.1 8.1-7.5 9.4-4.4-1.3-7.5-4.7-7.5-9.4V6.2z"></path><path d="M9.2 12.1l2 2 3.6-3.9"></path></svg>
        <span class="cx__pip"></span>
      </button>
      <button type="button" class="cx__btn is-live" aria-label="Identity — signed in" onClick="{{openHost}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="12" r="4"></circle><path d="M12.5 12H21M18 12v3M15 12v2.2"></path></svg>
        <span class="cx__pip"></span>
      </button>
      <button type="button" class="cx__btn is-attn" aria-label="This machine — not paired" onClick="{{openMac}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect><path d="M7 9.5l2.8 2.5L7 14.5M12.5 15h4.2"></path></svg>
        <span class="cx__pip"></span>
      </button>
      <button type="button" class="cx__btn is-live" aria-label="Git history — connected" onClick="{{openHost}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="2.2"></circle><circle cx="7" cy="18" r="2.2"></circle><circle cx="17" cy="9" r="2.2"></circle><path d="M7 8.2v7.6"></path><path d="M17 11.2c0 3.4-3 4.4-5.6 4.8"></path></svg>
        <span class="cx__pip"></span>
      </button>
      <button type="button" class="cx__btn is-live" aria-label="Key vault — WebCrypto on this device" onClick="{{openHost}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10.5" rx="2.2"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="15.5" r="1.15"></circle></svg>
        <span class="cx__pip"></span>
      </button>
    </div>
    <span class="lockbtn">Lock</span>
  </header>

  <div class="position">
    <main class="section">
      <div class="section__head">
        <h1>Settings</h1>
        <p>Stored on this device.</p>
      </div>

      <nav class="set__nav">
        <button type="button" class="set__nav-link">General</button>
        <button type="button" class="set__nav-link">Security</button>
        <button type="button" class="set__nav-link" aria-current="true">Connectivity</button>
        <button type="button" class="set__nav-link">Vault data</button>
      </nav>

      <section class="panel">
        <div class="panel__head">
          <div>
            <h2>Core connections</h2>
            <p>Tap one to open its ceremony.</p>
          </div>
          <span class="chip chip--warn">1 needs setup</span>
        </div>
        <div class="panel__body">

          <button type="button" class="conn is-live" onClick="{{openHost}}">
            <span class="conn__mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3.2v5.1c0 4.7-3.1 8.1-7.5 9.4-4.4-1.3-7.5-4.7-7.5-9.4V6.2z"></path><path d="M9.2 12.1l2 2 3.6-3.9"></path></svg></span>
            <span class="conn__grow"><span class="conn__name">Host</span><span class="conn__state">127.0.0.1:18787</span></span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"></path></svg>
          </button>

          <button type="button" class="conn is-live" onClick="{{openHost}}">
            <span class="conn__mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="12" r="4"></circle><path d="M12.5 12H21M18 12v3M15 12v2.2"></path></svg></span>
            <span class="conn__grow"><span class="conn__name">Identity</span><span class="conn__state">contact.tylerkendrick</span></span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"></path></svg>
          </button>

          <button type="button" class="conn is-attn" onClick="{{openMac}}">
            <span class="conn__mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect><path d="M7 9.5l2.8 2.5L7 14.5M12.5 15h4.2"></path></svg></span>
            <span class="conn__grow"><span class="conn__name">This machine</span><span class="conn__state">Not paired</span></span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"></path></svg>
          </button>

          <button type="button" class="conn is-live" onClick="{{openHost}}">
            <span class="conn__mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="2.2"></circle><circle cx="7" cy="18" r="2.2"></circle><circle cx="17" cy="9" r="2.2"></circle><path d="M7 8.2v7.6"></path><path d="M17 11.2c0 3.4-3 4.4-5.6 4.8"></path></svg></span>
            <span class="conn__grow"><span class="conn__name">Git history</span><span class="conn__state">opensesame-store</span></span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"></path></svg>
          </button>

          <button type="button" class="conn is-live" onClick="{{openHost}}">
            <span class="conn__mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10.5" rx="2.2"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="15.5" r="1.15"></circle></svg></span>
            <span class="conn__grow"><span class="conn__name">Key vault</span><span class="conn__state">WebCrypto · this device</span></span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"></path></svg>
          </button>

        </div>
      </section>
    </main>

    <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{true}}">
      <button type="button" class="scrim" aria-label="Close" onClick="{{close}}"></button>
    </sc-if>
    <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{true}}">
      <div class="bsheet">
        <span class="bsheet__grab"></span>
        <h2>{{title}}</h2>
        <p class="bsheet__lead">{{lead}}</p>
        <div class="found">
          <p class="found__top"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>{{foundTop}}</p>
          <p class="found__name">{{foundName}}</p>
          <dl><dt>{{k1}}</dt><dd>{{v1}}</dd><dt>{{k2}}</dt><dd>{{v2}}</dd></dl>
        </div>
        <button type="button" class="btn btn--primary">{{cta}}</button>
        <button type="button" class="btn btn--ghost" onClick="{{close}}">Not now</button>
      </div>
    </sc-if>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <span class="tabbar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10.5" rx="2.2"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="15.5" r="1.15"></circle></svg><span>Vault</span></span>
    <span class="tabbar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 13.8a4.6 4.6 0 0 0 6.94.5l2.6-2.6a4.6 4.6 0 0 0-6.5-6.5l-1.5 1.49"></path><path d="M13.8 10.2a4.6 4.6 0 0 0-6.94-.5l-2.6 2.6a4.6 4.6 0 0 0 6.5 6.5l1.49-1.49"></path></svg><span>Connections</span></span>
    <span class="tabbar__link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="3"></rect><path d="M12 4.5v3M8.75 12.5h.01M15.25 12.5h.01M9.5 16h5"></path><circle cx="12" cy="3.5" r="1"></circle></svg><span>Agents</span></span>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"}}'>
const SHEETS = {
  mac: {
    title: 'Connect this machine',
    lead: 'This page cannot see 127.0.0.1, so it pairs your daemon over Tailscale Serve.',
    foundTop: 'Found on your tailnet', foundName: 'macbook.tail9c2.ts.net',
    k1: 'Daemon', v1: '0.4.1', k2: 'Serve', v2: 'enabled',
    cta: 'Pair this daemon',
  },
  host: {
    title: 'Host',
    lead: 'The authority plane. It authorizes every ConnectionRef and signs every receipt.',
    foundTop: 'Reachable', foundName: '127.0.0.1:18787',
    k1: 'Version', v1: 'gateway 0.4.1', k2: 'Round trip', v2: '6 ms',
    cta: 'Re-probe',
  },
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: 'mac' };
  }

  renderVals() {
    const s = this.state.sheet ? SHEETS[this.state.sheet] : null;
    return {
      theme: this.props.theme ?? 'light',
      sheetOpen: s !== null,
      title: s ? s.title : '', lead: s ? s.lead : '',
      foundTop: s ? s.foundTop : '', foundName: s ? s.foundName : '',
      k1: s ? s.k1 : '', v1: s ? s.v1 : '', k2: s ? s.k2 : '', v2: s ? s.v2 : '',
      cta: s ? s.cta : '',
      openMac: () => this.setState({ sheet: 'mac' }),
      openHost: () => this.setState({ sheet: 'host' }),
      close: () => this.setState({ sheet: null }),
    };
  }
}
</script>

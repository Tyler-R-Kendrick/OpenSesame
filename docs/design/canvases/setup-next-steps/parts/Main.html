<div class="os" data-theme="{{theme}}" style="width: 390px; height: 844px">

  <div class="setup__bar">
    <p class="setup__wordmark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="1.5"></rect><path d="M8 10.5V7a4 4 0 0 1 8 0"></path></svg>
      opensesame
    </p>
  </div>

  <main class="setup__body" id="main">
    <div class="setup__head">
      <h1>Set up, and signed in</h1>
      <p>That was the only question. Everything below is optional — set one up now, come back later, or never. Nothing here blocks you.</p>
    </div>

    <div class="next">
      <button type="button" class="next__card" onClick="{{ openModels }}">
        <span class="next__mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M9 9h6v6H9z"></path><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"></path></svg>
        </span>
        <span class="next__body">
          <span class="next__name">A model to drive password resets</span>
          <span class="next__why">Lets OpenSesame work a website's own reset form for you, instead of deep-linking you to it. Pick who runs the model — or leave it, and this device runs it.</span>
          <span class="next__state">{{ modelsState }}</span>
        </span>
        <span class="next__chev">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </span>
      </button>

      <button type="button" class="next__card" onClick="{{ openInvite }}">
        <span class="next__mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"></path><circle cx="9.5" cy="7.5" r="3.5"></circle><path d="M19 8v6M22 11h-6"></path></svg>
        </span>
        <span class="next__body">
          <span class="next__name">Invite people</span>
          <span class="next__why">Send someone a link into this vault. Every invite carries a lifetime and dies on its own.</span>
          <span class="next__state">{{ inviteState }}</span>
        </span>
        <span class="next__chev">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </span>
      </button>

      <button type="button" class="next__card" onClick="{{ openDevices }}">
        <span class="next__mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg>
        </span>
        <span class="next__body">
          <span class="next__name">Register another device</span>
          <span class="next__why">Your phone, a laptop, a work machine. Each one gets its own key, and any one of them can be dropped without touching the others.</span>
          <span class="next__state">{{ devicesState }}</span>
        </span>
        <span class="next__chev">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </span>
      </button>
    </div>

    <p class="hint">Skipping is not deferring. A road you never build is simply not offered later — no greyed-out buttons, no reminders.</p>
  </main>

  <div class="setup__foot">
    <div class="go-row">
      <button type="button" class="go" aria-label="Go to the vault" title="Go to the vault">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      </button>
      <span class="go-verb" aria-hidden="true">Go to the vault</span>
    </div>
  </div>
</div>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { models: false, invite: false, devices: false };
  }

  label(on, set, unset) {
    return on ? set : unset;
  }

  renderVals() {
    return {
      theme: this.props.theme || "light",
      modelsState: this.label(
        this.state.models,
        "Ollama, on this machine",
        "Not set up — this browser's own model is doing it",
      ),
      inviteState: this.label(
        this.state.invite,
        "1 invite out, lapses in 23 hours",
        "Not set up — nobody else is here",
      ),
      devicesState: this.label(
        this.state.devices,
        "2 devices",
        "Not set up — this browser only",
      ),
      openModels: () => this.setState({ models: !this.state.models }),
      openInvite: () => this.setState({ invite: !this.state.invite }),
      openDevices: () => this.setState({ devices: !this.state.devices }),
    };
  }
}
</script>

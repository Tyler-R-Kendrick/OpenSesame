[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Path deps without an explicit version look like wildcards to cargo-deny.
wildcards = "warn"

# cargo-deny ≥0.18: `vulnerability` lint removed (always enforced via RustSec).
# `unmaintained` / `unsound` take Scope: all | workspace | transitive | none
[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
